<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Registo de sintonizações — Escola de Reiki</title>
<style>
:root{--bronze:#8a6420;--ouro:#b28632;--tinta:#2b2218;--suave:#7a6a55;--linha:#e3d5b2;--caixa:#fbf3df;--fundo:#faf6ee;--verde:#2f6b3a;--verm:#a23b2a}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--fundo);color:var(--tinta);line-height:1.45}
header{background:linear-gradient(160deg,#5a3e1b,#8a6420);color:#fff;padding:18px 16px}
header h1{margin:0;font-size:1.25rem}header p{margin:4px 0 0;font-size:.85rem;opacity:.9}
main{max-width:980px;margin:0 auto;padding:14px 14px 40px}
.card{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:14px;margin-bottom:12px}
.nota{color:var(--suave);font-size:.85rem}
.aluno{display:flex;gap:12px;align-items:center;cursor:pointer}
.aluno:hover{border-color:var(--ouro)}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:#efe6d6;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--bronze);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.barra{height:8px;background:#eadfca;border-radius:6px;overflow:hidden;margin-top:6px}.barra i{display:block;height:100%;background:var(--bronze)}
.chip{display:inline-block;font-size:.75rem;padding:2px 9px;border-radius:20px;background:var(--caixa);border:1px solid var(--linha);margin:2px 4px 0 0}
.ok{color:var(--verde);font-weight:700}.mau{color:var(--verm);font-weight:700}
button{font:inherit;cursor:pointer;border:1px solid var(--ouro);background:#fff;color:var(--bronze);border-radius:10px;padding:9px 14px}
button.p{background:var(--bronze);color:#fff;border-color:var(--bronze)}
details{border:1px solid var(--linha);border-radius:12px;padding:10px 12px;margin:8px 0;background:#fff}
summary{cursor:pointer;font-weight:600}
.q{padding:8px 0;border-top:1px dashed var(--linha);font-size:.9rem}.q:first-of-type{border-top:0}
.reg{background:var(--caixa);border-left:3px solid var(--ouro);padding:8px 10px;border-radius:0 8px 8px 0;margin-top:8px;font-size:.88rem;white-space:pre-line}
input[type=search]{width:100%;padding:11px 12px;border:1px solid var(--linha);border-radius:10px;font:inherit;margin-bottom:12px}
label{display:block;font-size:.82rem;color:var(--suave);margin:8px 0 3px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--linha);border-radius:10px;font:inherit;background:#fff}.lin{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:9px 0;border-top:1px dashed var(--linha)}.lin:first-of-type{border-top:0}</style>
</head>
<body>
<header><h1>🗂️ Registo de sintonizações</h1><p>Hikari Fafe · Escola de Reiki — quem sintonizaste, em que nível, como e quando</p></header>
<main id="palco"><div class="card"><p class="nota">A carregar…</p></div></main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app = initializeApp({
  apiKey: "AIzaSyDKWdXYEG6PO9KEMQMklyPGngtXuZlP7Cg", authDomain: "saudecare-app.firebaseapp.com",
  projectId: "saudecare-app", storageBucket: "saudecare-app.firebasestorage.app",
  messagingSenderId: "455466438728", appId: "1:455466438728:web:61cfbf9fac85d59e18c87d"
});
const auth = getAuth(app), db = getFirestore(app);
const palco = document.getElementById('palco');
const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const TIPOS = ['Presencial, individual','Presencial, em grupo','À distância, individual','À distância, em grupo','Videochamada','Chamada de voz','À hora marcada'];
const NIVEIS = ['1','2','3A','3B'];
let TENANT = '', ITENS = [];
const ref = () => doc(db, 'tenants', TENANT, 'reikiConfig', 'registoSintonizacoes');
const dia = iso => iso ? new Date(iso + 'T12:00:00').toLocaleDateString('pt-PT') : '—';

function desenhar(){
  const hoje = new Date().toISOString().slice(0, 10);
  const ord = ITENS.slice().sort((a, b) => (b.data || '').localeCompare(a.data || ''));
  const cont = {}; ord.forEach(x => { cont[x.nivel] = (cont[x.nivel] || 0) + 1; });
  palco.innerHTML = `<div class="card"><h3 style="margin-top:0;">Nova sintonização</h3>
    <label>Aluno (nome completo)</label><input id="fAluno" placeholder="Nome como vai no certificado">
    <label>Nível transmitido</label><select id="fNivel">${NIVEIS.map(n => `<option>${n}</option>`).join('')}</select>
    <label>Forma</label><select id="fTipo">${TIPOS.map(t => `<option>${t}</option>`).join('')}</select>
    <label>Data</label><input id="fData" type="date" value="${hoje}">
    <label>Notas (opcional): como correu, o que o aluno sentiu, localidade, quem mais estava</label><textarea id="fNotas" rows="3"></textarea>
    <p style="margin:12px 0 0;"><button class="p" onclick="guardar()">Guardar no registo</button></p></div>
    <div class="card"><h3 style="margin-top:0;">Registos (${ord.length})</h3>
      <p class="nota" style="margin-top:0;">${NIVEIS.filter(n => cont[n]).map(n => 'Nível ' + n + ': ' + cont[n]).join(' · ') || 'Ainda não há registos.'}</p>
      ${ord.map(x => `<div class="lin"><div><b>${esc(x.aluno)}</b> <span class="chip">Nível ${esc(x.nivel)}</span><span class="chip">${esc(x.tipo)}</span><br><span class="nota">${esc(dia(x.data))}${x.notas ? ' · ' + esc(x.notas) : ''}</span></div>
        <button onclick="apagar('${esc(x.id)}')" title="Apagar">🗑</button></div>`).join('')}
      ${ord.length ? '<p style="margin:12px 0 0;"><button onclick="exportar()">⬇ Descarregar (CSV)</button></p>' : ''}</div>`;
}
async function gravar(){ await setDoc(ref(), { itens: ITENS, actualizadoEm: new Date().toISOString() }, { merge: true }); }
window.guardar = async () => {
  const aluno = document.getElementById('fAluno').value.trim();
  if (!aluno){ alert('Escreve o nome do aluno.'); return; }
  ITENS.push({ id: 's' + Date.now(), aluno, nivel: document.getElementById('fNivel').value, tipo: document.getElementById('fTipo').value,
    data: document.getElementById('fData').value, notas: document.getElementById('fNotas').value.trim(), criadoEm: new Date().toISOString() });
  try { await gravar(); desenhar(); } catch(e){ ITENS.pop(); alert('Não consegui guardar: ' + e.message); }
};
window.apagar = async id => {
  if (!confirm('Apagar este registo?')) return;
  const antes = ITENS; ITENS = ITENS.filter(x => x.id !== id);
  try { await gravar(); desenhar(); } catch(e){ ITENS = antes; alert('Não consegui apagar: ' + e.message); }
};
window.exportar = () => {
  const c = s => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const linhas = [['Data','Aluno','Nível','Forma','Notas'].map(c).join(';')].concat(ITENS.slice().sort((a, b) => (a.data || '').localeCompare(b.data || '')).map(x => [x.data, x.aluno, x.nivel, x.tipo, x.notas].map(c).join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + linhas.join('\n')], { type: 'text/csv;charset=utf-8' }));
  a.download = 'registo-sintonizacoes.csv'; a.click();
};
onAuthStateChanged(auth, async user => {
  if (!user){
    palco.innerHTML = `<div class="card"><h3>Entra primeiro na Vindora</h3><p class="nota">Esta página é só para a escola.</p><p><a href="app.html"><button class="p">Entrar na Vindora</button></a></p></div>`;
    return;
  }
  const tk = await user.getIdTokenResult();
  TENANT = new URLSearchParams(location.search).get('t') || tk.claims.tenantId;
  if (!TENANT){ palco.innerHTML = '<div class="card"><p class="nota">A tua conta não tem escola associada.</p></div>'; return; }
  try { const s = await getDoc(ref()); ITENS = (s.exists() && s.data().itens) || []; desenhar(); }
  catch(e){ palco.innerHTML = `<div class="card"><h3>Não consegui ler o registo</h3><p class="nota">${esc(e.message)}</p></div>`; }
});
</script>
</body>
</html>
