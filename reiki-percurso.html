<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A minha formação — Hikari Fafe Escola de Reiki</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{ --papel:#fdfaf1; --linha:#d9cbae; --bronze:#a8681f; --bronze2:#b8873a;
         --tinta:#332f29; --suave:#8d8375; --caixa:#fcf4e2; --verde:#2f6f5e; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--papel);color:var(--tinta);line-height:1.6;padding-bottom:70px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  header{background:linear-gradient(160deg,#8a5518,var(--bronze));color:#fff;padding:22px 18px 14px;}
  header h1{font-size:19px;margin-bottom:3px;text-align:center;}
  header p{opacity:.92;font-size:13.5px;}
  .abas{display:flex;gap:6px;padding:14px 18px 0;}
  .abas button{flex:1;padding:9px 8px;border:none;border-radius:9px;font-size:13.5px;cursor:pointer;
    background:rgba(255,255,255,.18);color:#fff;}
  .abas button.on{background:#fff;color:var(--bronze);font-weight:600;}
  .selo-nivel{display:inline-block;margin-top:2px;padding:3px 12px;border:1px solid rgba(255,255,255,.5);border-radius:999px;font-size:12.5px;}
  main{max-width:640px;margin:0 auto;padding:16px;}
  .card{background:#fff;border:1px solid var(--linha);border-radius:14px;padding:16px;margin-bottom:12px;}
  .modulo{cursor:pointer;}
  .modulo .topo{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .modulo h3{font-size:15.5px;color:var(--bronze);}
  .modulo p{font-size:13.5px;color:var(--suave);margin-top:3px;}
  .selo{font-size:11px;padding:4px 10px;border-radius:20px;white-space:nowrap;
    background:#efe6d5;color:#8a5518;}
  .selo.feito{background:#e6eee8;color:var(--verde);}
  .barra{height:6px;background:#efe6d5;border-radius:6px;margin-top:10px;overflow:hidden;}
  .barra i{display:block;height:100%;background:var(--bronze2);border-radius:6px;transition:width .4s;}
  .passos{display:flex;gap:6px;margin:14px 0;}
  .passos div{flex:1;text-align:center;font-size:12px;padding:8px 4px;border-radius:9px;
    background:#f3ece0;color:var(--suave);}
  .passos div.on{background:var(--bronze);color:#fff;}
  .passos div.ok{background:#e6eee8;color:var(--verde);}
  .bloco{margin-bottom:12px;}
  .bloco.destaque{background:var(--caixa);border:1px solid var(--linha);
    border-radius:12px;padding:14px;font-size:15px;}
  .bloco ul{margin:6px 0 0 18px;}
  .bloco li{margin-bottom:5px;}
  .bloco b{color:var(--bronze);}
  h4{color:var(--bronze2);font-size:14px;margin-bottom:6px;}
  textarea,input{width:100%;padding:11px;border:1px solid var(--linha);border-radius:9px;
    font-size:16px;font-family:inherit;background:#fff;color:var(--tinta);}
  button{font-family:inherit;cursor:pointer;}
  .principal{width:100%;background:var(--bronze);color:#fff;border:none;padding:14px;
    border-radius:11px;font-size:15.5px;margin-top:12px;}
  .principal:disabled{background:#d8cbb4;}
  .leve{background:none;border:1px solid var(--linha);color:var(--tinta);
    padding:10px 15px;border-radius:9px;font-size:14px;}
  .opcao{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--linha);
    border-radius:10px;padding:12px;margin-bottom:7px;font-size:14.5px;color:var(--tinta);}
  .opcao.certa{border-color:var(--verde);background:#f0f7f3;}
  .opcao.errada{border-color:#c98b8b;background:#fdf3f3;}
  .feedback{background:var(--caixa);border-left:3px solid var(--bronze2);border-radius:0 10px 10px 0;
    padding:12px 14px;margin:8px 0 4px;font-size:14px;}
  .nota{font-size:12.5px;color:var(--suave);margin-top:8px;}
  .aviso{background:#fff8ed;border:1px solid #f0d9a8;border-radius:12px;padding:14px;font-size:14px;}
  .comunidade a{display:block;padding:12px;border:1px solid var(--linha);border-radius:10px;
    margin-bottom:8px;text-decoration:none;color:var(--tinta);font-size:14.5px;background:#fff;}
  .recurso{margin-bottom:8px;}
  .hidden{display:none!important;}
  footer{text-align:center;color:var(--suave);font-size:12px;padding:22px 16px;}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:12px;justify-content:center;">
    <img id="avatarAluno" class="hidden" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.6);" onerror="this.classList.add('hidden')">
    <div>
      <h1 id="cab" style="text-align:left;">A minha formação</h1>
      <p id="subcab" style="text-align:left;">Hikari Fafe · Escola de Reiki</p>
    </div>
  </div>
</header>
<div class="abas hidden" id="barraAbas">
  <button id="abaPercurso" class="on" onclick="mudarAba('percurso')">📖 Percurso</button>
  <button id="abaBiblioteca" onclick="mudarAba('biblioteca')">📚 Biblioteca</button>
  <button id="abaTestes" onclick="mudarAba('testes')">📝 Testes</button>
  <button id="abaPoemas" onclick="mudarAba('poemas')">🎴 Poemas</button>
</div>

<main id="palco">
  <div class="card"><p class="nota">A carregar…</p></div>
</main>

<footer>
  Hikari Fafe Escola de Reiki · Mestre Ricardo Correia<br>
  O Reiki é uma prática complementar de bem-estar e não substitui acompanhamento médico.
</footer>

   emite manualmente — para o aluno receber exactamente a mesma peça. */

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const palco = () => document.getElementById('palco');

async function arrancar(){
  if (!CODIGO){
    palco().innerHTML = `<div class="card"><h3>Falta o teu código</h3><p class="nota">Usa o link pessoal que a escola te enviou. Se o perdeste, pede outro.</p></div>`;
    return;
  }
  try {
    const cartao = await getDoc(doc(db, 'tenants', TENANT, 'reikiAccess', CODIGO));
    if (!cartao.exists()){
      palco().innerHTML = `<div class="card"><h3>Código não reconhecido</h3><p class="nota">Confirma o link com a escola.</p></div>`;
      return;
    }
    ALUNO = cartao.data();
  } catch(e){
    palco().innerHTML = `<div class="card"><h3>Não consegui ligar-me</h3><p class="nota">${esc(e.message)}</p></div>`;
    return;
  }

  document.getElementById('cab').textContent = 'Olá, ' + (ALUNO.nome || '').split(' ')[0];
  if (ALUNO.foto){
    const av = document.getElementById('avatarAluno');
    av.src = ALUNO.foto;
    av.classList.remove('hidden');
  }

  if (ALUNO.suspenso){
    document.getElementById('subcab').textContent = 'Acesso suspenso';
    palco().innerHTML = `<div class="card"><h3>O teu acesso está suspenso</h3><p class="nota">Fala com a escola para perceberes o que se passa.</p></div>`;
    return;
  }

  document.getElementById('subcab').innerHTML = ALUNO.nivel
    ? '<span class="selo-nivel">Nível ' + esc(ALUNO.nivel) + '</span>'
    : '<span class="selo-nivel">Percurso a começar</span>';
  document.getElementById('barraAbas').classList.remove('hidden');

  if (!ALUNO.nivel){
    palco().innerHTML = `<div class="card"><h3>Ainda não tens nível atribuído</h3><p class="nota">Assim que a escola registar o teu nível, os módulos aparecem aqui.</p></div>`;
    return;
  }

  try {
    const [mods, prog] = await Promise.all([
      getDocs(query(collection(db, 'tenants', TENANT, 'reikiModules'), where('nivel', '==', String(ALUNO.nivel)))),
      getDocs(query(collection(db, 'tenants', TENANT, 'reikiProgress'), where('codigo', '==', CODIGO)))
    ]);
    MODULOS = [];
    mods.forEach(d => { const m = { id: d.id, ...d.data() }; if (m.publicado) MODULOS.push(m); });
    MODULOS.sort((a,b) => (a.ordem||0) - (b.ordem||0));
    prog.forEach(d => { PROGRESSO[d.data().moduloId] = d.data(); });
  } catch(e){ console.warn('percurso indisponível', e); }

  if (!Object.keys(PROGRESSO).length && MODULOS.length){
    await Promise.all(MODULOS.map(async m => {
      try {
        const d = await getDoc(doc(db, 'tenants', TENANT, 'reikiProgress', CODIGO + '_' + m.id));
        if (d.exists()) PROGRESSO[m.id] = d.data();
      } catch(e){}
    }));
  }

  try {
    const snap = await getDocs(collection(db, 'tenants', TENANT, 'reikiLibrary'));
    RECURSOS = [];
    snap.forEach(d => RECURSOS.push({ id: d.id, ...d.data() }));
  } catch(e){ console.warn('biblioteca indisponível', e); }

  try {
    const snapT = await getDocs(collection(db, 'tenants', TENANT, 'reikiQuizzes'));
    TESTES = [];
    snapT.forEach(d => TESTES.push({ id: d.id, ...d.data() }));
    TESTES = TESTES.filter(t => {
      const nv = String(t.nivel || '0');
      if (nv === '0') return true;
      const i = ORDEM_NIVEIS.indexOf(nv);
      return i >= 0 && i <= meuIndice;
    });
  } catch(e){ console.warn('testes indisponíveis', e); }

  desenharLista();
}

window.mudarAba = function(qual){
  ['Percurso','Biblioteca','Testes','Poemas'].forEach(nome => {
    document.getElementById('aba'+nome)?.classList.toggle('on', qual === nome.toLowerCase());
  });
  if (qual === 'biblioteca') desenharBiblioteca();
  else if (qual === 'testes') desenharTestes();
  else if (qual === 'poemas') desenharPoemas();
  else desenharLista();
  window.scrollTo({top:0,behavior:'smooth'});
};

function textoParaHtml(t){
  const linhas = String(t||'').split('\n');
  let html = '', emLista = false;
  linhas.forEach(l => {
    const li = l.trim();
    if (li.startsWith('- ')){
      if (!emLista){ html += '<ul style="margin:6px 0 6px 18px;">'; emLista = true; }
      html += '<li style="margin-bottom:4px;">' + esc(li.slice(2)) + '</li>';
    } else {
      if (emLista){ html += '</ul>'; emLista = false; }
      if (li) html += '<p style="margin-bottom:8px;">' + esc(li) + '</p>';
    }
  });
  if (emLista) html += '</ul>';
  return html;
}

let RECURSO_ABERTO = null;

function desenharBiblioteca(){
  const meuIndice = ORDEM_NIVEIS.indexOf(String(ALUNO.nivel));
  const visiveis = RECURSOS.filter(r => {
    if (!r.url && !r.conteudo) return false;   // ainda por preencher — não se mostra a ninguém
    const nv = String(r.nivel || '0');
    if (nv === '0') return true;
    const i = ORDEM_NIVEIS.indexOf(nv);
    return i >= 0 && i <= meuIndice;
  }).sort((a,b) => ORDEM_NIVEIS.indexOf(String(a.nivel||'0')) - ORDEM_NIVEIS.indexOf(String(b.nivel||'0')));

  if (!visiveis.length){
    palco().innerHTML = `<div class="card"><p class="nota">Ainda não há materiais disponíveis para o teu nível.</p></div>`;
    return;
  }

  const categorias = [...new Set(visiveis.map(r => r.categoria || 'Materiais'))];
  palco().innerHTML = `<div class="card"><p class="nota">Manuais e materiais do teu percurso, até ao nível em que estás.</p></div>` +
    categorias.map(cat => `<h4 style="margin:14px 4px 6px;color:var(--bronze);">${esc(cat)}</h4>` +
      visiveis.filter(r => (r.categoria || 'Materiais') === cat).map(r => {
        if (r.conteudo){
          return `<div class="card recurso modulo" onclick="abrirRecursoTexto('${r.id}')">
            <strong>📝 ${esc(r.titulo || '(sem título)')}</strong>
            <p class="nota">Guia de estudo — toca para ler</p></div>`;
        }
        return `<div class="card recurso"><strong>${esc(r.titulo || '(sem título)')}</strong>${r.descricao ? `<p class="nota">${esc(r.descricao)}</p>` : ''}<a class="leve" style="display:inline-block;margin-top:8px;text-decoration:none;" href="${esc(r.url)}" target="_blank" rel="noopener">Abrir</a></div>`;
      }).join('')
    ).join('');
}

window.abrirRecursoTexto = function(id){
  RECURSO_ABERTO = RECURSOS.find(r => r.id === id);
  if (!RECURSO_ABERTO) return;
  const ilustracao = ILUSTRACOES[RECURSO_ABERTO.ilustracao] || '';
  palco().innerHTML = `<button class="leve" onclick="mudarAba('biblioteca')">← Voltar</button>
    <div class="card" style="margin-top:12px;">
      <h3 style="color:var(--bronze);">${esc(RECURSO_ABERTO.titulo)}</h3>
      ${ilustracao ? `<div style="margin:14px 0;">${ilustracao}</div>` : ''}
      <div style="margin-top:10px;">${textoParaHtml(RECURSO_ABERTO.conteudo)}</div>
      ${RECURSO_ABERTO.url ? `<a class="leve" style="display:inline-block;margin-top:8px;text-decoration:none;" href="${esc(RECURSO_ABERTO.url)}" target="_blank" rel="noopener">🎧 Ouvir / Ver também</a>` : ''}
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
};

function desenharLista(){
  if (!MODULOS.length){
    palco().innerHTML = `<div class="card"><h3>Ainda não há módulos publicados</h3><p class="nota">A escola está a preparar o teu percurso. Volta daqui a uns dias.</p></div>`;
    return;
  }
  const concluidos = MODULOS.filter(m => (PROGRESSO[m.id]||{}).concluido).length;
  const pct = Math.round(concluidos / MODULOS.length * 100);
  const tudoFeito = concluidos === MODULOS.length;

  const listaModulos = MODULOS.map((m, i) => {
    const p = PROGRESSO[m.id] || {};
    const anterior = i === 0 ? { concluido: true } : (PROGRESSO[MODULOS[i-1].id] || {});
    const trancado = !anterior.concluido;
    const onclickAttr = trancado ? '' : `onclick="abrirModulo('${m.id}')"`;
    return `<div class="card modulo" ${onclickAttr} style="${trancado ? 'opacity:.55;' : ''}">
      <div class="topo"><div><h3>${m.ordem}. ${esc(m.titulo)}</h3>
      ${m.subtitulo ? `<p>${esc(m.subtitulo)}</p>` : ''}
      ${m.duracao ? `<p>⏱️ ${esc(m.duracao)}</p>` : ''}</div>
      <span class="selo ${p.concluido ? 'feito' : ''}">${p.concluido ? '✓ feito' : (trancado ? '🔒' : (p.lido ? 'a meio' : 'por começar'))}</span></div></div>`;
  }).join('');

  const blocoTreino = MODULOS.some(m => (PROGRESSO[m.id]||{}).lido)
    ? `<div class="card"><h4>🎯 Treino livre</h4><p class="nota">Perguntas à sorte dos módulos que já leste. Não conta para o percurso — serve para veres o que ficou.</p><button class="principal" onclick="abrirTreino()">Começar treino</button></div>`
    : '';

  const blocoFeito = tudoFeito
    ? `<div class="card aviso">
        <strong>🎉 Parabéns — concluíste o percurso do Nível ${esc(ALUNO.nivel)}.</strong>
        <p style="margin-top:6px;">Antes do teste final, vale a pena rever com calma o que já leste — usa o Treino livre acima quantas vezes quiseres, até te sentires seguro.</p>
        <p style="margin-top:6px;">Quando te sentires à vontade, faz o teste final na aba Testes. Se passares, o teu certificado fica pronto ali mesmo, para descarregares.</p>
        <button class="principal" onclick="mudarAba('testes')">Ir para os Testes</button>
      </div>`
    : '';

  const blocoTurma = (ALUNO.turmaWhatsapp || ALUNO.turmaJitsi)
    ? `<div class="card comunidade"><h4>A tua turma${ALUNO.turmaNome ? ' · ' + esc(ALUNO.turmaNome) : ''}</h4>
       ${ALUNO.turmaWhatsapp ? `<a href="${esc(ALUNO.turmaWhatsapp)}" target="_blank" rel="noopener">💬 Grupo de conversa</a>` : ''}
       ${ALUNO.turmaJitsi ? `<a href="${esc(ALUNO.turmaJitsi)}" target="_blank" rel="noopener">🎥 Sala de encontros</a>` : ''}
       <p class="nota">Traz as dúvidas ao grupo. Nenhuma é demasiado básica.</p></div>`
    : '';

  palco().innerHTML = `<div class="card"><strong>${concluidos} de ${MODULOS.length} módulos concluídos</strong>
    <div class="barra"><i style="width:${pct}%"></i></div>
    <p class="nota">Faz um módulo de cada vez, sem pressa. O que escreveres fica guardado e a escola acompanha o teu percurso.</p></div>
    ${listaModulos}${blocoTreino}${blocoFeito}${blocoTurma}`;
}

async function carregarModeloCert(){
  if (window.__certDataUrl) return window.__certDataUrl;
  const res = await fetch(CERT_TEMPLATE, { cache: 'force-cache' });
  if (!res.ok) throw new Error('Modelo do certificado não encontrado.');
  const blob = await res.blob();
  window.__certDataUrl = await new Promise((ok, nok) => {
    const r = new FileReader();
    r.onload = () => ok(r.result);
    r.onerror = () => nok(new Error('Não consegui ler o modelo.'));
    r.readAsDataURL(blob);
  });
  return window.__certDataUrl;
}

function escreverCampoCert(pdf, texto, campo){
  let size = campo.size;
  pdf.setFontSize(size);
  while (size > 7 && pdf.getTextWidth(texto) > campo.maxW){ size -= 0.5; pdf.setFontSize(size); }
  pdf.text(texto, campo.x, campo.y, { align: campo.align || 'center' });
}

window.descarregarCertificado = async function(nivel, btn){
  const info = CERT_NIVEIS[nivel];
  if (!info) return;
  const antes = btn.textContent;
  btn.disabled = true; btn.textContent = 'A preparar…';
  try {
    const modelo = await carregarModeloCert();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
    const L = CERT_LAYOUT;
    pdf.addImage(modelo, 'PNG', L.imgX, L.imgY, L.imgW, L.imgH);
    pdf.setFont('helvetica', 'bold');
    pdf.setTextColor(info.cor[0], info.cor[1], info.cor[2]);
    escreverCampoCert(pdf, info.campo, L.nivel);
    pdf.setTextColor(L.cor[0], L.cor[1], L.cor[2]);
    escreverCampoCert(pdf, ALUNO.nome || '', L.nome);
    const hoje = new Date().toLocaleDateString('pt-PT', { day:'2-digit', month:'long', year:'numeric' });
    escreverCampoCert(pdf, hoje, L.data);
    pdf.save('Certificado-Reiki-Nivel-' + nivel + '.pdf');
  } catch(e){
    alert('Não consegui gerar o certificado: ' + e.message + '\n\nFala com a tua Mestra — ela consegue emiti-lo do lado dela.');
  }
  btn.disabled = false; btn.textContent = antes;
};

function desenharTestes(){
  if (!TESTES.length){
    palco().innerHTML = `<div class="card"><p class="nota">Ainda não há testes disponíveis para o teu nível.</p></div>`;
    return;
  }
  palco().innerHTML = `<div class="card"><p class="nota">Corrigido na hora. Precisas da nota mínima para passar — se não conseguires, podes repetir.</p></div>` +
    TESTES.map(t => `<div class="card">
      <strong>${esc(t.titulo || 'Teste')}</strong>
      <p class="nota">${(t.perguntas||[]).length} perguntas · mínimo ${t.notaMinima || 70}%</p>
      <button class="principal" onclick="abrirTeste('${t.id}')">Fazer o teste</button>
    </div>`).join('');
}

let TESTE_ABERTO = null;

window.abrirTeste = function(testeId){
  TESTE_ABERTO = TESTES.find(t => t.id === testeId);
  if (!TESTE_ABERTO) return;
  const qs = TESTE_ABERTO.perguntas || [];
  palco().innerHTML = `<div class="card">
      <strong>${esc(TESTE_ABERTO.titulo)}</strong>
      <p class="nota">Responde a todas. Precisas de ${TESTE_ABERTO.notaMinima || 70}% para passar.</p>
    </div>` +
    qs.map((q, i) => `<div class="card"><h4>${i+1}. ${esc(q.texto)}</h4>
      ${(q.opcoes||[]).map((o, j) => `<label style="display:flex;gap:9px;align-items:flex-start;margin-top:9px;font-size:14.5px;">
        <input type="radio" name="q${i}" value="${j}" style="width:auto;margin-top:3px;">
        <span>${esc(o)}</span></label>`).join('')}
    </div>`).join('') +
    `<div class="card"><button class="principal" onclick="entregarTeste()">Entregar</button></div>`;
  window.scrollTo({top:0,behavior:'smooth'});
};

window.entregarTeste = async function(){
  const t = TESTE_ABERTO;
  const qs = t.perguntas || [];
  let certas = 0, respondidas = 0;
  const respostas = [];
  for (let i = 0; i < qs.length; i++){
    const sel = document.querySelector(`input[name="q${i}"]:checked`);
    const v = sel ? parseInt(sel.value) : -1;
    respostas.push(v);
    if (v >= 0) respondidas++;
    if (v === (qs[i].correta || 0)) certas++;
  }
  if (respondidas < qs.length){
    alert('Faltam ' + (qs.length - respondidas) + ' pergunta(s) por responder.');
    return;
  }
  const pct = Math.round(certas / qs.length * 100);
  const aprovado = pct >= (t.notaMinima || 70);
  try {
    await setDoc(doc(collection(db, 'tenants', TENANT, 'reikiQuizResults')), {
      testeId: t.id, codigo: CODIGO, alunoId: ALUNO.alunoId || '', alunoNome: ALUNO.nome || '',
      percentagem: pct, aprovado, respostas, entregueEm: new Date().toISOString()
    });
  } catch(e){ console.warn('não consegui entregar', e); }
  palco().innerHTML = `<div class="card" style="text-align:center;">
      <h3 style="color:var(--bronze);">${pct}%</h3>
      <p style="margin-top:8px;">${aprovado
        ? '🎉 Passaste! Parabéns pelo teu percurso até aqui.'
        : 'Ficaste abaixo do mínimo. Revê o manual e o Treino livre, e fala com a tua Mestra — podes repetir.'}</p>
    </div>
    ${aprovado ? `<div class="card" style="text-align:center;">
      <h4>🎓 O teu certificado está pronto</h4>
      <p class="nota" style="margin-top:6px;">Descarrega e guarda. Se precisares de outra via mais tarde, a tua Mestra também o pode emitir.</p>
      <button class="principal" onclick="descarregarCertificado('${t.nivel}', this)">Descarregar certificado (PDF)</button>
    </div>` : ''}
    <button class="leve" style="width:100%;" onclick="mudarAba('testes')">← Voltar aos testes</button>`;
  window.scrollTo({top:0,behavior:'smooth'});
};

function desenharPoemas(){
  const url = 'poemas-meiji.html?t=' + encodeURIComponent(TENANT);
  palco().innerHTML = `<div class="card" style="text-align:center;">
      <h4>🎴 Os poemas do imperador Meiji</h4>
      <p class="nota" style="margin-top:6px;">Tira um poema com uma intenção para meditar, ou consulta-os um a um.</p>
      <a class="principal" style="display:block;text-decoration:none;box-sizing:border-box;" href="${url}" target="_blank" rel="noopener">Abrir os poemas</a>
    </div>`;
}

let ABERTO = null, PASSO = 'ler', RESPOSTAS = {};

window.abrirModulo = function(id){
  ABERTO = MODULOS.find(m => m.id === id);
  if (!ABERTO) return;
  const p = PROGRESSO[id] || {};
  PASSO = !p.lido ? 'ler' : (!p.praticaFeita ? 'praticar' : 'responder');
  RESPOSTAS = Object.assign({}, p.respostas || {});
  desenharModulo();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

function blocoHtml(b){
  if (b.tipo === 'destaque') return `<div class="bloco destaque">${esc(b.conteudo)}</div>`;
  if (b.tipo === 'lista') return `<div class="bloco">${b.titulo ? `<h4>${esc(b.titulo)}</h4>` : ''}<ul>${(b.itens||[]).map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`;
  if (b.tipo === 'imagem') return b.url ? `<div class="bloco" style="text-align:center;">
      <img src="${esc(b.url)}" style="max-width:100%;border-radius:10px;border:1px solid var(--linha);">
      ${b.legenda ? `<p class="nota">${esc(b.legenda)}</p>` : ''}</div>` : '';
  return `<div class="bloco" style="white-space:pre-line;">${esc(b.conteudo)}</div>`;
}

function desenharModulo(){
  const m = ABERTO, p = PROGRESSO[m.id] || {};
  const cab = `<button class="leve" onclick="desenharLista();window.scrollTo(0,0)">← Voltar</button>
    <div class="card" style="margin-top:12px;"><h3 style="color:var(--bronze);">${m.ordem}. ${esc(m.titulo)}</h3>
    ${m.subtitulo ? `<p class="nota">${esc(m.subtitulo)}</p>` : ''}
    <div class="passos"><div class="${PASSO==='ler'?'on':(p.lido?'ok':'')}">📖 Ler</div>
    <div class="${PASSO==='praticar'?'on':(p.praticaFeita?'ok':'')}">🤲 Praticar</div>
    <div class="${PASSO==='responder'?'on':(p.concluido?'ok':'')}">✍️ Responder</div></div></div>`;

  if (PASSO === 'ler'){
    palco().innerHTML = cab + `<div class="card">${(m.ler||[]).map(blocoHtml).join('')}
      <button class="principal" onclick="marcarLido()">Li — seguir para a prática</button></div>`;
    return;
  }

  if (PASSO === 'praticar'){
    const pr = m.praticar || {};
    const blocoDesafio = m.desafio ? `<div class="card aviso" style="margin-top:12px;">
      <h4>🎯 Desafio para levar para a vida</h4>
      <p style="white-space:pre-line;">${esc(m.desafio)}</p>
      <label class="nota" style="display:block;margin:10px 0 5px;">Se o experimentares, conta aqui o que aconteceu (opcional)</label>
      <textarea id="desafioTexto" rows="3" placeholder="Não é obrigatório — só se quiseres registar.">${esc(p.desafioRegisto || '')}</textarea>
    </div>` : '';
    palco().innerHTML = cab + `<div class="card"><h4>${esc(pr.titulo || 'Prática')}</h4>
      <div class="bloco" style="white-space:pre-line;">${esc(pr.instrucoes || '')}</div>
      ${pr.registo !== false ? `<label class="nota" style="display:block;margin:10px 0 5px;">${esc(pr.registoPergunta || 'O que notaste?')}</label>
      <textarea id="registo" rows="5" placeholder="Escreve sem pensar muito. É para ti — e a escola lê.">${esc(p.registo || '')}</textarea>` : ''}
      <button class="principal" onclick="marcarPratica()">Fiz — seguir para as perguntas</button>
      <p class="nota">Faz mesmo a prática antes de avançares. É ela que ensina; o resto é conversa.</p></div>
      ${blocoDesafio}`;
    return;
  }

  const qs = m.responder || [];
  const perguntasHtml = qs.map((q, i) => {
    const dada = RESPOSTAS[i];
    const respondida = dada !== undefined;
    const opcoesHtml = (q.opcoes||[]).map((o, oi) => {
      let cls = '';
      if (respondida){ if (oi === q.correta) cls = 'certa'; else if (oi === dada) cls = 'errada'; }
      const attr = respondida ? 'disabled' : `onclick="responder(${i},${oi})"`;
      return `<button class="opcao ${cls}" ${attr}>${respondida && oi === q.correta ? '✓ ' : ''}${esc(o)}</button>`;
    }).join('');
    return `<div style="margin-bottom:18px;"><h4>${i+1}. ${esc(q.pergunta)}</h4>${opcoesHtml}
      ${respondida && q.feedback ? `<div class="feedback">💬 ${esc(q.feedback)}</div>` : ''}</div>`;
  }).join('');
  const faltam = qs.length - Object.keys(RESPOSTAS).length;
  palco().innerHTML = cab + `<div class="card">${perguntasHtml}
    <button class="principal" onclick="concluirModulo()" ${faltam > 0 ? 'disabled' : ''}>
      ${faltam > 0 ? `Faltam ${faltam} resposta(s)` : 'Concluir este módulo'}
    </button></div>`;
}

window.responder = function(i, oi){ RESPOSTAS[i] = oi; desenharModulo(); };

async function gravar(dados){
  const id = CODIGO + '_' + ABERTO.id;
  const base = { codigo: CODIGO, moduloId: ABERTO.id, nivel: String(ALUNO.nivel),
    alunoNome: ALUNO.nome || '', moduloTitulo: ABERTO.titulo || '', actualizadoEm: new Date().toISOString() };
  const junto = Object.assign({}, PROGRESSO[ABERTO.id] || {}, base, dados);
  PROGRESSO[ABERTO.id] = junto;
  try { await setDoc(doc(db, 'tenants', TENANT, 'reikiProgress', id), junto, { merge: true }); }
  catch(e){ console.warn('não consegui gravar', e); }
}

window.marcarLido = async function(){
  await gravar({ lido: true, lidoEm: new Date().toISOString() });
  PASSO = 'praticar'; desenharModulo(); window.scrollTo({top:0,behavior:'smooth'});
};
window.marcarPratica = async function(){
  const t = document.getElementById('registo');
  const d = document.getElementById('desafioTexto');
  await gravar({ praticaFeita: true, registo: t ? t.value.trim() : '',
                 desafioRegisto: d ? d.value.trim() : '', praticaEm: new Date().toISOString() });
  PASSO = 'responder'; desenharModulo(); window.scrollTo({top:0,behavior:'smooth'});
};
window.concluirModulo = async function(){
  const qs = ABERTO.responder || [];
  const acertos = qs.reduce((n, q, i) => n + (RESPOSTAS[i] === q.correta ? 1 : 0), 0);
  await gravar({ respostas: RESPOSTAS, acertos, totalPerguntas: qs.length, concluido: true, concluidoEm: new Date().toISOString() });
  desenharLista(); window.scrollTo({top:0,behavior:'smooth'});
};

let TREINO = [], TI = 0, TACERTOS = 0, TRESP = null;

window.abrirTreino = function(){
  const banco = [];
  MODULOS.forEach(m => {
    if (!(PROGRESSO[m.id]||{}).lido) return;
    (m.responder||[]).forEach(q => banco.push(Object.assign({}, q, { modulo: m.titulo })));
  });
  if (!banco.length) return;
  TREINO = banco.sort(() => Math.random() - 0.5).slice(0, Math.min(10, banco.length));
  TI = 0; TACERTOS = 0; TRESP = null;
  desenharTreino();
  window.scrollTo({top:0,behavior:'smooth'});
};

function desenharTreino(){
  if (TI >= TREINO.length){
    const pct = Math.round(TACERTOS / TREINO.length * 100);
    const msg = pct === 100 ? 'Sem falhas. Isto está assente.' :
      pct >= 70 ? 'Bom. Relê os módulos das que falhaste.' :
      'Vale a pena voltar aos módulos com calma — e não faz mal nenhum.';
    palco().innerHTML = `<div class="card" style="text-align:center;"><h3 style="color:var(--bronze);">${TACERTOS} de ${TREINO.length}</h3>
      <div class="barra" style="margin:12px 0;"><i style="width:${pct}%"></i></div>
      <p>${pct}% certas</p><p class="nota" style="margin-top:8px;">${msg}</p>
      <button class="principal" onclick="abrirTreino()">Treinar outra vez</button>
      <button class="leve" style="width:100%;margin-top:8px;" onclick="desenharLista();window.scrollTo(0,0)">Voltar ao percurso</button></div>`;
    return;
  }
  const q = TREINO[TI];
  const opcoesHtml = (q.opcoes||[]).map((o, oi) => {
    let cls = '';
    if (TRESP !== null){ if (oi === q.correta) cls = 'certa'; else if (oi === TRESP) cls = 'errada'; }
    const attr = TRESP !== null ? 'disabled' : `onclick="treinoResponder(${oi})"`;
    return `<button class="opcao ${cls}" ${attr}>${esc(o)}</button>`;
  }).join('');
  palco().innerHTML = `<button class="leve" onclick="desenharLista();window.scrollTo(0,0)">← Sair do treino</button>
    <div class="card" style="margin-top:12px;"><p class="nota">Pergunta ${TI+1} de ${TREINO.length} · ${TACERTOS} certa(s) até agora</p>
    <div class="barra" style="margin:8px 0 14px;"><i style="width:${Math.round(TI/TREINO.length*100)}%"></i></div>
    <h4>${esc(q.pergunta)}</h4>${opcoesHtml}
    ${TRESP !== null ? `${q.feedback ? `<div class="feedback">💬 ${esc(q.feedback)}</div>` : ''}
      <p class="nota">Do módulo: ${esc(q.modulo)}</p>
      <button class="principal" onclick="treinoSeguinte()">Seguinte</button>` : ''}</div>`;
}

window.treinoResponder = function(oi){ TRESP = oi; if (oi === TREINO[TI].correta) TACERTOS++; desenharTreino(); };
window.treinoSeguinte = function(){ TI++; TRESP = null; desenharTreino(); window.scrollTo({top:0,behavior:'smooth'}); };

arrancar();
</script>
