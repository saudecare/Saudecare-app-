<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaúdeCare</title>
<style>
  :root{
    --primary:#2f6f5e; --primary-dark:#1f4d40; --bg:#f6f8f7; --card:#ffffff;
    --text:#1a2b26; --muted:#6b7d76; --danger:#b3413a; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;}
  nav{width:220px;background:var(--primary-dark);color:#fff;padding:20px 12px;flex-shrink:0;}
  nav h1{font-size:20px;margin-bottom:24px;padding:0 8px;}
  nav button{display:block;width:100%;text-align:left;background:none;border:none;color:#e4ede9;
    padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:4px;}
  nav button.active,nav button:hover{background:var(--primary);color:#fff;}
  main{flex:1;padding:24px;max-width:900px;}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);}
  h2{margin-bottom:14px;font-size:20px;}
  input,select,textarea{width:100%;padding:10px;border:1px solid #d8e0dc;border-radius:8px;
    margin-bottom:10px;font-size:14px;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  button.primary{background:var(--primary);color:#fff;border:none;padding:10px 18px;
    border-radius:8px;cursor:pointer;font-size:14px;}
  button.danger{background:var(--danger);color:#fff;border:none;padding:8px 14px;
    border-radius:8px;cursor:pointer;font-size:13px;}
  button.ghost{background:none;border:1px solid #d8e0dc;padding:8px 14px;border-radius:8px;cursor:pointer;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .appt-item,.patient-item{border-bottom:1px solid #eef2f0;padding:10px 0;}
  .appt-item:last-child,.patient-item:last-child{border-bottom:none;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#e4ede9;color:var(--primary-dark);}
  .badge.cancelled{background:#f6e2e0;color:var(--danger);}
  .muted{color:var(--muted);font-size:13px;}
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2b26;
    color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:999;}
  .hidden{display:none !important;}
  @media(max-width:640px){
    #app{flex-direction:column;}
    nav{width:100%;display:flex;overflow-x:auto;padding:10px;}
    nav h1{display:none;}
    nav button{flex-shrink:0;margin-right:6px;margin-bottom:0;}
    main{padding:14px;}
  }
</style>
</head>
<body>

<div id="loginScreen" class="card" style="max-width:340px;">
  <h2>SaúdeCare — Entrar</h2>
  <label>Email</label>
  <input id="loginEmail" type="email" autocomplete="username">
  <label>Palavra-passe</label>
  <input id="loginPass" type="password" autocomplete="current-password">
  <button class="primary" style="width:100%" onclick="doLogin()">Entrar</button>
  <p id="loginError" class="muted" style="color:var(--danger);margin-top:8px;"></p>
</div>

<div id="app" class="hidden">
  <nav>
    <h1>SaúdeCare</h1>
    <button data-view="agenda" class="active">📅 Agenda</button>
    <button data-view="patients">🗂️ Pacientes</button>
    <button data-view="services">🩺 Serviços</button>
    <button data-view="protocols">📋 Protocolos</button>
    <button data-view="forms">📝 Fichas</button>
    <button data-view="trainings">🎓 Formações</button>
    <button data-view="profile">🏥 Perfil</button>
    <button data-view="settings">⚙️ Configurações</button>
    <button data-view="logout" style="margin-top:20px;color:#f2b8b8;">Sair</button>
  </nav>
  <main id="mainView"></main>
</div>

<div id="toast"></div>

<!-- Firebase (SDK modular v9, via CDN) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc,
  deleteDoc, query, where, orderBy, serverTimestamp, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ── CONFIGURAÇÃO — substituir pelos valores reais do projeto Firebase ──
const firebaseConfig = {
  apiKey: "AIzaSyDKWdXYEG6PO9KEMQMklyPGngtXuZlP7Cg",
  authDomain: "saudecare-app.firebaseapp.com",
  projectId: "saudecare-app",
  storageBucket: "saudecare-app.firebasestorage.app",
  messagingSenderId: "455466438728",
  appId: "1:455466438728:web:61cfbf9fac85d59e18c87d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let tenantId = null;
let tenantRole = null;
let currentTenantDoc = null;

// ── Helpers de UI ────────────────────────────────────────────────────
function toast(msg, isError=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#b3413a' : '#1a2b26';
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 3200);
}

function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

// ── Auth ─────────────────────────────────────────────────────────────
window.doLogin = async function(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    errEl.textContent = 'Credenciais inválidas ou conta inexistente.';
    console.error(e);
  }
};

onAuthStateChanged(auth, async (user) => {
  if (!user){
    currentUser = null; tenantId = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    return;
  }
  currentUser = user;

  // Força refresh do token para garantir que os custom claims (tenantId,
  // role) mais recentes estão disponíveis — essencial logo após onboarding.
  const tokenResult = await user.getIdTokenResult(true);
  tenantId = tokenResult.claims.tenantId || null;
  tenantRole = tokenResult.claims.role || null;

  if (!tenantId){
    toast('Esta conta ainda não está associada a nenhum subscritor.', true);
    await signOut(auth);
    return;
  }

  const tSnap = await getDoc(doc(db, 'tenants', tenantId));
  if (!tSnap.exists()){
    toast('Subscritor não encontrado.', true);
    await signOut(auth);
    return;
  }
  currentTenantDoc = tSnap.data();

  if (currentTenantDoc.status === 'suspended' || currentTenantDoc.status === 'cancelled'){
    toast('Esta conta está suspensa. Contacte o suporte.', true);
    await signOut(auth);
    return;
  }

  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  applyBranding();
  renderView('agenda');
});

document.querySelectorAll('nav button[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if (btn.dataset.view === 'logout'){ signOut(auth); return; }
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView(btn.dataset.view);
  });
});

function applyBranding(){
  if (currentTenantDoc?.branding?.primaryColor){
    document.documentElement.style.setProperty('--primary', currentTenantDoc.branding.primaryColor);
  }
}

// ── Audit log — escrito antes de qualquer operação sensível em pacientes ──
async function logAudit(action, targetPatientId){
  try{
    await addDoc(collection(db, 'tenants', tenantId, 'auditLog'), {
      action, targetPatientId: targetPatientId || null,
      performedBy: currentUser.uid, timestamp: serverTimestamp()
    });
  }catch(e){
    // Falha a registar auditoria não deve travar a operação principal,
    // mas é sinalizada em consola para diagnóstico.
    console.error('Falha ao gravar auditLog', e);
  }
}

// ── Router simples ──────────────────────────────────────────────────
function renderView(view){
  const main = document.getElementById('mainView');
  main.innerHTML = '<p class="muted">A carregar…</p>';
  if (view === 'agenda') renderAgenda(main);
  else if (view === 'patients') renderPatients(main);
  else if (view === 'services') renderServices(main);
  else if (view === 'protocols') renderProtocols(main);
  else if (view === 'forms') renderForms(main);
  else if (view === 'trainings') renderTrainings(main);
  else if (view === 'profile') renderProfile(main);
  else if (view === 'settings') renderSettings(main);
}

// ── AGENDA ───────────────────────────────────────────────────────────
async function renderAgenda(main){
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);

  const q = query(
    collection(db, 'tenants', tenantId, 'appointments'),
    where('startsAt', '>=', Timestamp.fromDate(todayStart)),
    where('startsAt', '<=', Timestamp.fromDate(todayEnd)),
    orderBy('startsAt')
  );
  const snap = await getDocs(q);

  let itemsHtml = '';
  snap.forEach(d=>{
    const a = d.data();
    const time = a.startsAt.toDate().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
    const statusClass = a.status === 'cancelled' ? 'cancelled' : '';
    itemsHtml += `<div class="appt-item">
      <div class="row">
        <div><strong>${time}</strong> — ${escapeHtml(a.patientName||'Paciente')}
          <div class="muted">${escapeHtml(a.serviceName||'')}</div>
        </div>
        <span class="badge ${statusClass}">${escapeHtml(a.status)}</span>
      </div>
      <div class="row" style="margin-top:6px;">
        <button class="ghost" onclick="editAppointment('${d.id}')">Editar</button>
        ${a.status !== 'cancelled' ? `<button class="ghost" onclick="cancelAppointment('${d.id}')">Cancelar</button>` : ''}
        <button class="danger" onclick="deleteAppointment('${d.id}')">Apagar</button>
      </div>
    </div>`;
  });
  if (!itemsHtml) itemsHtml = '<p class="muted">Sem marcações para hoje.</p>';

  main.innerHTML = `
    <div class="row"><h2>Agenda — Hoje</h2>
      <button class="primary" onclick="openNewAppointment()">+ Nova marcação</button>
    </div>
    <div class="card">${itemsHtml}</div>
    <div id="apptFormContainer"></div>
  `;
}

window.openNewAppointment = async function(){
  const patientsSnap = await getDocs(collection(db, 'tenants', tenantId, 'patients'));
  const servicesSnap = await getDocs(query(collection(db, 'tenants', tenantId, 'services'), where('active','==', true)));

  let patientOpts = '<option value="">Selecionar paciente…</option>';
  patientsSnap.forEach(d => patientOpts += `<option value="${d.id}" data-name="${escapeHtml(d.data().fullName)}">${escapeHtml(d.data().fullName)}</option>`);

  let serviceOpts = '<option value="">Selecionar serviço…</option>';
  servicesSnap.forEach(d => serviceOpts += `<option value="${d.id}" data-name="${escapeHtml(d.data().name)}" data-duration="${d.data().durationMinutes}">${escapeHtml(d.data().name)}</option>`);

  document.getElementById('apptFormContainer').innerHTML = `
    <div class="card">
      <h2>Nova marcação</h2>
      <label>Paciente</label><select id="apptPatient">${patientOpts}</select>
      <label>Serviço</label><select id="apptService">${serviceOpts}</select>
      <label>Data e hora</label><input id="apptStart" type="datetime-local">
      <button class="primary" onclick="saveAppointment()">Guardar</button>
    </div>`;
};

window.saveAppointment = async function(){
  const patientSel = document.getElementById('apptPatient');
  const serviceSel = document.getElementById('apptService');
  const startInput = document.getElementById('apptStart').value;
  if (!patientSel.value || !serviceSel.value || !startInput){
    toast('Preencha todos os campos.', true); return;
  }
  const duration = parseInt(serviceSel.selectedOptions[0].dataset.duration || '50', 10);
  const start = new Date(startInput);
  const end = new Date(start.getTime() + duration*60000);

  await addDoc(collection(db, 'tenants', tenantId, 'appointments'), {
    patientId: patientSel.value,
    patientName: patientSel.selectedOptions[0].dataset.name,
    serviceId: serviceSel.value,
    serviceName: serviceSel.selectedOptions[0].dataset.name,
    staffUid: currentUser.uid,
    startsAt: Timestamp.fromDate(start),
    endsAt: Timestamp.fromDate(end),
    status: 'confirmed',
    createdAt: serverTimestamp()
  });
  toast('Marcação criada.');
  renderView('agenda');
};

window.editAppointment = async function(appointmentId){
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'appointments', appointmentId));
  if (!snap.exists()){ toast('Marcação não encontrada.', true); return; }
  const a = snap.data();

  const patientsSnap = await getDocs(collection(db, 'tenants', tenantId, 'patients'));
  const servicesSnap = await getDocs(collection(db, 'tenants', tenantId, 'services'));

  let patientOpts = '';
  patientsSnap.forEach(d => patientOpts += `<option value="${d.id}" data-name="${escapeHtml(d.data().fullName)}" ${d.id===a.patientId?'selected':''}>${escapeHtml(d.data().fullName)}</option>`);
  let serviceOpts = '';
  servicesSnap.forEach(d => serviceOpts += `<option value="${d.id}" data-name="${escapeHtml(d.data().name)}" data-duration="${d.data().durationMinutes}" ${d.id===a.serviceId?'selected':''}>${escapeHtml(d.data().name)}</option>`);

  const startLocal = new Date(a.startsAt.toDate().getTime() - a.startsAt.toDate().getTimezoneOffset()*60000)
    .toISOString().slice(0,16);

  document.getElementById('apptFormContainer').innerHTML = `
    <div class="card">
      <h2>Editar marcação</h2>
      <label>Paciente</label><select id="apptPatient">${patientOpts}</select>
      <label>Serviço</label><select id="apptService">${serviceOpts}</select>
      <label>Data e hora</label><input id="apptStart" type="datetime-local" value="${startLocal}">
      <button class="primary" onclick="updateAppointment('${appointmentId}')">Guardar alterações</button>
    </div>`;
};

window.updateAppointment = async function(appointmentId){
  const patientSel = document.getElementById('apptPatient');
  const serviceSel = document.getElementById('apptService');
  const startInput = document.getElementById('apptStart').value;
  if (!patientSel.value || !serviceSel.value || !startInput){
    toast('Preencha todos os campos.', true); return;
  }
  const duration = parseInt(serviceSel.selectedOptions[0].dataset.duration || '50', 10);
  const start = new Date(startInput);
  const end = new Date(start.getTime() + duration*60000);

  await updateDoc(doc(db, 'tenants', tenantId, 'appointments', appointmentId), {
    patientId: patientSel.value,
    patientName: patientSel.selectedOptions[0].dataset.name,
    serviceId: serviceSel.value,
    serviceName: serviceSel.selectedOptions[0].dataset.name,
    startsAt: Timestamp.fromDate(start),
    endsAt: Timestamp.fromDate(end)
  });
  toast('Marcação atualizada.');
  renderView('agenda');
};

window.cancelAppointment = async function(appointmentId){
  if (!confirm('Cancelar esta marcação? Fica registada como cancelada, não é apagada.')) return;
  await updateDoc(doc(db, 'tenants', tenantId, 'appointments', appointmentId), { status: 'cancelled' });
  toast('Marcação cancelada.');
  renderView('agenda');
};

window.deleteAppointment = async function(appointmentId){
  if (!confirm('Apagar esta marcação definitivamente? Não pode ser desfeito.')) return;
  await deleteDoc(doc(db, 'tenants', tenantId, 'appointments', appointmentId));
  toast('Marcação apagada.');
  renderView('agenda');
};

// ── PACIENTES (dados de saúde — tratamento reforçado) ──────────────────
async function renderPatients(main){
  const snap = await getDocs(query(collection(db, 'tenants', tenantId, 'patients'), orderBy('fullName')));
  let rows = '';
  snap.forEach(d=>{
    const p = d.data();
    rows += `<div class="patient-item row">
      <div><strong>${escapeHtml(p.fullName)}</strong>
        <div class="muted">${escapeHtml(p.phone||'')} ${p.consentGivenAt ? '· consentimento registado' : '· <span style=\"color:var(--danger)\">sem consentimento</span>'}</div>
      </div>
      <div>
        <button class="ghost" onclick="viewPatient('${d.id}')">Ver ficha</button>
        <button class="danger" onclick="deletePatient('${d.id}','${escapeHtml(p.fullName)}')">Apagar</button>
      </div>
    </div>`;
  });
  if (!rows) rows = '<p class="muted">Ainda sem pacientes.</p>';

  main.innerHTML = `
    <div class="row"><h2>Pacientes</h2>
      <button class="primary" onclick="openNewPatient()">+ Novo paciente</button>
    </div>
    <div class="card">${rows}</div>
    <div id="patientFormContainer"></div>
  `;
}

window.openNewPatient = function(){
  document.getElementById('patientFormContainer').innerHTML = `
    <div class="card">
      <h2>Novo paciente</h2>
      <label>Nome completo</label><input id="pFullName">
      <label>Telefone</label><input id="pPhone">
      <label>Email</label><input id="pEmail" type="email">
      <label>Notas clínicas iniciais</label><textarea id="pNotes" rows="3"></textarea>
      <label style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="pConsent" style="width:auto;margin:0;">
        Paciente deu consentimento explícito para tratamento de dados de saúde
      </label>
      <button class="primary" onclick="savePatient()">Guardar</button>
    </div>`;
};

window.savePatient = async function(){
  const fullName = document.getElementById('pFullName').value.trim();
  const consent = document.getElementById('pConsent').checked;
  if (!fullName){ toast('Nome é obrigatório.', true); return; }
  if (!consent){ toast('Não é possível registar sem consentimento explícito.', true); return; }

  await addDoc(collection(db, 'tenants', tenantId, 'patients'), {
    fullName,
    phone: document.getElementById('pPhone').value.trim(),
    email: document.getElementById('pEmail').value.trim(),
    clinicalNotes: document.getElementById('pNotes').value.trim(),
    consentGivenAt: serverTimestamp(),
    consentVersion: currentTenantDoc?.legalTexts?.consentVersion || 'v1',
    createdBy: currentUser.uid
  });
  toast('Paciente registado.');
  renderView('patients');
};

window.viewPatient = async function(patientId){
  await logAudit('patient_viewed', patientId);
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'patients', patientId));
  if (!snap.exists()){ toast('Paciente não encontrado.', true); return; }
  const p = snap.data();

  const reportsSnap = await getDocs(query(
    collection(db, 'tenants', tenantId, 'patients', patientId, 'reports'),
    orderBy('generatedAt', 'desc')
  ));
  let reportsHtml = '';
  reportsSnap.forEach(rd => {
    const r = rd.data();
    const date = r.generatedAt?.toDate ? r.generatedAt.toDate().toLocaleDateString('pt-PT') : '';
    reportsHtml += `<div class="appt-item row">
      <div><strong>${escapeHtml(r.protocolName)}</strong><div class="muted">${date}</div></div>
      <button class="ghost" onclick="viewSavedReport('${patientId}','${rd.id}')">Ver</button>
    </div>`;
  });
  if (!reportsHtml) reportsHtml = '<p class="muted">Ainda sem relatórios para este paciente.</p>';

  // Fichas/questionários já associados a este paciente (antes ficavam
  // guardados mas nunca eram mostrados aqui — corrigido).
  const formRespSnap = await getDocs(query(
    collection(db, 'tenants', tenantId, 'patients', patientId, 'formResponses'),
    orderBy('submittedAt', 'desc')
  ));
  let formRespHtml = '';
  formRespSnap.forEach(fd => {
    const f = fd.data();
    const date = f.submittedAt?.toDate ? f.submittedAt.toDate().toLocaleDateString('pt-PT') : '';
    formRespHtml += `<div class="appt-item row">
      <div><strong>${escapeHtml(f.formTitle)}</strong><div class="muted">${date}</div></div>
      <button class="ghost" onclick="viewSavedFormResponse('${patientId}','${fd.id}')">Ver respostas</button>
    </div>`;
  });
  if (!formRespHtml) formRespHtml = '<p class="muted">Ainda sem fichas respondidas para este paciente.</p>';

  document.getElementById('patientFormContainer').innerHTML = `
    <div class="card">
      <h2>${escapeHtml(p.fullName)}</h2>
      <p class="muted">${escapeHtml(p.phone||'')} · ${escapeHtml(p.email||'')}</p>
      <label style="margin-top:10px;">Notas clínicas</label>
      <textarea rows="5" readonly>${escapeHtml(p.clinicalNotes||'')}</textarea>
      <p class="muted">Consentimento: ${p.consentGivenAt ? 'registado' : 'em falta'}</p>
      <div class="row" style="margin-top:10px;">
        <button class="primary" onclick="startGuidedConsultation('${patientId}', '${escapeHtml(p.fullName)}')">🧭 Iniciar consulta guiada</button>
        <button class="ghost" onclick="openSendFormToPatient('${patientId}', '${escapeHtml(p.fullName)}')">📝 Enviar ficha a este paciente</button>
      </div>
    </div>
    <div id="sendFormContainer"></div>
    <div class="card">
      <h2>Relatórios anteriores</h2>
      ${reportsHtml}
    </div>
    <div class="card">
      <h2>Fichas respondidas</h2>
      ${formRespHtml}
    </div>`;
};

window.viewSavedFormResponse = async function(patientId, responseId){
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'patients', patientId, 'formResponses', responseId));
  if (!snap.exists()){ toast('Resposta não encontrada.', true); return; }
  const r = snap.data();
  let answersHtml = (r.answers || []).map(a => `
    <div class="appt-item"><strong>${escapeHtml(a.label)}</strong><div class="muted">${escapeHtml(String(a.value))}</div></div>
  `).join('');
  document.getElementById('sendFormContainer').innerHTML = `
    <div class="card">
      <h2>${escapeHtml(r.formTitle)}</h2>
      ${answersHtml}
    </div>`;
};

// ── Enviar ficha diretamente a um paciente já existente ─────────────────
// O link inclui o patientId — quando o paciente responde, a resposta já
// chega "etiquetada" e aparece pré-selecionada nas pendentes, reduzindo o
// risco de associar ao paciente errado. A associação continua a exigir um
// toque de confirmação (não é 100% automática) porque a resposta vem de
// alguém sem conta — sem essa confirmação humana, dados de saúde podiam
// entrar na ficha errada sem ninguém dar por isso.
window.openSendFormToPatient = async function(patientId, patientName){
  const snap = await getDocs(collection(db, 'tenants', tenantId, 'forms'));
  if (snap.empty){
    toast('Crie uma ficha primeiro, em "Fichas".', true);
    return;
  }
  let opts = '<option value="">Selecionar ficha...</option>';

// ── FICHAS / QUESTIONÁRIOS (tipo Google Forms) ──────────────────────────
// O subscritor cria uma ficha com perguntas de vários tipos. Gera-se um
// link único que envia ao paciente (sem precisar de conta). As respostas
// entram numa fila de "pendentes" e o subscritor associa manualmente a
// um paciente — evita escrita direta e não autenticada nos dados internos.
let formQuestionsDraft = [];

async function renderForms(main){
  const snap = await getDocs(collection(db, 'tenants', tenantId, 'forms'));
  let rows = '';
  snap.forEach(d=>{
    const f = d.data();
    const link = `${window.location.origin}${window.location.pathname.replace('saudecare-core.html','saudecare-ficha-publica.html')}?t=${currentTenantDoc.slug}&f=${d.id}`;
    rows += `<div class="appt-item">
      <div class="row">
        <div><strong>${escapeHtml(f.title)}</strong><div class="muted">${(f.questions||[]).length} perguntas</div></div>
        <div>
          <button class="ghost" onclick="editForm('${d.id}')">Editar</button>
          <button class="danger" onclick="deleteForm('${d.id}')">Remover</button>
        </div>
      </div>
      <div class="row" style="margin-top:8px;">
        <input readonly value="${link}" style="font-size:11px;margin:0;" onclick="this.select()">
        <button class="ghost" onclick="navigator.clipboard.writeText('${link}');toast('Link copiado.')">Copiar</button>
      </div>
    </div>`;
  });
  if (!rows) rows = '<p class="muted">Ainda sem fichas. Crie a sua primeira ficha de avaliação.</p>';

  const pendingSnap = await getDocs(query(
    collection(db, 'public_form_responses'),
    where('tenantId', '==', tenantId), where('status', '==', 'pending_review')
  ));
  let pendingHtml = '';
  pendingSnap.forEach(d=>{
    const r = d.data();
    const linkedBadge = r.patientId ? '<span class="badge">paciente identificado</span>' : '';
    pendingHtml += `<div class="appt-item row">
      <div><strong>${escapeHtml(r.respondentName||'Sem nome')}</strong> ${linkedBadge}
        <div class="muted">${escapeHtml(r.formTitle||'')}</div></div>
      <button class="primary" onclick="openAttachResponse('${d.id}')">Associar a paciente</button>
    </div>`;
  });
  if (!pendingHtml) pendingHtml = '<p class="muted">Sem respostas pendentes.</p>';

  // Alerta visível no menu quando há respostas por associar.
  const pendingCountEl = document.querySelector('button[data-view="forms"]');
  if (pendingCountEl){
    pendingCountEl.innerHTML = pendingSnap.size > 0
      ? `📝 Fichas <span class="badge" style="background:#f6e2e0;color:var(--danger);margin-left:4px;">${pendingSnap.size}</span>`
      : `📝 Fichas`;
  }

  main.innerHTML = `
    <div class="row"><h2>Fichas / Questionários</h2>
      <button class="primary" onclick="openNewForm()">+ Nova ficha</button>
    </div>
    <div class="card">${rows}</div>
    <h2 style="margin:16px 0 10px;">Respostas pendentes de associar</h2>
    <div class="card">${pendingHtml}</div>
    <div id="formBuilderContainer"></div>
    <div id="attachContainer"></div>
  `;
}

window.openNewForm = function(){
  formQuestionsDraft = [];
  renderFormBuilder(null, '', '', []);
};

window.editForm = async function(id){
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'forms', id));
  if (!snap.exists()){ toast('Ficha não encontrada.', true); return; }
  const f = snap.data();
  formQuestionsDraft = (f.questions || []).map(q => ({...q}));
  renderFormBuilder(id, f.title, f.description||'', formQuestionsDraft);
};

function renderFormBuilder(editId, title, description, questions){
  formQuestionsDraft = questions;
  const qTypeLabel = { text: 'Texto livre', multiple_choice: 'Escolha múltipla', scale: 'Escala (0-10)' };

  let qHtml = formQuestionsDraft.map((q, idx) => `
    <div class="card" style="margin-bottom:8px;">
      <label>Pergunta</label>
      <input value="${escapeHtml(q.label||'')}" onchange="updateFormQuestion(${idx},'label',this.value)">
      <label>Tipo de resposta</label>
      <select onchange="changeQuestionType(${idx}, this.value)">
        <option value="text" ${q.type==='text'?'selected':''}>Texto livre</option>
        <option value="multiple_choice" ${q.type==='multiple_choice'?'selected':''}>Escolha múltipla</option>
        <option value="scale" ${q.type==='scale'?'selected':''}>Escala (0-10)</option>
      </select>
      ${q.type==='multiple_choice' ? `
        <label>Opções (uma por linha)</label>
        <textarea rows="3" onchange="updateFormQuestion(${idx},'optionsRaw',this.value)">${escapeHtml((q.options||[]).join('\n'))}</textarea>
      ` : ''}
      <button class="danger" onclick="removeFormQuestion(${idx})">Remover pergunta</button>
    </div>
  `).join('');

  document.getElementById('formBuilderContainer').innerHTML = `
    <div class="card">
      <h2>${editId ? 'Editar ficha' : 'Nova ficha'}</h2>
      <label>Título da ficha</label>
      <input id="formTitle" value="${escapeHtml(title)}" placeholder="ex: Questionário Pré-Consulta">
      <label>Descrição (opcional, o paciente vê isto)</label>
      <textarea id="formDescription" rows="2">${escapeHtml(description)}</textarea>
      <div id="formQuestionsList">${qHtml || '<p class="muted">Ainda sem perguntas.</p>'}</div>
      <button class="ghost" onclick="addFormQuestion()">+ Adicionar pergunta</button>
      <div style="margin-top:14px;">
        <button class="primary" onclick="saveForm('${editId||''}')">Guardar ficha</button>
      </div>
    </div>`;
}

window.updateFormQuestion = function(idx, field, value){
  if (field === 'optionsRaw'){
    formQuestionsDraft[idx].options = value.split('\n').map(s=>s.trim()).filter(Boolean);
  } else {
    formQuestionsDraft[idx][field] = value;
  }
};

window.changeQuestionType = function(idx, type){
  formQuestionsDraft[idx].type = type;
  if (type === 'multiple_choice' && !formQuestionsDraft[idx].options) formQuestionsDraft[idx].options = [];
  renderFormBuilder(window.__editingFormId,
    document.getElementById('formTitle')?.value || '',
    document.getElementById('formDescription')?.value || '', formQuestionsDraft);
};

window.addFormQuestion = function(){
  formQuestionsDraft.push({ id: 'q'+Date.now(), type: 'text', label: '' });
  renderFormBuilder(window.__editingFormId,
    document.getElementById('formTitle')?.value || '',
    document.getElementById('formDescription')?.value || '', formQuestionsDraft);
};

window.removeFormQuestion = function(idx){
  formQuestionsDraft.splice(idx, 1);
  renderFormBuilder(window.__editingFormId,
    document.getElementById('formTitle')?.value || '',
    document.getElementById('formDescription')?.value || '', formQuestionsDraft);
};

window.saveForm = async function(editId){
  const title = document.getElementById('formTitle').value.trim();
  if (!title){ toast('Dê um título à ficha.', true); return; }
  const validQuestions = formQuestionsDraft.filter(q => q.label && q.label.trim());
  if (!validQuestions.length){ toast('Adicione pelo menos uma pergunta.', true); return; }

  const data = {
    title,
    description: document.getElementById('formDescription').value.trim(),
    questions: validQuestions,
    updatedAt: serverTimestamp()
  };
  if (editId){
    await updateDoc(doc(db, 'tenants', tenantId, 'forms', editId), data);
  } else {
    data.createdAt = serverTimestamp();
    await addDoc(collection(db, 'tenants', tenantId, 'forms'), data);
  }
  toast('Ficha guardada.');
  renderView('forms');
};

window.deleteForm = async function(id){
  if (!confirm('Remover esta ficha? O link deixa de funcionar.')) return;
  await deleteDoc(doc(db, 'tenants', tenantId, 'forms', id));
  renderView('forms');
};

// ── Associar resposta pendente a um paciente ────────────────────────────
window.openAttachResponse = async function(responseId){
  const snap = await getDoc(doc(db, 'public_form_responses', responseId));
  if (!snap.exists()){ toast('Resposta não encontrada.', true); return; }
  const r = snap.data();

  const patientsSnap = await getDocs(collection(db, 'tenants', tenantId, 'patients'));
  let opts = '<option value="">Criar novo paciente com este nome...</option>';
  let matchedName = '';
  patientsSnap.forEach(d => {
    const isMatch = r.patientId && d.id === r.patientId;
    if (isMatch) matchedName = d.data().fullName;
    opts += `<option value="${d.id}" ${isMatch ? 'selected' : ''}>${escapeHtml(d.data().fullName)}</option>`;
  });

  let answersHtml = (r.answers || []).map(a => `
    <div class="appt-item"><strong>${escapeHtml(a.label)}</strong><div class="muted">${escapeHtml(String(a.value))}</div></div>
  `).join('');

  document.getElementById('attachContainer').innerHTML = `
    <div class="card">
      <h2>Associar resposta — ${escapeHtml(r.respondentName||'Sem nome')}</h2>
      ${matchedName ? `<p class="muted">Este link já identifica <strong>${escapeHtml(matchedName)}</strong> — confirme e associe.</p>` : ''}
      <div style="max-height:240px;overflow:auto;margin-bottom:10px;">${answersHtml}</div>
      <label>Associar ao paciente</label>
      <select id="attachPatientSelect">${opts}</select>
      <button class="primary" onclick="confirmAttach('${responseId}')">Confirmar</button>
    </div>`;
  window.__pendingResponseData = r;
};

window.confirmAttach = async function(responseId){
  const r = window.__pendingResponseData;
  let patientId = document.getElementById('attachPatientSelect').value;

  if (!patientId){
    const newPatientRef = await addDoc(collection(db, 'tenants', tenantId, 'patients'), {
      fullName: r.respondentName || 'Paciente sem nome',
      phone: r.respondentPhone || '',
      email: r.respondentEmail || '',
      clinicalNotes: '',
      consentGivenAt: serverTimestamp(),
      consentVersion: 'form-v1',
      createdBy: currentUser.uid
    });
    patientId = newPatientRef.id;
  }

  await addDoc(collection(db, 'tenants', tenantId, 'patients', patientId, 'formResponses'), {
    formId: r.formId,
    formTitle: r.formTitle,
    answers: r.answers,
    submittedAt: r.submittedAt || serverTimestamp()
  });

  await updateDoc(doc(db, 'public_form_responses', responseId), { status: 'processed' });
  await logAudit('form_response_attached', patientId);

  toast('Resposta associada ao paciente.');
  renderView('forms');
};

window.startGuidedConsultation = async function(patientId, patientName){
  const snap = await getDocs(collection(db, 'tenants', tenantId, 'protocols'));
  let opts = '<option value="">Selecionar protocolo...</option>';
  const protocols = {};
  snap.forEach(d => { protocols[d.id] = d.data(); opts += `<option value="${d.id}">${escapeHtml(d.data().name)}</option>`; });

  if (snap.empty){
    toast('Crie um protocolo primeiro, em "Protocolos".', true);
    return;
  }

  document.getElementById('patientFormContainer').innerHTML = `
    <div class="card">
      <h2>Consulta guiada — ${escapeHtml(patientName)}</h2>
      <label>Protocolo</label>
      <select id="guidedProtocolSelect" onchange="renderGuidedPoints('${patientId}', '${escapeHtml(patientName)}')">${opts}</select>
      <div id="guidedPointsArea"></div>
    </div>`;
  window.__guidedProtocols = protocols;
};

window.renderGuidedPoints = function(patientId, patientName){
  const protoId = document.getElementById('guidedProtocolSelect').value;
  const area = document.getElementById('guidedPointsArea');
  if (!protoId){ area.innerHTML=''; return; }
  const proto = window.__guidedProtocols[protoId];
  window.__currentGuidedProtoId = protoId;
  window.__currentGuidedProtoName = proto.name;

  area.innerHTML = proto.points.map((pt, idx) => `
    <div class="card" style="margin:8px 0;">
      <label style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="ptCheck${idx}" style="width:auto;margin:0;">
        <strong>${escapeHtml(pt.name)}</strong>
      </label>
      <label style="margin-top:6px;">Nota desta sessão (opcional)</label>
      <textarea id="ptNote${idx}" rows="2" placeholder="Observações específicas desta consulta..."></textarea>
    </div>
  `).join('') + `<button class="primary" onclick="generateReport('${patientId}', '${escapeHtml(patientName)}')">Gerar relatório</button>`;
};

window.generateReport = async function(patientId, patientName){
  const protoId = window.__currentGuidedProtoId;
  const proto = window.__guidedProtocols[protoId];
  const detectedPoints = [];

  proto.points.forEach((pt, idx) => {
    const checked = document.getElementById(`ptCheck${idx}`)?.checked;
    if (checked){
      const note = document.getElementById(`ptNote${idx}`)?.value.trim() || '';
      detectedPoints.push({ name: pt.name, knowledgeText: pt.knowledgeText, note });
    }
  });

  if (!detectedPoints.length){
    toast('Marque pelo menos um ponto para gerar o relatório.', true);
    return;
  }

  // Montagem do relatório: texto legível, ponto a ponto, sem IA — usa
  // exatamente a fonte de conhecimento que o subscritor definiu.
  let reportText = `Relatório de Consulta — ${proto.name}\n`;
  reportText += `Paciente: ${patientName}\n`;
  reportText += `Data: ${new Date().toLocaleDateString('pt-PT')}\n\n`;
  detectedPoints.forEach(p => {
    reportText += `• ${p.name}\n${p.knowledgeText}\n`;
    if (p.note) reportText += `Nota da sessão: ${p.note}\n`;
    reportText += `\n`;
  });

  await addDoc(collection(db, 'tenants', tenantId, 'patients', patientId, 'reports'), {
    protocolId: protoId,
    protocolName: proto.name,
    points: detectedPoints,
    reportText,
    generatedAt: serverTimestamp(),
    generatedBy: currentUser.uid
  });
  await logAudit('report_generated', patientId);

  document.getElementById('patientFormContainer').innerHTML = `
    <div class="card">
      <h2>Relatório gerado</h2>
      <textarea rows="14" readonly>${escapeHtml(reportText)}</textarea>
      <div class="row" style="margin-top:8px;">
        <button class="ghost" onclick="downloadReportFile('${escapeHtml(proto.name)}', document.querySelector('#patientFormContainer textarea').value)">⬇️ Descarregar ficheiro</button>
      </div>
      <p class="muted" style="margin-top:8px;">Guardado na ficha do paciente. Copie o texto ou descarregue o ficheiro para enviar por email/WhatsApp.</p>
    </div>`;
  toast('Relatório gerado e guardado.');
};

// ── Descarregar relatório/prescrição como ficheiro de texto ────────────
// Funciona 100% no browser, sem servidor — o subscritor pode depois
// guardar esse ficheiro onde quiser (telemóvel, Drive, pen, etc.).
window.downloadReportFile = function(title, content){
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${title.replace(/[^a-z0-9]+/gi,'_')}_${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

// ── PERFIL DA CLÍNICA/PROFISSIONAL (identidade, contacto, equipa) ──────
// Tudo aqui alimenta a futura página pública (Fase B) — logótipo, cores,
// sobre, contactos, redes sociais e a equipa que trabalha na conta.
async function renderProfile(main){
  const p = currentTenantDoc?.profile || {};
  const b = currentTenantDoc?.branding || {};
  const social = p.social || {};

  const teamSnap = await getDocs(collection(db, 'tenants', tenantId, 'teamMembers'));
  let teamHtml = '';
  teamSnap.forEach(d=>{
    const m = d.data();
    teamHtml += `<div class="appt-item row">
      <div><strong>${escapeHtml(m.name)}</strong><div class="muted">${escapeHtml(m.role||'')}</div></div>
      <button class="danger" onclick="deleteTeamMember('${d.id}')">Remover</button>
    </div>`;
  });
  if (!teamHtml) teamHtml = '<p class="muted">Ainda sem membros de equipa.</p>';

  main.innerHTML = `
    <h2>Perfil do negócio</h2>
    <div class="card">
      <label>Nome do negócio</label>
      <input id="pfBusinessName" value="${escapeHtml(currentTenantDoc?.businessName||'')}">
      <label>Frase de apresentação (tagline curta)</label>
      <input id="pfTagline" value="${escapeHtml(p.tagline||'')}" placeholder="ex: Cuidado que transforma">
      <label>Sobre / apresentação</label>
      <textarea id="pfAbout" rows="4">${escapeHtml(p.about||'')}</textarea>
      <label>URL do logótipo</label>
      <input id="pfLogoUrl" value="${escapeHtml(b.logoUrl||'')}" placeholder="https://...">
      <p class="muted">Sem armazenamento próprio de imagens nesta versão — use um serviço como postimages.org e cole o link direto da imagem aqui.</p>
      <label>Cor principal</label>
      <input id="pfColor" type="color" value="${b.primaryColor||'#2f6f5e'}">
    </div>

    <div class="card">
      <h2>Contactos</h2>
      <label>Telefone</label><input id="pfPhone" value="${escapeHtml(p.phone||'')}">
      <label>Email</label><input id="pfEmail" value="${escapeHtml(p.email||'')}">
      <label>Morada (se atender presencialmente)</label><input id="pfAddress" value="${escapeHtml(p.address||'')}">
    </div>

    <div class="card">
      <h2>Redes sociais</h2>
      <label>Facebook</label><input id="pfFacebook" value="${escapeHtml(social.facebook||'')}" placeholder="https://facebook.com/...">
      <label>Instagram</label><input id="pfInstagram" value="${escapeHtml(social.instagram||'')}" placeholder="https://instagram.com/...">
      <label>WhatsApp</label><input id="pfWhatsapp" value="${escapeHtml(social.whatsapp||'')}" placeholder="https://wa.me/351...">
      <label>Website</label><input id="pfWebsite" value="${escapeHtml(social.website||'')}" placeholder="https://...">
      <button class="primary" onclick="saveProfile()">Guardar perfil</button>
    </div>

    <div class="card">
      <h2>Equipa</h2>
      <p class="muted" style="margin-bottom:10px;">Membros mostrados publicamente (não são contas de login — para isso use "Convidar colaborador" nas Configurações).</p>
      ${teamHtml}
      <div style="margin-top:12px;">
        <label>Nome</label><input id="tmName">
        <label>Função/especialidade</label><input id="tmRole" placeholder="ex: Fisioterapeuta, Nutricionista">
        <label>URL da foto (opcional)</label><input id="tmPhotoUrl">
        <label>Breve bio</label><textarea id="tmBio" rows="2"></textarea>
        <button class="primary" onclick="addTeamMember()">Adicionar à equipa</button>
      </div>
    </div>
  `;
}

window.saveProfile = async function(){
  await updateDoc(doc(db, 'tenants', tenantId), {
    businessName: document.getElementById('pfBusinessName').value.trim(),
    'branding.logoUrl': document.getElementById('pfLogoUrl').value.trim(),
    'branding.primaryColor': document.getElementById('pfColor').value,
    profile: {
      tagline: document.getElementById('pfTagline').value.trim(),
      about: document.getElementById('pfAbout').value.trim(),
      phone: document.getElementById('pfPhone').value.trim(),
      email: document.getElementById('pfEmail').value.trim(),
      address: document.getElementById('pfAddress').value.trim(),
      social: {
        facebook: document.getElementById('pfFacebook').value.trim(),
        instagram: document.getElementById('pfInstagram').value.trim(),
        whatsapp: document.getElementById('pfWhatsapp').value.trim(),
        website: document.getElementById('pfWebsite').value.trim()
      }
    }
  });
  const snap = await getDoc(doc(db, 'tenants', tenantId));
  currentTenantDoc = snap.data();
  applyBranding();
  toast('Perfil guardado.');
};

window.addTeamMember = async function(){
  const name = document.getElementById('tmName').value.trim();
  if (!name){ toast('Nome é obrigatório.', true); return; }
  await addDoc(collection(db, 'tenants', tenantId, 'teamMembers'), {
    name,
    role: document.getElementById('tmRole').value.trim(),
    photoUrl: document.getElementById('tmPhotoUrl').value.trim(),
    bio: document.getElementById('tmBio').value.trim(),
    createdAt: serverTimestamp()
  });
  toast('Membro adicionado.');
  renderView('profile');
};

window.deleteTeamMember = async function(id){
  if (!confirm('Remover este membro da equipa?')) return;
  await deleteDoc(doc(db, 'tenants', tenantId, 'teamMembers', id));
  renderView('profile');
};

// ── FORMAÇÕES / EVENTOS (com inscrição) ─────────────────────────────────
async function renderTrainings(main){
  const snap = await getDocs(collection(db, 'tenants', tenantId, 'trainings'));
  let rows = '';
  for (const d of snap.docs){
    const t = d.data();
    const signupsSnap = await getDocs(query(
      collection(db, 'public_training_signups'),
      where('trainingId', '==', d.id), where('status', '==', 'confirmed')
    ));
    const link = `${window.location.origin}${window.location.pathname.replace('saudecare-core.html','saudecare-formacao-publica.html')}?t=${currentTenantDoc.slug}&tr=${d.id}`;
    rows += `<div class="appt-item">
      <div class="row">
        <div><strong>${escapeHtml(t.title)}</strong>
          <div class="muted">${escapeHtml(t.date||'')} · ${signupsSnap.size}/${t.capacity||'∞'} inscritos</div>
        </div>
        <button class="danger" onclick="deleteTraining('${d.id}')">Remover</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <input readonly value="${link}" style="font-size:11px;margin:0;">
        <button class="ghost" onclick="navigator.clipboard.writeText('${link}').then(()=>toast('Link copiado.'))">Copiar</button>
      </div>
    </div>`;
  }
  if (!rows) rows = '<p class="muted">Ainda sem formações/eventos criados.</p>';

  main.innerHTML = `
    <div class="row"><h2>Formações / Eventos</h2></div>
    <div class="card">${rows}</div>
    <div class="card">
      <h2>Nova formação/evento</h2>
      <label>Título</label><input id="trTitle">
      <label>Descrição</label><textarea id="trDescription" rows="3"></textarea>
      <label>Data (texto livre, ex: "14 Set, 18h")</label><input id="trDate">
      <label>Preço (€, deixe 0 se gratuito)</label><input id="trPrice" type="number" step="0.01" value="0">
      <label>Capacidade (vagas, deixe vazio se ilimitado)</label><input id="trCapacity" type="number">
      <button class="primary" onclick="saveTraining()">Criar</button>
    </div>
  `;
}

window.saveTraining = async function(){
  const title = document.getElementById('trTitle').value.trim();
  if (!title){ toast('Dê um título à formação.', true); return; }
  await addDoc(collection(db, 'tenants', tenantId, 'trainings'), {
    title,
    description: document.getElementById('trDescription').value.trim(),
    date: document.getElementById('trDate').value.trim(),
    price: parseFloat(document.getElementById('trPrice').value || '0'),
    capacity: document.getElementById('trCapacity').value ? parseInt(document.getElementById('trCapacity').value, 10) : null,
    createdAt: serverTimestamp()
  });
  toast('Formação criada.');
  renderView('trainings');
};

window.deleteTraining = async function(id){
  if (!confirm('Remover esta formação? O link de inscrição deixa de funcionar.')) return;
  await deleteDoc(doc(db, 'tenants', tenantId, 'trainings', id));
  renderView('trainings');
};

// ── CONFIGURAÇÕES ────────────────────────────────────────────────────
function renderSettings(main){
  main.innerHTML = `
    <h2>Configurações da conta</h2>
    <div class="card">
      <p class="muted">Plano atual: <strong>${escapeHtml(currentTenantDoc?.plan||'—')}</strong></p>
      <p class="muted">Estado: <strong>${escapeHtml(currentTenantDoc?.status||'—')}</strong></p>
      <p class="muted" style="margin-top:10px;">Para alterar nome, logótipo, cores, contactos e equipa, use a aba <strong>Perfil</strong>.</p>
    </div>`;
}
