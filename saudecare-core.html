<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" id="dynamicManifest" href="manifest.json">
<link rel="apple-touch-icon" id="appleTouchIcon" href="">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SaúdeCare">
<title>SaúdeCare</title>
<style>
  :root{
    --primary:#2f6f5e; --primary-dark:#1f4d40; --bg:#f6f8f7; --card:#ffffff;
    --text:#1a2b26; --muted:#6b7d76; --danger:#b3413a; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;}
  nav{width:220px;background:var(--primary-dark);color:#fff;padding:20px 12px;flex-shrink:0;}
  nav h1{font-size:20px;margin-bottom:24px;padding:0 8px;}
  nav button{display:block;width:100%;text-align:left;background:none;border:none;color:#e4ede9;
    padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:4px;}
  nav button.active,nav button:hover{background:var(--primary);color:#fff;}
  main{flex:1;padding:24px;max-width:900px;}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);}
  h2{margin-bottom:14px;font-size:20px;}
  input,select,textarea{width:100%;padding:10px;border:1px solid #d8e0dc;border-radius:8px;font-size:16px;
    margin-bottom:10px;font-size:14px;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  button.primary{background:var(--primary);color:#fff;border:none;padding:10px 18px;
    border-radius:8px;cursor:pointer;font-size:14px;}
  button.danger{background:var(--danger);color:#fff;border:none;padding:8px 14px;
    border-radius:8px;cursor:pointer;font-size:13px;}
  button.ghost{background:none;border:1px solid #d8e0dc;padding:8px 14px;border-radius:8px;cursor:pointer;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .appt-item,.patient-item{border-bottom:1px solid #eef2f0;padding:10px 0;}
  .appt-item:last-child,.patient-item:last-child{border-bottom:none;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#e4ede9;color:var(--primary-dark);}
  .badge.cancelled{background:#f6e2e0;color:var(--danger);}
  .muted{color:var(--muted);font-size:13px;}
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;padding:20px;}
  .authTabs{display:flex;border-bottom:1px solid #eef2f0;margin-bottom:18px;}
  .authTabs button{flex:1;background:none;border:none;padding:12px 8px;font-size:14px;cursor:pointer;
    color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;}
  .authTabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;}
  .authBrand{text-align:center;margin-bottom:20px;}
  .authBrand .authLogo{width:52px;height:52px;border-radius:14px;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;margin:0 auto 10px;}
  .authBrand h2{margin-bottom:4px;}
  .trialNote{background:#eef6f2;border:1px solid #d7ebe2;border-radius:10px;padding:10px 12px;
    font-size:12.5px;color:var(--primary-dark);margin-bottom:14px;}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2b26;
    color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:999;}
  .hidden{display:none !important;}
  @media(max-width:640px){
    #app{flex-direction:column;}
    nav{width:100%;display:flex;overflow-x:auto;padding:8px;gap:4px;}
    nav h1{display:none;}
    nav button{flex-shrink:0;width:auto;margin-right:0;margin-bottom:0;padding:8px 10px;font-size:12.5px;white-space:nowrap;}
    main{padding:14px;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="card" style="max-width:380px;width:100%;">
    <div class="authBrand">
      <div class="authLogo">SC</div>
      <h2>SaúdeCare</h2>
      <p class="muted">Gestão de consultas, pacientes e protocolos para profissionais de saúde e terapeutas em Portugal</p>
    </div>

    <div class="authTabs">
      <button id="authTabLoginBtn" class="active" onclick="switchAuthTab('login')">Entrar</button>
      <button id="authTabRegisterBtn" onclick="switchAuthTab('register')">Criar conta</button>
    </div>

    <div id="authPanelLogin">
      <label>Email</label>
      <input id="loginEmail" type="email" autocomplete="username">
      <label>Palavra-passe</label>
      <input id="loginPass" type="password" autocomplete="current-password">
      <button class="primary" style="width:100%" onclick="doLogin()">Entrar</button>
      <p id="loginError" class="muted" style="color:var(--danger);margin-top:8px;"></p>
      <p class="muted" style="margin-top:10px;text-align:center;">
        <a href="#" onclick="doPasswordReset();return false;" style="color:var(--primary);">Esqueci-me da password</a>
      </p>
    </div>

    <div id="authPanelRegister" class="hidden">
      <div class="trialNote">✨ 14 dias grátis, sem cartão de crédito. Sem compromisso.</div>
      <label>Nome do consultório / prática</label>
      <input id="regBusinessName" placeholder="ex: Clínica Bem-Estar">
      <label>O seu email</label>
      <input id="regEmail" type="email" autocomplete="username">
      <label>Palavra-passe</label>
      <input id="regPass" type="password" autocomplete="new-password" placeholder="mínimo 6 caracteres">
      <button class="primary" style="width:100%" onclick="doRegister()">Criar conta e começar período de teste</button>
      <p id="registerError" class="muted" style="color:var(--danger);margin-top:8px;"></p>
    </div>
  </div>
</div>

<div id="app" class="hidden">
  <nav>
    <h1>SaúdeCare</h1>
    <button data-view="agenda" class="active">📅 Agenda</button>
    <button data-view="patients">🗂️ Pacientes</button>
    <button data-view="services">🩺 Serviços</button>
    <button data-view="protocols">📋 Protocolos</button>
    <button data-view="forms">📝 Fichas</button>
    <button data-view="trainings">🎓 Formações</button>
    <button data-view="profile">🏥 Perfil</button>
    <button data-view="settings">⚙️ Configurações</button>
    <button data-view="logout" style="margin-top:20px;color:#f2b8b8;">Sair</button>
  </nav>
  <main id="mainView"></main>
</div>

<div id="toast"></div>

<!-- Firebase (SDK modular v9, via CDN) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, addDoc, updateDoc,
  deleteDoc, setDoc, query, where, orderBy, serverTimestamp, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ── CONFIGURAÇÃO — substituir pelos valores reais do projeto Firebase ──
const firebaseConfig = {
  apiKey: "AIzaSyDKWdXYEG6PO9KEMQMklyPGngtXuZlP7Cg",
  authDomain: "saudecare-app.firebaseapp.com",
  projectId: "saudecare-app",
  storageBucket: "saudecare-app.firebasestorage.app",
  messagingSenderId: "455466438728",
  appId: "1:455466438728:web:61cfbf9fac85d59e18c87d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let tenantId = null;
let tenantRole = null;
let currentTenantDoc = null;

// ── Helpers de UI ────────────────────────────────────────────────────
function toast(msg, isError=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#b3413a' : '#1a2b26';
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 3200);
}

function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

// ── Auth ─────────────────────────────────────────────────────────────
window.doLogin = async function(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    errEl.textContent = 'Credenciais inválidas ou conta inexistente.';
    console.error(e);
  }
};

window.switchAuthTab = function(tab){
  const isLogin = tab === 'login';
  document.getElementById('authTabLoginBtn').classList.toggle('active', isLogin);
  document.getElementById('authTabRegisterBtn').classList.toggle('active', !isLogin);
  document.getElementById('authPanelLogin').classList.toggle('hidden', !isLogin);
  document.getElementById('authPanelRegister').classList.toggle('hidden', isLogin);
};

// Regista um novo subscritor com período de teste de 14 dias.
// NOTA: cria a conta e o documento do tenant com status "pending_activation".
// Enquanto as Cloud Functions não estiverem ativas (Blaze pendente — ver
// documento de continuidade), a atribuição do custom claim (tenantId, role)
// que dá acesso real à app continua a ser feita manualmente via Cloud Shell
// (setclaim.js). Este fluxo deixa a conta pronta para essa ativação.
window.doRegister = async function(){
  const businessName = document.getElementById('regBusinessName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass = document.getElementById('regPass').value;
  const errEl = document.getElementById('registerError');
  errEl.style.color = 'var(--danger)';
  errEl.textContent = '';

  if (!businessName){ errEl.textContent = 'Indique o nome do consultório/prática.'; return; }
  if (!email){ errEl.textContent = 'Indique o seu email.'; return; }
  if (pass.length < 6){ errEl.textContent = 'A palavra-passe precisa de ter pelo menos 6 caracteres.'; return; }

  window.__justRegistered = true;
  try{
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    const slug = businessName.toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/(^-+|-+$)/g, '') || 'novo-subscritor';

    await setDoc(doc(db, 'tenants', cred.user.uid), {
      businessName, slug,
      status: 'pending_activation',
      plan: 'start',
      ownerUid: cred.user.uid,
      ownerEmail: email,
      trialDays: 14,
      profile: { email },
      createdAt: serverTimestamp()
    });

    errEl.style.color = 'var(--primary)';
    errEl.textContent = 'Conta criada com sucesso! Estamos a preparar o seu acesso — vai poder entrar em breve.';
  }catch(e){
    window.__justRegistered = false;
    errEl.style.color = 'var(--danger)';
    if (e.code === 'auth/email-already-in-use') errEl.textContent = 'Já existe uma conta com este email.';
    else if (e.code === 'auth/invalid-email') errEl.textContent = 'Email inválido.';
    else errEl.textContent = 'Não foi possível criar a conta. Tente novamente.';
    console.error(e);
  }
};

window.doPasswordReset = async function(){
  const email = document.getElementById('loginEmail').value.trim();
  const errEl = document.getElementById('loginError');
  if (!email){
    errEl.textContent = 'Escreva o seu email na caixa acima primeiro, depois toque em "Esqueci-me da password".';
    return;
  }
  try{
    await sendPasswordResetEmail(auth, email);
    errEl.style.color = 'var(--primary)';
    errEl.textContent = 'Email de recuperação enviado — verifique a caixa de entrada (e spam).';
  }catch(e){
    errEl.style.color = 'var(--danger)';
    errEl.textContent = 'Não foi possível enviar. Confirme que o email está correto.';
    console.error(e);
  }
};

onAuthStateChanged(auth, async (user) => {
  if (!user){
    currentUser = null; tenantId = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    return;
  }
  currentUser = user;

  // Força refresh do token para garantir que os custom claims (tenantId,
  // role) mais recentes estão disponíveis — essencial logo após onboarding.
  const tokenResult = await user.getIdTokenResult(true);
  tenantId = tokenResult.claims.tenantId || null;
  tenantRole = tokenResult.claims.role || null;

  if (!tenantId){
    if (window.__justRegistered){
      window.__justRegistered = false;
      await signOut(auth);
      switchAuthTab('login');
      const errEl = document.getElementById('loginError');
      errEl.style.color = 'var(--primary)';
      errEl.textContent = 'Conta criada! Assim que o acesso for ativado, poderá entrar aqui com o mesmo email e password.';
      return;
    }
    toast('Esta conta ainda não está associada a nenhum subscritor.', true);
    await signOut(auth);
    return;
  }

  const tSnap = await getDoc(doc(db, 'tenants', tenantId));
  if (!tSnap.exists()){
    toast('Subscritor não encontrado.', true);
    await signOut(auth);
    return;
  }
  currentTenantDoc = tSnap.data();

  if (currentTenantDoc.status === 'suspended' || currentTenantDoc.status === 'cancelled'){
    toast('Esta conta está suspensa. Contacte o suporte.', true);
    await signOut(auth);
    return;
  }

  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  applyBranding();
  applyDynamicManifestAdmin();
  renderView('agenda');
});

document.querySelectorAll('nav button[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if (btn.dataset.view === 'logout'){ signOut(auth); return; }
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView(btn.dataset.view);
  });
});

function applyBranding(){
  if (currentTenantDoc?.branding?.primaryColor){
    document.documentElement.style.setProperty('--primary', currentTenantDoc.branding.primaryColor);
  }
}

// ── "Adicionar ao ecrã principal" com identidade do subscritor ─────────
// Mesmo mecanismo da página pública — gera um manifest à medida no
// browser, para o subscritor poder instalar o SEU painel com o nome e
// logótipo do seu próprio negócio, não com o nome genérico "SaúdeCare".
function applyDynamicManifestAdmin(){
  const businessName = currentTenantDoc?.businessName || 'SaúdeCare';
  const logoUrl = currentTenantDoc?.branding?.logoUrl || '';
  document.title = businessName;

  if (logoUrl){
    const appleIcon = document.getElementById('appleTouchIcon');
    if (appleIcon) appleIcon.href = logoUrl;
  }

  const manifestObj = {
    name: businessName + ' — Painel',
    short_name: businessName.slice(0, 12),
    start_url: window.location.href,
    display: 'standalone',
    background_color: '#f6f8f7',
    theme_color: currentTenantDoc?.branding?.primaryColor || '#2f6f5e',
    icons: logoUrl ? [
      { src: logoUrl, sizes: '192x192', type: 'image/png' },
      { src: logoUrl, sizes: '512x512', type: 'image/png' }
    ] : []
  };
  const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
  const manifestLink = document.getElementById('dynamicManifest');
  if (manifestLink) manifestLink.href = URL.createObjectURL(blob);
}

// ── Audit log — escrito antes de qualquer operação sensível em pacientes ──
async function logAudit(action, targetPatientId){
  try{
    await addDoc(collection(db, 'tenants', tenantId, 'auditLog'), {
      action, targetPatientId: targetPatientId || null,
      performedBy: currentUser.uid, timestamp: serverTimestamp()
    });
  }catch(e){
    // Falha a registar auditoria não deve travar a operação principal,
    // mas é sinalizada em consola para diagnóstico.
    console.error('Falha ao gravar auditLog', e);
  }
}

// ── Router simples ──────────────────────────────────────────────────
function renderView(view){
  const main = document.getElementById('mainView');
  main.innerHTML = '<p class="muted">A carregar…</p>';
  if (view === 'agenda') renderAgenda(main);
  else if (view === 'patients') renderPatients(main);
  else if (view === 'services') renderServices(main);
  else if (view === 'protocols') renderProtocols(main);
  else if (view === 'forms') renderForms(main);
  else if (view === 'trainings') renderTrainings(main);
  else if (view === 'profile') renderProfile(main);
  else if (view === 'settings') renderSettings(main);
}

// ── AGENDA ───────────────────────────────────────────────────────────
async function renderAgenda(main){
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todayEnd = new Date(); todayEnd.setHours(23,59,59,999);

  const q = query(
    collection(db, 'tenants', tenantId, 'appointments'),
    where('startsAt', '>=', Timestamp.fromDate(todayStart)),
    where('startsAt', '<=', Timestamp.fromDate(todayEnd)),
    orderBy('startsAt')
  );
  const snap = await getDocs(q);

  let itemsHtml = '';
  snap.forEach(d=>{
    const a = d.data();
    const time = a.startsAt.toDate().toLocaleTimeString('pt-PT',{hour:'2-digit',minute:'2-digit'});
    const statusClass = a.status === 'cancelled' ? 'cancelled' : '';
    itemsHtml += `<div class="appt-item">
      <div class="row">
        <div><strong>${time}</strong> — ${escapeHtml(a.patientName||'Paciente')}
          <div class="muted">${escapeHtml(a.serviceName||'')}</div>
        </div>
        <span class="badge ${statusClass}">${escapeHtml(a.status)}</span>
      </div>
      <div class="row" style="margin-top:6px;">
        <button class="ghost" onclick="editAppointment('${d.id}')">Editar</button>
        ${a.status !== 'cancelled' ? `<button class="ghost" onclick="cancelAppointment('${d.id}')">Cancelar</button>` : ''}
        <button class="danger" onclick="deleteAppointment('${d.id}')">Apagar</button>
      </div>
    </div>`;
  });
  if (!itemsHtml) itemsHtml = '<p class="muted">Sem marcações para hoje.</p>';

  main.innerHTML = `
    <div class="row"><h2>Agenda — Hoje</h2>
      <button class="primary" onclick="openNewAppointment()">+ Nova marcação</button>
    </div>
    <div class="card">${itemsHtml}</div>
    <div id="apptFormContainer"></div>
  `;
}

window.openNewAppointment = async function(){
  const patientsSnap = await getDocs(collection(db, 'tenants', tenantId, 'patients'));
  const servicesSnap = await getDocs(query(collection(db, 'tenants', tenantId, 'services'), where('active','==', true)));

  let patientOpts = '<option value="">Selecionar paciente…</option>';
  patientsSnap.forEach(d => patientOpts += `<option value="${d.id}" data-name="${escapeHtml(d.data().fullName)}">${escapeHtml(d.data().fullName)}</option>`);

  let serviceOpts = '<option value="">Selecionar serviço…</option>';
  servicesSnap.forEach(d => serviceOpts += `<option value="${d.id}" data-name="${escapeHtml(d.data().name)}" data-duration="${d.data().durationMinutes}">${escapeHtml(d.data().name)}</option>`);

  document.getElementById('apptFormContainer').innerHTML = `
    <div class="card">
      <h2>Nova marcação</h2>
      <label>Paciente</label><select id="apptPatient">${patientOpts}</select>
      <label>Serviço</label><select id="apptService">${serviceOpts}</select>
      <label>Data e hora</label><input id="apptStart" type="datetime-local">
      <button class="primary" onclick="saveAppointment()">Guardar</button>
    </div>`;
};

window.saveAppointment = async function(){
  const patientSel = document.getElementById('apptPatient');
  const serviceSel = document.getElementById('apptService');
  const startInput = document.getElementById('apptStart').value;
  if (!patientSel.value || !serviceSel.value || !startInput){
    toast('Preencha todos os campos.', true); return;
  }
  const duration = parseInt(serviceSel.selectedOptions[0].dataset.duration || '50', 10);
  const start = new Date(startInput);
  const end = new Date(start.getTime() + duration*60000);

  await addDoc(collection(db, 'tenants', tenantId, 'appointments'), {
    patientId: patientSel.value,
    patientName: patientSel.selectedOptions[0].dataset.name,
    serviceId: serviceSel.value,
    serviceName: serviceSel.selectedOptions[0].dataset.name,
    staffUid: currentUser.uid,
    startsAt: Timestamp.fromDate(start),
    endsAt: Timestamp.fromDate(end),
    status: 'confirmed',
    createdAt: serverTimestamp()
  });
  toast('Marcação criada.');
  renderView('agenda');
};

window.editAppointment = async function(appointmentId){
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'appointments', appointmentId));
  if (!snap.exists()){ toast('Marcação não encontrada.', true); return; }
  const a = snap.data();

  const patientsSnap = await getDocs(collection(db, 'tenants', tenantId, 'patients'));
  const servicesSnap = await getDocs(collection(db, 'tenants', tenantId, 'services'));

  let patientOpts = '';
  patientsSnap.forEach(d => patientOpts += `<option value="${d.id}" data-name="${escapeHtml(d.data().fullName)}" ${d.id===a.patientId?'selected':''}>${escapeHtml(d.data().fullName)}</option>`);
  let serviceOpts = '';
  servicesSnap.forEach(d => serviceOpts += `<option value="${d.id}" data-name="${escapeHtml(d.data().name)}" data-duration="${d.data().durationMinutes}" ${d.id===a.serviceId?'selected':''}>${escapeHtml(d.data().name)}</option>`);

  const startLocal = new Date(a.startsAt.toDate().getTime() - a.startsAt.toDate().getTimezoneOffset()*60000)
    .toISOString().slice(0,16);

  document.getElementById('apptFormContainer').innerHTML = `
    <div class="card">
      <h2>Editar marcação</h2>
      <label>Paciente</label><select id="apptPatient">${patientOpts}</select>
      <label>Serviço</label><select id="apptService">${serviceOpts}</select>
      <label>Data e hora</label><input id="apptStart" type="datetime-local" value="${startLocal}">
      <button class="primary" onclick="updateAppointment('${appointmentId}')">Guardar alterações</button>
    </div>`;
};

window.updateAppointment = async function(appointmentId){
  const patientSel = document.getElementById('apptPatient');
  const serviceSel = document.getElementById('apptService');
  const startInput = document.getElementById('apptStart').value;
  if (!patientSel.value || !serviceSel.value || !startInput){
    toast('Preencha todos os campos.', true); return;
  }
  const duration = parseInt(serviceSel.selectedOptions[0].dataset.duration || '50', 10);
  const start = new Date(startInput);
  const end = new Date(start.getTime() + duration*60000);

  await updateDoc(doc(db, 'tenants', tenantId, 'appointments', appointmentId), {
    patientId: patientSel.value,
    patientName: patientSel.selectedOptions[0].dataset.name,

async function renderPatients(main){

  snap.forEach(d=>{
    const p = d.data();

let patientCustomFieldsDraft = [];

function renderPatientCustomFieldsBuilder(){
  const rows = patientCustomFieldsDraft.map((f, idx) => `
    <div class="row" style="gap:8px;margin-bottom:8px;">
      <input value="${escapeHtml(f.label||'')}" onchange="updatePatientCustomField(${idx},'label',this.value)" placeholder="Nome do campo (ex: Profissão)" style="flex:1;margin-bottom:0;">
      <input value="${escapeHtml(f.value||'')}" onchange="updatePatientCustomField(${idx},'value',this.value)" placeholder="Valor" style="flex:1;margin-bottom:0;">
      <button class="danger" onclick="removePatientCustomField(${idx})" style="flex-shrink:0;">Remover</button>
    </div>
  `).join('');
  return `
    <h3 style="margin:14px 0 8px;">Campos personalizados (opcional)</h3>
    <div id="patientCustomFieldsList">${rows}</div>
    <button class="ghost" onclick="addPatientCustomField()">+ Adicionar campo</button>`;
}

window.addPatientCustomField = function(){
  patientCustomFieldsDraft.push({ label:'', value:'' });
  refreshPatientCustomFieldsList();
};

function refreshPatientCustomFieldsList(){
  const rows = patientCustomFieldsDraft.map((f, idx) => `
    <div class="row" style="gap:8px;margin-bottom:8px;">
      <input value="${escapeHtml(f.label||'')}" onchange="updatePatientCustomField(${idx},'label',this.value)" placeholder="Nome do campo (ex: Profissão)" style="flex:1;margin-bottom:0;">
      <input value="${escapeHtml(f.value||'')}" onchange="updatePatientCustomField(${idx},'value',this.value)" placeholder="Valor" style="flex:1;margin-bottom:0;">
      <button class="danger" onclick="removePatientCustomField(${idx})" style="flex-shrink:0;">Remover</button>
    </div>
  `).join('');
  const list = document.getElementById('patientCustomFieldsList');
  if (list) list.innerHTML = rows;
}

window.updatePatientCustomField = function(idx, field, value){
  patientCustomFieldsDraft[idx][field] = value;
};

window.removePatientCustomField = function(idx){
  patientCustomFieldsDraft.splice(idx, 1);
  refreshPatientCustomFieldsList();
};

window.updatePatient = async function(patientId){

  if (!fullName){ toast('Nome é obrigatório.', true); return; }

    fullName,
    phone: document.getElementById('pPhone').value.trim(),

    clinicalNotes: document.getElementById('pNotes').value.trim(),
    customFields: patientCustomFieldsDraft.filter(f => f.label && f.label.trim())

window.savePatient = async function(){
  const fullName = document.getElementById('pFullName').value.trim();
  const consent = document.getElementById('pConsent').checked;
  if (!fullName){ toast('Nome é obrigatório.', true); return; }
  if (!consent){ toast('Não é possível registar sem consentimento explícito.', true); return; }

  await addDoc(collection(db, 'tenants', tenantId, 'patients'), {
    fullName,
    phone: document.getElementById('pPhone').value.trim(),
    email: document.getElementById('pEmail').value.trim(),
    clinicalNotes: document.getElementById('pNotes').value.trim(),
    customFields: patientCustomFieldsDraft.filter(f => f.label && f.label.trim()),
    consentGivenAt: serverTimestamp(),
    consentVersion: currentTenantDoc?.legalTexts?.consentVersion || 'v1',
    createdBy: currentUser.uid
  });

  renderView('patients');
};

window.viewPatient = async function(patientId){
  await logAudit('patient_viewed', patientId);
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'patients', patientId));
  if (!snap.exists()){ toast('Paciente não encontrado.', true); return; }
  const p = snap.data();

  const reportsSnap = await getDocs(query(
    collection(db, 'tenants', tenantId, 'patients', patientId, 'reports'),
    orderBy('generatedAt', 'desc')
  ));
  let reportsHtml = '';
  reportsSnap.forEach(rd => {
    const r = rd.data();
    const date = r.generatedAt?.toDate ? r.generatedAt.toDate().toLocaleDateString('pt-PT') : '';
    reportsHtml += `<div class="appt-item row">
      <div><strong>${escapeHtml(r.protocolName)}</strong><div class="muted">${date}</div></div>
      <button class="ghost" onclick="viewSavedReport('${patientId}','${rd.id}')">Ver</button>
    </div>`;
  });
  if (!reportsHtml) reportsHtml = '<p class="muted">Ainda sem relatórios para este paciente.</p>';

  // Fichas/questionários já associados a este paciente (antes ficavam
  // guardados mas nunca eram mostrados aqui — corrigido).
  const formRespSnap = await getDocs(query(
    collection(db, 'tenants', tenantId, 'patients', patientId, 'formResponses'),
    orderBy('submittedAt', 'desc')
  ));
  let formRespHtml = '';
  formRespSnap.forEach(fd => {
    const f = fd.data();
    const date = f.submittedAt?.toDate ? f.submittedAt.toDate().toLocaleDateString('pt-PT') : '';
    formRespHtml += `<div class="appt-item row">
      <div><strong>${escapeHtml(f.formTitle)}</strong><div class="muted">${date}</div></div>
      <button class="ghost" onclick="viewSavedFormResponse('${patientId}','${fd.id}')">Ver respostas</button>
    </div>`;
  });
  if (!formRespHtml) formRespHtml = '<p class="muted">Ainda sem fichas respondidas para este paciente.</p>';

  const customFieldsHtml = (p.customFields||[]).length
    ? (p.customFields||[]).map(f => `<p class="muted"><strong>${escapeHtml(f.label)}:</strong> ${escapeHtml(f.value)}</p>`).join('')
    : '';

  document.getElementById('patientFormContainer').innerHTML = `
    <div class="card">
      <div class="row">
        <h2>${escapeHtml(p.fullName)}</h2>
        <button class="ghost" onclick="editPatient('${patientId}')">✏️ Editar</button>
      </div>
      <p class="muted">${escapeHtml(p.phone||'')} · ${escapeHtml(p.email||'')}</p>
      ${customFieldsHtml}
      <label style="margin-top:10px;">Notas clínicas</label>
      <textarea rows="5" readonly>${escapeHtml(p.clinicalNotes||'')}</textarea>
      <p class="muted">Consentimento: ${p.consentGivenAt ? 'registado' : 'em falta'}</p>
      <div class="row" style="margin-top:10px;">
        <button class="primary" onclick="startGuidedConsultation('${patientId}', '${escapeHtml(p.fullName)}')">🧭 Iniciar consulta guiada</button>
        <button class="ghost" onclick="openSendFormToPatient('${patientId}', '${escapeHtml(p.fullName)}')">📝 Enviar ficha a este paciente</button>
      </div>
    </div>
    <div id="sendFormContainer"></div>
    <div class="card">
      <h2>Relatórios anteriores</h2>
      ${reportsHtml}
    </div>
    <div class="card">
      <h2>Fichas respondidas</h2>
      ${formRespHtml}
    </div>`;
};

// ── Enviar ficha diretamente a um paciente já existente ─────────────────
// O link inclui o patientId — quando o paciente responde, a resposta já
// chega "etiquetada" e aparece pré-selecionada nas pendentes, reduzindo o
// risco de associar ao paciente errado. A associação continua a exigir um
// toque de confirmação (não é 100% automática) porque a resposta vem de
// alguém sem conta — sem essa confirmação humana, dados de saúde podiam
// entrar na ficha errada sem ninguém dar por isso.

    <div class="card">
      <h2>Enviar ficha a ${escapeHtml(patientName)}</h2>

      <select id="sendFormSelect" onchange="renderSendFormLink('${patientId}')">${opts}</select>

async function renderServices(main){
  const snap = await getDocs(collection(db, 'tenants', tenantId, 'services'));
  const services = [];
  snap.forEach(d => services.push({ id: d.id, ...d.data() }));

  // Agrupa por categoria — cada categoria mostra o ícone escolhido pelo
  // subscritor (ou um genérico se ainda não escolheu nenhum).
  const groups = {};
  services.forEach(s => {
    const cat = s.category || 'Sem categoria';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(s);
  });

  let rows = '';
  Object.keys(groups).sort().forEach(cat => {
    const icon = groups[cat][0]?.categoryIcon || '🩺';
    rows += `<h3 style="margin:14px 0 8px;">${icon} ${escapeHtml(cat)}</h3>`;
    groups[cat].forEach(s => {

    <div class="card">${rows}</div>
