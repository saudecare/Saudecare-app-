// ── FICHAS / QUESTIONÁRIOS (tipo Google Forms) ──────────────────────────
// O subscritor cria uma ficha com perguntas de vários tipos. Gera-se um
// link único que envia ao paciente (sem precisar de conta). As respostas
// entram numa fila de "pendentes" e o subscritor associa manualmente a
// um paciente — evita escrita direta e não autenticada nos dados internos.
let formQuestionsDraft = [];

async function renderForms(main){
  try{
  const snap = await getDocs(collection(db, 'tenants', tenantId, 'forms'));
  let rows = '';
  snap.forEach(d=>{
    const f = d.data();
    const link = `${window.location.origin}${window.location.pathname.replace('saudecare-core.html','saudecare-ficha-publica.html')}?t=${currentTenantDoc.slug}&f=${d.id}`;
    rows += `<div class="appt-item">
      <div class="row">
        <div><strong>${escapeHtml(f.title)}</strong><div class="muted">${(f.questions||[]).length} perguntas</div></div>
        <div>
          <button class="ghost" onclick="editForm('${d.id}')">Editar</button>
          <button class="danger" onclick="deleteForm('${d.id}')">Remover</button>
        </div>
      </div>
      <div class="row" style="margin-top:8px;">
        <input readonly value="${link}" style="font-size:11px;margin:0;" onclick="this.select()">
        <button class="ghost" onclick="navigator.clipboard.writeText('${link}');toast('Link copiado.')">Copiar</button>
      </div>
    </div>`;
  });
  if (!rows) rows = '<p class="muted">Ainda sem fichas. Crie a sua primeira ficha de avaliação.</p>';

  const pendingSnap = await getDocs(query(
    collection(db, 'public_form_responses'),
    where('tenantId', '==', tenantId), where('status', '==', 'pending_review')
  ));
  let pendingHtml = '';
  pendingSnap.forEach(d=>{
    const r = d.data();
    const linkedBadge = r.patientId ? '<span class="badge">paciente identificado</span>' : '';
    pendingHtml += `<div class="appt-item row">
      <div><strong>${escapeHtml(r.respondentName||'Sem nome')}</strong> ${linkedBadge}
        <div class="muted">${escapeHtml(r.formTitle||'')}</div></div>
      <button class="primary" onclick="openAttachResponse('${d.id}')">Associar a paciente</button>
    </div>`;
  });
  if (!pendingHtml) pendingHtml = '<p class="muted">Sem respostas pendentes.</p>';

  // Alerta visível no menu quando há respostas por associar.
  const pendingCountEl = document.querySelector('button[data-view="forms"]');
  if (pendingCountEl){
    pendingCountEl.innerHTML = pendingSnap.size > 0
      ? `📝 Fichas <span class="badge" style="background:#f6e2e0;color:var(--danger);margin-left:4px;">${pendingSnap.size}</span>`
      : `📝 Fichas`;
  }

  main.innerHTML = `
    <div class="row"><h2>Fichas / Questionários</h2>
      <button class="primary" onclick="openNewForm()">+ Nova ficha</button>
    </div>
    <div class="card">${rows}</div>
    <h2 style="margin:16px 0 10px;">Respostas pendentes de associar</h2>
    <div class="card">${pendingHtml}</div>
    <div id="formBuilderContainer"></div>
    <div id="attachContainer"></div>
  `;
  }catch(e){
    console.error('Erro ao carregar fichas:', e);
    main.innerHTML = `<p class="muted" style="color:var(--danger);">Não foi possível carregar as fichas. Erro: ${escapeHtml(e.message||'desconhecido')}</p>`;
  }
}

window.openNewForm = function(){
  formQuestionsDraft = [];
  renderFormBuilder(null, '', '', []);
};

window.editForm = async function(id){
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'forms', id));
  if (!snap.exists()){ toast('Ficha não encontrada.', true); return; }
  const f = snap.data();
  formQuestionsDraft = (f.questions || []).map(q => ({...q}));
  renderFormBuilder(id, f.title, f.description||'', formQuestionsDraft);
};

function renderFormBuilder(editId, title, description, questions){
  formQuestionsDraft = questions;
  const qTypeLabel = { text: 'Texto livre', multiple_choice: 'Escolha múltipla', scale: 'Escala (0-10)' };

  let qHtml = formQuestionsDraft.map((q, idx) => `
    <div class="card" style="margin-bottom:8px;">
      <label>Pergunta</label>
      <input value="${escapeHtml(q.label||'')}" onchange="updateFormQuestion(${idx},'label',this.value)">
      <label>Tipo de resposta</label>
      <select onchange="changeQuestionType(${idx}, this.value)">
        <option value="text" ${q.type==='text'?'selected':''}>Texto livre</option>
        <option value="multiple_choice" ${q.type==='multiple_choice'?'selected':''}>Escolha múltipla</option>
        <option value="scale" ${q.type==='scale'?'selected':''}>Escala (0-10)</option>
      </select>
      ${q.type==='multiple_choice' ? `
        <label>Opções (uma por linha)</label>
        <textarea rows="3" onchange="updateFormQuestion(${idx},'optionsRaw',this.value)">${escapeHtml((q.options||[]).join('\n'))}</textarea>
      ` : ''}
      <button class="danger" onclick="removeFormQuestion(${idx})">Remover pergunta</button>
    </div>
  `).join('');

  document.getElementById('formBuilderContainer').innerHTML = `
    <div class="card">
      <h2>${editId ? 'Editar ficha' : 'Nova ficha'}</h2>
      <label>Título da ficha</label>
      <input id="formTitle" value="${escapeHtml(title)}" placeholder="ex: Questionário Pré-Consulta">
      <label>Descrição (opcional, o paciente vê isto)</label>
      <textarea id="formDescription" rows="2">${escapeHtml(description)}</textarea>
      <div id="formQuestionsList">${qHtml || '<p class="muted">Ainda sem perguntas.</p>'}</div>
      <button class="ghost" onclick="addFormQuestion()">+ Adicionar pergunta</button>
      <div style="margin-top:14px;">
        <button class="primary" onclick="saveForm('${editId||''}')">Guardar ficha</button>
      </div>
    </div>`;
}

window.updateFormQuestion = function(idx, field, value){
  if (field === 'optionsRaw'){
    formQuestionsDraft[idx].options = value.split('\n').map(s=>s.trim()).filter(Boolean);
  } else {
    formQuestionsDraft[idx][field] = value;
  }
};

window.changeQuestionType = function(idx, type){
  formQuestionsDraft[idx].type = type;
  if (type === 'multiple_choice' && !formQuestionsDraft[idx].options) formQuestionsDraft[idx].options = [];
  renderFormBuilder(window.__editingFormId,
    document.getElementById('formTitle')?.value || '',
    document.getElementById('formDescription')?.value || '', formQuestionsDraft);
};

window.addFormQuestion = function(){
  formQuestionsDraft.push({ id: 'q'+Date.now(), type: 'text', label: '' });
  renderFormBuilder(window.__editingFormId,
    document.getElementById('formTitle')?.value || '',
    document.getElementById('formDescription')?.value || '', formQuestionsDraft);
};

window.removeFormQuestion = function(idx){
  formQuestionsDraft.splice(idx, 1);
  renderFormBuilder(window.__editingFormId,
    document.getElementById('formTitle')?.value || '',
    document.getElementById('formDescription')?.value || '', formQuestionsDraft);
};

window.saveForm = async function(editId){
  const title = document.getElementById('formTitle').value.trim();
  if (!title){ toast('Dê um título à ficha.', true); return; }
  const validQuestions = formQuestionsDraft.filter(q => q.label && q.label.trim());
  if (!validQuestions.length){ toast('Adicione pelo menos uma pergunta.', true); return; }

  const data = {
    title,
    description: document.getElementById('formDescription').value.trim(),
    questions: validQuestions,
    updatedAt: serverTimestamp()
  };
  if (editId){
    await updateDoc(doc(db, 'tenants', tenantId, 'forms', editId), data);
  } else {
    data.createdAt = serverTimestamp();
    await addDoc(collection(db, 'tenants', tenantId, 'forms'), data);
  }
  toast('Ficha guardada.');
  renderView('forms');
};

window.deleteForm = async function(id){
  if (!confirm('Remover esta ficha? O link deixa de funcionar.')) return;
  await deleteDoc(doc(db, 'tenants', tenantId, 'forms', id));
  renderView('forms');
};

// ── Associar resposta pendente a um paciente ────────────────────────────
window.openAttachResponse = async function(responseId){
  const snap = await getDoc(doc(db, 'public_form_responses', responseId));
  if (!snap.exists()){ toast('Resposta não encontrada.', true); return; }
  const r = snap.data();

  const patientsSnap = await getDocs(collection(db, 'tenants', tenantId, 'patients'));
  let opts = '<option value="">Criar novo paciente com este nome...</option>';
  let matchedName = '';
  patientsSnap.forEach(d => {
    const isMatch = r.patientId && d.id === r.patientId;
    if (isMatch) matchedName = d.data().fullName;
    opts += `<option value="${d.id}" ${isMatch ? 'selected' : ''}>${escapeHtml(d.data().fullName)}</option>`;
  });

  let answersHtml = (r.answers || []).map(a => `
    <div class="appt-item"><strong>${escapeHtml(a.label)}</strong><div class="muted">${escapeHtml(String(a.value))}</div></div>
  `).join('');

  document.getElementById('attachContainer').innerHTML = `
    <div class="card">
      <h2>Associar resposta — ${escapeHtml(r.respondentName||'Sem nome')}</h2>
      ${matchedName ? `<p class="muted">Este link já identifica <strong>${escapeHtml(matchedName)}</strong> — confirme e associe.</p>` : ''}
      <div style="max-height:240px;overflow:auto;margin-bottom:10px;">${answersHtml}</div>
      <label>Associar ao paciente</label>
      <select id="attachPatientSelect">${opts}</select>
      <button class="primary" onclick="confirmAttach('${responseId}')">Confirmar</button>
    </div>`;
  window.__pendingResponseData = r;
};

window.confirmAttach = async function(responseId){
  const r = window.__pendingResponseData;
  let patientId = document.getElementById('attachPatientSelect').value;

  if (!patientId){
    const newPatientRef = await addDoc(collection(db, 'tenants', tenantId, 'patients'), {
      fullName: r.respondentName || 'Paciente sem nome',
      phone: r.respondentPhone || '',
      email: r.respondentEmail || '',
      clinicalNotes: '',
      consentGivenAt: serverTimestamp(),
      consentVersion: 'form-v1',
      createdBy: currentUser.uid
    });
    patientId = newPatientRef.id;
  }

  await addDoc(collection(db, 'tenants', tenantId, 'patients', patientId, 'formResponses'), {
    formId: r.formId,
    formTitle: r.formTitle,
    answers: r.answers,
    submittedAt: r.submittedAt || serverTimestamp()
  });

  await updateDoc(doc(db, 'public_form_responses', responseId), { status: 'processed' });
  await logAudit('form_response_attached', patientId);

  toast('Resposta associada ao paciente.');
  renderView('forms');
};

// ── PROTOCOLOS (métodos de atendimento personalizados) ─────────────────
// Dois tipos: "simples" (lista plana de pontos, como já existia) e
// "mapeamento" (grupos de pontos organizados por sistema, com zonas do
// corpo escolhidas antes de mapear — frente/costas × esquerda/direita —
// e textos que só precisam de ser escritos uma vez, com variações
// opcionais quando o significado muda consoante a zona/lado).
async function renderProtocols(main){
  const snap = await getDocs(collection(db, 'tenants', tenantId, 'protocols'));
  let rows = '';
  snap.forEach(d=>{
    const p = d.data();
    const isMapping = p.type === 'mapping';
    const countInfo = isMapping
      ? `${(p.groups||[]).length} grupos de pontos`
      : `${(p.points||[]).length} pontos definidos`;
    rows += `<div class="appt-item row">
      <div><strong>${escapeHtml(p.name)}</strong>
        <div class="muted">${isMapping ? '🗺️ Mapeamento por zonas' : '📋 Lista simples'} · ${countInfo}</div>
      </div>
      <div>
        <button class="ghost" onclick="editProtocol('${d.id}')">Editar</button>
        <button class="danger" onclick="deleteProtocol('${d.id}')">Remover</button>
      </div>
    </div>`;
  });
  if (!rows) rows = '<p class="muted">Ainda sem protocolos. Crie o seu primeiro método de atendimento.</p>';

  main.innerHTML = `
    <div class="row"><h2>Protocolos / Métodos de Atendimento</h2>
      <button class="primary" onclick="openNewProtocol()">+ Novo protocolo</button>
    </div>
    <p class="muted" style="margin-bottom:10px;">
      Um protocolo é o seu próprio método. Pode ser uma lista simples de
      pontos, ou um mapeamento por zonas do corpo (frente/costas ×
      esquerda/direita), com grupos de pontos organizados por sistema.
    </p>
    <div class="card">${rows}</div>
    <div id="protocolFormContainer"></div>
  `;
}

let protocolPointsDraft = [];
let protocolGroupsDraft = [];
let protocolClassificationsDraft = [];
let protocolBodyImages = { front: '', back: '' };

window.openNewProtocol = function(){
  protocolPointsDraft = [];
  protocolGroupsDraft = [];
  protocolClassificationsDraft = [];
  protocolBodyImages = { front: '', back: '' };
  window.__editingProtocolId = null;
  renderProtocolForm(null, { type: 'simple' });
};

window.editProtocol = async function(id){
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'protocols', id));
  if (!snap.exists()){ toast('Protocolo não encontrado.', true); return; }
  const p = snap.data();
  window.__editingProtocolId = id;
  protocolPointsDraft = (p.points || []).map(pt => ({...pt}));
  protocolGroupsDraft = (p.groups || []).map(g => ({...g, points: (g.points||[]).map(pt=>({...pt}))}));
  protocolClassificationsDraft = (p.finalClassifications || []).map(c => ({...c}));
  protocolBodyImages = { front: p.bodyFrontImageUrl || '', back: p.bodyBackImageUrl || '' };
  renderProtocolForm(id, p);
};

window.changeProtocolType = function(newType){
  const name = document.getElementById('protoName')?.value || '';
  renderProtocolForm(window.__editingProtocolId, { name, type: newType });
};

function renderProtocolForm(editId, data){
  const type = data.type || 'simple';
  const name = data.name || '';

  let bodyHtml = '';
  if (type === 'simple'){
    bodyHtml = renderSimplePointsBuilder() + renderClassificationsBuilder();
  } else {
    bodyHtml = renderMappingGroupsBuilder() + renderClassificationsBuilder();
  }

  document.getElementById('protocolFormContainer').innerHTML = `
    <div class="card">
      <h2>${editId ? 'Editar protocolo' : 'Novo protocolo'}</h2>
      <label>Nome do protocolo</label>
      <input id="protoName" value="${escapeHtml(name)}" placeholder="ex: Avaliação de Ansiedade e Depressão">
      <label>Tipo de protocolo</label>
      <select id="protoType" onchange="changeProtocolType(this.value)">
        <option value="simple" ${type==='simple'?'selected':''}>Lista simples de pontos</option>
        <option value="mapping" ${type==='mapping'?'selected':''}>Mapeamento por zonas do corpo</option>
      </select>
      <div id="protoTypeBody">${bodyHtml}</div>
      <div style="margin-top:14px;">
        <button class="primary" onclick="saveProtocol('${editId||''}')">Guardar protocolo</button>
      </div>
    </div>`;
}

// ── Tipo "simples" (como já existia) ────────────────────────────────────
function renderSimplePointsBuilder(){
  let pointsHtml = protocolPointsDraft.map((pt, idx) => `
    <div class="card" style="margin-bottom:8px;">
      <label>Nome do ponto</label>
      <input value="${escapeHtml(pt.name||'')}" onchange="updateProtocolPoint(${idx}, 'name', this.value)">
      <label>Fonte de conhecimento (o que significa quando detetado)</label>
      <textarea rows="3" onchange="updateProtocolPoint(${idx}, 'knowledgeText', this.value)">${escapeHtml(pt.knowledgeText||'')}</textarea>
      <button class="danger" onclick="removeProtocolPoint(${idx})">Remover ponto</button>
    </div>
  `).join('');
  return `
    <div id="protoPointsList">${pointsHtml || '<p class="muted">Ainda sem pontos. Adicione o primeiro.</p>'}</div>
    <button class="ghost" onclick="addProtocolPoint()">+ Adicionar ponto</button>`;
}

window.updateProtocolPoint = function(idx, field, value){
  protocolPointsDraft[idx][field] = value;
};
window.addProtocolPoint = function(){
  protocolPointsDraft.push({ name: '', knowledgeText: '' });
  refreshProtoTypeBody();
};
window.removeProtocolPoint = function(idx){
  protocolPointsDraft.splice(idx, 1);
  refreshProtoTypeBody();
};

// ── Tipo "mapeamento" — grupos de pontos com variações por zona/lado ───
function renderMappingGroupsBuilder(){
  let groupsHtml = protocolGroupsDraft.map((g, gIdx) => {
    let pointsHtml = (g.points||[]).map((pt, pIdx) => `
      <div class="card" style="margin:8px 0;background:#f6f8f7;">
        <label>Nome do ponto</label>
        <input value="${escapeHtml(pt.name||'')}" onchange="updateMappingPoint(${gIdx},${pIdx},'name',this.value)">
        <label>Texto base (significado geral — usado se não houver variação abaixo)</label>
        <textarea rows="2" onchange="updateMappingPoint(${gIdx},${pIdx},'baseText',this.value)">${escapeHtml(pt.baseText||'')}</textarea>
        <p class="muted" style="margin:6px 0 4px;">Variações opcionais — deixe em branco se for igual ao texto base:</p>
        <label>Diferença quando é na FRENTE</label>
        <textarea rows="2" onchange="updateMappingPoint(${gIdx},${pIdx},'frontText',this.value)">${escapeHtml(pt.frontText||'')}</textarea>
        <label>Diferença quando é nas COSTAS</label>
        <textarea rows="2" onchange="updateMappingPoint(${gIdx},${pIdx},'backText',this.value)">${escapeHtml(pt.backText||'')}</textarea>
        <label>Acrescento quando é do lado ESQUERDO</label>
        <textarea rows="2" onchange="updateMappingPoint(${gIdx},${pIdx},'leftText',this.value)">${escapeHtml(pt.leftText||'')}</textarea>
        <label>Acrescento quando é do lado DIREITO</label>
        <textarea rows="2" onchange="updateMappingPoint(${gIdx},${pIdx},'rightText',this.value)">${escapeHtml(pt.rightText||'')}</textarea>
        <button onclick="openMapPositionPicker(${gIdx},${pIdx})" style="width:100%;background:${pt.mapX!=null?'var(--primary)':'#fff3cd'};color:${pt.mapX!=null?'#fff':'#8a5a00'};border:2px solid ${pt.mapX!=null?'var(--primary)':'#e0a83c'};padding:10px;border-radius:8px;font-weight:600;cursor:pointer;margin-bottom:8px;">${pt.mapX!=null ? '📍 Posição definida ('+(pt.mapSide==='costas'?'Costas':'Frente')+') — toque para editar' : '📍 Toque para colocar este ponto no boneco'}</button>
        <button class="danger" onclick="removeMappingPoint(${gIdx},${pIdx})">Remover ponto</button>
      </div>
    `).join('');
    return `
      <div class="card" style="border:1px solid var(--primary);margin-bottom:10px;">
        <label>Nome do grupo/sistema</label>
        <input value="${escapeHtml(g.groupName||'')}" onchange="updateMappingGroupName(${gIdx}, this.value)" placeholder="ex: 7 Pontos Vitais, Sistema Superior...">
        ${pointsHtml}
        <button class="ghost" onclick="addMappingPoint(${gIdx})">+ Adicionar ponto a este grupo</button>
        <button class="danger" style="margin-left:6px;" onclick="removeMappingGroup(${gIdx})">Remover grupo inteiro</button>
      </div>`;
  }).join('');

  return `
    <h3 style="margin:14px 0 8px;">Imagem do corpo para o mapa (opcional)</h3>
    <p class="muted" style="margin-bottom:8px;">Cole o link de uma imagem sua (frente e/ou costas). Se deixar em branco, é usado um boneco genérico.</p>
    <label>URL da imagem — Frente</label>
    <input value="${escapeHtml(protocolBodyImages.front||'')}" onchange="updateProtocolBodyImage('front', this.value)" placeholder="https://...">
    <label>URL da imagem — Costas</label>
    <input value="${escapeHtml(protocolBodyImages.back||'')}" onchange="updateProtocolBodyImage('back', this.value)" placeholder="https://...">
    <h3 style="margin:14px 0 8px;">Grupos de pontos</h3>
    <div id="mapPickerContainer"></div>
    <div id="protoGroupsList">${groupsHtml || '<p class="muted">Ainda sem grupos. Adicione o primeiro (ex: "7 Pontos Vitais").</p>'}</div>
    <button class="ghost" onclick="addMappingGroup()">+ Adicionar grupo</button>`;
}

window.updateProtocolBodyImage = function(side, value){
  protocolBodyImages[side] = value.trim();
};

// ── Desenho do mapa do corpo — usa imagem própria se definida, senão um boneco genérico ─
function bodyDiagramHTML(bodyImages, side, overlayHtml){
  overlayHtml = overlayHtml || '';
  const imgUrl = side === 'costas' ? bodyImages?.back : bodyImages?.front;
  const inner = imgUrl
    ? `<img src="${escapeHtml(imgUrl)}" style="width:100%;display:block;border-radius:8px;" onerror="this.style.display='none';this.nextElementSibling.style.display='block';">
       <p class="muted" style="display:none;padding:30px 10px;text-align:center;">Não foi possível carregar esta imagem — verifique o link.</p>`
    : `<svg viewBox="0 0 200 400" style="width:100%;display:block;" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="100" cy="42" rx="30" ry="34" style="fill:#e4ede9;stroke:#b9cfc6;stroke-width:2;"/>
        <rect x="68" y="76" width="64" height="94" rx="20" style="fill:#e4ede9;stroke:#b9cfc6;stroke-width:2;"/>
        <rect x="34" y="82" width="30" height="128" rx="14" style="fill:#e4ede9;stroke:#b9cfc6;stroke-width:2;"/>
        <rect x="136" y="82" width="30" height="128" rx="14" style="fill:#e4ede9;stroke:#b9cfc6;stroke-width:2;"/>
        <rect x="70" y="168" width="28" height="160" rx="14" style="fill:#e4ede9;stroke:#b9cfc6;stroke-width:2;"/>
        <rect x="102" y="168" width="28" height="160" rx="14" style="fill:#e4ede9;stroke:#b9cfc6;stroke-width:2;"/>
       </svg>`;
  return `<div class="mapDiagramWrap" style="position:relative;width:100%;max-width:260px;margin:0 auto;">
    ${inner}
    <div style="position:absolute;top:4px;left:8px;font-size:11px;background:rgba(0,0,0,.45);color:#fff;padding:2px 8px;border-radius:10px;">${side==='costas'?'Costas':'Frente'}</div>
    ${overlayHtml}
  </div>`;
}

// ── Seletor de posição no mapa do corpo (usado ao construir o protocolo) ─
window.openMapPositionPicker = function(gIdx, pIdx){
  window.__mapPickerTarget = { gIdx, pIdx };
  const pt = protocolGroupsDraft[gIdx].points[pIdx];
  window.__mapPickerSide = pt.mapSide || 'frente';
  window.__mapPickerX = pt.mapX ?? null;
  window.__mapPickerY = pt.mapY ?? null;
  renderMapPositionPicker();
  document.getElementById('mapPickerContainer').scrollIntoView({ behavior:'smooth', block:'center' });
};

function renderMapPositionPicker(){
  const { gIdx, pIdx } = window.__mapPickerTarget;
  const pt = protocolGroupsDraft[gIdx].points[pIdx];
  const side = window.__mapPickerSide;
  const dot = (window.__mapPickerX != null)
    ? `<div style="position:absolute;left:${window.__mapPickerX}%;top:${window.__mapPickerY}%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--primary);border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);pointer-events:none;"></div>`
    : '';
  document.getElementById('mapPickerContainer').innerHTML = `
    <div class="card" style="background:#f6f8f7;">
      <div class="row" style="margin-bottom:8px;">
        <strong>Posição no mapa — ${escapeHtml(pt.name||'(sem nome)')}</strong>
        <button class="ghost" onclick="closeMapPositionPicker()">Fechar</button>
      </div>
      <div style="display:flex;margin-bottom:10px;">
        <button onclick="setMapPickerSide('frente')" style="flex:1;background:${side==='frente'?'var(--primary)':'none'};color:${side==='frente'?'#fff':'var(--text)'};border:1px solid #d8e0dc;padding:8px;border-radius:8px 0 0 8px;cursor:pointer;">Frente</button>
        <button onclick="setMapPickerSide('costas')" style="flex:1;background:${side==='costas'?'var(--primary)':'none'};color:${side==='costas'?'#fff':'var(--text)'};border:1px solid #d8e0dc;border-left:none;padding:8px;border-radius:0 8px 8px 0;cursor:pointer;">Costas</button>
      </div>
      <p class="muted" style="margin-bottom:8px;text-align:center;">Toque na imagem no local exato deste ponto.</p>
      <div onclick="handleMapPickerClick(event)" style="cursor:crosshair;">${bodyDiagramHTML(protocolBodyImages, side, dot)}</div>
      <div style="margin-top:10px;display:flex;gap:8px;">
        <button class="primary" onclick="saveMapPosition()">Guardar posição</button>
        ${pt.mapX!=null ? `<button class="danger" onclick="removeMapPosition()">Remover</button>` : ''}
      </div>
    </div>`;
}

window.setMapPickerSide = function(side){
  window.__mapPickerSide = side;
  renderMapPositionPicker();
};

window.handleMapPickerClick = function(evt){
  const wrap = evt.currentTarget.querySelector('.mapDiagramWrap');
  const rect = wrap.getBoundingClientRect();
  const x = ((evt.clientX - rect.left) / rect.width) * 100;
  const y = ((evt.clientY - rect.top) / rect.height) * 100;
  window.__mapPickerX = Math.max(0, Math.min(100, x));
  window.__mapPickerY = Math.max(0, Math.min(100, y));
  renderMapPositionPicker();
};

window.saveMapPosition = function(){
  const { gIdx, pIdx } = window.__mapPickerTarget;
  if (window.__mapPickerX == null){ toast('Toque no boneco para marcar a posição.', true); return; }
  protocolGroupsDraft[gIdx].points[pIdx].mapX = window.__mapPickerX;
  protocolGroupsDraft[gIdx].points[pIdx].mapY = window.__mapPickerY;
  protocolGroupsDraft[gIdx].points[pIdx].mapSide = window.__mapPickerSide;
  closeMapPositionPicker();
  refreshProtoTypeBody();
  toast('Posição guardada.');
};

window.removeMapPosition = function(){
  const { gIdx, pIdx } = window.__mapPickerTarget;
  delete protocolGroupsDraft[gIdx].points[pIdx].mapX;
  delete protocolGroupsDraft[gIdx].points[pIdx].mapY;
  delete protocolGroupsDraft[gIdx].points[pIdx].mapSide;
  closeMapPositionPicker();
  refreshProtoTypeBody();
  toast('Posição removida.');
};

window.closeMapPositionPicker = function(){
  window.__mapPickerTarget = null;
  const el = document.getElementById('mapPickerContainer');
  if (el) el.innerHTML = '';
}

window.updateMappingGroupName = function(gIdx, value){
  protocolGroupsDraft[gIdx].groupName = value;
};
window.addMappingGroup = function(){
  protocolGroupsDraft.push({ groupName: '', points: [] });
  refreshProtoTypeBody();
};
window.removeMappingGroup = function(gIdx){
  protocolGroupsDraft.splice(gIdx, 1);
  refreshProtoTypeBody();
};
window.addMappingPoint = function(gIdx){
  protocolGroupsDraft[gIdx].points.push({ name:'', baseText:'', frontText:'', backText:'', leftText:'', rightText:'' });
  refreshProtoTypeBody();
};
window.removeMappingPoint = function(gIdx, pIdx){
  protocolGroupsDraft[gIdx].points.splice(pIdx, 1);
  refreshProtoTypeBody();
};
window.updateMappingPoint = function(gIdx, pIdx, field, value){
  protocolGroupsDraft[gIdx].points[pIdx][field] = value;
};

// ── Classificações finais — genéricas, nomeadas pelo próprio subscritor
// (ex: "Escudo emocional mais ativo", "Momento", "Idade/Geração"), para
// que a app continue universal a qualquer terapia, não só a uma.
function renderClassificationsBuilder(){
  let html = protocolClassificationsDraft.map((c, idx) => `
    <div class="card" style="margin-bottom:8px;">
      <label>Pergunta / dado a recolher</label>
      <input value="${escapeHtml(c.label||'')}" onchange="updateClassification(${idx},'label',this.value)" placeholder="ex: Escudo emocional mais ativo">
      <label>Quando perguntar</label>
      <select onchange="updateClassification(${idx},'when',this.value)">
        <option value="before" ${c.when==='before'?'selected':''}>No início (antes do mapeamento) — ex: dados do paciente, perguntas de recolha</option>
        <option value="after" ${(!c.when||c.when==='after')?'selected':''}>No fim (classificação final) — ex: escudo ativo, idade/geração</option>
      </select>
      <label>Tipo de resposta</label>
      <select onchange="updateClassification(${idx},'type',this.value)">
        <option value="select" ${(!c.type||c.type==='select')?'selected':''}>Escolher uma opção</option>
        <option value="checkbox" ${c.type==='checkbox'?'selected':''}>Marcar vários (múltipla escolha)</option>
        <option value="text" ${c.type==='text'?'selected':''}>Texto livre</option>
      </select>
      ${c.type !== 'text' ? `
        <label>Opções (separadas por vírgula)</label>
        <input value="${escapeHtml((c.options||[]).join(', '))}" onchange="updateClassification(${idx},'optionsRaw',this.value)" placeholder="ex: Desproteção, Desvalorização, Impotência, Sobrevivência, Perda">
      ` : ''}
      <button class="danger" onclick="removeClassification(${idx})">Remover</button>
    </div>
  `).join('');
  return `
    <h3 style="margin:14px 0 8px;">Perguntas do protocolo (opcional)</h3>
    <p class="muted" style="margin-bottom:8px;">Dados ou perguntas feitas antes de começar (ex: nome, medicação, as 6 perguntas do poder) ou no fim (ex: qual escudo está mais ativo, em que momento/idade).</p>
    <div id="protoClassificationsList">${html}</div>
    <button class="ghost" onclick="addClassification()">+ Adicionar pergunta</button>`;
}

window.updateClassification = function(idx, field, value){
  if (field === 'optionsRaw'){
    protocolClassificationsDraft[idx].options = value.split(',').map(s=>s.trim()).filter(Boolean);
  } else {
    protocolClassificationsDraft[idx][field] = value;
  }
  if (field === 'type') refreshProtoTypeBody();
};
window.addClassification = function(){
  protocolClassificationsDraft.push({ label:'', type:'select', when:'after', options:[] });
  refreshProtoTypeBody();
};
window.removeClassification = function(idx){
  protocolClassificationsDraft.splice(idx, 1);
  refreshProtoTypeBody();
};

function refreshProtoTypeBody(){
  const type = document.getElementById('protoType')?.value || 'simple';
  const name = document.getElementById('protoName')?.value || '';
  document.getElementById('protoTypeBody').innerHTML =
    type === 'simple' ? (renderSimplePointsBuilder() + renderClassificationsBuilder()) : (renderMappingGroupsBuilder() + renderClassificationsBuilder());
}

window.saveProtocol = async function(editId){
  const name = document.getElementById('protoName').value.trim();
  if (!name){ toast('Dê um nome ao protocolo.', true); return; }
  const type = document.getElementById('protoType').value;

  let data = { name, type, updatedAt: serverTimestamp() };
  data.finalClassifications = protocolClassificationsDraft.filter(c => c.label && c.label.trim());
  if (type === 'simple'){
    const validPoints = protocolPointsDraft.filter(p => p.name && p.name.trim());
    if (!validPoints.length){ toast('Adicione pelo menos um ponto com nome.', true); return; }
    data.points = validPoints;
  } else {
    const validGroups = protocolGroupsDraft
      .filter(g => g.groupName && g.groupName.trim())
      .map(g => ({ groupName: g.groupName, points: (g.points||[]).filter(p => p.name && p.name.trim()) }))
      .filter(g => g.points.length);
    if (!validGroups.length){ toast('Adicione pelo menos um grupo com um ponto válido.', true); return; }
    data.groups = validGroups;
    data.bodyFrontImageUrl = protocolBodyImages.front || '';
    data.bodyBackImageUrl = protocolBodyImages.back || '';
  }

  if (editId){
    await updateDoc(doc(db, 'tenants', tenantId, 'protocols', editId), data);
  } else {
    data.createdAt = serverTimestamp();
    await addDoc(collection(db, 'tenants', tenantId, 'protocols'), data);
  }
  toast('Protocolo guardado.');
  renderView('protocols');
};

window.deleteProtocol = async function(id){
  if (!confirm('Remover este protocolo? Relatórios já gerados com ele não são afetados.')) return;
  await deleteDoc(doc(db, 'tenants', tenantId, 'protocols', id));
  renderView('protocols');
};

// ── CONSULTA GUIADA — usar um protocolo com um paciente concreto ───────
window.startGuidedConsultation = async function(patientId, patientName){
  const snap = await getDocs(collection(db, 'tenants', tenantId, 'protocols'));
  let opts = '<option value="">Selecionar protocolo...</option>';
  const protocols = {};
  snap.forEach(d => { protocols[d.id] = d.data(); opts += `<option value="${d.id}">${escapeHtml(d.data().name)}</option>`; });

  if (snap.empty){
    toast('Crie um protocolo primeiro, em "Protocolos".', true);
    return;
  }

  document.getElementById('patientFormContainer').innerHTML = `
    <div class="card">
      <h2>Consulta guiada — ${escapeHtml(patientName)}</h2>
      <label>Protocolo</label>
      <select id="guidedProtocolSelect" onchange="onGuidedProtocolChange('${patientId}', '${escapeHtml(patientName)}')">${opts}</select>
      <div id="guidedPointsArea"></div>
    </div>`;
  window.__guidedProtocols = protocols;
};

window.onGuidedProtocolChange = function(patientId, patientName){
  const protoId = document.getElementById('guidedProtocolSelect').value;
  const area = document.getElementById('guidedPointsArea');
  if (!protoId){ area.innerHTML=''; return; }
  const proto = window.__guidedProtocols[protoId];
  window.__currentGuidedProtoId = protoId;
  window.__mappingBeforeAnswers = [];
  window.__mappingAfterAnswers = [];
  area.innerHTML = '';

  const nextStep = () => {
    if (proto.type === 'mapping') renderMappingZoneSelection(patientId, patientName, area);
    else renderGuidedPoints(patientId, patientName, area, proto);
  };

  const beforeQuestions = (proto.finalClassifications || []).filter(c => c.when === 'before');
  if (beforeQuestions.length){
    renderQuestionsScreen(area, beforeQuestions, 'before', nextStep);
  } else {
    nextStep();
  }
};

// ── Ecrã genérico de perguntas (usado no início e no fim do mapeamento) ─
function renderQuestionsScreen(area, questions, phase, onContinue){
  let html = `<h3 style="margin:8px 0;">${phase==='before' ? 'Antes de começar' : 'Classificação final'}</h3>`;
  questions.forEach((c, idx) => {
    const inputId = `${phase}q_${idx}`;
    if (c.type === 'text'){
      html += `<div class="card"><label>${escapeHtml(c.label)}</label><input id="${inputId}"></div>`;
    } else if (c.type === 'checkbox'){
      const opts = (c.options||[]).map((o, oIdx) => `
        <label style="display:flex;align-items:center;gap:8px;margin-top:6px;">
          <input type="checkbox" id="${inputId}_opt_${oIdx}" value="${escapeHtml(o)}" style="width:auto;margin:0;">
          ${escapeHtml(o)}
        </label>`).join('');
      html += `<div class="card"><label>${escapeHtml(c.label)}</label>${opts}</div>`;
    } else {
      const opts = (c.options||[]).map(o => `<option value="${escapeHtml(o)}">${escapeHtml(o)}</option>`).join('');
      html += `<div class="card"><label>${escapeHtml(c.label)}</label><select id="${inputId}"><option value="">—</option>${opts}</select></div>`;
    }
  });
  html += `<button class="primary" onclick="window.__questionsScreenContinue()">Continuar</button>`;
  area.innerHTML += html;
  area.scrollIntoView({ behavior:'smooth', block:'end' });

  window.__questionsScreenContinue = function(){
    const answers = questions.map((c, idx) => {
      const inputId = `${phase}q_${idx}`;
      if (c.type === 'checkbox'){
        const chosen = (c.options||[])
          .map((o, oIdx) => document.getElementById(`${inputId}_opt_${oIdx}`)?.checked ? o : null)
          .filter(Boolean);
        return { label: c.label, value: chosen.join(', ') };
      }
      return { label: c.label, value: document.getElementById(inputId)?.value || '' };
    }).filter(a => a.value);

    if (phase === 'before') window.__mappingBeforeAnswers = answers;
    else window.__mappingAfterAnswers = answers;

    onContinue();
  };
}

// ── Fluxo tipo "simples" (como já existia) ──────────────────────────────
function renderGuidedPoints(patientId, patientName, area, proto){
  area.innerHTML = proto.points.map((pt, idx) => `
    <div class="card" style="margin:8px 0;">
      <label style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" id="ptCheck${idx}" style="width:auto;margin:0;">
        <strong>${escapeHtml(pt.name)}</strong>
      </label>
      <label style="margin-top:6px;">Nota desta sessão (opcional)</label>
      <textarea id="ptNote${idx}" rows="2" placeholder="Observações específicas desta consulta..."></textarea>
    </div>
  `).join('') + `<button class="primary" onclick="startSimpleClassificationsPhase('${patientId}', '${escapeHtml(patientName)}')">Continuar</button>`;
}

window.startSimpleClassificationsPhase = function(patientId, patientName){
  const proto = window.__guidedProtocols[window.__currentGuidedProtoId];
  const hasChecked = proto.points.some((pt, idx) => document.getElementById(`ptCheck${idx}`)?.checked);
  if (!hasChecked){ toast('Marque pelo menos um ponto para continuar.', true); return; }

  const afterQuestions = (proto.finalClassifications || []).filter(c => !c.when || c.when === 'after');
  if (!afterQuestions.length){
    window.__mappingAfterAnswers = [];
    generateReport(patientId, patientName);
    return;
  }
  renderQuestionsScreen(
    document.getElementById('guidedPointsArea'),
    afterQuestions,
    'after',
    () => generateReport(patientId, patientName)
  );
};

window.generateReport = async function(patientId, patientName){
  const protoId = window.__currentGuidedProtoId;
  const proto = window.__guidedProtocols[protoId];
  const detectedPoints = [];

  proto.points.forEach((pt, idx) => {
    const checked = document.getElementById(`ptCheck${idx}`)?.checked;
    if (checked){
      const note = document.getElementById(`ptNote${idx}`)?.value.trim() || '';
      detectedPoints.push({ name: pt.name, knowledgeText: pt.knowledgeText, note });
    }
  });

  if (!detectedPoints.length){
    toast('Marque pelo menos um ponto para gerar o relatório.', true);
    return;
  }

  const beforeAnswers = window.__mappingBeforeAnswers || [];
  const afterAnswers = window.__mappingAfterAnswers || [];

  let reportText = `Relatório de Consulta — ${proto.name}\n`;
  reportText += `Paciente: ${patientName}\n`;
  reportText += `Data: ${new Date().toLocaleDateString('pt-PT')}\n\n`;

  if (beforeAnswers.length){
    reportText += `== Dados iniciais ==\n`;
    beforeAnswers.forEach(a => { reportText += `${a.label}: ${a.value}\n`; });
    reportText += `\n`;
  }

  detectedPoints.forEach(p => {
    reportText += `• ${p.name}\n${p.knowledgeText}\n`;
    if (p.note) reportText += `Nota da sessão: ${p.note}\n`;
    reportText += `\n`;
  });

  if (afterAnswers.length){
    reportText += `== Classificação final ==\n`;
    afterAnswers.forEach(a => { reportText += `${a.label}: ${a.value}\n`; });
  }

  await addDoc(collection(db, 'tenants', tenantId, 'patients', patientId, 'reports'), {
    protocolId: protoId, protocolName: proto.name, points: detectedPoints,
    beforeAnswers, classifications: afterAnswers,
    reportText, generatedAt: serverTimestamp(), generatedBy: currentUser.uid
  });
  await logAudit('report_generated', patientId);
  renderGeneratedReportScreen(proto.name, reportText);
};

// ── Fluxo tipo "mapeamento" — escolher zonas, depois mapear pontos ─────
window.renderMappingZoneSelection = function(patientId, patientName, area){
  window.__zoneSelection = { frente:false, costas:false, esquerdo:false, direito:false };
  area.innerHTML = `
    <div class="card">
      <h3>O que vamos mapear?</h3>
      <p class="muted" style="margin-bottom:10px;">Escolha um ou mais lados. Pode mapear um lado de cada vez (em consultas separadas) ou vários juntos — o relatório indica sempre a que lado pertence cada ponto.</p>
      <div id="zoneButtonsGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"></div>
      <div class="row" style="margin-top:10px;">
        <button class="ghost" onclick="quickSelectZone('frenteCompleta')">Frente completa</button>
        <button class="ghost" onclick="quickSelectZone('costasCompleta')">Costas completa</button>
        <button class="ghost" onclick="quickSelectZone('tudo')">Mapeamento completo</button>
      </div>
      <button class="primary" style="margin-top:14px;" onclick="startMappingPoints('${patientId}','${escapeHtml(patientName)}')">Continuar para o mapeamento</button>
    </div>`;
  renderZoneButtons();
};

const ZONE_BUTTON_DEFS = [
  { key:'frente-esquerdo', zona:'frente', lado:'esquerdo', label:'Frente — Lado Esquerdo' },
  { key:'frente-direito', zona:'frente', lado:'direito', label:'Frente — Lado Direito' },
  { key:'costas-esquerdo', zona:'costas', lado:'esquerdo', label:'Costas — Lado Esquerdo' },
  { key:'costas-direito', zona:'costas', lado:'direito', label:'Costas — Lado Direito' }
];

function renderZoneButtons(){
  const grid = document.getElementById('zoneButtonsGrid');
  if (!grid) return;
  grid.innerHTML = ZONE_BUTTON_DEFS.map(def => {
    const on = !!window.__zoneCombos?.[def.key];
    return `<button onclick="toggleZoneCombo('${def.key}')" style="padding:14px 8px;border-radius:10px;border:2px solid ${on?'var(--primary)':'#d8e0dc'};background:${on?'var(--primary)':'#fff'};color:${on?'#fff':'var(--text)'};font-size:13px;font-weight:600;cursor:pointer;">${def.label}</button>`;
  }).join('');
}

window.toggleZoneCombo = function(key){
  window.__zoneCombos = window.__zoneCombos || {};
  window.__zoneCombos[key] = !window.__zoneCombos[key];
  renderZoneButtons();
};

window.quickSelectZone = function(preset){
  window.__zoneCombos = {};
  if (preset === 'frenteCompleta'){ window.__zoneCombos['frente-esquerdo']=true; window.__zoneCombos['frente-direito']=true; }
  if (preset === 'costasCompleta'){ window.__zoneCombos['costas-esquerdo']=true; window.__zoneCombos['costas-direito']=true; }
  if (preset === 'tudo'){ ZONE_BUTTON_DEFS.forEach(d => window.__zoneCombos[d.key]=true); }
  renderZoneButtons();
};

window.startMappingPoints = function(patientId, patientName){
  const combos = ZONE_BUTTON_DEFS
    .filter(def => window.__zoneCombos?.[def.key])
    .map(def => ({ zona: def.zona, lado: def.lado }));

  if (!combos.length){
    toast('Escolha pelo menos um lado para mapear.', true); return;
  }
  window.__mappingCombos = combos;

  const proto = window.__guidedProtocols[window.__currentGuidedProtoId];
  const zonaLabel = { frente:'Frente', costas:'Costas' };
  const ladoLabel = { esquerdo:'Esquerdo', direito:'Direito' };

  let html = '';
  combos.forEach((combo, cIdx) => {
    html += `<h3 style="margin:16px 0 8px;">${zonaLabel[combo.zona]} — Lado ${ladoLabel[combo.lado]}</h3>`;
    html += renderMappingDiagram(cIdx, combo, proto);
    proto.groups.forEach((g, gIdx) => {
      html += `<div class="card" style="margin-bottom:8px;"><strong>${escapeHtml(g.groupName)}</strong>`;
      g.points.forEach((pt, pIdx) => {
        const id = `mp_${cIdx}_${gIdx}_${pIdx}`;
        html += `
          <div style="margin-top:8px;border-top:1px solid #eef2f0;padding-top:8px;">
            <label style="display:flex;align-items:center;gap:8px;">
              <input type="checkbox" id="${id}_check" onchange="syncMapDot('${id}')" style="width:auto;margin:0;">
              <strong>${escapeHtml(pt.name)}</strong>
            </label>
            <textarea id="${id}_note" rows="1" placeholder="Nota (opcional)" style="margin-top:4px;"></textarea>
          </div>`;
      });
      html += `</div>`;
    });
  });
  html += `<button class="primary" onclick="startMappingClassificationsPhase('${patientId}','${escapeHtml(patientName)}')">Continuar</button>`;

  document.getElementById('guidedPointsArea').innerHTML = html;
};

// ── Mapa do corpo na execução — dots absolutos sobre a imagem própria ──
function renderMappingDiagram(cIdx, combo, proto){
  let dots = '';
  let hasAny = false;
  proto.groups.forEach((g, gIdx) => {
    g.points.forEach((pt, pIdx) => {
      if (pt.mapX == null || pt.mapSide !== combo.zona) return;
      hasAny = true;
      const id = `mp_${cIdx}_${gIdx}_${pIdx}`;
      dots += `<div data-target="${id}_check" onclick="toggleMapDot(this)"
        style="position:absolute;left:${pt.mapX}%;top:${pt.mapY}%;width:22px;height:22px;margin:-11px 0 0 -11px;
        border-radius:50%;background:#fff;border:3px solid var(--primary);cursor:pointer;
        box-shadow:0 1px 4px rgba(0,0,0,.3);"></div>`;
    });
  });
  const hasImage = combo.zona === 'costas' ? !!proto.bodyBackImageUrl : !!proto.bodyFrontImageUrl;
  if (!hasAny && !hasImage) return '';
  return `<div class="card" style="background:#f6f8f7;text-align:center;">
    <p class="muted" style="margin-bottom:8px;">${hasAny ? 'Toque no ponto na imagem — equivale a marcar a caixa abaixo' : 'Ainda sem pontos posicionados nesta zona (marque pela lista abaixo)'}</p>
    ${bodyDiagramHTML({front: proto.bodyFrontImageUrl, back: proto.bodyBackImageUrl}, combo.zona, dots)}
  </div>`;
}

window.toggleMapDot = function(circle){
  const check = document.getElementById(circle.dataset.target);
  if (!check) return;
  check.checked = !check.checked;
  check.dispatchEvent(new Event('change'));
};

window.syncMapDot = function(id){
  const check = document.getElementById(`${id}_check`);
  const dotEl = document.querySelector(`div[data-target="${id}_check"]`);
  if (dotEl && check) dotEl.style.background = check.checked ? 'var(--primary)' : '#fff';
};

window.startMappingClassificationsPhase = function(patientId, patientName){
  const proto = window.__guidedProtocols[window.__currentGuidedProtoId];
  const afterQuestions = (proto.finalClassifications || []).filter(c => !c.when || c.when === 'after');
  if (!afterQuestions.length){
    window.__mappingAfterAnswers = [];
    generateMappingReport(patientId, patientName);
    return;
  }
  renderQuestionsScreen(
    document.getElementById('guidedPointsArea'),
    afterQuestions,
    'after',
    () => generateMappingReport(patientId, patientName)
  );
};

function computeMappingPointText(pt, zona, lado){
  let text = pt.baseText || '';
  if (zona === 'frente' && pt.frontText) text = pt.frontText;
  if (zona === 'costas' && pt.backText) text = pt.backText;
  if (lado === 'esquerdo' && pt.leftText) text += (text ? '\n' : '') + pt.leftText;
  if (lado === 'direito' && pt.rightText) text += (text ? '\n' : '') + pt.rightText;
  return text;
}

window.generateMappingReport = async function(patientId, patientName){
  const proto = window.__guidedProtocols[window.__currentGuidedProtoId];
  const combos = window.__mappingCombos;
  const zonaLabel = { frente:'Frente', costas:'Costas' };
  const ladoLabel = { esquerdo:'Esquerdo', direito:'Direito' };
  const detected = [];

  combos.forEach((combo, cIdx) => {
    proto.groups.forEach((g, gIdx) => {
      g.points.forEach((pt, pIdx) => {
        const id = `mp_${cIdx}_${gIdx}_${pIdx}`;
        const checkEl = document.getElementById(`${id}_check`);
        if (checkEl && checkEl.checked){
          const note = document.getElementById(`${id}_note`)?.value.trim() || '';
          detected.push({
            group: g.groupName, name: pt.name, zona: combo.zona, lado: combo.lado,
            text: computeMappingPointText(pt, combo.zona, combo.lado), note
          });
        }
      });
    });
  });

  const beforeAnswers = window.__mappingBeforeAnswers || [];
  const classificationAnswers = window.__mappingAfterAnswers || [];

  if (!detected.length){
    toast('Marque pelo menos um ponto para gerar o relatório.', true);
    return;
  }

  let reportText = `Relatório de Mapeamento — ${proto.name}\n`;
  reportText += `Paciente: ${patientName}\n`;
  reportText += `Data: ${new Date().toLocaleDateString('pt-PT')}\n\n`;

  if (beforeAnswers.length){
    reportText += `== Dados iniciais ==\n`;
    beforeAnswers.forEach(a => { reportText += `${a.label}: ${a.value}\n`; });
    reportText += `\n`;
  }

  let currentGroup = null;
  detected.forEach(d => {
    if (d.group !== currentGroup){
      reportText += `\n== ${d.group} ==\n`;
      currentGroup = d.group;
    }
    reportText += `• ${d.name} (${zonaLabel[d.zona]}, Lado ${ladoLabel[d.lado]})\n${d.text}\n`;
    if (d.note) reportText += `Nota da sessão: ${d.note}\n`;
  });

  if (classificationAnswers.length){
    reportText += `\n== Classificação final ==\n`;
    classificationAnswers.forEach(a => { reportText += `${a.label}: ${a.value}\n`; });
  }

  await addDoc(collection(db, 'tenants', tenantId, 'patients', patientId, 'reports'), {
    protocolId: window.__currentGuidedProtoId, protocolName: proto.name,
    mappingDetected: detected, beforeAnswers, classifications: classificationAnswers,
    reportText, generatedAt: serverTimestamp(), generatedBy: currentUser.uid
  });
  await logAudit('report_generated', patientId);
  renderGeneratedReportScreen(proto.name, reportText);
};

function renderGeneratedReportScreen(protocolName, reportText){
  document.getElementById('patientFormContainer').innerHTML = `
    <div class="card">
      <h2>Relatório gerado</h2>
      <textarea rows="14" readonly>${escapeHtml(reportText)}</textarea>
      <div class="row" style="margin-top:8px;">
        <button class="ghost" onclick="downloadReportFile('${escapeHtml(protocolName)}', document.querySelector('#patientFormContainer textarea').value)">⬇️ Descarregar ficheiro</button>
      </div>
      <p class="muted" style="margin-top:8px;">Guardado na ficha do paciente. Copie o texto ou descarregue o ficheiro para enviar por email/WhatsApp.</p>
    </div>`;
  toast('Relatório gerado e guardado.');
}

// ── Descarregar relatório/prescrição como ficheiro de texto ────────────
// Funciona 100% no browser, sem servidor — o subscritor pode depois
// guardar esse ficheiro onde quiser (telemóvel, Drive, pen, etc.).
window.downloadReportFile = function(title, content){
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${title.replace(/[^a-z0-9]+/gi,'_')}_${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

      <label>Telefone</label><input id="pfPhone" value="${escapeHtml(p.phone||'')}">
      <label>Email</label><input id="pfEmail" value="${escapeHtml(p.email||'')}">
      <label>Morada (se atender presencialmente)</label><input id="pfAddress" value="${escapeHtml(p.address||'')}">
    </div>

    <div class="card">
      <h2>Redes sociais</h2>
      <label>Facebook</label><input id="pfFacebook" value="${escapeHtml(social.facebook||'')}" placeholder="https://facebook.com/...">
      <label>Instagram</label><input id="pfInstagram" value="${escapeHtml(social.instagram||'')}" placeholder="https://instagram.com/...">
      <label>WhatsApp</label><input id="pfWhatsapp" value="${escapeHtml(social.whatsapp||'')}" placeholder="https://wa.me/351...">
      <label>Website</label><input id="pfWebsite" value="${escapeHtml(social.website||'')}" placeholder="https://...">
      <button class="primary" onclick="saveProfile()">Guardar perfil</button>
    </div>

    <div class="card">
      <h2>Equipa</h2>
      <p class="muted" style="margin-bottom:10px;">Membros mostrados publicamente (não são contas de login — para isso use "Convidar colaborador" nas Configurações).</p>
      ${teamHtml}
      <div style="margin-top:12px;">
        <label>Nome</label><input id="tmName" value="${escapeHtml(window.__editingTeamMember?.name||'')}">
        <label>Função/especialidade</label><input id="tmRole" placeholder="ex: Fisioterapeuta, Nutricionista" value="${escapeHtml(window.__editingTeamMember?.role||'')}">
        <label>URL da foto (opcional)</label><input id="tmPhotoUrl" value="${escapeHtml(window.__editingTeamMember?.photoUrl||'')}">
        <label>Breve bio</label><textarea id="tmBio" rows="2">${escapeHtml(window.__editingTeamMember?.bio||'')}</textarea>
        <button class="primary" onclick="saveTeamMember('${window.__editingTeamMemberId||''}')">${window.__editingTeamMemberId?'Guardar alterações':'Adicionar à equipa'}</button>
        ${window.__editingTeamMemberId ? `<button class="ghost" onclick="window.__editingTeamMemberId=null;window.__editingTeamMember=null;renderView('profile')">Cancelar edição</button>` : ''}
      </div>
    </div>

    <div class="card">
      <h2>Testemunhos / Feedback</h2>
      <p class="muted" style="margin-bottom:10px;">Escreva testemunhos que recebeu (por WhatsApp, redes sociais, etc.) — aparecem na página inicial.</p>
      ${testimonialsHtml}
      <div style="margin-top:12px;">
        <label>Nome do cliente</label><input id="tsName" value="${escapeHtml(window.__editingTestimonial?.name||'')}">
        <label>Testemunho</label><textarea id="tsText" rows="3">${escapeHtml(window.__editingTestimonial?.text||'')}</textarea>
        <label>Classificação (1-5)</label><input id="tsRating" type="number" min="1" max="5" value="${window.__editingTestimonial?.rating||5}">
        <button class="primary" onclick="saveTestimonial('${window.__editingTestimonialId||''}')">${window.__editingTestimonialId?'Guardar alterações':'Adicionar testemunho'}</button>
        ${window.__editingTestimonialId ? `<button class="ghost" onclick="window.__editingTestimonialId=null;window.__editingTestimonial=null;renderView('profile')">Cancelar edição</button>` : ''}
      </div>
    </div>
  `;
}

window.saveProfile = async function(){
  const profileData = {
    tagline: document.getElementById('pfTagline').value.trim(),
    about: document.getElementById('pfAbout').value.trim(),
    phone: document.getElementById('pfPhone').value.trim(),
    email: document.getElementById('pfEmail').value.trim(),
    address: document.getElementById('pfAddress').value.trim(),
    social: {
      facebook: document.getElementById('pfFacebook').value.trim(),
      instagram: document.getElementById('pfInstagram').value.trim(),
      whatsapp: document.getElementById('pfWhatsapp').value.trim(),
      website: document.getElementById('pfWebsite').value.trim()
    }
  };
  const businessName = document.getElementById('pfBusinessName').value.trim();
  const logoUrl = document.getElementById('pfLogoUrl').value.trim();
  const primaryColor = document.getElementById('pfColor').value;

  await updateDoc(doc(db, 'tenants', tenantId), {
    businessName,
    'branding.logoUrl': logoUrl,
    'branding.primaryColor': primaryColor,
    profile: profileData
  });

  // Espelha os campos públicos para public_tenant_profiles, usado pela
  // página inicial, funil de marcações e fichas — sem isto, nada do que
  // o subscritor edita aqui chegaria a ser visto pelos clientes.
  await setDoc(doc(db, 'public_tenant_profiles', currentTenantDoc.slug), {
    tenantId,
    businessName,
    tagline: profileData.tagline,
    about: profileData.about,
    branding: { logoUrl, primaryColor },
    phone: profileData.phone,
    email: profileData.email,
    address: profileData.address,
    social: profileData.social,
    legalTexts: currentTenantDoc?.legalTexts || {}
  }, { merge: true });

  const snap = await getDoc(doc(db, 'tenants', tenantId));
  currentTenantDoc = snap.data();
  applyBranding();
  toast('Perfil guardado e publicado.');
};

window.editTeamMember = async function(id){
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'teamMembers', id));
  if (!snap.exists()){ toast('Membro não encontrado.', true); return; }
  window.__editingTeamMemberId = id;
  window.__editingTeamMember = snap.data();
  renderView('profile');
};

window.saveTeamMember = async function(editId){
  const name = document.getElementById('tmName').value.trim();
  if (!name){ toast('Nome é obrigatório.', true); return; }
  const data = {
    name,
    role: document.getElementById('tmRole').value.trim(),
    photoUrl: document.getElementById('tmPhotoUrl').value.trim(),
    bio: document.getElementById('tmBio').value.trim()
  };
  if (editId){
    await updateDoc(doc(db, 'tenants', tenantId, 'teamMembers', editId), data);
  } else {
    data.createdAt = serverTimestamp();
    await addDoc(collection(db, 'tenants', tenantId, 'teamMembers'), data);
  }
  window.__editingTeamMemberId = null;
  window.__editingTeamMember = null;
  toast('Membro guardado.');
  renderView('profile');
};

window.deleteTeamMember = async function(id){
  if (!confirm('Remover este membro da equipa?')) return;
  await deleteDoc(doc(db, 'tenants', tenantId, 'teamMembers', id));
  renderView('profile');
};

window.editTestimonial = async function(id){
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'testimonials', id));
  if (!snap.exists()){ toast('Testemunho não encontrado.', true); return; }
  window.__editingTestimonialId = id;
  window.__editingTestimonial = snap.data();
  renderView('profile');
};

window.saveTestimonial = async function(editId){
  const name = document.getElementById('tsName').value.trim();
  const text = document.getElementById('tsText').value.trim();
  if (!name || !text){ toast('Preencha nome e testemunho.', true); return; }
  const data = { name, text, rating: parseInt(document.getElementById('tsRating').value || '5', 10) };
  if (editId){
    await updateDoc(doc(db, 'tenants', tenantId, 'testimonials', editId), data);
  } else {
    data.createdAt = serverTimestamp();
    await addDoc(collection(db, 'tenants', tenantId, 'testimonials'), data);
  }
  window.__editingTestimonialId = null;
  window.__editingTestimonial = null;
  toast('Testemunho guardado.');
  renderView('profile');
};

window.deleteTestimonial = async function(id){
  if (!confirm('Remover este testemunho?')) return;
  await deleteDoc(doc(db, 'tenants', tenantId, 'testimonials', id));
  renderView('profile');
};

// ── FORMAÇÕES / EVENTOS (com inscrição) ─────────────────────────────────
async function renderTrainings(main){
  try{
    const snap = await getDocs(collection(db, 'tenants', tenantId, 'trainings'));
    let rows = '';
    for (const d of snap.docs){
      const t = d.data();
      // O filtro por tenantId é obrigatório aqui — as regras de segurança
      // exigem-no explicitamente na própria consulta (não só nos dados),
      // senão o Firestore recusa o pedido inteiro em vez de devolver
      // resultados filtrados.
      const signupsSnap = await getDocs(query(
        collection(db, 'public_training_signups'),
        where('tenantId', '==', tenantId),
        where('trainingId', '==', d.id),
        where('status', '==', 'confirmed')
      ));
      let signupsListHtml = '';
      signupsSnap.forEach(sd => {
        const s = sd.data();
        signupsListHtml += `<div class="muted" style="padding:4px 0;">• ${escapeHtml(s.name)} — ${escapeHtml(s.contact||'')}</div>`;
      });
      const link = `${window.location.origin}${window.location.pathname.replace('saudecare-core.html','saudecare-formacao-publica.html')}?t=${currentTenantDoc.slug}&tr=${d.id}`;
      rows += `<div class="appt-item">
        <div class="row">
          <div><strong>${escapeHtml(t.title)}</strong>
            <div class="muted">${escapeHtml(t.date||'')} · ${signupsSnap.size}/${t.capacity||'∞'} inscritos</div>
          </div>
          <div>
            <button class="ghost" onclick="editTraining('${d.id}')">Editar</button>
            <button class="danger" onclick="deleteTraining('${d.id}')">Remover</button>
          </div>
        </div>
        ${signupsListHtml ? `<div style="margin-top:8px;border-top:1px solid #eef2f0;padding-top:8px;">${signupsListHtml}</div>` : '<p class="muted" style="margin-top:8px;">Ainda sem inscrições.</p>'}
        <div class="row" style="margin-top:8px;">
          <input readonly value="${link}" style="font-size:11px;margin:0;">
          <button class="ghost" onclick="navigator.clipboard.writeText('${link}').then(()=>toast('Link copiado.'))">Copiar</button>
        </div>
      </div>`;
    }
    if (!rows) rows = '<p class="muted">Ainda sem formações/eventos criados.</p>';

    main.innerHTML = `
      <div class="row"><h2>Formações / Eventos</h2></div>
      <div class="card">${rows}</div>
      <div id="trainingFormContainer"></div>
    `;
    renderTrainingForm(null, {});
  }catch(e){
    console.error('Erro ao carregar formações:', e);
    main.innerHTML = `<p class="muted" style="color:var(--danger);">Não foi possível carregar as formações. Erro: ${escapeHtml(e.message||'desconhecido')}</p>`;
  }
}

function renderTrainingForm(editId, t){
  document.getElementById('trainingFormContainer').innerHTML = `
    <div class="card">
      <h2>${editId ? 'Editar formação/evento' : 'Nova formação/evento'}</h2>
      <label>Título</label><input id="trTitle" value="${escapeHtml(t.title||'')}">
      <label>Descrição</label><textarea id="trDescription" rows="3">${escapeHtml(t.description||'')}</textarea>
      <label>Data (texto livre, ex: "14 Set, 18h")</label><input id="trDate" value="${escapeHtml(t.date||'')}">
      <label>Preço (€, deixe 0 se gratuito)</label><input id="trPrice" type="number" step="0.01" value="${t.price||0}">
      <label>Capacidade (vagas, deixe vazio se ilimitado)</label><input id="trCapacity" type="number" value="${t.capacity||''}">
      <button class="primary" onclick="saveTraining('${editId||''}')">${editId?'Guardar alterações':'Criar'}</button>
    </div>`;
}

window.editTraining = async function(id){
  const snap = await getDoc(doc(db, 'tenants', tenantId, 'trainings', id));
  if (!snap.exists()){ toast('Formação não encontrada.', true); return; }
  renderTrainingForm(id, snap.data());
};

window.saveTraining = async function(editId){
  const title = document.getElementById('trTitle').value.trim();
  if (!title){ toast('Dê um título à formação.', true); return; }
  const data = {
    title,
    description: document.getElementById('trDescription').value.trim(),
    date: document.getElementById('trDate').value.trim(),
    price: parseFloat(document.getElementById('trPrice').value || '0'),
    capacity: document.getElementById('trCapacity').value ? parseInt(document.getElementById('trCapacity').value, 10) : null
  };
  if (editId){
    await updateDoc(doc(db, 'tenants', tenantId, 'trainings', editId), data);
  } else {
    data.createdAt = serverTimestamp();
    await addDoc(collection(db, 'tenants', tenantId, 'trainings'), data);
  }
  toast('Formação guardada.');
  renderView('trainings');
};

window.deleteTraining = async function(id){
  if (!confirm('Remover esta formação? O link de inscrição deixa de funcionar.')) return;
  await deleteDoc(doc(db, 'tenants', tenantId, 'trainings', id));
  renderView('trainings');
};

    <h2>Configurações da conta</h2>
    <div class="card">
      <p class="muted">Plano atual: <strong>${escapeHtml(currentTenantDoc?.plan||'—')}</strong></p>

      <p class="muted" style="margin-top:10px;">Para alterar nome, logótipo, cores, contactos e equipa, use a aba <strong>Perfil</strong>.</p>
    </div>`;
}
