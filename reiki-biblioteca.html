<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sala de Estudo — Hikari Fafe Escola de Reiki</title>
<style>
  :root{
    --fundo:#faf6ef; --papel:#fffdf9; --linha:#e6d9c3;
    --texto:#3b2f1e; --suave:#8a7a63; --destaque:#b8893b;
    --verde:#5d7a4a; --aviso:#9a5b3d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0 0 76px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fundo); color:var(--texto); line-height:1.55;
  }
  .envolve{max-width:640px;margin:0 auto;padding:0 14px;}
  header{text-align:center;padding:20px 0 6px;}
  header h1{font-size:1.15rem;margin:0;letter-spacing:.04em;}
  header p{margin:5px 0 0;color:var(--suave);font-size:.86rem;}
  .cartao{
    background:var(--papel); border:1px solid var(--linha);
    border-radius:14px; padding:16px; margin-bottom:12px;
  }
  .selo{
    display:inline-block; padding:4px 12px;
    border:1px solid var(--destaque); border-radius:999px;
    color:var(--destaque); font-size:.82rem;
  }
  .selo.cinza{border-color:var(--linha);color:var(--suave);}
  h2{
    font-size:.88rem; text-transform:uppercase; letter-spacing:.08em;
    color:var(--suave); margin:22px 0 10px; font-weight:600;
  }
  .recurso{display:flex;gap:12px;align-items:flex-start;}
  .icone{font-size:1.5rem;line-height:1;flex-shrink:0;}
  .recurso strong{display:block;}
  .recurso p{margin:4px 0 0;color:var(--suave);font-size:.88rem;}
  a.abrir,button.abrir{
    display:inline-block;margin-top:10px;padding:9px 16px;
    background:var(--destaque);color:#fff;text-decoration:none;border:0;
    border-radius:9px;font-size:.9rem;cursor:pointer;font-family:inherit;
  }
  button.abrir:disabled{background:var(--linha);color:var(--suave);cursor:default;}
  a.botao,button.botao{
    display:inline-block;margin:4px 5px;padding:10px 18px;
    border:1px solid var(--destaque);color:var(--destaque);background:none;
    text-decoration:none;border-radius:9px;font-size:.9rem;cursor:pointer;
    font-family:inherit;
  }
  .vazio{text-align:center;color:var(--suave);padding:28px 12px;}
  .nota{
    text-align:center;color:var(--suave);font-size:.79rem;
    margin:22px 0 0;padding-top:14px;border-top:1px solid var(--linha);
  }
  nav{
    position:fixed;bottom:0;left:0;right:0;background:var(--papel);
    border-top:1px solid var(--linha);display:flex;z-index:20;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1;background:none;border:0;padding:9px 2px 8px;cursor:pointer;
    font-family:inherit;font-size:.68rem;color:var(--suave);line-height:1.25;
  }
  nav button .ic{display:block;font-size:1.22rem;margin-bottom:1px;}
  nav button.on{color:var(--destaque);font-weight:600;}
  nav button .pip{
    display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--aviso);vertical-align:top;margin-left:2px;
  }
  .barra{height:8px;background:var(--linha);border-radius:99px;overflow:hidden;margin-top:10px;}
  .barra i{display:block;height:100%;background:var(--destaque);}
  .msgs{max-height:58vh;overflow-y:auto;padding:2px;}
  .msg{margin-bottom:12px;}
  .msg .quem{font-size:.76rem;color:var(--suave);margin-bottom:2px;}
  .msg .bolha{
    display:inline-block;padding:9px 13px;border-radius:13px;
    background:#f2ebdd;max-width:88%;white-space:pre-wrap;word-break:break-word;
  }
  .msg.meu{text-align:right;}
  .msg.meu .bolha{background:var(--destaque);color:#fff;text-align:left;}
  .msg.mestre .bolha{background:#efe6d2;border:1px solid var(--destaque);}
  .escrever{display:flex;gap:8px;margin-top:12px;align-items:flex-end;}
  .msg .bolha img{max-width:100%;}
  .aula{border:2px solid var(--destaque);}
  .aula.vivo{border-color:#c0392b;background:#fff5f3;}
  .aula .ponto{display:inline-block;width:10px;height:10px;border-radius:50%;background:#c0392b;margin-right:6px;animation:pisca 1.2s infinite;}
  @keyframes pisca{50%{opacity:.25;}}
  .btfoto{margin:0 !important;background:#f3ece0 !important;color:var(--texto) !important;padding:10px 12px !important;}
  .escrever textarea{
    flex:1;resize:none;font-family:inherit;font-size:.95rem;padding:10px;
    border:1px solid var(--linha);border-radius:10px;background:var(--papel);
    color:var(--texto);
  }
  label.opcao{display:flex;gap:9px;align-items:flex-start;margin-top:9px;cursor:pointer;}
  label.opcao input{margin-top:4px;}
  .fechado{opacity:.55;}
  .etiqueta{font-size:.76rem;color:var(--verde);font-weight:600;}
  .etiqueta.mau{color:var(--aviso);}
  details.categoria{
    background:var(--papel); border:1px solid var(--linha);
    border-radius:14px; padding:4px 12px 2px; margin-bottom:12px;
  }
  details.categoria summary{
    cursor:pointer; padding:10px 0; font-weight:600; list-style:none;
  }
  details.categoria summary::-webkit-details-marker{display:none;}
  details.categoria summary::after{content:'▾';float:right;color:var(--suave);transition:transform .2s;}
  details.categoria:not([open]) summary::after{transform:rotate(-90deg);}
  details.categoria .cartao{background:var(--fundo);}
  .conta{font-weight:400;font-size:.78rem;color:var(--suave);margin-left:4px;}
  .subtitulo{font-size:.86rem;font-weight:600;color:var(--destaque);margin:12px 0 6px;}
  .sub{border-left:2px solid var(--linha);padding-left:10px;margin-bottom:8px;}
  p.desc{margin:0 0 8px;color:var(--suave);font-size:.86rem;}
  .plano .linha{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linha);}
  .plano .linha:last-child{border-bottom:0;}
  .plano .num{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.88rem;background:var(--linha);color:var(--suave);}
  .plano .feito .num{background:var(--verde);color:#fff;}
  .plano .atual{background:#fbf3e3;margin:0 -8px;padding:11px 8px;border-radius:10px;border-bottom:0;}
  .plano .atual .num{background:var(--destaque);color:#fff;}
  .plano .bloq{opacity:.6;}
  .plano .corpo{flex:1;min-width:0;}
  .plano .t{font-weight:600;line-height:1.35;}
  .plano .s{font-size:.82rem;color:var(--suave);margin-top:2px;}
  .plano .tag{font-size:.72rem;font-weight:700;color:var(--destaque);letter-spacing:.04em;text-transform:uppercase;}
  .plano .abrir{margin-top:8px;}
  .plano h3{margin:0 0 4px;font-size:.92rem;}
</style>
</head>

<nav id="barra" style="display:none;"></nav>

<script type="module">

         query, orderBy, onSnapshot, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKWdXYEG6PO9KEMQMklyPGngtXuZlP7Cg",
  authDomain: "saudecare-app.firebaseapp.com",
  projectId: "saudecare-app",
  storageBucket: "saudecare-app.firebasestorage.app",

};
const db = getFirestore(initializeApp(firebaseConfig));
const alvo = document.getElementById('conteudo');
const barra = document.getElementById('barra');

const NIVEIS  = ['1','2','3A','3B'];
const ROTULOS = {
  '0':'Para todos os alunos',
  '1':'Nível 1 — Shoden',
  '2':'Nível 2 — Okuden',
  '3A':'Nível 3A — Shinpiden',
  '3B':'Nível 3B — Shinpiden'
};
const ICONES = { manual:'📘', video:'🎬', audio:'🎧', documento:'📄', link:'🔗' };

/* Mapa da Alma e Cartomancia, para os alunos praticarem. Abrem as páginas
   da escola, no mesmo estilo do cartão dos Poemas do Imperador Meiji. */
function cartaoFerramenta(href, icone, titulo, texto){
  return '<a href="' + href + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:block;">'
    + '<div class="cartao" style="display:flex;gap:16px;align-items:center;cursor:pointer;padding:16px;">'
    + '<div style="width:96px;height:96px;border-radius:50%;flex:none;border:3px solid #b8893b;background:#f2ebdd;display:flex;align-items:center;justify-content:center;font-size:2.8rem;">' + icone + '</div>'
    + '<div style="flex:1;"><strong style="font-size:1.1rem;">' + titulo + '</strong>'
    + '<p class="desc" style="margin:4px 0 0;">' + texto + '</p></div><span style="font-size:1.5rem;">›</span></div></a>';
}
function cartoesFerramentas(){
  return cartaoFerramenta('mesinhas.html?t=' + encodeURIComponent(C.tenant) + '&c=' + encodeURIComponent(C.codigo), '🌿', 'Ervas e Mesinhas Antigas', 'Receitas e mesinhas antigas. Escreve o que procuras e aparece. Só para alunos.')
    + cartaoFerramenta('mapa-da-alma.html', '🔮', 'Mapa da Alma', 'Toca para abrir e descobrir o teu mapa. Para todos os níveis.')
    + cartaoFerramenta('cartomancia.html', '🃏', 'Cartomancia', 'Toca para abrir e tirar as cartas. Para todos os níveis.');
}

/* Cartão dos Poemas do Imperador Meiji (Início e Estudo). */
function cartaoMeiji(){
  return '<a href="poemas-meiji.html" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:block;">'
    + '<div class="cartao" style="display:flex;gap:16px;align-items:center;cursor:pointer;padding:16px;">'
    + '<img src="reiki-img/meiji-rosto.jpg" alt="Imperador Meiji" style="width:96px;height:96px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #b8893b;background:#000;">'
    + '<div style="flex:1;"><strong style="font-size:1.1rem;">Os 125 Poemas do Imperador Meiji</strong>'
    + '<p class="desc" style="margin:4px 0 0;">Toca para abrir e ler. Para todos os níveis.</p></div><span style="font-size:1.5rem;">›</span></div></a>';
}

/* Partilha com amigos e família: cada pessoa faz a sua primeira leitura grátis
   nas páginas públicas (onde deixa o contacto e aceita o tratamento de dados).
   O link é montado só com o nome da página, sem o código de acesso do aluno. */
const PARTILHAS = {
  mapa:  { ficheiro:'mapa-da-alma.html', titulo:'Mapa da Alma',
           texto:'Fiz o meu Mapa da Alma na Escola de Reiki do Mestre Hikari Fafe e gostei. Podes descobrir o teu, a primeira leitura é grátis:' },
  carta: { ficheiro:'cartomancia.html', titulo:'Cartomancia',
           texto:'Experimenta uma leitura de cartas da Escola de Reiki do Mestre Hikari Fafe, a primeira leitura é grátis:' },
  ervas: { ficheiro:'mesinhas.html?t=hikari-terapias', titulo:'Ervas e Mesinhas Antigas',
           texto:'Ervas e mesinhas antigas, com receitas de casa, da Escola de Reiki do Mestre Hikari Fafe. Escreve o que procuras e aparece:' },
  meiji: { ficheiro:'poemas-meiji.html', titulo:'Os 125 Poemas do Imperador Meiji',
           texto:'Os 125 Poemas do Imperador Meiji, que estudamos na Escola de Reiki do Mestre Hikari Fafe. Podes ler aqui:' }
};
window.__partilhar = async function(k){
  const p = PARTILHAS[k];
  if (!p) return;
  const url = new URL(p.ficheiro, location.href).href;
  try {
    if (navigator.share){ await navigator.share({ title: p.titulo, text: p.texto, url: url }); return; }
  } catch(e){
    if (e && e.name === 'AbortError') return;
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(p.texto + ' ' + url), '_blank');
};
function cartaoPartilha(){
  return '<div class="cartao" style="text-align:center;">'
    + '<strong>💛 Partilha com os teus amigos</strong>'
    + '<p style="margin:6px 0 10px;color:var(--suave);font-size:.9rem;">Envia estes links a amigos e família. '
    + 'Cada um pode fazer a sua primeira leitura grátis e ler os poemas.</p>'
    + '<button class="abrir" style="margin:4px;" onclick="__partilhar(\'mapa\')">📲 Partilhar Mapa da Alma</button><br>'
    + '<button class="abrir" style="margin:4px;" onclick="__partilhar(\'carta\')">📲 Partilhar Cartomancia</button><br>'
    + '<button class="abrir" style="margin:4px;" onclick="__partilhar(\'meiji\')">📲 Partilhar Poemas do Meiji</button><br>'
    + '<button class="abrir" style="margin:4px;" onclick="__partilhar(\'ervas\')">📲 Partilhar Ervas e Mesinhas</button>'
    + '</div>';
}

/* Aviso nosso: o aviso() é bloqueado no browser do WhatsApp. */
function aviso(texto){
  const f = document.createElement('div');
  f.style.cssText = 'position:fixed;inset:0;background:rgba(40,30,15,.45);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px;';
  f.innerHTML = '<div class="cartao" style="max-width:360px;text-align:center;margin:0;">'
    + '<p style="margin:0 0 14px;">' + esc(texto) + '</p>'
    + '<button class="abrir" style="margin:0;">OK</button></div>';
  f.querySelector('button').onclick = () => f.remove();
  document.body.appendChild(f);
}
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

/* O nível em estudo é o seguinte ao último concluído.
   Aluno novo, sem nenhum concluído, está a estudar o Nível 1. */
function nivelEmEstudo(nivelConcluido){
  if (!nivelConcluido) return '1';
  const i = NIVEIS.indexOf(String(nivelConcluido));
  return i < 0 ? '1' : (NIVEIS[i+1] || null);
}
/* Materiais são cumulativos: vê tudo até ao nível que estuda. */
function materialVisivel(recurso, emEstudo, concluido){
  const alvoN = String(recurso.nivel || '0');
  if (alvoN === '0') return true;
  const topo = emEstudo || concluido;
  if (!topo) return false;
  return NIVEIS.indexOf(alvoN) <= NIVEIS.indexOf(String(topo));
}

let C = {};
let aba = 'inicio';
let porLer = 0;
let desligar = [];

function limparEscutas(){ desligar.forEach(f => { try{ f(); }catch(e){} }); desligar = []; }

async function arrancar(){
  const p = new URLSearchParams(location.search);
  const tenant = p.get('t');
  const codigo = (p.get('c') || '').trim().toUpperCase();

  if (!tenant || !codigo){
    alvo.innerHTML = '<div class="cartao vazio"><strong>Link incompleto</strong>'
      + '<p>Falta o código de acesso. Usa o link que o teu Mestre te enviou.</p></div>';
    return;
  }

  let aluno;
  try {
    const s = await getDoc(doc(db, 'tenants', tenant, 'reikiAccess', codigo));
    if (!s.exists()) throw new Error('sem cartao');
    aluno = s.data();
  } catch(e){
    alvo.innerHTML = '<div class="cartao vazio"><strong>Não encontrei este código</strong>'
      + '<p>Confirma o link. Se continuar assim, fala com o teu Mestre.</p></div>';
    return;
  }

  const concluido = aluno.nivel || null;
  const emEstudo  = nivelEmEstudo(concluido);

  C = { tenant, codigo, aluno, concluido, emEstudo,
        recursos: [], testes: [], resultados: [] };

  document.getElementById('subtitulo').textContent =
    (aluno.nome ? aluno.nome.split(' ')[0] : 'Sala de estudo')
    + (aluno.turmaNome ? ' · ' + aluno.turmaNome : '');

  await carregarDados();
  iniciarAula();
  desenharBarra();
  mostrar('inicio');
}


// Manuais da escola, guardados no site. Se a linha "Manual do Nível X" ainda não
// tem link do Drive, usa o PDF que está em /manuais (o link do Drive, se existir, ganha).
function manualPadrao(r){
  try {
    if (r && r.tipo === 'manual'){
      const m = /n[íi]vel\s*(1|2|3a|3b)\b/i.exec(r.titulo || '');
      const f = { '1':'Manual-Reiki-Nivel-1-Shoden-Hikari-Fafe.pdf', '2':'Manual-Reiki-Nivel-2-Okuden-Hikari-Fafe.pdf',
                  '3a':'Manual-Reiki-Nivel-3A-Shinpiden-Hikari-Fafe.pdf', '3b':'Manual-Reiki-Nivel-3B-Mestrado-Hikari-Fafe.pdf' }[m && m[1].toLowerCase()];
      if (f){ r.url = 'https://vindora.pt/manuais/' + f + '?v=20261003j'; if (!r.nivel) r.nivel = m[1].toUpperCase(); }
    }
  } catch(e){}
  return r;
}
/* Garante que os 4 manuais da escola estão sempre disponíveis, cada um no seu nível. */
function garantirManuais(lista){
  const nomes = { '1':'Nível 1 — Shoden', '2':'Nível 2 — Okuden', '3A':'Nível 3A — Shinpiden', '3B':'Nível 3B — Mestrado' };
  Object.keys(nomes).forEach(n => {
    const ja = lista.some(r => r && r.tipo === 'manual' && new RegExp('n[íi]vel\\s*' + n + '\\b', 'i').test(r.titulo || ''));
    if (!ja) lista.push(manualPadrao({ id:'manual-padrao-' + n, tipo:'manual', nivel:n, categoria:'Manuais',
      titulo:'Manual do ' + nomes[n], descricao:'Manual completo do nível. Podes ler aqui ou descarregar o PDF.' }));
  });
  return lista;
}
async function carregarDados(){
  const { tenant, codigo, emEstudo, concluido } = C;

  try {
    const s = await getDocs(collection(db, 'tenants', tenant, 'reikiLibrary'));
    const r = []; s.forEach(d => r.push(manualPadrao({ id: d.id, ...d.data() })));
    garantirManuais(r);
    r.sort((a,b) => String(a.nivel||'0').localeCompare(String(b.nivel||'0')));
    C.recursos = r.filter(x => materialVisivel(x, emEstudo, concluido));
  } catch(e){ C.recursos = []; }

  /* Categorias: se não se deixarem ler, a sala mostra os materiais
     numa lista simples, como antes. */
  try {
    const s = await getDocs(collection(db, 'tenants', tenant, 'reikiCategories'));
    const c = []; s.forEach(d => c.push({ id: d.id, ...d.data() }));
    C.categorias = c;
  } catch(e){ C.categorias = []; }

  /* Testes: só os do nível em estudo, e os abertos a todos.
     Nada de testes de níveis que o aluno ainda não frequenta. */
  try {
    const s = await getDocs(collection(db, 'tenants', tenant, 'reikiQuizzes'));
    const t = []; s.forEach(d => t.push({ id: d.id, ...d.data() }));
    C.testes = t.filter(x => {
      const n = String(x.nivel || '0');
      return n === '0' || (emEstudo && n === String(emEstudo));
    });
  } catch(e){ C.testes = []; }

  /* As notas ficam no próprio cartão do aluno: ele vê as suas e não
     consegue ler as dos colegas. */
  /* Os resultados ficam guardados na conversa privada do aluno — é o
     único sítio onde a sala de estudo tem licença para escrever. */
  C.resultados = (C.aluno.resultados || []).slice();
  try {
    const s = await getDoc(doc(db, 'tenants', tenant, 'reikiThreads', codigo));
    if (s.exists()){
      const d = s.data();
      if (Array.isArray(d.resultados) && d.resultados.length) C.resultados = d.resultados;
      porLer = (d.ultimaDe === 'mestre' && d.lidoAluno === false) ? 1 : 0;
      C.percurso = d.percurso || {};
      C.vistos = d.vistos || {};
    }
  } catch(e){}

  /* Módulos do percurso do nível em estudo: quantos há e quantos feitos.
     O teste final desse nível só abre com todos feitos. */
  C.modTotal = 0; C.modFeitos = 0; C.pratica = null;
  if (emEstudo){
    try {
      window.firebaseConfig = firebaseConfig;
      await import(emEstudo === '1' ? './reiki-percurso-nivel1.js' : './reiki-percurso-niveis-2-3.js');
      // Originais com as edições do Mestre por cima (iguais às do percurso):
      // lições novas contam, as escondidas deixam de contar.
      const mapa = {};
      (window['MODULOS_NIVEL_' + emEstudo] || []).forEach(m => { mapa[emEstudo + '-' + m.ordem] = Object.assign({}, m, { id: emEstudo + '-' + m.ordem, publicado: true }); });
      let docPratica = null;
      try {
        const msnap = await getDocs(collection(db, 'tenants', tenant, 'reikiModules'));
        msnap.forEach(d => {
          const x = d.data() || {};
          if (String(x.nivel) !== String(emEstudo)) return;
          if (x.tipo === 'pratica'){ docPratica = x; return; }
          mapa[d.id] = Object.assign({}, x, { id: d.id });
        });
      } catch(e){ console.warn('lições editadas indisponíveis', e); }
      const prat = mesclarPratica(emEstudo, docPratica);
      C.pratica = prat.publicado === false ? null : prat;
      const lista = Object.values(mapa).filter(m => m.publicado !== false).sort((x, y) => (x.ordem || 0) - (y.ordem || 0));
      const p = C.percurso || {};
      C.modulos = lista;
      C.modTotal = lista.length;
      C.modFeitos = lista.filter(m => (p[emEstudo + '-' + m.ordem] || {}).concluido).length;
      C.proximoModulo = lista.slice().sort((x, y) => (x.ordem || 0) - (y.ordem || 0))
        .find(m => !(p[emEstudo + '-' + m.ordem] || {}).concluido) || null;
    } catch(e){ console.warn('percurso indisponível', e); }
  }
}

/* ─── Plano da formação ──────────────────────────────────────────────
   O caminho todo do nível em estudo, por ordem: módulos e testes,
   materiais de apoio, teste final e certificado. Mostra o que já está
   feito, o que é a seguir e o que ainda está fechado. */
function calcularPlano(){
  const { emEstudo, testes, resultados } = C;
  const perc = C.percurso || {};
  const mods = (C.modulos || []).slice().sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
  const modId = m => emEstudo + '-' + m.ordem;
  const modFeito = m => !!(perc[modId(m)] || {}).concluido;
  const passou = t => resultados.some(r => r.testeId === t.id && r.aprovado);
  const doNivel = t => String(t.nivel || '0') === String(emEstudo);
  const testeDoModulo = m => testes.find(t => doNivel(t) && (parseInt(t.modulo) || 0) === Number(m.ordem));
  const testeFinal = testes.find(t => doNivel(t) && (parseInt(t.modulo) || 0) === 0) || null;

  const etapas = [];
  let anteriorFeito = true;
  const PR = C.pratica;
  const pp = PR ? (perc[PR.id] || {}) : {};
  const pratFeita = !!(PR && pp.concluido);
  const pratIniciada = !!(PR && (pp.iniciada || pp.concluido));
  const diasFeitos = PR ? Object.keys(pp.dias || {}).length : 0;
  let pratPosta = false;
  const poePratica = () => {
    if (!PR || pratPosta) return;
    pratPosta = true;
    etapas.push({ k: 'pratica', id: PR.id, titulo: '🌿 ' + PR.titulo,
      sub: pratFeita ? 'Concluída · ' + PR.dias + ' dias'
        : pratIniciada ? 'Dia ' + diasFeitos + ' de ' + PR.dias + ' · continua quando puderes'
        : PR.dias + ' dias de autotratamento' + ((PR.audios || []).some(a => a.url) ? ' com meditações guiadas' : ' · desafio obrigatório'),
      feito: pratFeita, bloq: !anteriorFeito });
    anteriorFeito = pratIniciada;
  };
  if (PR && Number(PR.depoisDe) === 0) poePratica();
  mods.forEach(m => {
    const feito = modFeito(m);
    const pm = perc[modId(m)] || {};
    etapas.push({ k: 'modulo', id: modId(m), titulo: 'Módulo ' + m.ordem + ' — ' + (m.titulo || ''),
      sub: feito ? (pm.totalPerguntas ? 'Concluído · ' + pm.acertos + ' de ' + pm.totalPerguntas + ' certas' : 'Concluído')
        : [m.video ? '▶️ vídeo' : '', '📖 ler', '🤲 praticar', '✍️ responder'].filter(Boolean).join(' · ') + (m.duracao ? ' · ⏱️ ' + m.duracao : ''),
      feito, bloq: !anteriorFeito });
    anteriorFeito = feito;
    const t = testeDoModulo(m);
    if (t){
      const ok = passou(t);
      const r = resultados.filter(x => x.testeId === t.id).sort((a, b) => String(b.quando || '').localeCompare(String(a.quando || '')))[0];
      etapas.push({ k: 'teste', id: t.id, titulo: 'Teste do módulo ' + m.ordem,
        sub: ok ? 'Aprovado com ' + r.percentagem + '%' : ((t.perguntas || []).length + ' perguntas · mínimo ' + (t.notaMinima || 70) + '%' + (r ? ' · última tentativa ' + r.percentagem + '%' : '')),
        feito: ok, bloq: !feito });
    }
    if (PR && Number(PR.depoisDe) === Number(m.ordem)) poePratica();
  });
  poePratica(); // se o módulo indicado não existe, fica no fim

  const obrig = materiaisObrigatorios();
  const porVer = materiaisPorVer();
  const matFeito = obrig.length === 0 || porVer.length === 0;
  const modulosPorFazer = mods.filter(m => !modFeito(m)).length;
  const testesModuloPorFazer = testes.filter(t => doNivel(t) && (parseInt(t.modulo) || 0) > 0 && !passou(t)).length;
  const finalPassou = !!(testeFinal && passou(testeFinal));
  const faltaPratica = !!(PR && PR.obrigatoria && !pratFeita);
  const finalBloq = !!testeFinal && !finalPassou && (modulosPorFazer > 0 || porVer.length > 0 || testesModuloPorFazer > 0 || faltaPratica);

  const emCurso = e => e.k === 'pratica' && !e.feito && pratIniciada;
  let atual = etapas.find(e => !e.feito && !e.bloq && !emCurso(e)) || etapas.find(e => !e.feito && !e.bloq) || null;
  let atualMat = false, atualFinal = false;
  if (!atual && obrig.length && !matFeito) atualMat = true;
  else if (!atual && testeFinal && !finalPassou && !finalBloq) atualFinal = true;

  const total = etapas.length + (obrig.length ? 1 : 0) + (testeFinal ? 1 : 0);
  const feitos = etapas.filter(e => e.feito).length + ((obrig.length && matFeito) ? 1 : 0) + (finalPassou ? 1 : 0);
  return { etapas, atual, atualMat, atualFinal, obrig, porVer, matFeito, testeFinal, finalPassou, finalBloq,
           modulosPorFazer, testesModuloPorFazer, faltaPratica, total, feitos, mods };
}

function verPlano(){
  const { emEstudo } = C;
  if (!emEstudo){
    alvo.innerHTML = '<div class="cartao vazio"><strong>Percurso completo</strong><p>Já concluíste todos os níveis.</p></div>';
    return;
  }
  const P = calcularPlano();
  if (!P.total){
    alvo.innerHTML = '<button class="botao" data-ir="inicio" style="margin:0 0 10px;">← Início</button>'
      + '<div class="cartao vazio"><strong>O teu plano está a ser preparado</strong><p>Assim que o teu Mestre publicar os módulos e os testes deste nível, o caminho aparece aqui.</p></div>';
    alvo.querySelector('[data-ir]').onclick = () => mostrar('inicio');
    return;
  }
  const pct = Math.round(P.feitos / P.total * 100);
  const iniciar = P.feitos === 0;

  const linha = (estado, num, titulo, sub, botao) =>
    '<div class="linha ' + estado + '"><div class="num">' + num + '</div><div class="corpo">'
    + (estado === 'atual' ? '<div class="tag">▶ A seguir</div>' : '')
    + '<div class="t">' + esc(titulo) + '</div>'
    + (sub ? '<div class="s">' + sub + '</div>' : '')
    + (botao || '') + '</div></div>';
  const btn = (ir, rotulo) => '<button class="abrir" data-ir="' + esc(ir) + '">' + rotulo + '</button>';

  const idAtual = P.atual ? P.atual.k + ':' + P.atual.id : '';
  let n = 0;
  const linhasA = P.etapas.map(e => {
    n++;
    const ehAtual = (e.k + ':' + e.id) === idAtual;
    const estado = e.feito ? 'feito' : (ehAtual ? 'atual' : (e.bloq ? 'bloq' : ''));
    const num = e.feito ? '✓' : (e.bloq ? '🔒' : n);
    let botao = '';
    if (!e.feito && !e.bloq){
      botao = e.k === 'modulo' ? btn('modulo:' + e.id, ehAtual ? '▶ Abrir módulo' : 'Abrir módulo')
            : e.k === 'pratica' ? btn('modulo:' + e.id, ehAtual ? '▶ Continuar a prática' : 'Abrir a prática')
            : btn('teste:' + e.id, ehAtual ? '▶ Fazer o teste' : 'Fazer o teste');
    } else if (e.bloq){
      e.sub = (e.k === 'teste' ? 'Abre quando concluíres o módulo.' : 'Abre quando concluíres o módulo anterior.');
      if (e.k === 'pratica') e.sub = 'Abre quando concluíres o módulo anterior.';
    }
    return linha(estado, num, e.titulo, esc(e.sub || ''), botao);
  }).join('');

  let blocoMat = '';
  if (P.obrig.length){
    const v = C.vistos || {};
    n++;
    blocoMat = linha(P.matFeito ? 'feito' : (P.atualMat ? 'atual' : ''), P.matFeito ? '✓' : n,
      'Materiais de apoio — ver até ao fim',
      (P.obrig.length - P.porVer.length) + ' de ' + P.obrig.length + ' vistos. Podes ir vendo ao mesmo tempo que fazes os módulos.'
        + '<div style="margin-top:6px;">' + P.obrig.map(r => (v[r.id] ? '✅ ' : '◻️ ') + esc(r.titulo || '')).join('<br>') + '</div>',
      P.matFeito ? '' : btn('materiais', 'Ir para os materiais'));
  }

  let blocoFinal = '';
  if (P.testeFinal){
    n++;
    const faltas = [];
    if (P.modulosPorFazer) faltas.push('concluir ' + P.modulosPorFazer + ' módulo(s)');
    if (P.testesModuloPorFazer) faltas.push('passar ' + P.testesModuloPorFazer + ' teste(s) de módulo');
    if (P.faltaPratica) faltas.push('concluir os dias da prática');
    if (P.porVer.length) faltas.push('ver ' + P.porVer.length + ' material(ais) até ao fim');
    blocoFinal = linha(P.finalPassou ? 'feito' : (P.atualFinal ? 'atual' : (P.finalBloq ? 'bloq' : '')),
      P.finalPassou ? '✓' : (P.finalBloq ? '🔒' : n),
      'Teste final do nível',
      P.finalPassou ? 'Aprovado.' : (P.finalBloq ? 'Abre depois de: ' + faltas.join(', ') + '.' : 'Já podes fazê-lo. Mínimo ' + (P.testeFinal.notaMinima || 70) + '%.'),
      (!P.finalPassou && !P.finalBloq) ? btn('teste:' + P.testeFinal.id, '▶ Fazer o teste final') : '');
  }
  n++;
  const blocoCert = linha('', '🎓', 'Certificado e passagem de nível',
    'Depois do teste final, o teu Mestre regista a conclusão e dá-te o certificado.', '');

  // botão principal
  let cta = '';
  if (P.atual){
    cta = '<button class="abrir" data-ir="' + (P.atual.k === 'teste' ? 'teste:' : 'modulo:') + esc(P.atual.id) + '">'
      + (iniciar ? '▶ Iniciar formação' : '▶ Continuar: ' + esc(P.atual.titulo)) + '</button>';
  } else if (P.atualMat){
    cta = '<button class="abrir" data-ir="materiais">▶ Continuar: materiais de apoio</button>';
  } else if (P.atualFinal){
    cta = '<button class="abrir" data-ir="teste:' + esc(P.testeFinal.id) + '">▶ Fazer o teste final</button>';
  } else if (P.feitos === P.total){
    cta = '<p style="margin:10px 0 0;"><b>🎉 Concluíste tudo!</b> Fala com o teu Mestre para o certificado.</p>';
  }

  alvo.innerHTML = '<div class="plano">'
    + '<button class="botao" data-ir="inicio" style="margin:0 0 10px;">← Início</button>'
    + '<div class="cartao" style="text-align:center;">'
    + '<strong style="font-size:1.05rem;">🎓 ' + esc(ROTULOS[emEstudo]) + '</strong>'
    + '<div class="barra"><i style="width:' + pct + '%"></i></div>'
    + '<p style="margin:8px 0 0;color:var(--suave);font-size:.88rem;">' + P.feitos + ' de ' + P.total + ' etapas feitas (' + pct + '%)</p>'
    + cta + '</div>'
    + '<div class="cartao"><h3>1 · Módulos e testes</h3>'
    + '<p class="desc">Faz por ordem: cada módulo tem vídeo ou áudio, uma introdução e depois o teste, o desafio ou a prática.</p>'
    + (linhasA || '<p class="desc">Ainda sem módulos publicados.</p>') + '</div>'
    + (blocoMat ? '<div class="cartao"><h3>2 · Materiais de apoio</h3>' + blocoMat + '</div>' : '')
    + (blocoFinal ? '<div class="cartao"><h3>' + (blocoMat ? '3' : '2') + ' · Teste final</h3>' + blocoFinal + '</div>' : '')
    + '<div class="cartao"><h3>Meta</h3>' + blocoCert + '</div>'
    + '</div>';

  alvo.querySelectorAll('[data-ir]').forEach(b => b.onclick = () => {
    const ir = b.dataset.ir;
    if (ir === 'inicio') mostrar('inicio');
    else if (ir === 'materiais') mostrar('biblioteca');
    else if (ir.indexOf('modulo:') === 0){
      location.href = 'reiki-percurso.html?t=' + encodeURIComponent(C.tenant) + '&c=' + encodeURIComponent(C.codigo) + '&m=' + encodeURIComponent(ir.slice(7));
    }
    else if (ir.indexOf('teste:') === 0) abrirTeste(ir.slice(6));
  });
}

/* Ordem definida pelo Mestre no painel; sem número, vai para o fim
   por ordem alfabética. */
function ordenar(lista, campo){
  return lista.slice().sort((a,b) => {
    const oa = typeof a.ordem === 'number' ? a.ordem : 1e9;
    const ob = typeof b.ordem === 'number' ? b.ordem : 1e9;
    if (oa !== ob) return oa - ob;
    return String(a[campo]||'').localeCompare(String(b[campo]||''), 'pt');
  });
}

/* Materiais de apoio que contam para o teste final: os do nível em
   estudo, sem os extras pagos. */
function materiaisObrigatorios(){
  return (C.recursos || []).filter(r => String(r.nivel || '0') === String(C.emEstudo) && !r.pago);
}
function materiaisPorVer(){
  const v = C.vistos || {};
  return materiaisObrigatorios().filter(r => !v[r.id]);
}

function htmlMaterial(r){
  const conta = String(r.nivel || '0') === String(C.emEstudo) && !r.pago;
  const visto = (C.vistos || {})[r.id];
  const marca = !conta ? ''
    : (visto ? '<p class="etiqueta">✓ Visto até ao fim</p>'
             : '<button class="botao" data-visto="' + esc(r.id) + '" style="margin-top:8px;">✓ Já vi até ao fim</button>');
  return '<div class="cartao"><div class="recurso">'
    + '<div class="icone">' + (ICONES[r.tipo] || '📄') + '</div><div>'
    + '<strong>' + esc(r.titulo || 'Material') + '</strong>'
    + (r.pago ? ' <span class="etiqueta mau">extra</span>' : '')
    + (r.descricao ? '<p>' + esc(r.descricao) + '</p>' : '')
    + (r.url ? '<a class="abrir" href="' + esc(r.url) + '" target="_blank" rel="noopener">Abrir</a>' : '')
    + (r.url && r.url.indexOf('/manuais/') > -1 ? ' <a class="abrir" href="' + esc(r.url) + '" download>⬇ Descarregar PDF</a>' : '')
    + marca
    + '</div></div></div>';
}

function verBiblioteca(){
  const { recursos, emEstudo } = C;
  const CARTAO_MEIJI = cartaoMeiji();

  const categorias = C.categorias || [];
  if (!recursos.length){
    alvo.innerHTML = '<div class="cartao vazio"><strong>Ainda sem materiais</strong>'
      + '<p>O teu Mestre ainda não publicou materiais para o teu nível.</p></div>' + CARTAO_MEIJI + cartoesFerramentas();
    return;
  }
  const catExiste = id => id && categorias.some(c => c.id === id);
  const noSitio = (nivel, catId) => ordenar(recursos.filter(r => {
    const rc = catExiste(r.categoriaId) ? r.categoriaId : '';
    return catId ? rc === catId : (rc === '' && String(r.nivel||'0') === nivel);
  }), 'titulo');

  /* O nível que o aluno está a estudar aparece primeiro e aberto;
     os anteriores ficam abaixo, para rever. O geral vem no fim. */
  const presentes = [...new Set(recursos.map(r => String(r.nivel || '0')))];
  const ordemNiveis = [];
  if (emEstudo && presentes.includes(emEstudo)) ordemNiveis.push(emEstudo);
  NIVEIS.slice().reverse().forEach(n => { if (n !== emEstudo && presentes.includes(n)) ordemNiveis.push(n); });
  if (presentes.includes('0')) ordemNiveis.push('0');

  let h = CARTAO_MEIJI + cartoesFerramentas();
  for (const nivel of ordemNiveis){
    const aberto = nivel === emEstudo || ordemNiveis.length === 1;
    h += '<details class="categoria pasta"' + (aberto ? ' open' : '') + '><summary>📁 ' + esc(ROTULOS[nivel] || nivel) + (nivel === emEstudo ? ' · a estudar' : '') + '</summary>';
    const cats = ordenar(categorias.filter(c => !c.paiId && String(c.nivel||'0') === nivel), 'nome');
    for (const c of cats){
      const subs = ordenar(categorias.filter(s => s.paiId === c.id), 'nome');
      const mats = noSitio(nivel, c.id);
      const blocosSub = subs.map(s => {
        const ms = noSitio(nivel, s.id);
        if (!ms.length) return '';
        return '<div class="sub"><div class="subtitulo">' + esc(s.nome || '') + '</div>'
          + (s.descricao ? '<p class="desc">' + esc(s.descricao) + '</p>' : '')
          + ms.map(htmlMaterial).join('') + '</div>';
      }).join('');
      const total = mats.length + subs.reduce((t, s) => t + noSitio(nivel, s.id).length, 0);
      if (!total) continue;
      h += '<details class="categoria"' + (aberto ? ' open' : '') + '>'
        + '<summary>📂 ' + esc(c.nome || '') + ' <span class="conta">' + total + '</span></summary>'
        + (c.descricao ? '<p class="desc">' + esc(c.descricao) + '</p>' : '')
        + mats.map(htmlMaterial).join('') + blocosSub + '</details>';
    }
    const soltos = noSitio(nivel, '');
    if (soltos.length){
      if (cats.length) h += '<div class="subtitulo" style="margin:14px 0 6px;">Outros materiais</div>';
      h += soltos.slice().sort((a, b) => (b.tipo === 'manual') - (a.tipo === 'manual')).map(htmlMaterial).join('');
    }
    h += '</details>';
  }
  alvo.innerHTML = h;
  alvo.querySelectorAll('button[data-visto]').forEach(b => b.onclick = async () => {
    const id = b.dataset.visto;
    C.vistos = C.vistos || {};
    C.vistos[id] = true;
    b.disabled = true;
    try {
      await setDoc(doc(db, 'tenants', C.tenant, 'reikiThreads', C.codigo),
        { codigo: C.codigo, alunoNome: C.aluno.nome || '', vistos: { [id]: true } }, { merge: true });
    } catch(e){ delete C.vistos[id]; aviso('Não consegui guardar. Tenta outra vez.'); }
    verBiblioteca();
  });
}

function verTestes(){
  const { testes, resultados, emEstudo } = C;
  if (!emEstudo){
    alvo.innerHTML = '<div class="cartao vazio"><strong>Percurso completo</strong>'
      + '<p>Já concluíste todos os níveis. Não há testes por fazer.</p></div>';
    return;
  }
  if (!testes.length){
    alvo.innerHTML = '<div class="cartao vazio"><strong>Ainda sem testes</strong>'
      + '<p>Quando o teu Mestre publicar um teste do teu nível, aparece aqui.</p></div>';
    return;
  }
  let h = '<div class="cartao"><p style="margin:0;color:var(--suave);font-size:.88rem;">'
    + 'Só aparecem aqui os testes de <b>' + esc(ROTULOS[emEstudo]) + '</b>, o nível que '
    + 'estás a estudar. Os dos níveis seguintes abrem quando lá chegares.</p></div>';

  const percNotas = Object.values(C.percurso || {}).filter(x => x && x.concluido && x.totalPerguntas);
  if (percNotas.length){
    h += '<div class="cartao"><strong>As minhas notas dos módulos</strong>'
      + percNotas.sort((x, y) => String(x.moduloId).localeCompare(String(y.moduloId), 'pt', { numeric: true }))
        .map(m => '<p style="margin:4px 0 0;">' + esc(m.moduloTitulo || m.moduloId) + ': <b>' + m.acertos + '/' + m.totalPerguntas + '</b></p>').join('')
      + '</div>';
  }
  for (const t of testes){
    const r = resultados.filter(x => x.testeId === t.id)
                        .sort((a,b) => String(b.quando||'').localeCompare(String(a.quando||'')))[0];
    const passou = r && r.aprovado;
    // O teste do nível em estudo espera pelos módulos do percurso.
    // O teste do nível em estudo espera pelos módulos do percurso e
    // por todos os materiais de apoio vistos até ao fim.
    const doNivel = String(t.nivel || '0') === String(emEstudo);
    const modN = parseInt(t.modulo) || 0;
    const modFeito = !!((C.percurso || {})[emEstudo + '-' + modN] || {}).concluido;
    if (!passou && doNivel && modN > 0 && !modFeito){
      h += '<div class="cartao"><div class="recurso"><div class="icone">🔒</div><div style="flex:1;">'
        + '<strong>' + esc(t.titulo || 'Teste') + '</strong>'
        + '<p>Abre quando concluíres o módulo ' + modN + '.</p>'
        + '<a class="abrir" href="reiki-percurso.html?t=' + encodeURIComponent(C.tenant)
        + '&c=' + encodeURIComponent(C.codigo) + '">Ir para os módulos</a></div></div></div>';
      continue;
    }
    const finalDoNivel = doNivel && modN === 0;
    const faltaModulos = finalDoNivel && C.modTotal && C.modFeitos < C.modTotal;
    const porVer = finalDoNivel ? materiaisPorVer() : [];
    const faltaPrat = !!(finalDoNivel && C.pratica && C.pratica.obrigatoria && !((C.percurso || {})[C.pratica.id] || {}).concluido);
    const testesModulo = finalDoNivel ? testes.filter(x => (parseInt(x.modulo) || 0) > 0
      && !resultados.some(y => y.testeId === x.id && y.aprovado)) : [];
    if (!passou && (faltaModulos || faltaPrat || porVer.length || testesModulo.length)){
      const totalMat = materiaisObrigatorios().length;
      h += '<div class="cartao"><div class="recurso"><div class="icone">🔒</div><div style="flex:1;">'
        + '<strong>' + esc(t.titulo || 'Teste') + '</strong>'
        + '<p>Abre quando terminares:</p>'
        + (C.modTotal ? '<p>' + (faltaModulos ? '◻️' : '✅') + ' Módulos do Estudo passo a passo ('
            + C.modFeitos + ' de ' + C.modTotal + ')</p>' : '')
        + (faltaPrat ? '<p>◻️ 🌿 ' + esc(C.pratica.titulo) + ' (' + Object.keys(((C.percurso || {})[C.pratica.id] || {}).dias || {}).length + ' de ' + C.pratica.dias + ' dias)</p>' : '')
        + (totalMat ? '<p>' + (porVer.length ? '◻️' : '✅') + ' Materiais de apoio vistos até ao fim ('
            + (totalMat - porVer.length) + ' de ' + totalMat + ')</p>' : '')
        + (testesModulo.length ? '<p>◻️ Testes dos módulos aprovados (faltam ' + testesModulo.length + ')</p>' : '')
        + ((faltaModulos || faltaPrat) ? '<a class="abrir" href="reiki-percurso.html?t=' + encodeURIComponent(C.tenant)
            + '&c=' + encodeURIComponent(C.codigo) + '">Ir para os módulos</a>'
          : (porVer.length ? '<button class="abrir" onclick="__mostrar(\'biblioteca\')">Ir para os materiais</button>' : ''))
        + '</div></div></div>';
      continue;
    }
    h += '<div class="cartao' + (passou ? ' fechado' : '') + '"><div class="recurso">'
      + '<div class="icone">' + (passou ? '✅' : '📝') + '</div><div style="flex:1;">'
      + '<strong>' + esc(t.titulo || 'Teste') + '</strong>'
      + '<p>' + (modN > 0 ? 'Módulo ' + modN : 'Teste final') + ' · ' + (t.perguntas||[]).length + ' perguntas · mínimo ' + (t.notaMinima||70) + '%</p>'
      + (r ? '<p class="etiqueta' + (passou ? '' : ' mau') + '">'
             + (passou ? 'Concluído com ' + r.percentagem + '%' : 'Última tentativa: ' + r.percentagem + '%')
             + '</p>' : '')
      + (passou
          ? '<button class="abrir" disabled>Concluído</button>'
          : '<button class="abrir" data-teste="' + t.id + '">'
            + (r ? 'Repetir teste' : 'Fazer o teste') + '</button>')
      + '</div></div></div>';
  }
  alvo.innerHTML = h;
  alvo.querySelectorAll('button[data-teste]').forEach(b =>
    b.onclick = () => abrirTeste(b.dataset.teste));
}

function abrirTeste(testeId){
  const t = C.testes.find(x => x.id === testeId);
  if (!t) return;
  const qs = t.perguntas || [];
  alvo.innerHTML = '<div class="cartao"><strong>' + esc(t.titulo) + '</strong>'
    + '<p style="color:var(--suave);font-size:.88rem;margin-top:4px;">'
    + 'Responde a todas. Precisas de ' + (t.notaMinima||70) + '% para passar. '
    + 'Se não correr bem, podes repetir.</p></div>'
    + qs.map(function(q,i){
        return '<div class="cartao"><strong>' + (i+1) + '. ' + esc(q.texto) + '</strong>'
          + (q.opcoes||[]).map(function(o,j){
              return '<label class="opcao"><input type="radio" name="q' + i + '" value="' + j + '">'
                + '<span>' + esc(o) + '</span></label>';
            }).join('')
          + '</div>';
      }).join('')
    + '<div class="cartao" style="text-align:center;">'
    + '<button class="abrir" id="btEntregar">Entregar</button> '
    + '<button class="botao" id="btVoltar">Voltar</button></div>';
  document.getElementById('btEntregar').onclick = function(){ entregarTeste(testeId); };
  document.getElementById('btVoltar').onclick = function(){ mostrar('testes'); };
  window.scrollTo(0,0);
}

async function entregarTeste(testeId){
  const t = C.testes.find(x => x.id === testeId);
  const qs = t.perguntas || [];
  const respostas = [];
  let certas = 0, faltam = 0;
  qs.forEach(function(q,i){
    const sel = document.querySelector('input[name="q' + i + '"]:checked');
    const v = sel ? parseInt(sel.value) : -1;
    respostas.push(v);
    if (v < 0) faltam++;
    else if (v === (q.correta||0)) certas++;
  });
  if (faltam){ aviso('Faltam ' + faltam + ' pergunta(s) por responder.'); return; }

  const pct = Math.round(certas / qs.length * 100);
  const aprovado = pct >= (t.notaMinima || 70);
  const registo = { testeId: testeId, titulo: t.titulo || '', percentagem: pct,
                    aprovado: aprovado, quando: new Date().toISOString() };

  try {
    await addDoc(collection(db, 'tenants', C.tenant, 'reikiQuizResults'), {
      testeId: testeId, codigo: C.codigo, alunoId: C.aluno.alunoId || '',
      alunoNome: C.aluno.nome || '', percentagem: pct, aprovado: aprovado,
      respostas: respostas, entregueEm: serverTimestamp()
    });
    C.resultados = C.resultados.filter(r => r.testeId !== testeId).concat([registo]);
    await setDoc(doc(db, 'tenants', C.tenant, 'reikiThreads', C.codigo),
                 { resultados: C.resultados, codigo: C.codigo,
                   alunoNome: C.aluno.nome || '' }, { merge: true });
  } catch(e){ C.resultados = C.resultados.concat([registo]); }

  alvo.innerHTML = '<div class="cartao vazio">'
    + '<strong style="font-size:1.5rem;">' + pct + '%</strong>'
    + '<p style="margin-top:8px;">' + (aprovado
        ? 'Passaste. O teu Mestre recebeu o resultado.'
        : 'Ficaste abaixo do mínimo. Revê o material, fala com o teu Mestre, e repete quando te sentires pronto.')
    + '</p></div>'
    + '<div class="cartao" style="text-align:center;">'
    + '<button class="abrir" onclick="__mostrar(\'testes\')">Voltar aos testes</button></div>';
  window.scrollTo(0,0);
}

      caixa.innerHTML = '<p class="vazio">Ainda não há mensagens.<br>Escreve a primeira.</p>';

                          codigo: C.codigo, criadoEm: serverTimestamp() });
      await setDoc(doc(db, 'tenants', C.tenant, 'reikiThreads', C.codigo),
        { alunoNome: C.aluno.nome || '', alunoId: C.aluno.alunoId || '',
          codigo: C.codigo, ultima: texto.slice(0,120),
          ultimaDe: 'aluno', lidoMestre: false, lidoAluno: true,
          atualizadoEm: serverTimestamp() }, { merge: true });

  document.getElementById('btFoto').onclick = async function(){
    const img = await escolherFoto();
    if (!img) return;
    const ta = document.getElementById('txt');
    const texto = ta.value.trim() || '📷 Foto';
    ta.value = '';
    try {
      await addDoc(ref, { de:'aluno', texto: texto, imagem: img, nome: C.aluno.nome || '',
                          codigo: C.codigo, criadoEm: serverTimestamp() });
      await setDoc(doc(db, 'tenants', C.tenant, 'reikiThreads', C.codigo),
        { alunoNome: C.aluno.nome || '', alunoId: C.aluno.alunoId || '',
          codigo: C.codigo, ultima: '📷 ' + texto.slice(0,110),
          ultimaDe: 'aluno', lidoMestre: false, lidoAluno: true,
          atualizadoEm: serverTimestamp() }, { merge: true });

}

let salaAtual = 'geral';

  const salaNivel = emEstudo ? 'nivel-' + emEstudo : null;
  const salaTurma = C.aluno.turmaId ? 'turma-' + C.aluno.turmaId : null;

    + '<div class="cartao" style="text-align:center;">'
    + '<button class="botao" id="sGeral">🌍 Toda a escola</button>'
    + (salaTurma ? '<button class="botao" id="sTurma">👥 ' + esc(C.aluno.turmaNome || 'A minha turma') + '</button>' : '')
    + (salaNivel ? '<button class="botao" id="sNivel">' + esc(ROTULOS[emEstudo]) + '</button>' : '')
    + '<p style="margin:10px 0 0;color:var(--suave);font-size:.82rem;">'
    + 'Aqui escrevem os alunos da escola. Trata os outros como gostarias de ser tratado.</p></div>'
    + '<div class="cartao"><div class="msgs" id="caixa"><p class="vazio">A abrir…</p></div>'

    + '<button class="abrir btfoto" id="btFoto" title="Enviar foto">📷</button>'
    + '<button class="abrir" id="btEnviar" style="margin:0;">Enviar</button></div></div>';

  const bG = document.getElementById('sGeral'), bN = document.getElementById('sNivel'), bT = document.getElementById('sTurma');
  [bG,bN,bT].forEach(function(b){ if (b){ b.style.background='none'; b.style.color='var(--destaque)'; } });

  if (bN) bN.onclick = function(){ salaAtual = salaNivel; verConversa(); };

  const caixa = document.getElementById('caixa');
  const ref = collection(db, 'tenants', C.tenant, 'reikiChat', salaAtual, 'mensagens');
  const fim = onSnapshot(query(ref, orderBy('criadoEm')), function(s){
    const m = []; s.forEach(d => m.push(d.data()));
    if (!m.length){
      caixa.innerHTML = '<p class="vazio">Ainda ninguém escreveu aqui.<br>Começa tu.</p>';
      return;
    }

      return '<div class="msg ' + (x.codigo === C.codigo ? 'meu' : (x.de === 'mestre' ? 'mestre' : '')) + '">'

        + '<div class="bolha">' + corpoMensagem(x) + '</div></div>';
    }).join('');
    caixa.scrollTop = caixa.scrollHeight;
  }, function(){
    caixa.innerHTML = '<p class="vazio">Não consegui abrir a conversa.</p>';
  });
  desligar.push(fim);

  document.getElementById('btEnviar').onclick = async function(){
    const ta = document.getElementById('txt');
    const texto = ta.value.trim();
    if (!texto) return;
    ta.value = '';
    try {
      await addDoc(ref, { de:'aluno', nome: C.aluno.nome || 'Aluno',
                          codigo: C.codigo, texto: texto, criadoEm: serverTimestamp() });
    } catch(e){ aviso('Não consegui enviar. Tenta outra vez.'); ta.value = texto; }
  };

  document.getElementById('btFoto').onclick = async function(){
    const img = await escolherFoto();
    if (!img) return;
    const ta = document.getElementById('txt');
    const texto = ta.value.trim() || '📷 Foto';
    ta.value = '';
    try {
      await addDoc(ref, { de:'aluno', nome: C.aluno.nome || 'Aluno',
                          codigo: C.codigo, texto: texto, imagem: img, criadoEm: serverTimestamp() });
    } catch(e){ aviso('Não consegui enviar a foto. Tenta outra vez.'); }
  };
}
