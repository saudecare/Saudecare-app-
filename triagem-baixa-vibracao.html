function buscarEtiquetas(temas, maxResult=2){
  const fontes = [["NOVAS_01", ETQ_NOVAS01], ["Usar em nós", ETQ_USAR_EM_NOS], ["1º Nível", ETQ_NIVEL1]];
  let resultados = [];
  temas.forEach(tema => {
    fontes.forEach(([fonteNome, lista]) => {
      lista.forEach(item => {
        if (item.pt.toLowerCase().includes(tema.toLowerCase())) resultados.push({fonte: fonteNome, item});
      });
    });
  });
  temas.forEach(tema => {
    NOMES_72.forEach(item => {
      if (item.pt.toLowerCase().includes(tema.toLowerCase().split(' ')[0])){
        resultados.push({fonte:'72 Nomes', item:{heb:item.heb, pt:`Nome ${item.n} — ${item.pt}`}});
      }
    });
  });
  const vistos = new Set(); const final = [];
  resultados.forEach(r => { if (!vistos.has(r.item.pt)){ vistos.add(r.item.pt); final.push(r); } });
  return final.slice(0, maxResult);
}

function slotHTML(path, label){
  const valor = getPorPath(path);
  return `
  <div class="slot-row">
    <div>
      <div class="slot-label">${label}</div>
      ${valor ? `<div class="slot-carta"><span class="tier-dot" style="background:${tierInfo(valor.tier).cor};"></span>${valor.n} — ${escapeHtml(valor.nome)} (${tierInfo(valor.tier).label})</div>` : `<div class="slot-carta" style="color:var(--muted);">— por preencher —</div>`}
    </div>
    ${estado.modo === 'auto'
      ? `<button class="btn btn-ghost btn-sm" data-tirar="${path}">🎴 Tirar</button>`
      : `<select data-manual="${path}" style="width:140px;"><option value="">Escolher…</option>${optionsCartas()}</select>`
    }
  </div>`;
}
function getPorPath(path){
  const parts = path.split('.');
  let obj = estado;
  for (const p of parts){ if (obj == null) return null; obj = /^\d+$/.test(p) ? obj[parseInt(p,10)] : obj[p]; }
  return obj;
}
function setPorPath(path, valor){
  const parts = path.split('.');
  let obj = estado;
  for (let i=0; i<parts.length-1; i++){ const p = parts[i]; obj = /^\d+$/.test(p) ? obj[parseInt(p,10)] : obj[p]; }
  const last = parts[parts.length-1];
  if (/^\d+$/.test(last)) obj[parseInt(last,10)] = valor; else obj[last] = valor;
}

  }));
  document.querySelectorAll('[data-tirar]').forEach(el => el.addEventListener('click', () => {
    setPorPath(el.dataset.tirar, tirarCartaAleatoria()); renderFormulario();
  }));
  document.querySelectorAll('[data-manual]').forEach(el => el.addEventListener('change', () => {
    const idx = parseInt(el.value, 10);
    setPorPath(el.dataset.manual, isNaN(idx) ? null : ARCANOS[idx]);
  }));
  document.getElementById('btnGerar').addEventListener('click', gerarRelatorio);
}

/* ─── Motor de avaliação ─────────────────────────────────────────────── */
function avaliarChakra(c, dados){
  const { miasmaIni, miasmaFin, magiaIni, magiaFin } = dados;
  return {
    nome: c.nome, temas: c.temas,
    miasma: miasmaIni && miasmaFin ? { inicial: miasmaIni, final: miasmaFin, melhoria: miasmaIni.tier - miasmaFin.tier, presente: miasmaFin.tier >= 2 } : null,
    magia: magiaIni && magiaFin ? { inicial: magiaIni, final: magiaFin, melhoria: magiaIni.tier - magiaFin.tier, presente: magiaFin.tier >= 2 } : null
  };
}

async function gerarRelatorio(){
  if (!estado.nome){ alert('Preencha o nome do consulente.'); return; }
  const avalChakras = CHAKRAS.map((c, i) => avaliarChakra(c, estado.chakras[i]));

  const achados = []; // para o parágrafo de síntese
  avalChakras.forEach(a => {
    if (a.miasma && a.miasma.presente) achados.push(`miasma em ${a.nome}`);
    if (a.magia && a.magia.presente) achados.push(`magia/olho gordo em ${a.nome}`);
  });
  if (estado.larvaPresenca && estado.larvaPresenca.tier >= 2) achados.push('sinal de larva astral');
  if (estado.geopatiaPresenca && estado.geopatiaPresenca.tier >= 2) achados.push('sinal de geopatia');
  if (estado.campoEletro && estado.campoEletro.tier >= 2) achados.push('interferência no campo electromagnético');

  // Protocolo — junta etiquetas para cada chakra afectado + gerais
  const protocolo = [];
  avalChakras.forEach(a => {
    if ((a.miasma && a.miasma.presente) || (a.magia && a.magia.presente)){
      buscarEtiquetas(a.temas, 2).forEach(r => protocolo.push({...r, motivo: `Chakra ${a.nome}`}));
    }
  });
  if (achados.some(x => x.includes('magia') || x.includes('olho gordo'))){
    buscarEtiquetas(['Olho Gordo','Magia','Proteção'], 3).forEach(r => protocolo.push({...r, motivo: 'Magia/Olho Gordo'}));
  }
  if (estado.larvaPresenca && estado.larvaPresenca.tier >= 2){
    buscarEtiquetas(['Larva Astral','Purificação','Limpar'], 3).forEach(r => protocolo.push({...r, motivo: 'Larva Astral'}));
  }
  if ((estado.campoEletro && estado.campoEletro.tier >= 2) || (estado.geopatiaPresenca && estado.geopatiaPresenca.tier >= 2)){
    buscarEtiquetas(['Campo Electromagnético','Geopatia','Purificação'], 3).forEach(r => protocolo.push({...r, motivo: 'Ambiente'}));
  }
  if (protocolo.length === 0){
    buscarEtiquetas(['Harmonizar','Paz interior','Força vital'], 3).forEach(r => protocolo.push({...r, motivo: 'Manutenção geral'}));
  }
  // dedupe protocolo
  const vistosProt = new Set(); const protocoloFinal = [];
  protocolo.forEach(p => { if (!vistosProt.has(p.item.pt)){ vistosProt.add(p.item.pt); protocoloFinal.push(p); } });

  const bovisIniVal = estado.bovisIni ? tierParaBovis(estado.bovisIni.tier) : null;
  const bovisFinVal = estado.bovisFin ? tierParaBovis(estado.bovisFin.tier) : null;

  const leadId = crypto.randomUUID();
  try{
    await setDoc(doc(db, 'tenants', TENANT_ID, 'triagemBaixaVibracao', leadId), {
      nome: estado.nome, data: estado.data || new Date().toISOString().slice(0,10),
      chakras: avalChakras.map(a => ({ nome:a.nome, miasma:a.miasma, magia:a.magia })),
      bovis: { inicial: bovisIniVal, final: bovisFinVal },
      larva: { presenca: estado.larvaPresenca, local: estado.larvaLocal },
      campoEletro: estado.campoEletro,
      geopatia: { presenca: estado.geopatiaPresenca, local: estado.geopatiaLocal },
      protocolo: protocoloFinal.map(p => ({ fonte:p.fonte, heb:p.item.heb, pt:p.item.pt, motivo:p.motivo })),
      criadoEm: new Date().toISOString()
    });
  }catch(e){ console.warn('Não foi possível guardar a sessão:', e); }

  renderRelatorio(avalChakras, achados, protocoloFinal, bovisIniVal, bovisFinVal);
}

function renderRelatorio(avalChakras, achados, protocoloFinal, bovisIniVal, bovisFinVal){
  const primeiroNome = estado.nome.split(/\s+/)[0];
  const sintese = achados.length
    ? `A triagem de ${escapeHtml(primeiroNome)} detectou ${achados.length} sinal(is) a vigiar: ${achados.map(escapeHtml).join(', ')}. O protocolo abaixo foi montado especificamente para estes pontos.`
    : `A triagem de ${escapeHtml(primeiroNome)} não revelou sinais fortes de interferência nas posições avaliadas — campo globalmente equilibrado. O protocolo abaixo é de manutenção.`;

  main.innerHTML = `
    <div class="card">
      <p class="muted" style="font-size:.75rem;">Relatório de ${escapeHtml(estado.data || new Date().toLocaleDateString('pt-PT'))}</p>
      <h3 style="color:var(--gold-light);margin:6px 0 10px;">🔮 Triagem de ${escapeHtml(estado.nome)}</h3>
      <p class="muted">${sintese}</p>
    </div>

    <div class="card">
      <h3 style="color:var(--gold-light);margin-bottom:8px;">🌀 Chakras</h3>
      ${avalChakras.map(a => `
        <div style="margin-top:8px;padding:8px 10px;background:rgba(255,255,255,.04);border-radius:8px;">
          <p class="muted" style="font-weight:700;color:var(--text);">${escapeHtml(a.nome)}</p>
          ${a.miasma ? `<p class="muted" style="margin-top:4px;"><span class="tier-dot" style="background:${tierInfo(a.miasma.final.tier).cor};"></span>Miasma: ${tierInfo(a.miasma.inicial.tier).label} → ${tierInfo(a.miasma.final.tier).label}${a.miasma.melhoria>0?' (melhorou)':a.miasma.melhoria<0?' (piorou)':' (igual)'}</p>` : ''}
          ${a.magia ? `<p class="muted" style="margin-top:4px;"><span class="tier-dot" style="background:${tierInfo(a.magia.final.tier).cor};"></span>Magia/Olho Gordo: ${tierInfo(a.magia.inicial.tier).label} → ${tierInfo(a.magia.final.tier).label}${a.magia.melhoria>0?' (melhorou)':a.magia.melhoria<0?' (piorou)':' (igual)'}</p>` : ''}
        </div>`).join('')}
    </div>

    ${(bovisIniVal!=null || bovisFinVal!=null) ? `
    <div class="card">
      <h3 style="color:var(--gold-light);margin-bottom:8px;">📊 Energia Vital (Bovis simbólico)</h3>
      <p class="muted">Inicial: <strong>${bovisIniVal ?? '—'}/10</strong> · Final: <strong>${bovisFinVal ?? '—'}/10</strong></p>
    </div>` : ''}

    ${(estado.larvaPresenca || estado.campoEletro || estado.geopatiaPresenca) ? `
    <div class="card">
      <h3 style="color:var(--gold-light);margin-bottom:8px;">👻 Larva Astral, Campo & Geopatia</h3>
      ${estado.larvaPresenca ? `<p class="muted"><span class="tier-dot" style="background:${tierInfo(estado.larvaPresenca.tier).cor};"></span>Larva Astral: ${tierInfo(estado.larvaPresenca.tier).label}${estado.larvaLocal ? ` — área: ${escapeHtml(estado.larvaLocal.area)}` : ''}</p>` : ''}
      ${estado.campoEletro ? `<p class="muted" style="margin-top:4px;"><span class="tier-dot" style="background:${tierInfo(estado.campoEletro.tier).cor};"></span>Campo Electromagnético: ${tierInfo(estado.campoEletro.tier).label}</p>` : ''}
      ${estado.geopatiaPresenca ? `<p class="muted" style="margin-top:4px;"><span class="tier-dot" style="background:${tierInfo(estado.geopatiaPresenca.tier).cor};"></span>Geopatia: ${tierInfo(estado.geopatiaPresenca.tier).label}${estado.geopatiaLocal ? ` — área: ${escapeHtml(estado.geopatiaLocal.area)}` : ''}</p>` : ''}
      <p class="muted" style="margin-top:8px;font-size:.72rem;opacity:.8;">⚠️ Adaptação simbólica — para confirmação real use pêndulo/biómetro sobre a planta da casa.</p>
    </div>` : ''}

    <div class="card" style="border:1px solid var(--gold);">
      <h3 style="color:var(--gold-light);margin-bottom:8px;">🧴 Protocolo de Limpeza — Etiquetas a Usar</h3>
      ${protocoloFinal.map(p => `
        <div class="etiqueta-item">
          <span class="etiqueta-heb">${p.item.heb}</span>
          <span class="etiqueta-pt">${escapeHtml(p.item.pt)} <em style="opacity:.7;">(${escapeHtml(p.motivo)})</em></span>
          <span class="badge-fonte">${escapeHtml(p.fonte)}</span>
        </div>`).join('')}
    </div>

    <p class="muted no-print" style="text-align:center;margin-top:10px;">Ferramenta de apoio profissional, baseada em correspondências tradicionais dos Arcanos — não substitui diagnóstico médico, psicológico ou psiquiátrico.</p>
    <button class="btn btn-ghost no-print" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
    <button class="btn no-print" id="btnNovaSessao">↺ Nova Sessão</button>
  `;
  document.getElementById('btnNovaSessao').addEventListener('click', () => {
    estado = {
      nome:'', data:'', modo: estado.modo,
      chakras: CHAKRAS.map(() => ({ miasmaIni:null, miasmaFin:null, magiaIni:null, magiaFin:null })),
      bovisIni:null, bovisFin:null, larvaPresenca:null, larvaLocal:null,
      campoEletro:null, geopatiaPresenca:null, geopatiaLocal:null
    };
    renderFormulario();
  });
}

renderFormulario();
</script>
