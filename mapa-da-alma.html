const VOWELS = 'AEIOU';

function stripAccents(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function reduceNumber(n){
  while (n > 9 && n !== 11 && n !== 22 && n !== 33){
    n = String(n).split('').reduce((a,d) => a + (parseInt(d,10)||0), 0);
  }
  return n;
}
function letterValue(ch){ return PYTH_MAP[ch.toUpperCase()] || 0; }
function nameLetters(str){ return stripAccents(str).toUpperCase().split('').filter(ch => /[A-Z]/.test(ch)); }
function sumLetters(str, filter){
  let total = 0;
  for (const ch of nameLetters(str)){
    if (filter === 'vowels' && !VOWELS.includes(ch)) continue;
    if (filter === 'consonants' && VOWELS.includes(ch)) continue;
    total += letterValue(ch);
  }
  return total;
}
function vibracaoMista(str){
  let total = 0;
  for (const ch of stripAccents(str).toUpperCase()){
    if (/[0-9]/.test(ch)) total += parseInt(ch,10);
    else if (/[A-Z]/.test(ch)) total += letterValue(ch);
  }
  return reduceNumber(total);
}
function caminhoDeVida(dateStr){
  const digits = dateStr.replace(/\D/g,'');
  const sum = digits.split('').reduce((a,d) => a + parseInt(d,10), 0);
  return reduceNumber(sum);
}
function expressao(nome){ return reduceNumber(sumLetters(nome, null)); }
function motivacao(nome){ return reduceNumber(sumLetters(nome, 'vowels')); }
function impressao(nome){ return reduceNumber(sumLetters(nome, 'consonants')); }

function licoesCarmicas(nome){
  const presentes = new Set(nameLetters(nome).map(ch => letterValue(ch)));
  const faltam = [];
  for (let n=1; n<=9; n++) if (!presentes.has(n)) faltam.push(n);
  return faltam;
}
function excessoNumerologico(nome){
  const counts = {};
  nameLetters(nome).forEach(ch => { const v = letterValue(ch); counts[v] = (counts[v]||0) + 1; });
  let max = 0, tops = [];
  Object.entries(counts).forEach(([n,c]) => {
    if (c > max){ max = c; tops = [n]; } else if (c === max) tops.push(n);
  });
  return max >= 3 ? tops.map(Number) : [];
}

function getDiaSemanaInfo(dateStr){ return DIA_INFO[new Date(dateStr+'T12:00:00').getDay()]; }
function getDiaSemanaNome(dateStr){ return DIAS_NOMES[new Date(dateStr+'T12:00:00').getDay()]; }
function getSigno(dateStr){
  const d = new Date(dateStr+'T12:00:00'); const m = d.getMonth()+1, day = d.getDate();
  for (const s of SIGNOS){
    const [im,id]=s.ini, [fm,fd]=s.fim;
    if (im>fm){ if((m===im&&day>=id)||(m===fm&&day<=fd)) return s; }
    else { if((m===im&&day>=id)||(m===fm&&day<=fd)||(m>im&&m<fm)) return s; }
  }
  return SIGNOS[0];
}

  const contacto = document.getElementById('inpContacto').value.trim();
  const consentimento = document.getElementById('inpConsentimento').checked;
  const consentimentoMarketing = document.getElementById('inpConsentimentoMarketing').checked;
  const g = (id) => document.getElementById(id)?.value?.trim() || '';
  const splitLines = (v) => v.split('\n').map(s => s.trim()).filter(Boolean);

  const extra = { morada: g('inpMorada') };
  if (selectedTipo === 'empresa'){
    extra.denominacaoSocial = g('inpDenominacaoSocial');
    extra.telemovelLista = splitLines(g('inpTelemovel'));
    extra.matriculaLista = splitLines(g('inpMatricula'));
  } else if (selectedTipo === 'bebe'){
    // Sem telemóvel, matrícula ou lateralidade para bebés/crianças pequenas.
  } else {
    extra.telemovel = g('inpTelemovel') || contacto;
    extra.matricula = g('inpMatricula');
    extra.lateralidade = g('inpLateralidade') || 'destro';
    extra.corpoNota = g('inpCorpo');
  }
  let nome2 = '', data2 = '';
  if (selectedTipo === 'casal'){
    nome2 = g('inpNome2'); data2 = g('inpData2');
    if (nome2 && data2){
      extra.nome2 = nome2; extra.data2 = data2;
      // Calcula já aqui o essencial do 2º elemento (signo, dia da semana),
      // porque o servidor não tem as tabelas de datas — só o nome/números.
      extra.pessoa2 = {
        nome: nome2, data: data2,
        caminhoDeVida: caminhoDeVida(data2),
        signo: getSigno(data2).nome,
        diaInfo: getDiaSemanaInfo(data2)
      };
    }
  }
  if (selectedTipo === 'familia' || selectedTipo === 'empresa'){
    const nomes = document.querySelectorAll('.elementoExtraNome');
    const datas = document.querySelectorAll('.elementoExtraData');
    const lista = [];
    nomes.forEach((el, i) => {
      const n = el.value.trim(), d = datas[i]?.value;
      if (n && d){
        lista.push({ nome: n, data: d, caminhoDeVida: caminhoDeVida(d), signo: getSigno(d).nome, diaInfo: getDiaSemanaInfo(d) });
      }
    });
    if (lista.length) extra.elementosExtra = lista;
  }

  if (!nome || !data || !contacto){ alert('Preencha o nome, a data e um contacto (WhatsApp ou email).'); return; }
  if (!consentimento){ alert('Precisa de aceitar o tratamento de dados para continuar.'); return; }

  const btn = document.getElementById('btnCalcular');
  btn.disabled = true; btn.textContent = 'A calcular…';

  const cv = caminhoDeVida(data);
  const exp = expressao(nome);
  const mot = motivacao(nome);
  const diaInfo = getDiaSemanaInfo(data);
  const diaNome = getDiaSemanaNome(data);
  const signo = getSigno(data);
  const carmicas = licoesCarmicas(nome);
  const excesso = excessoNumerologico(nome);
  const mediunidade = temSinaisMediunidade(cv, exp, mot);
  const leadId = crypto.randomUUID();

  const freeResult = {
    tipo: selectedTipo, nome, dataNascimento: data,
    caminhoDeVida: cv, motivacao: mot,
    diaInfo, diaNome, signo: signo.nome,
    carmicas, excesso, mediunidade
  };

  try{
    await setDoc(doc(db, 'tenants', TENANT_ID, 'mapaAlmaLeads', leadId), {
      nome, dataNascimento: data, tipo: selectedTipo, contacto, extra,
      consentimento: true, consentimentoAt: new Date().toISOString(),
      consentimentoMarketing: !!consentimentoMarketing,
      freeResult, paymentStatus: 'unpaid', createdAt: new Date().toISOString()
    });
  }catch(e){ console.error(e); }

  window.history.replaceState({}, '', '?mapa=' + leadId);
  renderFreeResult(leadId, freeResult, signo, extra);
}

async function loadAndShowPrice(leadId){
  try{
    const res = await fetch(FUNCTION_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getPrice', tenantId: TENANT_ID, leadId })
    });
    const data = await res.json();
    if (!data.ok) return;
    const box = document.getElementById('priceBox');
    if (!box) return;
    if (data.promoActive){
      let extra = '';
      if (data.promoMode === 'until' && data.promoUntil){
        extra = `<div id="promoCountdown" class="muted" style="margin-top:4px;font-size:.8rem;"></div>`;
        startPromoCountdown(data.promoUntil);
      } else if (data.promoMode === 'maxOrders' && data.promoOrdersLeft != null){
        extra = `<div class="muted" style="margin-top:4px;font-size:.8rem;">⚡ Restam ${data.promoOrdersLeft} vagas a este preço</div>`;
      }
      box.innerHTML = `
        <p class="teaser-tag" style="background:rgba(220,60,60,.25);color:#ffb3b3;">🔥 PREÇO DE LANÇAMENTO</p>
        <div style="margin-top:6px;">

          <span style="color:var(--gold-light);font-size:1.8rem;font-weight:800;margin-left:8px;">${data.price}€</span>
        </div>
        ${extra}
      `;
    } else {
      box.innerHTML = `<div style="color:var(--gold-light);font-size:1.6rem;font-weight:800;">${data.price}€</div>`;
    }
  }catch(e){ /* se falhar, o preço só aparece no ecrã de pagamento — não bloqueia nada */ }
}
function startPromoCountdown(untilIso){
  const el = document.getElementById('promoCountdown');
  if (!el) return;
  function tick(){
    const diff = new Date(untilIso).getTime() - Date.now();
    if (diff <= 0){ el.textContent = '⏳ Promoção a terminar...'; return; }
    const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
    const d = Math.floor(h/24);
    el.textContent = `⏳ Termina em ${d>0?d+'d ':''}${(h%24).toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }
  tick();
  setInterval(tick, 1000);
}

// PDF — Mapa da Alma Diamante, estilo "dossiê" da Hikari Fafe
// ────────────────────────────────────────────────────────────────────────
const NAVY = [20, 20, 45];
const GOLD = [200, 160, 60];
const GOLD_LIGHT = [230, 200, 120];
const GREEN_BG = [232, 245, 236];
const GREEN_BAR = [70, 150, 100];
const RED_BG = [252, 235, 233];
const RED_BAR = [190, 80, 70];
const CREAM_BG = [246, 240, 226];
const TEXT_DARK = [40, 30, 20];
const MUTED = [100, 90, 110];

function downloadFullReportPDF(r, full, dom){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const marginX = 44;
  const contentW = pageW - marginX*2;
  let y = 0;
  let pageNum = 1;

  function drawSlimHeader(){
    pdf.setFillColor(...NAVY);
    pdf.rect(0, 0, pageW, 46, 'F');
    pdf.setTextColor(...GOLD_LIGHT);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(13);
    pdf.text('HIKARI FAFE', marginX, 29);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9);
    pdf.setTextColor(255,255,255);
    pdf.text('Mapa da Alma Diamante', pageW-marginX, 29, { align:'right' });
    y = 68;
  }
  function drawFooter(){
    pdf.setDrawColor(220,220,220);
    pdf.line(marginX, pageH-36, pageW-marginX, pageH-36);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8);
    pdf.setTextColor(...MUTED);
    pdf.text('Hikari Fafe — Desenvolvimento Pessoal & Terapia Holística', marginX, pageH-22);
    pdf.text(`Página ${pageNum}`, pageW-marginX, pageH-22, { align:'right' });
  }
  function newPage(){
    drawFooter();
    pdf.addPage();
    pageNum++;
    drawSlimHeader();
  }
  function ensureSpace(h){
    if (y + h > pageH - 50) newPage();
  }
  function heading(text, num){
    ensureSpace(30);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(12.5);
    pdf.setTextColor(...NAVY);
    pdf.text(`${num}. ${text}`, marginX, y);
    pdf.setDrawColor(...GOLD);
    pdf.setLineWidth(1.2);
    pdf.line(marginX, y+5, pageW-marginX, y+5);
    y += 20;
  }
  function paragraph(text, opts={}){
    pdf.setFont('helvetica', opts.bold ? 'bold' : 'normal');
    pdf.setFontSize(opts.size || 10);
    pdf.setTextColor(...(opts.color || TEXT_DARK));
    const lines = pdf.splitTextToSize(text, opts.width || contentW);
    ensureSpace(lines.length * 13 + 6);
    pdf.text(lines, marginX + (opts.indent||0), y);
    y += lines.length * 13 + (opts.gap ?? 8);
  }
  function bullet(text){
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9.5);
    pdf.setTextColor(...TEXT_DARK);
    const lines = pdf.splitTextToSize(text, contentW - 16);
    ensureSpace(lines.length * 12 + 4);
    pdf.text('•', marginX, y);
    pdf.text(lines, marginX + 12, y);
    y += lines.length * 12 + 5;
  }
  function calloutBox(title, items, bg, bar, textColor){
    const lineTexts = items.map(it => pdf.splitTextToSize(it, contentW - 34));
    const totalLines = lineTexts.reduce((a,l) => a + l.length, 0);
    const boxH = 26 + totalLines*12 + items.length*4;
    ensureSpace(boxH + 10);
    pdf.setFillColor(...bg);
    pdf.rect(marginX, y, contentW, boxH, 'F');
    pdf.setFillColor(...bar);
    pdf.rect(marginX, y, 4, boxH, 'F');
    pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5);
    pdf.setTextColor(...textColor);
    pdf.text(title, marginX+14, y+17);
    let iy = y+32;
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9.5);
    pdf.setTextColor(...TEXT_DARK);
    lineTexts.forEach(lines => {
      pdf.text('•', marginX+14, iy);
      pdf.text(lines, marginX+26, iy);
      iy += lines.length*12 + 4;
    });
    y += boxH + 12;
  }

  // ── Capa / Cabeçalho ──
  pdf.setFillColor(...NAVY);
  pdf.rect(0, 0, pageW, 100, 'F');
  pdf.setFont('helvetica','bold'); pdf.setFontSize(24);
  pdf.setTextColor(...GOLD_LIGHT);
  pdf.text('HIKARI FAFE', marginX, 48);
  pdf.setFont('helvetica','italic'); pdf.setFontSize(11);
  pdf.setTextColor(255,255,255);
  pdf.text('Mapa da Alma Diamante — Dossiê Terapêutico', marginX, 68);
  pdf.setFont('helvetica','bold'); pdf.setFontSize(10);
  pdf.setTextColor(...GOLD);
  pdf.text('MAPA DIAMANTE', pageW-marginX, 40, { align:'right' });
  pdf.setFont('helvetica','normal'); pdf.setFontSize(8);
  pdf.setTextColor(220,220,230);
  pdf.text('Consultoria Holística', pageW-marginX, 54, { align:'right' });

  y = 122;
  pdf.setFillColor(...CREAM_BG);
  pdf.rect(marginX, y, contentW, 56, 'F');
  pdf.setDrawColor(...GOLD); pdf.setLineWidth(2);
  pdf.line(marginX, y, marginX, y+56);
  pdf.setFont('helvetica','bold'); pdf.setFontSize(9.5); pdf.setTextColor(...NAVY);
  pdf.text('Cliente:', marginX+14, y+20);
  pdf.text('Signo:', marginX+14, y+40);
  pdf.text('Data Nasc.:', marginX+260, y+20);
  pdf.text('Caminho de Vida:', marginX+260, y+40);
  pdf.setFont('helvetica','normal'); pdf.setTextColor(...TEXT_DARK);
  pdf.text(r.nome, marginX+70, y+20);
  pdf.text(`${r.signo} (${full.signoElemento||''})`, marginX+55, y+40);
  pdf.text(`${r.dataNascimento.split('-').reverse().join('/')} (${r.diaNome})`, marginX+335, y+20);
  pdf.text(`${r.caminhoDeVida}${r.caminhoDeVida>=11?' (Número Mestre)':''}`, marginX+375, y+40);
  y += 76;

  paragraph(`Saudação de Luz, ${r.nome.split(' ')[0]}. Este Mapa da Alma Diamante foi gerado especialmente para si, cruzando Numerologia Pitagórica, Astrologia Terapêutica e Engenharia Vibracional do método Hikari Fafe.`, { size:9.5, color:MUTED });

  heading('Assinatura Cósmica', 'I');
  paragraph(`Caminho de Vida ${r.caminhoDeVida} — ${dom.nome}. ${dom.texto}`);
  paragraph(`Expressão: ${full.expressao}  ·  Número da Alma: ${r.motivacao}  ·  Impressão: ${full.impressao}`, { bold:true, size:9.5 });

  heading('Perfil Integral — Luz e Sombra', 'II');
  calloutBox('💎 LADO LUZ (O SEU POTENCIAL)', [full.luz], GREEN_BG, GREEN_BAR, [40,90,60]);
  calloutBox('⬤ LADO SOMBRA (A TRABALHAR)', [full.sombra], RED_BG, RED_BAR, [140,50,40]);

  heading('Lições Cármicas & Excessos', 'III');
  paragraph(full.carmicasTexto || '');
  paragraph(full.excessoTexto || '');
  if (full.mediunidadeTexto) paragraph('✨ ' + full.mediunidadeTexto);

  heading('O Corpo e a Imunidade Energética', 'IV');
  paragraph(full.corpoTexto || '');
  paragraph('⚠️ Leitura simbólica e espiritual — não substitui avaliação médica. Mantenha sempre acompanhamento/tratamento em curso.', { size:8.5, color:MUTED });

  heading('O Chakra em Foco', 'V');
  paragraph(`${r.diaInfo.chakra} · Cor: ${full.chakraInfo?.cor||''}`, { bold:true });
  bullet(`Significado: ${full.chakraInfo?.significado||''}`);
  bullet(`Sinais de desequilíbrio: ${full.chakraInfo?.desequilibrio||''}`);
  bullet(`Prática de equilíbrio: ${full.chakraInfo?.pratica||''}`);

  heading('Regência dos Astros, Mestre Ascenso & Alquimia', 'VI');
  paragraph(`Nascido(a) numa ${r.diaNome}, o seu planeta regente é ${r.diaInfo.planeta} e o seu Mestre Ascenso de conexão é ${r.diaInfo.mestre} (${r.diaInfo.raio}). Cristal do dia: ${r.diaInfo.cristal}. Cristal do signo: ${full.cristalSigno}.`);

  ensureSpace(90);
  pdf.setFillColor(...NAVY);
  pdf.rect(marginX, y, contentW, 66, 'F');
  pdf.setFont('helvetica','bold'); pdf.setFontSize(9.5); pdf.setTextColor(...GOLD_LIGHT);
  pdf.text(`🕊️ Oração de Conexão ao Mestre ${r.diaInfo.mestre}`, marginX+12, y+18);
  pdf.setFont('helvetica','italic'); pdf.setFontSize(9); pdf.setTextColor(240,240,245);
  const oracaoLines = pdf.splitTextToSize(full.oracaoMestre||'', contentW-24);
  pdf.text(oracaoLines, marginX+12, y+34);
  y += 66 + 12;

  heading('Rituais de Alquimia', 'VII');
  paragraph(`Banho de Ervas do Signo (${r.signo}): ${full.banhoErvas}`, { bold:true, gap:2 });
  paragraph(full.banhoModo || '', { size:9 });
  paragraph(`Banho de Descarrego: ${full.banhoDescarrego?.ervas} — ${full.banhoDescarrego?.hz}`, { bold:true, gap:2 });
  paragraph(full.banhoDescarrego?.modo || '', { size:9 });
  paragraph(`Banho de Proteção: ${full.banhoProtecao?.ervas} — ${full.banhoProtecao?.hz}`, { bold:true, gap:2 });
  paragraph(full.banhoProtecao?.modo || '', { size:9 });
  paragraph(`Mantra sugerido: ${full.mantra}`, { size:9 });
  if (full.avisoProfissional) paragraph(full.avisoProfissional, { size:8.5, color:MUTED });

  heading('Decretos "EU SOU" de Poder Pessoal', 'VIII');
  paragraph(`Afirmação do seu número: "${full.euSou}"`, { bold:true, gap:10 });
  (full.decretos||[]).forEach((d,i) => bullet(`${i+1}. ${d}`));

  heading('Engenharia Vibracional (Ajuste Numpro)', 'IX');
  if (full.vibMorada!=null) paragraph(`Morada: vibração ${full.vibMorada} — ${full.vibMoradaTexto}`);
  if (full.vibTelemovel!=null) paragraph(`Telemóvel: vibração ${full.vibTelemovel} — ${full.vibTelemovelTexto}`);
  if (full.vibMatricula!=null) paragraph(`Matrícula: vibração ${full.vibMatricula} — ${full.vibMatriculaTexto}`);
  (full.vibContactos||[]).forEach(c => paragraph(`Contacto ${c.numero}: vibração ${c.vibracao} — ${c.texto}`));
  (full.vibFrota||[]).forEach(f => paragraph(`Matrícula ${f.matricula}: vibração ${f.vibracao} — ${f.texto}`));

  if (full.grupo){
    heading('Leitura de Grupo', 'IX.1');
    paragraph(`Vibração conjunta: ${full.grupo.vibracaoGrupo} — ${full.grupo.vibracaoGrupoTexto}`, { bold:true, gap:2 });
    paragraph(full.grupo.harmoniaTexto, { size:9.5 });
    full.grupo.elementos.forEach(e => {
      paragraph(`${e.nome} — Caminho de Vida ${e.caminhoDeVida} · ${e.signo} (${e.elemento}, regido por ${e.regente})`, { bold:true, gap:1 });
      paragraph(`Dom natural: ${e.dom}`, { size:9 });
    });
  }
  if (full.avisoEmpresa){
    heading('Vibração do Negócio', 'IX.1');
    paragraph(full.avisoEmpresa, { size:9.5 });
  }
  if (full.casal){
    heading('O Casal — Perfil de ' + full.casal.perfil1.nome, 'IX.2');
    paragraph(`Caminho de Vida: ${full.casal.perfil1.caminhoDeVida} · Signo: ${full.casal.perfil1.signo} (${full.casal.perfil1.elemento}, regido por ${full.casal.perfil1.regente})`, { bold:true, gap:2 });
    paragraph(`Papel na relação: ${full.casal.perfil1.papelRelacao}`, { size:9.5 });
    paragraph(full.casal.perfil1.luzRelacao, { size:9.5 });
    paragraph(full.casal.perfil1.sombraRelacao, { size:9.5 });

    heading('O Casal — Perfil de ' + full.casal.perfil2.nome, 'IX.3');
    paragraph(`Caminho de Vida: ${full.casal.perfil2.caminhoDeVida} · Signo: ${full.casal.perfil2.signo} (${full.casal.perfil2.elemento}, regido por ${full.casal.perfil2.regente})`, { bold:true, gap:2 });
    paragraph(`Papel na relação: ${full.casal.perfil2.papelRelacao}`, { size:9.5 });
    paragraph(full.casal.perfil2.luzRelacao, { size:9.5 });
    paragraph(full.casal.perfil2.sombraRelacao, { size:9.5 });

    heading('Compatibilidade do Casal', 'IX.4');
    paragraph(`Vibração do casal enquanto unidade: ${full.casal.vibracaoCasal} — ${full.casal.vibracaoCasalTexto}`, { bold:true, gap:2 });
    paragraph(full.casal.compatNumero.texto, { size:9.5 });
    paragraph(full.casal.compatNumero.conselho, { size:9.5 });
    if (full.casal.compatElemento) paragraph(`Elementos (${full.casal.compatElemento.nivel}): ${full.casal.compatElemento.texto}`, { size:9.5 });
    if (full.casal.mediunidadeCasal) paragraph('Um de vocês (ou os dois) carrega o Número Mestre 11 — sensibilidade intuitiva acima da média como casal.', { size:9.5 });
    if (full.casal.moradaConjunta) paragraph(`Morada partilhada — vibração ${full.casal.moradaConjunta.vibracao} (${full.casal.moradaConjunta.texto}).`, { size:9.5 });
    paragraph(full.casal.ajusteEnergia, { size:9.5 });
    paragraph(full.casal.compatNumero.ritualCasal, { size:9.5 });
  }

  heading('Plano de Ativação (7–21 dias)', 'X');
  paragraph(full.planoAtivacao || '', { size:9.5 });

  ensureSpace(40);
  pdf.setFont('helvetica','italic'); pdf.setFontSize(9); pdf.setTextColor(...GOLD);
  paragraph('"O Mapa da Alma revela a sua frequência para que possa caminhar com clareza, verdade e poder pessoal."', { size:9 });

  drawFooter();
  pdf.save(`Mapa-da-Alma-Diamante-${r.nome.replace(/\s+/g,'-')}.pdf`);
}

(async function init(){
  await loadOverrides();
  if (existingToken) renderFullResult(existingToken);
  else renderTypeSelector();
})();
</script>
