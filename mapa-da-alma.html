const PYTH_MAP = {A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,I:9,J:1,K:2,L:3,M:4,N:5,O:6,P:7,Q:8,R:9,S:1,T:2,U:3,V:4,W:5,X:6,Y:7,Z:8};
const VOWELS = 'AEIOU';

function stripAccents(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function reduceNumber(n){
  while (n > 9 && n !== 11 && n !== 22 && n !== 33){
    n = String(n).split('').reduce((a,d) => a + (parseInt(d,10)||0), 0);
  }
  return n;
}
function letterValue(ch){ return PYTH_MAP[ch.toUpperCase()] || 0; }
function nameLetters(str){ return stripAccents(str).toUpperCase().split('').filter(ch => /[A-Z]/.test(ch)); }
function sumLetters(str, filter){
  let total = 0;
  for (const ch of nameLetters(str)){
    if (filter === 'vowels' && !VOWELS.includes(ch)) continue;
    if (filter === 'consonants' && VOWELS.includes(ch)) continue;
    total += letterValue(ch);
  }
  return total;
}
function vibracaoMista(str){
  let total = 0;
  for (const ch of stripAccents(str).toUpperCase()){
    if (/[0-9]/.test(ch)) total += parseInt(ch,10);
    else if (/[A-Z]/.test(ch)) total += letterValue(ch);
  }
  return reduceNumber(total);
}
function caminhoDeVida(dateStr){
  const digits = dateStr.replace(/\D/g,'');
  const sum = digits.split('').reduce((a,d) => a + parseInt(d,10), 0);
  return reduceNumber(sum);
}
function expressao(nome){ return reduceNumber(sumLetters(nome, null)); }
function motivacao(nome){ return reduceNumber(sumLetters(nome, 'vowels')); }
function impressao(nome){ return reduceNumber(sumLetters(nome, 'consonants')); }

function licoesCarmicas(nome){
  const presentes = new Set(nameLetters(nome).map(ch => letterValue(ch)));
  const faltam = [];
  for (let n=1; n<=9; n++) if (!presentes.has(n)) faltam.push(n);
  return faltam;
}
function excessoNumerologico(nome){
  const counts = {};
  nameLetters(nome).forEach(ch => { const v = letterValue(ch); counts[v] = (counts[v]||0) + 1; });
  let max = 0, tops = [];
  Object.entries(counts).forEach(([n,c]) => {
    if (c > max){ max = c; tops = [n]; } else if (c === max) tops.push(n);
  });
  return max >= 3 ? tops.map(Number) : [];
}

function pinaculoActivo(dateStr, hojeStr){
  const { pinaculos, idadesTransicao } = calcularPinaculosDesafios(dateStr);
  const idade = idadeAtual(dateStr, hojeStr);
  let indice = 3;
  if (idade < idadesTransicao[0]) indice = 0;

}

function calcularPinaculosDesafios(dateStr){
  const [ano, mes, dia] = dateStr.split('-').map(Number);
  const diaR = reduceNumber(dia);
  const mesR = reduceNumber(mes);
  const anoR = reduceNumber(String(ano).split('').reduce((a,d)=>a+parseInt(d,10),0));
  const cv = caminhoDeVida(dateStr);

  const p1 = reduceNumber(mesR + diaR);
  const p2 = reduceNumber(diaR + anoR);
  const p3 = reduceNumber(p1 + p2);
  const p4 = reduceNumber(mesR + anoR);

  const reduceSimples = (n) => { n = Math.abs(n); while (n > 9){ n = String(n).split('').reduce((a,d)=>a+(parseInt(d,10)||0),0); } return n; };
  const d1 = reduceSimples(mesR - diaR);
  const d2 = reduceSimples(diaR - anoR);
  const d3 = reduceSimples(d1 - d2);
  const d4 = reduceSimples(mesR - anoR);

  const fim1 = 36 - cv;
  const fim2 = fim1 + 9;
  const fim3 = fim2 + 9;

  return {
    pinaculos: [
      { numero: p1, desafio: d1, faixa: `nascimento — ${fim1} anos` },
      { numero: p2, desafio: d2, faixa: `${fim1} — ${fim2} anos` },
      { numero: p3, desafio: d3, faixa: `${fim2} — ${fim3} anos` },
      { numero: p4, desafio: d4, faixa: `${fim3}+ anos (resto da vida)` }
    ],
    idadesTransicao: [fim1, fim2, fim3]
  };
}
function calcularIdadeEDatasTransicao(dateStr, idades){
  const nasc = new Date(dateStr + 'T12:00:00');
  return idades.map(idade => {
    const d = new Date(nasc);
    d.setFullYear(d.getFullYear() + idade);
    return d.toISOString().slice(0,10);
  });
}
function idadeAtual(dateStr, hojeStr){
  const nasc = new Date(dateStr+'T12:00:00');
  const hoje = new Date(hojeStr+'T12:00:00');
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const aindaNaoFezAnos = (hoje.getMonth() < nasc.getMonth()) ||
    (hoje.getMonth() === nasc.getMonth() && hoje.getDate() < nasc.getDate());
  if (aindaNaoFezAnos) idade--;
  return idade;
}
function anoUniversal(ano){ return reduceNumber(String(ano).split('').reduce((a,d)=>a+parseInt(d,10),0)); }
function calcularCiclosPessoais(dateStr, hojeStr){
  const [, mes, dia] = dateStr.split('-').map(Number);
  const hoje = new Date(hojeStr+'T12:00:00');
  const anoAtual = hoje.getFullYear();
  const mesAtual = hoje.getMonth()+1;
  const diaAtual = hoje.getDate();
  const diaR = reduceNumber(dia);
  const mesR = reduceNumber(mes);
  const anoUniv = anoUniversal(anoAtual);
  const anoPessoal = reduceNumber(diaR + mesR + anoUniv);
  const mesPessoal = reduceNumber(anoPessoal + reduceNumber(mesAtual));
  const diaPessoal = reduceNumber(mesPessoal + reduceNumber(diaAtual));
  return { anoPessoal, mesPessoal, diaPessoal, anoUniversal: anoUniv };
}

function calcularMestreDia(dateStr){
  const d = new Date(dateStr + 'T12:00:00'); if (isNaN(d)) return null;
  const i = d.getDay();
  const base = { dia: DIAS_SEMANA_PT[i], nasceuNum: (i === 0 || i === 6 ? 'num ' : 'numa ') + DIAS_SEMANA_PT[i] };
  const m = MESTRE_DIA_SEMANA[i]; if (!m) return base;
  return Object.assign(base, m, { texto: m.texto.replace('{DIA}', DIAS_SEMANA_PT[i]) });
}

const ASC_RAD = Math.PI / 180;
function ascDiaJuliano(y, m, d, hUT){
  if (m <= 2){ y -= 1; m += 12; }
  const A = Math.floor(y / 100), B = 2 - A + Math.floor(A / 4);
  return Math.floor(365.25 * (y + 4716)) + Math.floor(30.6001 * (m + 1)) + d + hUT / 24 + B - 1524.5;
}
function ascOffsetFuso(tz, instanteUTC){
  const f = new Intl.DateTimeFormat('en-US', { timeZone: tz, hourCycle:'h23', year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit' });
  const p = {}; f.formatToParts(new Date(instanteUTC)).forEach(x => { p[x.type] = x.value; });
  const local = Date.UTC(+p.year, +p.month - 1, +p.day, +p.hour, +p.minute, +p.second);
  return local - Math.floor(instanteUTC / 1000) * 1000;
}
function ascHoraLegalParaUT(dataISO, hhmm, tz){
  const [Y, M, D] = dataISO.split('-').map(Number), [h, mi] = hhmm.split(':').map(Number);
  const alvo = Date.UTC(Y, M - 1, D, h, mi, 0);
  let utc = alvo - ascOffsetFuso(tz, alvo);
  utc = alvo - ascOffsetFuso(tz, utc);
  return new Date(utc);
}
function calcularAscendente(dataISO, hhmm, lat, lon, tz){
  const ut = ascHoraLegalParaUT(dataISO, hhmm, tz);
  const jd = ascDiaJuliano(ut.getUTCFullYear(), ut.getUTCMonth() + 1, ut.getUTCDate(), ut.getUTCHours() + ut.getUTCMinutes() / 60 + ut.getUTCSeconds() / 3600);
  const T = (jd - 2451545.0) / 36525;
  const gmst = 280.46061837 + 360.98564736629 * (jd - 2451545.0) + 0.000387933 * T * T - T * T * T / 38710000;
  const ramc = ((gmst + lon) % 360 + 360) % 360;
  const eps = (23.4392911 - 0.0130042 * T) * ASC_RAD;
  const r = ramc * ASC_RAD, ph = lat * ASC_RAD;
  let asc = Math.atan2(Math.cos(r), -(Math.sin(r) * Math.cos(eps) + Math.tan(ph) * Math.sin(eps))) / ASC_RAD;
  asc = (asc % 360 + 360) % 360;
  const SIG = ['Carneiro','Touro','Gémeos','Caranguejo','Leão','Virgem','Balança','Escorpião','Sagitário','Capricórnio','Aquário','Peixes'];
  const i = Math.floor(asc / 30);
  return { grau: asc, signo: SIG[i], indice: i, graus: Math.floor(asc - i * 30) };
}

/* ─── Nodos Lunares (Vidas Passadas / Propósito de Vida) ──────────────
   Fórmula astronómica real do Nodo Lunar Médio (Jean Meeus, Astronomical
   Algorithms) — não é uma tabela aproximada. Precisão de grau, mais do
   que suficiente ao nível do signo. Validado contra 3 trânsitos públicos
   e documentados do Nodo Norte: Carneiro (Jul/2023), Peixes (Jan/2025)
   e Aquário (meados de 2026) — os três bateram certo.
   NOTA DE HONESTIDADE: isto é leitura simbólica dentro da tradição da
   astrologia cármica, não um facto histórico verificável. A crença em
   vidas passadas não é comum a todos os astrólogos nem faz parte dos
   ensinamentos cânones da astrologia — é uma camada interpretativa. */
function paraDiaJuliano(ano, mes, dia, hora=12){
  if (mes <= 2){ ano -= 1; mes += 12; }
  const A = Math.floor(ano/100);
  const B = 2 - A + Math.floor(A/4);
  return Math.floor(365.25*(ano+4716)) + Math.floor(30.6001*(mes+1)) + dia + hora/24 + B - 1524.5;
}
function normalizar360(deg){ deg = deg % 360; return deg < 0 ? deg + 360 : deg; }
function nodoNorteLongitude(ano, mes, dia){
  const jd = paraDiaJuliano(ano, mes, dia);
  const T = (jd - 2451545.0) / 36525;
  const omega = 125.0445222 - 1934.1362608*T + 0.0020708*T*T + (T*T*T)/450000;
  return normalizar360(omega);
}
const SIGNOS_NODO = ['Carneiro','Touro','Gémeos','Caranguejo','Leão','Virgem','Balança','Escorpião','Sagitário','Capricórnio','Aquário','Peixes'];
function signoDeLongitude(long){ return SIGNOS_NODO[Math.floor(normalizar360(long) / 30)]; }
function calcularNodosLunares(dateStr){
  const [ano, mes, dia] = dateStr.split('-').map(Number);
  const nnLong = nodoNorteLongitude(ano, mes, dia);
  const nsLong = normalizar360(nnLong + 180);
  return {
    nodoNorte: { signo: signoDeLongitude(nnLong) },
    nodoSul:   { signo: signoDeLongitude(nsLong) }
  };
}

function reduzirParaArcano(soma){
  while (soma > 22){ soma = String(soma).split('').reduce((a,d) => a + (parseInt(d,10)||0), 0); }
  if (soma === 0) soma = 22;
  return soma;
}
function calcularArcanoPessoal(dateStr){
  const digits = dateStr.replace(/\D/g,'');
  const soma = digits.split('').reduce((a,d) => a + parseInt(d,10), 0);
  return reduzirParaArcano(soma);
}
function calcularArcanoDoAno(dateStr, hojeStr){
  const [, mesN, diaN] = dateStr.split('-').map(Number);
  const hoje = new Date(hojeStr+'T12:00:00');
  const anoAtual = hoje.getFullYear();
  const aindaNaoFezAnos = (hoje.getMonth()+1 < mesN) || (hoje.getMonth()+1 === mesN && hoje.getDate() < diaN);
  const anoBase = aindaNaoFezAnos ? anoAtual - 1 : anoAtual;
  return reduzirParaArcano(diaN + mesN + anoBase);
}

/* ─── Leitura Integrada (geração determinística por sementes) ────────
   Escreve UMA frase de abertura que cruza Caminho de Vida + Anjo +
   Arcano + Nodo Sul, em vez de os listar em blocos separados. Usa uma
   "semente" calculada a partir do nome+data (sem qualquer chamada a
   IA, sem custo): a mesma pessoa vê sempre a mesma leitura, mas duas
   pessoas com os mesmos números leem frases diferentes. */
function hashSemente(str){
  let h = 2166136261;
  for (let i=0; i<str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function gerarLeituraIntegrada(nomeCompleto, dataStr, cvNome, anjoNome, arcanoNome, nodoSulSigno){
  if (!cvNome || !anjoNome || !arcanoNome || !nodoSulSigno) return null;
  const seed = hashSemente(nomeCompleto.trim().toLowerCase() + '|' + dataStr);
  const rng = mulberry32(seed);
  const abertura = escolherVariante(rng, ABERTURAS_CV_ANJO)(cvNome, anjoNome);
  const ligacao = escolherVariante(rng, LIGACOES_ARCANO)(arcanoNome);
  const fecho = escolherVariante(rng, FECHOS_NODO)(nodoSulSigno);
  return `${abertura}, ${ligacao}${fecho}`;
}

/* ─── Variação por sementes — extensão aos restantes blocos ──────────
   Mesmo princípio do parágrafo integrado: cada bloco usa a sua própria
   sub-semente (nome+data+"|salt"), por isso a MESMA pessoa lê sempre o
   mesmo texto em cada bloco, mas dois blocos diferentes da mesma pessoa
   não "sincronizam" a escolha, e duas pessoas com o mesmo número
   recebem frases diferentes. Zero custo, zero IA. */
function variantePara(nomeCompleto, dataStr, salt, arr, ...args){
  const seed = hashSemente(nomeCompleto.trim().toLowerCase() + '|' + dataStr + '|' + salt);
  const rng = mulberry32(seed);
  const fn = escolherVariante(rng, arr);
  return typeof fn === 'function' ? fn(...args) : fn;
}

  const d = new Date(dateStr+'T12:00:00');
  const chave = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
  if (DIAS_GENIOS_UNIVERSAIS[chave]){
    return { tipo:'universal', elemento: DIAS_GENIOS_UNIVERSAIS[chave],
      nota:'Não tem um Anjo fixo — a sua essência liga-se directamente aos Anjos Universais/Génios da Humanidade.' };
  }
  const g = GENIOS_72.find(g => g.datas.includes(chave));
  if (!g) return null;
  const coro = coroDoGenio(g.n);
  return { tipo:'anjo', numero:g.n, nome:g.nome, coro:coro.nome, arcanjoRegente:coro.regente,

}

function getSigno(dateStr){
  const d = new Date(dateStr+'T12:00:00'); const m = d.getMonth()+1, day = d.getDate();
  for (const s of SIGNOS){
    const [im,id]=s.ini, [fm,fd]=s.fim;
    if (im>fm){ if((m===im&&day>=id)||(m===fm&&day<=fd)) return s; }
    else { if((m===im&&day>=id)||(m===fm&&day<=fd)||(m>im&&m<fm)) return s; }
  }
  return SIGNOS[0];
}

// Cliente com ficha: a app (painel da terapeuta) deixa aqui nome, data de nascimento e
// contacto por 15 minutos, neste aparelho, para não os escrever de novo.
function aplicarPrefillMapa(){
  try{
    const raw = localStorage.getItem('vd_prefill_mapa');
    if (!raw) return;
    const d = JSON.parse(raw);
    if (!d || !d.ts || Date.now() - d.ts > 15 * 60 * 1000){ localStorage.removeItem('vd_prefill_mapa'); return; }
    const put = (id, v) => { const el = document.getElementById(id); if (el && v && !el.value) el.value = v; };
    put('inpNome', d.nome); put('inpData', d.nascimento); put('inpContacto', d.contacto);
  }catch(_){}
}

// ── Limite da leitura grátis: uma por semana por contacto (verificado no servidor); alunos com código ──
const LIM_DIAS = 7;
const LG_URL = 'https://europe-west1-saudecare-app.cloudfunctions.net/leituraGratis';
(function(){ try{ const a = new URLSearchParams(location.search).get('aluno'); if (a) localStorage.setItem('vd_aluno_cod', a); }catch(_){} })();
function codigoAlunoGuardado(){ try{ return localStorage.getItem('vd_aluno_cod') || ''; }catch(_){ return ''; } }
function proximaLeituraGratis(){ try{ const t = parseInt(localStorage.getItem('vd_gratis_semana') || '0', 10); if (!t) return 0; const n = t + LIM_DIAS * 864e5; return n > Date.now() ? n : 0; }catch(_){ return 0; } }
function registarLeituraGratis(){ try{ localStorage.setItem('vd_gratis_semana', String(Date.now())); }catch(_){} }
async function verificarLeituraGratis(contacto){
  const codigo = codigoAlunoGuardado();
  if (!codigo){ const p = proximaLeituraGratis(); if (p) return { ok:false, proxima:p }; }
  try{
    const r = await fetch(LG_URL, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify({ data:{ contacto, codigo } }) });
    const j = (await r.json()).result;
    if (j && j.permitido === false) return { ok:false, proxima:j.proxima };
    if (j && j.aluno) return { ok:true };
  }catch(_){ /* sem rede para a verificação: não bloqueia */ }
  if (!codigo) registarLeituraGratis();
  return { ok:true };
}

async function loadAndShowPrice(leadId){
  try{
    const res = await fetch(FUNCTION_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getPrice', tenantId: TENANT_ID, leadId })
    });
    const data = await res.json();
    if (!data.ok) return;
    const box = document.getElementById('priceBox');
    if (!box) return;
    if (data.promoActive){
      let extra = '';
      if (data.promoMode === 'until' && data.promoUntil){
        extra = `<div id="promoCountdown" class="muted" style="margin-top:4px;font-size:.8rem;"></div>`;
        startPromoCountdown(data.promoUntil);
      } else if (data.promoMode === 'maxOrders' && data.promoOrdersLeft != null){
        extra = `<div class="muted" style="margin-top:4px;font-size:.8rem;">⚡ Restam ${data.promoOrdersLeft} vagas a este preço</div>`;
      }
      box.innerHTML = `
        <p class="teaser-tag" style="background:rgba(220,60,60,.25);color:#ffb3b3;">🔥 PREÇO DE LANÇAMENTO</p>
        <div style="margin-top:6px;">

          <span style="color:var(--gold-light);font-size:1.8rem;font-weight:800;margin-left:8px;">${data.price}€</span>
        </div>
        ${extra}
      `;
    } else {
      box.innerHTML = `<div style="color:var(--gold-light);font-size:1.6rem;font-weight:800;">${data.price}€</div>`;
    }
  }catch(e){ /* se falhar, o preço só aparece no ecrã de pagamento — não bloqueia nada */ }
}
function startPromoCountdown(untilIso){
  const el = document.getElementById('promoCountdown');
  if (!el) return;
  function tick(){
    const diff = new Date(untilIso).getTime() - Date.now();
    if (diff <= 0){ el.textContent = '⏳ Promoção a terminar...'; return; }
    const h = Math.floor(diff/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
    const d = Math.floor(h/24);
    el.textContent = `⏳ Termina em ${d>0?d+'d ':''}${(h%24).toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
  }
  tick();
  setInterval(tick, 1000);
}

let __checkoutEmCurso = false;
async function startCheckout(leadId, extra, metodo){
  // Impede dois pedidos ao mesmo tempo — um duplo clique, ou clicar num
  // método e depois no outro antes da página mudar, chegava a disparar
  // dois checkouts em simultâneo.
  if (__checkoutEmCurso) return;
  __checkoutEmCurso = true;
  main.innerHTML = '<div class="loading">A preparar o pagamento…</div>';
  try{

      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'createCheckout', tenantId: TENANT_ID, leadId, extra, metodo })
    });

    if (!res.ok || !data.ok) throw new Error(data.error || 'Erro desconhecido');
    if (data.checkoutUrl) window.location.href = data.checkoutUrl;
    else { __checkoutEmCurso = false; renderManualPayment(leadId, data.paymentInfo || {}); }

      <button class="btn btn-ghost" style="margin-top:10px;" onclick="renderPaymentChoice('${leadId}', ${JSON.stringify(extra)})">← Tentar outra vez</button>`;

const NAVY = [20, 20, 45];
const GOLD = [200, 160, 60];
const GOLD_LIGHT = [230, 200, 120];
const GREEN_BG = [232, 245, 236];
const GREEN_BAR = [70, 150, 100];
const RED_BG = [252, 235, 233];
const RED_BAR = [190, 80, 70];
const CREAM_BG = [246, 240, 226];
const TEXT_DARK = [40, 30, 20];
const MUTED = [100, 90, 110];

function downloadFullReportPDF(r, full, dom){
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'pt', format:'a4' });
  const pageW = pdf.internal.pageSize.getWidth();
  const pageH = pdf.internal.pageSize.getHeight();
  const marginX = 44;
  const contentW = pageW - marginX*2;
  let y = 0;
  let pageNum = 1;

  function drawSlimHeader(){
    pdf.setFillColor(...NAVY);
    pdf.rect(0, 0, pageW, 46, 'F');
    pdf.setTextColor(...GOLD_LIGHT);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(13);
    pdf.text('HIKARI FAFE', marginX, 29);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9);
    pdf.setTextColor(255,255,255);
    pdf.text('Mapa da Alma Diamante', pageW-marginX, 29, { align:'right' });
    y = 68;
  }
  function drawFooter(){
    pdf.setDrawColor(220,220,220);
    pdf.line(marginX, pageH-36, pageW-marginX, pageH-36);
    pdf.setFont('helvetica','normal'); pdf.setFontSize(8);
    pdf.setTextColor(...MUTED);
    pdf.text('Hikari Fafe — Desenvolvimento Pessoal & Terapia Holística', marginX, pageH-22);
    pdf.text(`Página ${pageNum}`, pageW-marginX, pageH-22, { align:'right' });
  }
  function newPage(){
    drawFooter();
    pdf.addPage();
    pageNum++;
    drawSlimHeader();
  }
  function ensureSpace(h){
    if (y + h > pageH - 50) newPage();
  }
  function heading(text, num){
    ensureSpace(30);
    pdf.setFont('helvetica','bold'); pdf.setFontSize(12.5);
    pdf.setTextColor(...NAVY);
    pdf.text(`${num}. ${text}`, marginX, y);
    pdf.setDrawColor(...GOLD);
    pdf.setLineWidth(1.2);
    pdf.line(marginX, y+5, pageW-marginX, y+5);
    y += 20;
  }
  function paragraph(text, opts={}){
    pdf.setFont('helvetica', opts.bold ? 'bold' : 'normal');
    pdf.setFontSize(opts.size || 10);
    pdf.setTextColor(...(opts.color || TEXT_DARK));
    const lines = pdf.splitTextToSize(text, opts.width || contentW);
    ensureSpace(lines.length * 13 + 6);
    pdf.text(lines, marginX + (opts.indent||0), y);
    y += lines.length * 13 + (opts.gap ?? 8);
  }
  function bullet(text){
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9.5);
    pdf.setTextColor(...TEXT_DARK);
    const lines = pdf.splitTextToSize(text, contentW - 16);
    ensureSpace(lines.length * 12 + 4);
    pdf.text('•', marginX, y);
    pdf.text(lines, marginX + 12, y);
    y += lines.length * 12 + 5;
  }
  function imagensLinha(itens){
    itens = (itens || []).filter(i => i && i.src);
    if (!itens.length) return;
    const H = Math.max(...itens.map(i => i.h)) + 24;
    ensureSpace(H + 8);
    let x = marginX;
    itens.forEach(i => {
      try { pdf.addImage(i.src, i.fmt, x, y, i.w, i.h); } catch (e) {}
      pdf.setFont('helvetica','normal'); pdf.setFontSize(8); pdf.setTextColor(...MUTED);
      pdf.text(i.label, x + i.w/2, y + i.h + 11, { align:'center' });
      x += i.w + 18;
    });
    y += H + 4;
  }
  function calloutBox(title, items, bg, bar, textColor){
    const lineTexts = items.map(it => pdf.splitTextToSize(it, contentW - 34));
    const totalLines = lineTexts.reduce((a,l) => a + l.length, 0);
    const boxH = 26 + totalLines*12 + items.length*4;
    ensureSpace(boxH + 10);
    pdf.setFillColor(...bg);
    pdf.rect(marginX, y, contentW, boxH, 'F');
    pdf.setFillColor(...bar);
    pdf.rect(marginX, y, 4, boxH, 'F');
    pdf.setFont('helvetica','bold'); pdf.setFontSize(10.5);
    pdf.setTextColor(...textColor);
    pdf.text(title, marginX+14, y+17);
    let iy = y+32;
    pdf.setFont('helvetica','normal'); pdf.setFontSize(9.5);
    pdf.setTextColor(...TEXT_DARK);
    lineTexts.forEach(lines => {
      pdf.text('•', marginX+14, iy);
      pdf.text(lines, marginX+26, iy);
      iy += lines.length*12 + 4;
    });
    y += boxH + 12;
  }

  // ── Capa / Cabeçalho ──

  paragraph(full.excessoTexto || '');
  if (full.mediunidadeTexto) paragraph('✨ ' + full.mediunidadeTexto);

  heading('O Corpo e a Imunidade Energética', 'IV');

  bullet(`Significado: ${full.chakraInfo?.significado||''}`);

  if (full.vibMatricula!=null){ const _g = guiaHarmonizar(full.vibMatricula, 'matricula'); if (_g){ paragraph(_g.titulo, { bold:true, size:9.5, gap:2 }); _g.passos.forEach((p,i) => bullet((i+1) + '. ' + p)); } }
  (full.vibContactos||[]).forEach(c => paragraph(`Contacto ${c.numero}: vibração ${c.vibracao} — ${c.texto}`));
  (full.vibFrota||[]).forEach(f => paragraph(`Matrícula ${f.matricula}: vibração ${f.vibracao} — ${f.texto}`));

  if (r.tipo !== 'casal' && r.caminhoDeVida){
    const _ab = guiaAbundancia(r.caminhoDeVida);
    heading(_ab.titulo, 'IX.0');
    paragraph(_ab.intro);
    paragraph('Para o dinheiro', { bold:true, gap:2 }); _ab.dinheiro.forEach((p,i) => bullet((i+1) + '. ' + p));
    paragraph('Para a família e a casa', { bold:true, gap:2 }); _ab.familia.forEach((p,i) => bullet((i+1) + '. ' + p));
    paragraph(_ab.aviso, { size:9 });
  }
  if (r.tipo !== 'casal' && r.caminhoDeVida){
    const _au = guiaAutonomia(r.caminhoDeVida);
    heading(_au.titulo, 'IX.00');
    paragraph(_au.intro);
    _au.pilares.forEach(p => { paragraph(p.nome.replace(/^\S+\s/, ''), { bold:true, gap:2 }); p.passos.forEach(x => bullet('• ' + x)); });
    paragraph('Sinais de recaída', { bold:true, gap:2 }); _au.recaida.forEach(x => bullet('• ' + x));
    paragraph(_au.aviso, { size:9 });
  }
  if (full.grupo){
    heading('Leitura de Grupo', 'IX.1');
    paragraph(`Vibração conjunta: ${full.grupo.vibracaoGrupo} — ${full.grupo.vibracaoGrupoTexto}`, { bold:true, gap:2 });
    paragraph(full.grupo.harmoniaTexto, { size:9.5 });
    full.grupo.elementos.forEach(e => {
      paragraph(`${e.nome} — Caminho de Vida ${e.caminhoDeVida} · ${e.signo} (${e.elemento}, regido por ${e.regente})`, { bold:true, gap:1 });
      paragraph(`Dom natural: ${e.dom}`, { size:9 });
    });
  }
  if (full.avisoEmpresa){
    heading('Vibração do Negócio', 'IX.1');
    paragraph(full.avisoEmpresa, { size:9.5 });
  }
  if (full.casal){
    heading('O Casal — Perfil de ' + full.casal.perfil1.nome, 'IX.2');
    paragraph(`Caminho de Vida: ${full.casal.perfil1.caminhoDeVida} · Signo: ${full.casal.perfil1.signo} (${full.casal.perfil1.elemento}, regido por ${full.casal.perfil1.regente})`, { bold:true, gap:2 });
    paragraph(`Papel na relação: ${full.casal.perfil1.papelRelacao}`, { size:9.5 });
    paragraph(full.casal.perfil1.luzRelacao, { size:9.5 });
    paragraph(full.casal.perfil1.sombraRelacao, { size:9.5 });

    heading('O Casal — Perfil de ' + full.casal.perfil2.nome, 'IX.3');
    paragraph(`Caminho de Vida: ${full.casal.perfil2.caminhoDeVida} · Signo: ${full.casal.perfil2.signo} (${full.casal.perfil2.elemento}, regido por ${full.casal.perfil2.regente})`, { bold:true, gap:2 });
    paragraph(`Papel na relação: ${full.casal.perfil2.papelRelacao}`, { size:9.5 });
    paragraph(full.casal.perfil2.luzRelacao, { size:9.5 });
    paragraph(full.casal.perfil2.sombraRelacao, { size:9.5 });

    heading('Compatibilidade do Casal', 'IX.4');
    paragraph(`Vibração do casal enquanto unidade: ${full.casal.vibracaoCasal} — ${full.casal.vibracaoCasalTexto}`, { bold:true, gap:2 });
    paragraph(full.casal.compatNumero.texto, { size:9.5 });
    paragraph(full.casal.compatNumero.conselho, { size:9.5 });
    if (full.casal.compatElemento) paragraph(`Elementos (${full.casal.compatElemento.nivel}): ${full.casal.compatElemento.texto}`, { size:9.5 });
    if (full.casal.mediunidadeCasal) paragraph('Um de vocês (ou os dois) carrega o Número Mestre 11 — sensibilidade intuitiva acima da média como casal.', { size:9.5 });
    if (full.casal.moradaConjunta) paragraph(`Morada partilhada — vibração ${full.casal.moradaConjunta.vibracao} (${full.casal.moradaConjunta.texto}).`, { size:9.5 });
    paragraph(full.casal.ajusteEnergia, { size:9.5 });
    paragraph(full.casal.compatNumero.ritualCasal, { size:9.5 });
  }

  heading('Plano de Ativação (7–21 dias)', 'X');
  paragraph(full.planoAtivacao || '', { size:9.5 });

  ensureSpace(40);
  pdf.setFont('helvetica','italic'); pdf.setFontSize(9); pdf.setTextColor(...GOLD);
  paragraph('"O Mapa da Alma revela a sua frequência para que possa caminhar com clareza, verdade e poder pessoal."', { size:9 });

  drawFooter();
  pdf.save(`Mapa-da-Alma-Diamante-${r.nome.replace(/\s+/g,'-')}.pdf`);
}

(async function init(){
  await loadOverrides();
  if (existingToken) renderFullResult(existingToken);
  else renderTypeSelector();
})();
</script>
</body>
</html>
