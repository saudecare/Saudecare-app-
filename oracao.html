<style>

  html[data-tema="claro"]{--bg:#faf8f4;--card:#ffffff;--tinta:#26303b;--suave:#66707c;--linha:#e3ddd0;--marca:#1e3a5f;--dest:#b7791f;--caixa:#eef3f9;--aviso:#fdf3e1;--on:#ffffff;}

  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--tinta);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.7;min-height:100dvh;padding-bottom:max(48px,env(safe-area-inset-bottom));transition:background .25s,color .25s;}
  .barra{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--linha);padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;gap:6px;align-items:center;justify-content:space-between;}

  .barra button{min-width:44px;min-height:44px;border:1px solid var(--linha);background:var(--card);color:var(--tinta);border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;padding:0 10px;}
  .barra button.on{background:var(--marca);color:var(--on);border-color:var(--marca);}
  .barra .marca{font-size:.82rem;font-weight:700;letter-spacing:.04em;color:var(--marca);display:flex;align-items:center;gap:8px;min-width:0;}

  .corpo p{margin:0 0 .9em;text-wrap:pretty;}
  .corpo ul,.corpo ol{margin:0 0 .9em 1.25em;}
  .corpo li{margin-bottom:.5em;padding-left:.15em;}
  .corpo li::marker{color:var(--dest);font-weight:700;}
  section.aviso{background:var(--aviso);}
  section.aviso h2{color:var(--dest);}
  section.oracao{background:var(--caixa);padding:24px 18px;}
  section.oracao .corpo{font-family:Georgia,"Times New Roman",serif;font-size:calc(var(--fs) + .08rem);line-height:1.85;text-align:center;}
  section.oracao h2{text-align:center;font-family:Georgia,serif;font-size:1.2rem;}
  section.oracao .estrofe{margin:0 0 1.3em;}

  section.oracao .nota{font-family:-apple-system,"Segoe UI",sans-serif;font-style:italic;color:var(--suave);font-size:.92em;}

  .tabs button span{font-size:1.45rem;line-height:1.2;}

  .btn.grande{min-height:62px;font-size:1.15rem;margin:14px 0 10px;}
  .btn + .btn,.btn + .nav2,.cartaoHoje + .btn{margin-top:10px;}
  .btn[disabled]{opacity:.35;pointer-events:none;}
  .cartaoHoje{text-align:center;border:1px solid var(--linha);}
  .pontos{display:flex;justify-content:center;gap:8px;margin:4px 0 2px;}
  .pontos i{width:10px;height:10px;border-radius:50%;background:var(--linha);} .pontos i.ok{background:var(--dest);opacity:.6;} .pontos i.ac{background:var(--marca);transform:scale(1.35);}
  section.passo{min-height:52vh;display:flex;flex-direction:column;justify-content:center;margin-top:12px;}
  section.passo.fim .acao{border:none;text-align:left;}
  .nav2{display:flex;gap:10px;margin-top:12px;} .nav2 .btn{margin:0;flex:1;}
  .tit2{font-family:Georgia,serif;color:var(--marca);font-size:1.5rem;margin:6px 0 12px;text-align:center;}
  details.ac{background:var(--card);border:1px solid var(--linha);border-radius:16px;margin:10px 0;padding:0 16px;}
  details.ac.aviso{background:var(--aviso);}
  details.ac summary{list-style:none;cursor:pointer;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;color:var(--marca);font-size:1.05rem;}
  details.ac summary::-webkit-details-marker{display:none;} details.ac summary::after{content:'＋';font-size:1.3rem;color:var(--dest);} details.ac[open] summary::after{content:'−';}
  details.ac .corpo{padding:0 0 14px;}
  @media (min-width:700px){:root{--fs:1.2rem;} section{padding:26px 28px;}}
  @media (prefers-reduced-motion:reduce){.arte *{animation:none!important;} *{transition:none!important;scroll-behavior:auto!important;}}
  @media print{.tabs,.vol,#musica,.barra,.indice,#caminho .btn,.grelha{display:none!important;} body{background:#fff;color:#000;} section{border:none;break-inside:avoid;}}
</style>
</head>
<body>

    <button id="menos" aria-label="Diminuir letra">A−</button>

  </div>
</div>
<main id="app"><div class="estado">A abrir…</div></main>

<footer id="rodape" hidden>Prática espiritual e de bem-estar. Não substitui o acompanhamento médico ou psicológico.<br>Hikari Fafe · Corpo · Mente · Alma · Espírito</footer>

<script type="module">

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const lerLS = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } };

// ── preferências de leitura (tamanho da letra e fundo) ──
const pref = Object.assign({ fs: 1.125, tema: '' }, lerLS('vo_pref', {}));
if (!pref.tema) pref.tema = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'escuro' : 'claro';
function aplicarPref() {

  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = pref.tema === 'escuro' ? '#12151b' : pref.tema === 'sepia' ? '#f3ead6' : '#faf8f4';
  gravarLS('vo_pref', pref);
}
aplicarPref();
$('menos').onclick = () => { pref.fs = Math.max(0.95, +(pref.fs - 0.1).toFixed(2)); aplicarPref(); };
$('mais').onclick = () => { pref.fs = Math.min(1.8, +(pref.fs + 0.1).toFixed(2)); aplicarPref(); };

// ── ilustrações (SVG próprio, leves) ──
const ESTRELAS = [[30,40],[170,30],[20,120],[182,110],[60,18],[140,16],[100,6]].map(([x,y],i)=>`<path class="est" d="M${x} ${y-4}l1.3 2.7 2.7 1.3-2.7 1.3L${x} ${y+4}l-1.3-2.7-2.7-1.3 2.7-1.3z" fill="var(--dest)"/>`).join('');

<path d="M100 76v54M82 98h36" stroke="var(--dest)" stroke-width="4" stroke-linecap="round"/>

<g class="raio" stroke="var(--dest)" stroke-width="1.6" stroke-linecap="round" opacity=".45">${Array.from({length:12},(_,i)=>`<line x1="100" y1="16" x2="100" y2="30" transform="rotate(${i*30} 100 100)"/>`).join('')}</g>
<path d="M100 54c14 20 28 34 28 54a28 28 0 0 1-56 0c0-14 8-22 14-32 4 8 8 10 10 14 4-10 2-22 4-36z" fill="var(--dest)" stroke="var(--marca)" stroke-width="2.4" stroke-linejoin="round"/>
<path d="M100 96c8 10 14 16 14 26a14 14 0 0 1-28 0c0-8 6-14 14-26z" fill="var(--caixa)" opacity=".9"/>
<path d="M76 152h48M84 160h32" stroke="var(--marca)" stroke-width="3" stroke-linecap="round"/>
${ESTRELAS}</svg>`;
const ORNA = `<svg class="orna" viewBox="0 0 120 18" aria-hidden="true"><g fill="none" stroke="var(--dest)" stroke-width="1.6" stroke-linecap="round"><path d="M6 9h38M76 9h38"/><path d="M60 3l3 6-3 6-3-6z" fill="var(--dest)"/><circle cx="48" cy="9" r="1.6" fill="var(--dest)"/><circle cx="72" cy="9" r="1.6" fill="var(--dest)"/></g></svg>`;
const ICONE_SEMANA = (n) => {
  const c = '<svg class="tema-img" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="var(--marca)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">';
  if (n <= 7) return c + '<path d="M32 8C22 22 14 30 14 40a18 18 0 0 0 36 0C50 30 42 22 32 8z" fill="var(--caixa)"/><path d="M24 42a8 8 0 0 0 8 8" stroke="var(--dest)"/></g></svg>';
  if (n <= 14) return c + '<path d="M8 32c10-14 18 14 28 0s14-6 20-2"/><path d="M28 18l8 28M36 18l-8 28" stroke="var(--dest)"/></g></svg>';

// ── música ambiente (gerada no telemóvel, sem ficheiros) ──
const musica = { ctx: null, mestre: null, on: false, timer: null, vol: 0.25 };
const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [196, 246.94, 293.66], [164.81, 196, 246.94]]; // Lá m · Fá · Sol · Mi m (notas suaves)
function nota(f, t0, dur) {
  const c = musica.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = f; o.detune.value = (Math.random() - .5) * 8;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.16, t0 + dur * .45); g.gain.linearRampToValueAtTime(0, t0 + dur);

function tocarAcorde() {
  if (!musica.on) return; const c = musica.ctx; let t = c.currentTime + .05;

  musica.timer = setTimeout(tocarAcorde, 8000);

function iniciarMusica() {

  if (!musica.ctx) return; musica.on = false; clearTimeout(musica.timer);

}
function marcarMusica() { $('musica').classList.toggle('on', musica.on); $('musica').setAttribute('aria-pressed', musica.on); $('musica').textContent = musica.on ? '🔊' : '🎵'; $('vol').classList.toggle('on', musica.on); }
$('musica').onclick = () => { if (musica.on) pararMusica(); else if (!iniciarMusica()) { $('musica').style.display = 'none'; return; } marcarMusica(); };
musica.vol = Math.min(0.6, Math.max(0.05, (lerLS('vo_pref', {}).vol || 25) / 100)); $('volr').value = Math.round(musica.vol * 100);
$('volr').oninput = (e) => { musica.vol = e.target.value / 100; pref.vol = +e.target.value; gravarLS('vo_pref', pref); if (musica.on) musica.mestre.gain.linearRampToValueAtTime(musica.vol, musica.ctx.currentTime + .2); };
document.addEventListener('visibilitychange', () => { if (document.hidden && musica.on) { pararMusica(); marcarMusica(); } });

// ── texto: parágrafos e listas simples ──
function blocoTexto(t) {
  const partes = String(t || '').split(/\n\s*\n/);
  return partes.map((p) => {
    const linhas = p.split('\n').filter((l) => l.trim());
    if (!linhas.length) return '';
    const ehLista = (l) => /^\s*[•\-–]\s+/.test(l);
    let out = '', i = 0;
    while (i < linhas.length) {
      if (ehLista(linhas[i])) {
        let li = '';
        while (i < linhas.length && ehLista(linhas[i])) { li += `<li>${esc(linhas[i].replace(/^\s*[•\-–]\s+/, ''))}</li>`; i++; }
        out += `<ul>${li}</ul>`;
      } else { let par = []; while (i < linhas.length && !ehLista(linhas[i])) { par.push(esc(linhas[i])); i++; } out += `<p>${par.join('<br>')}</p>`; }
    }
    return out;
  }).join('');
}
function blocoOracao(t) {
  return String(t || '').split(/\n\s*\n/).map((e) => {
    const nota = /^\s*\(.*\)\s*$/.test(e.trim());
    return `<div class="estrofe${nota ? ' nota' : ''}">${esc(e.trim()).replace(/\n/g, '<br>')}</div>`;
  }).join('');
}

// ── caminho dos dias (guardado só neste telemóvel) ──
let O = null, id = '', est = { inicio: '', feitos: [], feitosEm: {}, vezes: 0 }, ver = 0, envioId = '', envio = null;
function guardarEst(extra) {
  gravarLS(chave(), est);
  if (!envioId) return;
  const d = Object.assign({ inicio: est.inicio || '', feitos: est.feitos, feitosEm: est.feitosEm || {}, vezes: est.vezes || 0, ultimaAtividade: new Date().toISOString() }, extra || {});
  updateDoc(doc(db, 'oracoes_envios', envioId), d).catch(() => { const a = document.getElementById('app'); if (a && !document.getElementById('avisoNet')) a.insertAdjacentHTML('afterbegin', '<div id="avisoNet" class="aviso-net">⚠️ Não consegui guardar o progresso na internet. Fica guardado neste telemóvel.</div>'); });
}
const chave = () => 'vo_c_' + (envioId || id);
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const proximo = () => { for (let n = 1; n <= O.dias; n++) if (!est.feitos.includes(n)) return n; return 0; };
function semanaDe(n) { return n <= 7 ? 'Semana 1 · Limpar' : n <= 14 ? 'Semana 2 · Cortar' : 'Semana 3 · Proteger e selar'; }

function desenharCaminho() {
  const el = $('caminho'); if (!el || !O.dias) return;
  const prox = proximo(); const feitos = est.feitos.length;
  if (!est.inicio) {
    el.innerHTML = `<h2>🗓️ O teu caminho de ${O.dias} dias</h2>
      <div class="corpo"><p>Quando estiveres pronto/a, começa. Cada dia tens aqui a intenção e uma pequena ação. O teu progresso fica guardado neste telemóvel.</p></div>
      <button class="btn" id="comecar">✨ Começar hoje</button>`;
    $('comecar').onclick = () => { est.inicio = hojeISO(); ver = 1; guardarEst(); mostrar(); };
    return;
  }
  if (!ver) ver = prox || O.dias;
  const t = (O.temasDias || [])[ver - 1] || {};
  const feito = est.feitos.includes(ver);
  const completo = feitos >= O.dias;
  let grelha = '';
  for (let n = 1; n <= O.dias; n++) grelha += `<button data-d="${n}" class="${est.feitos.includes(n) ? 'feito' : ''} ${n === prox ? 'prox' : ''} ${n === ver ? 'ver' : ''}" aria-label="Dia ${n}${est.feitos.includes(n) ? ', feito' : ''}">${est.feitos.includes(n) ? '✓' : n}</button>`;
  el.innerHTML = `<h2>🗓️ O teu caminho <span style="font-size:.9rem;color:var(--suave);font-weight:600;">${feitos} de ${O.dias}</span></h2>
    <div class="prog"><i style="width:${Math.round(feitos / O.dias * 100)}%"></i></div>
    ${completo ? `<div class="final">🌟 <b>Completaste os ${O.dias} dias.</b><br>Que a luz continue contigo. Parabéns!</div>` : ''}
    <div class="grelha" id="grelha">${grelha}</div>
    <div class="semana">${esc(semanaDe(ver))}</div>
    <div class="hoje">
      ${ICONE_SEMANA(ver)}
      <div class="dia">Dia ${ver}${ver === prox && !completo ? ' · o teu dia de hoje' : ''}</div>
      <h3>${esc(t.titulo || '')}</h3>
      ${t.intencao ? `<p><b>Intenção:</b> ${esc(t.intencao)}</p>` : ''}
      ${t.acao ? `<p class="acao"><b>Para este dia:</b> ${esc(t.acao)}</p>` : ''}
    </div>
    <button class="btn sec" id="irRezar">🙏 Rezar o dia ${ver}</button>
    <button class="btn" id="marcar" style="margin-top:10px">${feito ? '↩ Desmarcar o dia ' + ver : '✅ Já fiz o dia ' + ver}</button>`;
  $('irRezar').onclick = () => irPara('rezar');
  $('grelha').onclick = (e) => { const b = e.target.closest('button[data-d]'); if (!b) return; ver = +b.dataset.d; desenharCaminho(); };
  $('marcar').onclick = () => {
    const i = est.feitos.indexOf(ver);
    if (i >= 0) { est.feitos.splice(i, 1); delete est.feitosEm[ver]; } else { est.feitos.push(ver); est.feitos.sort((a, b) => a - b); est.feitosEm[ver] = new Date().toISOString(); const p = proximo(); if (p) ver = p; }
    guardarEst(); desenharCaminho();
  };
}

// ── navegação por separadores (um ecrã de cada vez) ──
let vista = 'inicio', passo = 0, feitoAgora = false;
const seccoes = () => (O.seccoes || []);
const oracoes = () => seccoes().filter((s) => s.tipo === 'oracao');
const infos = () => seccoes().filter((s) => s.tipo !== 'oracao');
function irPara(v) { vista = v; passo = 0; mostrar(); window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' }); }
function corpoSeccao(s) {
  if (s.tipo === 'passos') return `<ol class="passos">${(s.itens || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`;
  if (s.tipo === 'oracao') return blocoOracao(s.texto);
  return blocoTexto(s.texto);
}
function passosRezar() {
  const l = oracoes().map((s) => ({ t: 'oracao', s }));
  l.push({ t: 'fim' }); return l;
}
function ecraInicio() {
  const prox = O.dias ? proximo() : 0, comecou = O.dias && est.inicio, completo = O.dias && est.feitos.length >= O.dias;
  const arte = O.tipo === 'ciclo' || /🛡|⚔/.test(O.emoji || '') ? ARTE_ESCUDO : ARTE_LUZ;
  let h = `<div class="capa">${arte}${envio && envio.patientNome ? `<p class="ola">Olá, ${esc(String(envio.patientNome).split(' ')[0])} 🌿</p>` : ''}<h1>${esc(O.titulo)}</h1>${O.subtitulo ? `<p>${esc(O.subtitulo)}</p>` : ''}</div>`;
  if (O.dias && comecou && !completo) {
    const t = (O.temasDias || [])[prox - 1] || {};
    h += `<div class="hoje cartaoHoje">${ICONE_SEMANA(prox)}<div class="dia">Dia ${prox} de ${O.dias} · hoje</div><h3>${esc(t.titulo || '')}</h3>${t.intencao ? `<p>${esc(t.intencao)}</p>` : ''}</div>`;
  } else if (completo) h += `<div class="final">🌟 <b>Completaste os ${O.dias} dias.</b><br>Que a luz continue contigo.</div>`;
  h += `<button class="btn grande" id="bRezar">🙏 ${O.dias && comecou && !completo ? 'Rezar o dia ' + prox : 'Começar a rezar'}</button>`;
  if (O.dias) h += `<button class="btn sec" id="bCam">🗓️ O meu caminho${comecou ? ' · ' + est.feitos.length + '/' + O.dias : ''}</button>`;
  if (infos().length) h += `<button class="btn sec" id="bSaber">📖 Saber mais: para que serve e como fazer</button>`;
  return h;
}
function ecraRezar() {
  const ps = passosRezar(), n = ps.length; passo = Math.min(passo, n - 1);
  const p = ps[passo];
  let h = `<div class="pontos" aria-label="Passo ${passo + 1} de ${n}">${ps.map((_, k) => `<i class="${k === passo ? 'ac' : k < passo ? 'ok' : ''}"></i>`).join('')}</div>`;
  if (p.t === 'oracao') {
    h += `<section class="oracao passo">${ORNA}${p.s.titulo ? `<h2>${esc(p.s.titulo)}</h2>` : ''}<div class="corpo">${corpoSeccao(p.s)}</div></section>`;
  } else {
    const t = O.dias ? (O.temasDias || [])[ver - 1] : null;
    const ultimo = O.dias && ver === O.dias;
    const selar = ultimo ? seccoes().find((x) => x.tipo === 'texto' && /selar|21/i.test(x.titulo || '')) : null;
    h += `<section class="oracao passo fim">${ORNA}<h2>🌟 Amén. Está feito.</h2><div class="corpo"><p>Respira fundo e agradece.</p>${t && t.acao ? `<p class="acao"><b>Para hoje:</b> ${esc(t.acao)}</p>` : ''}${selar ? `<div style="text-align:left">${blocoTexto(selar.texto)}</div>` : ''}</div></section>`;
    if (O.dias) h += `<button class="btn grande" id="bFeito">${est.feitos.includes(ver) ? '↩ Desmarcar o dia ' + ver : '✅ Já fiz o dia ' + ver}</button>`;
    else h += `<button class="btn grande" id="bRezei">${feitoAgora ? '✅ Registado. Obrigado!' : '🙏 Já rezei'}</button>${est.vezes ? `<p style="text-align:center;color:var(--suave)">Já rezaste ${est.vezes} ${est.vezes === 1 ? 'vez' : 'vezes'} com este link.</p>` : ''}`;
  }
  h += `<div class="nav2"><button class="btn sec" id="bAnt" ${passo === 0 ? 'disabled' : ''}>← Anterior</button>${passo < n - 1 ? '<button class="btn" id="bSeg">Seguinte →</button>' : '<button class="btn" id="bIni">🏠 Início</button>'}</div>`;
  return h;
}
function ecraSaber() {
  const l = infos(); if (!l.length) return '<div class="estado">Sem mais informação.</div>';
  return `<h1 class="tit2">📖 Saber mais</h1>` + l.map((s, k) => `<details class="ac ${s.tipo === 'aviso' ? 'aviso' : ''}" ${k === 0 ? 'open' : ''}><summary>${s.tipo === 'aviso' ? '⚠️ ' : ''}${esc(s.titulo || 'Texto')}</summary><div class="corpo">${corpoSeccao(s)}</div></details>`).join('');
}
function mostrar() {
  const temC = !!O.dias, temS = infos().length > 0;
  let h;
  if (vista === 'caminho' && temC) h = '<section id="caminho"></section>';
  else if (vista === 'rezar') h = ecraRezar();
  else if (vista === 'saber' && temS) h = ecraSaber();
  else { vista = 'inicio'; h = ecraInicio(); }
  const tabs = [['inicio', '🏠', 'Início'], ['rezar', '🙏', 'Rezar']].concat(temC ? [['caminho', '🗓️', 'Caminho']] : [], temS ? [['saber', '📖', 'Saber mais']] : []);
  $('app').innerHTML = h + (navigator.share && vista === 'inicio' ? `<button class="btn sec" id="partilhar">📤 Partilhar com alguém</button>` : '');
  $('tabs').innerHTML = tabs.map(([v, e, t]) => `<button data-v="${v}" class="${v === vista ? 'ac' : ''}"><span>${e}</span>${t}</button>`).join('');
  $('tabs').hidden = false;
  if (vista === 'caminho') desenharCaminho();
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on('bRezar', () => irPara('rezar')); on('bCam', () => irPara('caminho')); on('bSaber', () => irPara('saber'));
  on('bSeg', () => { passo++; mostrar(); window.scrollTo(0, 0); }); on('bAnt', () => { passo = Math.max(0, passo - 1); mostrar(); window.scrollTo(0, 0); });
  on('bIni', () => irPara('inicio'));
  on('bRezei', () => { if (feitoAgora) return; est.vezes = (est.vezes || 0) + 1; feitoAgora = true; guardarEst(); mostrar(); });
  on('bFeito', () => {
    if (!est.inicio) est.inicio = hojeISO();
    const k = est.feitos.indexOf(ver);
    if (k >= 0) { est.feitos.splice(k, 1); delete est.feitosEm[ver]; } else { est.feitos.push(ver); est.feitos.sort((a, b) => a - b); est.feitosEm[ver] = new Date().toISOString(); }
    guardarEst(); const nx = proximo(); if (nx) ver = nx; feitoAgora = k < 0; irPara('inicio');
  });
  on('partilhar', () => navigator.share({ title: O.titulo, url: location.href }).catch(() => {}));
}
$('tabs').onclick = (e) => { const b = e.target.closest('button[data-v]'); if (b) irPara(b.dataset.v); };
function desenhar() {
  document.title = (O.titulo || 'Oração') + ' — Hikari Fafe';
  est = Object.assign({ inicio: '', feitos: [], feitosEm: {}, vezes: 0 }, lerLS(chave(), {}));
  if (envio) { est.inicio = envio.inicio || est.inicio; est.feitos = (envio.feitos || est.feitos).slice(); est.feitosEm = envio.feitosEm || est.feitosEm || {}; est.vezes = envio.vezes || 0; }
  if (O.dias) ver = proximo() || O.dias;
  $('barra').hidden = false; $('rodape').hidden = false;
  mostrar();
}


// ── link geral: cada pessoa recebe o seu próprio acesso (e fica a lembrar-se neste telemóvel) ──
function acessoPessoal() {
  let t = ''; try { t = localStorage.getItem('vo_t_' + id) || ''; } catch (_) {}
  if (t) { location.replace(location.pathname + '?e=' + encodeURIComponent(t)); return; }
  document.title = (O.titulo || 'Oração') + ' — Hikari Fafe';
  const antigo = lerLS('vo_c_' + id, null); // progresso feito antes, só neste telemóvel: é mantido
  const feitosAntes = antigo && antigo.feitos ? antigo.feitos.length : 0;
  $('barra').hidden = false;
  $('app').innerHTML = `<div class="capa">${O.tipo === 'ciclo' || /🛡|⚔/.test(O.emoji || '') ? ARTE_ESCUDO : ARTE_LUZ}<h1>${esc(O.titulo)}</h1>${O.subtitulo ? `<p>${esc(O.subtitulo)}</p>` : ''}</div>
    <section style="text-align:center"><h2>🌿 Antes de começar</h2><div class="corpo"><p>Escreve o teu nome. Fica com um acesso só teu, que guarda o teu progresso e ao qual podes voltar quando quiseres.${feitosAntes ? `<br><b>Já tens ${feitosAntes} ${feitosAntes === 1 ? 'dia feito' : 'dias feitos'} e vamos mantê-${feitosAntes === 1 ? 'lo' : 'los'}.</b>` : ''}</p></div>
    <input id="nomeP" type="text" maxlength="80" autocomplete="name" placeholder="O teu nome" style="width:100%;min-height:52px;font-size:1.1rem;padding:10px 14px;border:2px solid var(--linha);border-radius:14px;background:var(--bg);color:var(--tinta);margin:6px 0 12px;">
    <button class="btn grande" id="entrarP">Entrar 🙏</button><p id="errP" style="color:#b3261e;margin-top:8px"></p></section>`;
  $('entrarP').onclick = async () => {
    const nome = $('nomeP').value.trim();
    if (nome.length < 2) { $('errP').textContent = 'Escreve o teu nome, por favor.'; return; }
    $('entrarP').disabled = true; $('entrarP').textContent = 'A criar o teu acesso…';
    const agora = new Date().toISOString();
    try {
      const r = await addDoc(collection(db, 'oracoes_envios'), {
        tenantId: 'hikari-terapias', oracaoId: id, titulo: O.titulo || '', patientId: '', patientNome: nome, origem: 'auto',
        feitos: (antigo && antigo.feitos) || [], feitosEm: {}, inicio: (antigo && antigo.inicio) || '', vezes: (antigo && antigo.vezes) || 0,
        abertoEm: agora, ultimaAtividade: agora, criadoEmIso: agora });
      try { localStorage.setItem('vo_t_' + id, r.id); } catch (_) {}
      location.replace(location.pathname + '?e=' + encodeURIComponent(r.id));
    } catch (_) { $('entrarP').disabled = false; $('entrarP').textContent = 'Entrar 🙏'; $('errP').textContent = 'Não consegui criar o acesso. Verifica a internet e tenta outra vez.'; }
  };
}
const q = new URLSearchParams(location.search);
id = q.get('o') || ''; envioId = q.get('e') || '';
const erro = (t, m) => { $('app').innerHTML = `<div class="estado"><h2>${t}</h2><p>${m}</p></div>`; };
(async () => {
  try {
    if (envioId) {
      const se = await getDoc(doc(db, 'oracoes_envios', envioId));
      if (!se.exists()) { try { for (const k of Object.keys(localStorage)) if (k.startsWith('vo_t_') && localStorage.getItem(k) === envioId) localStorage.removeItem(k); } catch (_) {} return erro('Link não encontrado', 'O link pode estar incompleto ou ter sido apagado. Pede um novo link a quem te enviou.'); }
      envio = se.data(); id = envio.oracaoId; try { localStorage.setItem('vo_t_' + id, envioId); } catch (_) {}
      updateDoc(doc(db, 'oracoes_envios', envioId), { abertoEm: new Date().toISOString(), ultimaAtividade: new Date().toISOString() }).catch(() => {});
    }
    if (!id) return erro('Link inválido', 'Pede um novo link a quem te enviou.');
    const s = await getDoc(doc(db, 'oracoes', id));
    if (!s.exists()) return erro('Não encontrei esta oração', 'O link pode ter sido apagado ou estar incompleto. Pede um novo link.');
    O = s.data();
    if (!envioId && !q.get('pre')) return acessoPessoal();
    desenhar();
  } catch (_) { erro('Sem ligação', 'Verifica a internet e tenta outra vez.'); }
})();
</script>
