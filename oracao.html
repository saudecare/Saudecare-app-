<!DOCTYPE html>
<html lang="pt-PT" data-tema="claro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1e3a5f">
<title>Oração — Hikari Fafe</title>
<style>
  :root{--fs:1.125rem;}
  html[data-tema="claro"]{--bg:#faf8f4;--card:#ffffff;--tinta:#26303b;--suave:#66707c;--linha:#e3ddd0;--marca:#1e3a5f;--dest:#b7791f;--caixa:#eef3f9;--aviso:#fdf3e1;--on:#ffffff;}
  html[data-tema="sepia"]{--bg:#f3ead6;--card:#f9f1df;--tinta:#3b3024;--suave:#7b6a55;--linha:#dccdae;--marca:#7a4a1d;--dest:#9a5b12;--caixa:#efe3c8;--aviso:#f6e8c8;--on:#ffffff;}
  html[data-tema="escuro"]{--bg:#12151b;--card:#1b2029;--tinta:#e9e6df;--suave:#a4a8b0;--linha:#2d3441;--marca:#8fb4e8;--dest:#e3b25b;--caixa:#1f2b3d;--aviso:#2c2619;--on:#12151b;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;}
  body{background:var(--bg);color:var(--tinta);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.7;min-height:100dvh;padding-bottom:max(48px,env(safe-area-inset-bottom));transition:background .25s,color .25s;}
  .barra{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--linha);padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;gap:6px;align-items:center;justify-content:space-between;}
  .barra .grupo{display:flex;gap:6px;align-items:center;}
  .barra button{min-width:44px;min-height:44px;border:1px solid var(--linha);background:var(--card);color:var(--tinta);border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;padding:0 10px;}
  .barra button.on{background:var(--marca);color:var(--on);border-color:var(--marca);}
  .barra .marca{font-size:.82rem;font-weight:700;letter-spacing:.04em;color:var(--marca);display:flex;align-items:center;gap:8px;min-width:0;}
  .barra .marca img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex-shrink:0;}
  .barra .marca span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  main{max-width:40rem;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));}
  .capa{text-align:center;padding:22px 8px 8px;}
  .capa .emoji{font-size:2.6rem;line-height:1;}
  .capa h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.55rem,6vw,2.1rem);line-height:1.2;color:var(--marca);margin:10px 0 6px;text-wrap:balance;}
  .capa p{color:var(--suave);font-size:1rem;text-wrap:balance;}
  .indice{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .indice::-webkit-scrollbar{display:none;}
  .indice a{flex:0 0 auto;border:1px solid var(--linha);background:var(--card);color:var(--tinta);text-decoration:none;border-radius:999px;padding:9px 14px;font-size:.88rem;font-weight:600;min-height:40px;display:flex;align-items:center;}
  section{background:var(--card);border:1px solid var(--linha);border-radius:18px;padding:20px 18px;margin:16px 0;scroll-margin-top:72px;}
  section h2{font-size:1.12rem;color:var(--marca);margin-bottom:10px;line-height:1.3;}
  .corpo{font-size:var(--fs);}
  .corpo p{margin:0 0 .9em;text-wrap:pretty;}
  .corpo ul,.corpo ol{margin:0 0 .9em 1.25em;}
  .corpo li{margin-bottom:.5em;padding-left:.15em;}
  .corpo li::marker{color:var(--dest);font-weight:700;}
  section.aviso{background:var(--aviso);}
  section.aviso h2{color:var(--dest);}
  section.oracao{background:var(--caixa);padding:24px 18px;}
  section.oracao .corpo{font-family:Georgia,"Times New Roman",serif;font-size:calc(var(--fs) + .08rem);line-height:1.85;text-align:center;}
  section.oracao h2{text-align:center;font-family:Georgia,serif;font-size:1.2rem;}
  section.oracao .estrofe{margin:0 0 1.3em;}
  section.oracao .estrofe:last-child{margin-bottom:0;}
  section.oracao .nota{font-family:-apple-system,"Segoe UI",sans-serif;font-style:italic;color:var(--suave);font-size:.92em;}
  .corpo .passos{list-style:none;margin:0;padding:0;counter-reset:p;}
  .passos li{counter-increment:p;position:relative;padding:0 0 0 2.6rem;margin-bottom:1em;min-height:2rem;}
  .passos li::before{content:counter(p);position:absolute;left:0;top:.1em;width:2rem;height:2rem;border-radius:50%;background:var(--marca);color:var(--on);font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;}
  /* caminho de 21 dias */
  #caminho{border:2px solid var(--dest);}
  #caminho h2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;}
  .prog{height:10px;background:var(--linha);border-radius:99px;overflow:hidden;margin:6px 0 14px;}
  .prog i{display:block;height:100%;background:var(--dest);border-radius:99px;transition:width .35s;}
  .grelha{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:16px;}
  .grelha button{aspect-ratio:1/1;min-height:40px;border-radius:50%;border:2px solid var(--linha);background:var(--card);color:var(--tinta);font-size:.95rem;font-weight:700;cursor:pointer;padding:0;}
  .grelha button.feito{background:var(--dest);border-color:var(--dest);color:var(--on);}
  .grelha button.prox{border-color:var(--marca);box-shadow:0 0 0 3px color-mix(in srgb,var(--marca) 25%,transparent);}
  .grelha button.ver{outline:3px solid var(--marca);outline-offset:2px;}
  .semana{font-size:.78rem;color:var(--suave);margin:-6px 0 8px;text-transform:uppercase;letter-spacing:.06em;}
  .hoje{background:var(--caixa);border-radius:14px;padding:14px 14px;margin-bottom:12px;}
  .hoje .dia{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--dest);font-weight:700;}
  .hoje h3{font-family:Georgia,serif;font-size:1.25rem;color:var(--marca);margin:2px 0 8px;line-height:1.3;}
  .hoje p{font-size:calc(var(--fs) - .05rem);margin:0 0 .6em;}
  .hoje .acao{border-left:4px solid var(--dest);padding-left:10px;}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:none;border-radius:14px;background:var(--marca);color:var(--on);font-size:1.02rem;font-weight:700;cursor:pointer;padding:12px 16px;text-decoration:none;}
  .btn.sec{background:transparent;color:var(--marca);border:2px solid var(--marca);}
  .btn + .btn{margin-top:10px;}
  .final{text-align:center;padding:10px 4px;font-size:1.05rem;}
  .estado{text-align:center;padding:70px 20px;color:var(--suave);}
  footer{max-width:40rem;margin:24px auto 0;padding:0 18px;text-align:center;color:var(--suave);font-size:.78rem;line-height:1.55;}

  .arte{display:block;margin:0 auto 6px;width:min(260px,70vw);height:auto;}
  .arte .raio{transform-origin:100px 100px;animation:gira 80s linear infinite;}
  .arte .brilho{animation:pulsa 5s ease-in-out infinite;transform-origin:100px 100px;}
  .arte .est{animation:cintila 3.5s ease-in-out infinite;}
  .arte .est:nth-child(2n){animation-delay:1.2s;} .arte .est:nth-child(3n){animation-delay:2.1s;}
  @keyframes gira{to{transform:rotate(360deg);}} @keyframes pulsa{50%{transform:scale(1.05);opacity:.85;}} @keyframes cintila{50%{opacity:.25;}}
  .orna{display:block;margin:2px auto 8px;width:120px;height:18px;opacity:.8;}
  .tema-img{display:block;width:64px;height:64px;margin:0 auto 4px;}
  #musica{position:relative;} #musica.on{background:var(--marca);color:var(--on);}
  .vol{display:none;align-items:center;gap:6px;} .vol.on{display:flex;} .vol input{width:70px;accent-color:var(--marca);}
  @media (max-width:480px){.barra:has(.vol.on) .marca span{display:none;}}
  @media (max-width:380px){.vol input{width:50px;}}
  @media (min-width:700px){:root{--fs:1.2rem;} section{padding:26px 28px;}}
  @media (prefers-reduced-motion:reduce){.arte *{animation:none!important;} *{transition:none!important;scroll-behavior:auto!important;}}
  @media print{.vol,#musica,.barra,.indice,#caminho .btn,.grelha{display:none!important;} body{background:#fff;color:#000;} section{border:none;break-inside:avoid;}}
</style>
</head>
<body>
<div class="barra" id="barra" hidden>
  <div class="marca"><img src="logo-hikari-fafe.png" alt=""><span>HIKARI FAFE</span></div>
  <div class="grupo">
    <span class="vol" id="vol"><input type="range" id="volr" min="5" max="60" value="25" aria-label="Volume da música"></span>
    <button id="musica" aria-label="Música ambiente" aria-pressed="false">🎵</button>
    <button id="menos" aria-label="Diminuir letra">A−</button>
    <button id="mais" aria-label="Aumentar letra">A+</button>
    <button id="tema" aria-label="Mudar o fundo">🌗</button>
  </div>
</div>
<main id="app"><div class="estado">A abrir…</div></main>
<footer id="rodape" hidden>Prática espiritual e de bem-estar. Não substitui o acompanhamento médico ou psicológico.<br>Hikari Fafe · Corpo · Mente · Alma · Espírito</footer>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const app = initializeApp({
  apiKey:'AIzaSyDKWdXYEG6PO9KEMQMklyPGngtXuZlP7Cg', authDomain:'saudecare-app.firebaseapp.com', projectId:'saudecare-app',
  storageBucket:'saudecare-app.firebasestorage.app', messagingSenderId:'455466438728', appId:'1:455466438728:web:61cfbf9fac85d59e18c87d'
});
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const lerLS = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (_) { return d; } };
const gravarLS = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };

// ── preferências de leitura (tamanho da letra e fundo) ──
const pref = Object.assign({ fs: 1.125, tema: '' }, lerLS('vo_pref', {}));
if (!pref.tema) pref.tema = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'escuro' : 'claro';
function aplicarPref() {
  document.documentElement.style.setProperty('--fs', pref.fs + 'rem');
  document.documentElement.setAttribute('data-tema', pref.tema);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = pref.tema === 'escuro' ? '#12151b' : pref.tema === 'sepia' ? '#f3ead6' : '#faf8f4';
  gravarLS('vo_pref', pref);
}
aplicarPref();
$('menos').onclick = () => { pref.fs = Math.max(0.95, +(pref.fs - 0.1).toFixed(2)); aplicarPref(); };
$('mais').onclick = () => { pref.fs = Math.min(1.8, +(pref.fs + 0.1).toFixed(2)); aplicarPref(); };
$('tema').onclick = () => { const o = ['claro', 'sepia', 'escuro']; pref.tema = o[(o.indexOf(pref.tema) + 1) % 3]; aplicarPref(); };


// ── ilustrações (SVG próprio, leves) ──
const ESTRELAS = [[30,40],[170,30],[20,120],[182,110],[60,18],[140,16],[100,6]].map(([x,y],i)=>`<path class="est" d="M${x} ${y-4}l1.3 2.7 2.7 1.3-2.7 1.3L${x} ${y+4}l-1.3-2.7-2.7-1.3 2.7-1.3z" fill="var(--dest)"/>`).join('');
const ARTE_ESCUDO = `<svg class="arte" viewBox="0 0 200 200" role="img" aria-label="Escudo de luz com asas"><defs><radialGradient id="g1"><stop offset="0" stop-color="var(--dest)" stop-opacity=".55"/><stop offset="1" stop-color="var(--dest)" stop-opacity="0"/></radialGradient></defs>
<circle class="brilho" cx="100" cy="100" r="88" fill="url(#g1)"/>
<g class="raio" stroke="var(--dest)" stroke-width="1.6" stroke-linecap="round" opacity=".5">${Array.from({length:16},(_,i)=>`<line x1="100" y1="14" x2="100" y2="${i%2?24:32}" transform="rotate(${i*22.5} 100 100)"/>`).join('')}</g>
<g fill="none" stroke="var(--marca)" stroke-width="2.2" stroke-linecap="round"><path d="M92 104C70 98 44 84 20 62c6 26 22 44 50 54M90 114C72 112 52 106 34 94c8 18 22 28 44 32M88 124c-12 0-26-4-38-10 8 12 18 18 34 20"/><path d="M108 104c22-6 48-20 72-42-6 26-22 44-50 54M110 114c18-2 38-8 56-20-8 18-22 28-44 32M112 124c12 0 26-4 38-10-8 12-18 18-34 20"/></g>
<path d="M100 64l30 11v26c0 20-13 36-30 44-17-8-30-24-30-44V75z" fill="var(--caixa)" stroke="var(--marca)" stroke-width="2.6" stroke-linejoin="round"/>
<path d="M100 76v54M82 98h36" stroke="var(--dest)" stroke-width="4" stroke-linecap="round"/>
${ESTRELAS}</svg>`;
const ARTE_LUZ = `<svg class="arte" viewBox="0 0 200 200" role="img" aria-label="Chama de luz"><defs><radialGradient id="g2"><stop offset="0" stop-color="var(--dest)" stop-opacity=".6"/><stop offset="1" stop-color="var(--dest)" stop-opacity="0"/></radialGradient></defs>
<circle class="brilho" cx="100" cy="100" r="86" fill="url(#g2)"/>
<g class="raio" stroke="var(--dest)" stroke-width="1.6" stroke-linecap="round" opacity=".45">${Array.from({length:12},(_,i)=>`<line x1="100" y1="16" x2="100" y2="30" transform="rotate(${i*30} 100 100)"/>`).join('')}</g>
<path d="M100 54c14 20 28 34 28 54a28 28 0 0 1-56 0c0-14 8-22 14-32 4 8 8 10 10 14 4-10 2-22 4-36z" fill="var(--dest)" stroke="var(--marca)" stroke-width="2.4" stroke-linejoin="round"/>
<path d="M100 96c8 10 14 16 14 26a14 14 0 0 1-28 0c0-8 6-14 14-26z" fill="var(--caixa)" opacity=".9"/>
<path d="M76 152h48M84 160h32" stroke="var(--marca)" stroke-width="3" stroke-linecap="round"/>
${ESTRELAS}</svg>`;
const ORNA = `<svg class="orna" viewBox="0 0 120 18" aria-hidden="true"><g fill="none" stroke="var(--dest)" stroke-width="1.6" stroke-linecap="round"><path d="M6 9h38M76 9h38"/><path d="M60 3l3 6-3 6-3-6z" fill="var(--dest)"/><circle cx="48" cy="9" r="1.6" fill="var(--dest)"/><circle cx="72" cy="9" r="1.6" fill="var(--dest)"/></g></svg>`;
const ICONE_SEMANA = (n) => {
  const c = '<svg class="tema-img" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="var(--marca)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">';
  if (n <= 7) return c + '<path d="M32 8C22 22 14 30 14 40a18 18 0 0 0 36 0C50 30 42 22 32 8z" fill="var(--caixa)"/><path d="M24 42a8 8 0 0 0 8 8" stroke="var(--dest)"/></g></svg>';
  if (n <= 14) return c + '<path d="M8 32c10-14 18 14 28 0s14-6 20-2"/><path d="M28 18l8 28M36 18l-8 28" stroke="var(--dest)"/></g></svg>';
  return c + '<path d="M32 8l18 7v16c0 12-8 21-18 25-10-4-18-13-18-25V15z" fill="var(--caixa)"/><path d="M32 22v22M23 32h18" stroke="var(--dest)"/></g></svg>';
};

// ── música ambiente (gerada no telemóvel, sem ficheiros) ──
const musica = { ctx: null, mestre: null, on: false, timer: null, vol: 0.25 };
const ACORDES = [[220, 261.63, 329.63], [174.61, 220, 261.63], [196, 246.94, 293.66], [164.81, 196, 246.94]]; // Lá m · Fá · Sol · Mi m (notas suaves)
function nota(f, t0, dur) {
  const c = musica.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = 'sine'; o.frequency.value = f; o.detune.value = (Math.random() - .5) * 8;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.16, t0 + dur * .45); g.gain.linearRampToValueAtTime(0, t0 + dur);
  o.connect(g); g.connect(musica.filtro); o.start(t0); o.stop(t0 + dur + .1);
}
function tocarAcorde() {
  if (!musica.on) return; const c = musica.ctx; let t = c.currentTime + .05;
  ACORDES[musica.i = ((musica.i ?? -1) + 1) % ACORDES.length].forEach((f, k) => { nota(f, t + k * .35, 9); nota(f / 2, t, 9.5); });
  if (Math.random() < .6) { const ac = ACORDES[musica.i]; nota(ac[Math.floor(Math.random() * 3)] * 2, t + 3 + Math.random() * 3, 4); }
  musica.timer = setTimeout(tocarAcorde, 8000);
}
function iniciarMusica() {
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  if (!musica.ctx) {
    const c = musica.ctx = new AC();
    musica.mestre = c.createGain(); musica.mestre.gain.value = 0;
    musica.filtro = c.createBiquadFilter(); musica.filtro.type = 'lowpass'; musica.filtro.frequency.value = 900;
    const atraso = c.createDelay(1); atraso.delayTime.value = .45; const fb = c.createGain(); fb.gain.value = .45;
    musica.filtro.connect(musica.mestre); musica.filtro.connect(atraso); atraso.connect(fb); fb.connect(atraso); atraso.connect(musica.mestre);
    musica.mestre.connect(c.destination);
  }
  musica.ctx.resume(); musica.on = true;
  musica.mestre.gain.cancelScheduledValues(0); musica.mestre.gain.linearRampToValueAtTime(musica.vol, musica.ctx.currentTime + 3);
  clearTimeout(musica.timer); tocarAcorde(); return true;
}
function pararMusica() {
  if (!musica.ctx) return; musica.on = false; clearTimeout(musica.timer);
  musica.mestre.gain.cancelScheduledValues(0); musica.mestre.gain.setValueAtTime(musica.mestre.gain.value, musica.ctx.currentTime);
  musica.mestre.gain.linearRampToValueAtTime(0, musica.ctx.currentTime + 1.2);
  setTimeout(() => { if (!musica.on) musica.ctx.suspend(); }, 1400);
}
function marcarMusica() { $('musica').classList.toggle('on', musica.on); $('musica').setAttribute('aria-pressed', musica.on); $('musica').textContent = musica.on ? '🔊' : '🎵'; $('vol').classList.toggle('on', musica.on); }
$('musica').onclick = () => { if (musica.on) pararMusica(); else if (!iniciarMusica()) { $('musica').style.display = 'none'; return; } marcarMusica(); };
musica.vol = Math.min(0.6, Math.max(0.05, (lerLS('vo_pref', {}).vol || 25) / 100)); $('volr').value = Math.round(musica.vol * 100);
$('volr').oninput = (e) => { musica.vol = e.target.value / 100; pref.vol = +e.target.value; gravarLS('vo_pref', pref); if (musica.on) musica.mestre.gain.linearRampToValueAtTime(musica.vol, musica.ctx.currentTime + .2); };
document.addEventListener('visibilitychange', () => { if (document.hidden && musica.on) { pararMusica(); marcarMusica(); } });

// ── texto: parágrafos e listas simples ──
function blocoTexto(t) {
  const partes = String(t || '').split(/\n\s*\n/);
  return partes.map((p) => {
    const linhas = p.split('\n').filter((l) => l.trim());
    if (!linhas.length) return '';
    const ehLista = (l) => /^\s*[•\-–]\s+/.test(l);
    let out = '', i = 0;
    while (i < linhas.length) {
      if (ehLista(linhas[i])) {
        let li = '';
        while (i < linhas.length && ehLista(linhas[i])) { li += `<li>${esc(linhas[i].replace(/^\s*[•\-–]\s+/, ''))}</li>`; i++; }
        out += `<ul>${li}</ul>`;
      } else { let par = []; while (i < linhas.length && !ehLista(linhas[i])) { par.push(esc(linhas[i])); i++; } out += `<p>${par.join('<br>')}</p>`; }
    }
    return out;
  }).join('');
}
function blocoOracao(t) {
  return String(t || '').split(/\n\s*\n/).map((e) => {
    const nota = /^\s*\(.*\)\s*$/.test(e.trim());
    return `<div class="estrofe${nota ? ' nota' : ''}">${esc(e.trim()).replace(/\n/g, '<br>')}</div>`;
  }).join('');
}

// ── caminho dos dias (guardado só neste telemóvel) ──
let O = null, id = '', est = { inicio: '', feitos: [] }, ver = 0;
const chave = () => 'vo_c_' + id;
const hojeISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const proximo = () => { for (let n = 1; n <= O.dias; n++) if (!est.feitos.includes(n)) return n; return 0; };
function semanaDe(n) { return n <= 7 ? 'Semana 1 · Limpar' : n <= 14 ? 'Semana 2 · Cortar' : 'Semana 3 · Proteger e selar'; }

function desenharCaminho() {
  const el = $('caminho'); if (!el || !O.dias) return;
  const prox = proximo(); const feitos = est.feitos.length;
  if (!est.inicio) {
    el.innerHTML = `<h2>🗓️ O teu caminho de ${O.dias} dias</h2>
      <div class="corpo"><p>Quando estiveres pronto/a, começa. Cada dia tens aqui a intenção e uma pequena ação. O teu progresso fica guardado neste telemóvel.</p></div>
      <button class="btn" id="comecar">✨ Começar hoje</button>`;
    $('comecar').onclick = () => { est.inicio = hojeISO(); ver = 1; gravarLS(chave(), est); desenharCaminho(); };
    return;
  }
  if (!ver) ver = prox || O.dias;
  const t = (O.temasDias || [])[ver - 1] || {};
  const feito = est.feitos.includes(ver);
  const completo = feitos >= O.dias;
  let grelha = '';
  for (let n = 1; n <= O.dias; n++) grelha += `<button data-d="${n}" class="${est.feitos.includes(n) ? 'feito' : ''} ${n === prox ? 'prox' : ''} ${n === ver ? 'ver' : ''}" aria-label="Dia ${n}${est.feitos.includes(n) ? ', feito' : ''}">${est.feitos.includes(n) ? '✓' : n}</button>`;
  el.innerHTML = `<h2>🗓️ O teu caminho <span style="font-size:.9rem;color:var(--suave);font-weight:600;">${feitos} de ${O.dias}</span></h2>
    <div class="prog"><i style="width:${Math.round(feitos / O.dias * 100)}%"></i></div>
    ${completo ? `<div class="final">🌟 <b>Completaste os ${O.dias} dias.</b><br>Que a luz continue contigo. Parabéns!</div>` : ''}
    <div class="grelha" id="grelha">${grelha}</div>
    <div class="semana">${esc(semanaDe(ver))}</div>
    <div class="hoje">
      ${ICONE_SEMANA(ver)}
      <div class="dia">Dia ${ver}${ver === prox && !completo ? ' · o teu dia de hoje' : ''}</div>
      <h3>${esc(t.titulo || '')}</h3>
      ${t.intencao ? `<p><b>Intenção:</b> ${esc(t.intencao)}</p>` : ''}
      ${t.acao ? `<p class="acao"><b>Para este dia:</b> ${esc(t.acao)}</p>` : ''}
    </div>
    <a class="btn sec" href="#${PRIMEIRA_ORACAO}">📖 Ir para a oração</a>
    <button class="btn" id="marcar" style="margin-top:10px">${feito ? '↩ Desmarcar o dia ' + ver : '✅ Já fiz o dia ' + ver}</button>`;
  $('grelha').onclick = (e) => { const b = e.target.closest('button[data-d]'); if (!b) return; ver = +b.dataset.d; desenharCaminho(); };
  $('marcar').onclick = () => {
    const i = est.feitos.indexOf(ver);
    if (i >= 0) est.feitos.splice(i, 1); else { est.feitos.push(ver); est.feitos.sort((a, b) => a - b); const p = proximo(); if (p) ver = p; }
    gravarLS(chave(), est); desenharCaminho();
    if (est.feitos.length >= O.dias) window.scrollTo({ top: $('caminho').offsetTop - 70, behavior: 'smooth' });
  };
}

let PRIMEIRA_ORACAO = 'caminho';
function desenhar() {
  document.title = (O.titulo || 'Oração') + ' — Hikari Fafe';
  const secs = (O.seccoes || []);
  const idx = []; let html = `<div class="capa">${O.tipo === 'ciclo' || /🛡|⚔/.test(O.emoji || '') ? ARTE_ESCUDO : ARTE_LUZ}<h1>${esc(O.titulo)}</h1>${O.subtitulo ? `<p>${esc(O.subtitulo)}</p>` : ''}</div>`;
  secs.forEach((s, i) => { if (s.tipo === 'oracao' && PRIMEIRA_ORACAO === 'caminho') PRIMEIRA_ORACAO = 's' + i; });
  const nav = [];
  if (O.dias) nav.push(['caminho', '🗓️ O meu caminho']);
  secs.forEach((s, i) => nav.push(['s' + i, (s.tipo === 'oracao' ? '🙏 ' : '') + (s.titulo || 'Texto')]));
  if (nav.length > 2) html += `<nav class="indice" aria-label="Índice">${nav.map(([a, t]) => `<a href="#${a}">${esc(t)}</a>`).join('')}</nav>`;
  if (O.dias) html += `<section id="caminho"></section>`;
  secs.forEach((s, i) => {
    const cls = s.tipo === 'oracao' ? 'oracao' : s.tipo === 'aviso' ? 'aviso' : '';
    let corpo;
    if (s.tipo === 'passos') corpo = `<ol class="passos">${(s.itens || []).map((x) => `<li>${esc(x)}</li>`).join('')}</ol>`;
    else if (s.tipo === 'oracao') corpo = blocoOracao(s.texto);
    else corpo = blocoTexto(s.texto);
    html += `<section id="s${i}" class="${cls}">${s.tipo === 'oracao' ? ORNA : ''}${s.titulo ? `<h2>${s.tipo === 'aviso' ? '⚠️ ' : ''}${esc(s.titulo)}</h2>` : ''}<div class="corpo">${corpo}</div></section>`;
  });
  if (navigator.share) html += `<button class="btn sec" id="partilhar" style="margin-top:6px">📤 Partilhar com alguém</button>`;
  $('app').innerHTML = html;
  $('barra').hidden = false; $('rodape').hidden = false;
  if (O.dias) { est = Object.assign({ inicio: '', feitos: [] }, lerLS(chave(), {})); desenharCaminho(); }
  const p = $('partilhar'); if (p) p.onclick = () => { navigator.share({ title: O.titulo, url: location.href }).catch(() => {}); };
}

id = new URLSearchParams(location.search).get('o') || '';
if (!id) { $('app').innerHTML = '<div class="estado"><h2>Link inválido</h2><p>Pede um novo link a quem te enviou.</p></div>'; }
else {
  getDoc(doc(db, 'oracoes', id)).then((s) => {
    if (!s.exists()) { $('app').innerHTML = '<div class="estado"><h2>Não encontrei esta oração</h2><p>O link pode ter sido apagado ou estar incompleto. Pede um novo link.</p></div>'; return; }
    O = s.data(); desenhar();
  }).catch(() => { $('app').innerHTML = '<div class="estado"><h2>Sem ligação</h2><p>Verifica a internet e tenta outra vez.</p></div>'; });
}
</script>
