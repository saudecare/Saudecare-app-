<!DOCTYPE html>
<html lang="pt-PT">
<head>

<link rel="apple-touch-icon" id="appleTouchIcon" href="">

<style>
  :root{
    --primary:#2f6f5e; --primary-dark:#1f4d40; --bg:#f6f8f7; --card:#fff; --text:#1a2b26; --muted:#6b7d76;
    --accent:#b3893f; --accent-soft:#f3ead7;
    --font-display:'Fraunces',Georgia,serif; --font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-body);}
  body{background:var(--bg);color:var(--text);line-height:1.5;}
  a{color:inherit;}
  .hero{background:linear-gradient(150deg,var(--primary-dark),var(--primary) 65%);color:#fff;padding:44px 20px 36px;text-align:center;position:relative;overflow:hidden;}
  .hero::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 82% 8%,rgba(255,255,255,.10),transparent 55%);pointer-events:none;}
  .hero img.logo{width:76px;height:76px;border-radius:18px;object-fit:cover;margin-bottom:16px;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.18);position:relative;}
  .hero h1{font-family:var(--font-display);font-weight:600;font-size:29px;letter-spacing:-.01em;margin-bottom:9px;position:relative;}
  .hero p{opacity:.9;font-size:15px;max-width:420px;margin:0 auto;position:relative;}
  .cta{display:inline-block;background:#fff;color:var(--primary-dark);font-weight:600;padding:14px 30px;
    border-radius:100px;text-decoration:none;margin-top:22px;font-size:15px;position:relative;box-shadow:0 6px 16px rgba(0,0,0,.14);}
  .wrap{max-width:560px;margin:0 auto;padding:16px;}
  section{margin:26px 0;}
  h2.section-title{font-family:var(--font-display);font-weight:600;font-size:20px;margin-bottom:14px;color:var(--primary-dark);letter-spacing:-.005em;}
  .card{background:var(--card);border:1px solid rgba(31,77,64,.07);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,40,34,.04);}
  .service-card{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .service-card .price{font-weight:700;color:var(--primary-dark);white-space:nowrap;}
  .cat-card{cursor:pointer;}
  .cat-card .cat-head{display:flex;justify-content:space-between;align-items:center;}
  .cat-card .cat-mod{font-size:12px;color:var(--accent);font-weight:600;}
  .cat-card .cat-items{margin-top:10px;padding-top:10px;border-top:1px solid rgba(0,0,0,.08);}
  .cat-card .cat-items.hidden{display:none;}
  .cat-card .chevron{transition:transform .15s;}
  .cat-card.open .chevron{transform:rotate(180deg);}
  .muted{color:var(--muted);font-size:13px;}
  .team-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .team-card{text-align:center;}
  .team-card img{width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:8px;background:#e4ede9;border:2px solid var(--accent-soft);}
  .stars{color:var(--accent);font-size:14px;margin-bottom:4px;}
  .social-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px;}
  .social-row a{background:rgba(255,255,255,.16);padding:9px 16px;border-radius:100px;font-size:13px;text-decoration:none;color:#fff;}
  .contact-row{display:flex;flex-direction:column;gap:6px;font-size:14px;}
  footer{text-align:center;padding:26px 16px;color:var(--muted);font-size:12px;}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:14px;}
  .quick-nav{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.06);-webkit-overflow-scrolling:touch;}
  .quick-nav a{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:100px;background:#f2f6f4;color:var(--primary-dark,#1a2b26);text-decoration:none;font-size:13px;font-weight:600;white-space:nowrap;transition:background .12s,color .12s;}
  .quick-nav a:active{background:var(--primary,#2e7d5b);color:#fff;}
  #servicesSection, #teamSection, #espiritualidadeSection, #trainingsSection, #testimonialsSection, #availabilitySection, #contactSection{scroll-margin-top:60px;}
  .spirit-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .spirit-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1;background:linear-gradient(135deg,#2d1b4e,#1a0f2e);border-radius:14px;text-decoration:none;padding:8px;box-shadow:0 3px 10px rgba(0,0,0,.2);}
  .spirit-icon{font-size:22px;}
  .spirit-label{color:#f0d878;font-size:11.5px;font-weight:700;text-align:center;line-height:1.2;}
  .spirit-tag{color:#c9b8e8;font-size:10px;}
  .hidden{display:none !important;}
</style>
</head>

  <p class="muted" style="color:#fff;opacity:.8;">…</p>

m": {"pt": "Domingo", "en": "Sunday", "es": "Domingo", "fr": "Dimanche", "de": "Sonntag", "it": "Domenica"}, "semFixo": {"pt": "Sem horário fixo — atendimento só por marcação combinada.", "en": "No fixed hours — by arranged appointment only.", "es": "Sin horario fijo: atención solo con cita acordada.", "fr": "Pas d’horaires fixes : uniquement sur rendez-vous convenu.", "de": "Keine festen Zeiten – nur nach Terminvereinbarung.", "it": "Nessun orario fisso: solo su appuntamento concordato."}, "semanaA": {"pt": "Semana A", "en": "Week A", "es": "Semana A", "fr": "Semaine A", "de": "Woche A", "it": "Settimana A"}, "semanaB": {"pt": "Semana B", "en": "Week B", "es": "Semana B", "fr": "Semaine B", "de": "Woche B", "it": "Settimana B"}, "semHorSem": {"pt": "Sem horário nesta semana.", "en": "No hours this week.", "es": "Sin horario esta semana.", "fr": "Pas d’horaires cette semaine.", "de": "Keine Zeiten in dieser Woche.", "it": "Nessun orario in questa settimana."}, "alterna": {"pt": "As semanas alternam quinzenalmente — confirme o dia certo ao pedir a marcação.", "en": "Weeks alternate every two weeks — confirm the right day when requesting a booking.", "es": "Las semanas se alternan cada quince días: confirme el día correcto al solicitar la cita.", "fr": "Les semaines alternent tous les quinze jours : confirmez le bon jour lors de votre demande.", "de": "Die Wochen wechseln alle zwei Wochen – bestätigen Sie den richtigen Tag bei der Anfrage.", "it": "Le settimane si alternano ogni due settimane: confermi il giorno giusto quando richiede la prenotazione."}, "fuso": {"pt": "Horas no fuso do profissional ({f}).", "en": "Times are in the professional’s time zone ({f}).", "es": "Horas en la zona horaria del profesional ({f}).", "fr": "Heures dans le fuseau du professionnel ({f}).", "de": "Zeiten in der Zeitzone der Fachperson ({f}).", "it": "Orari nel fuso del professionista ({f})."}});
const t = (k, v) => _t('pagina', k, v);
iniciarIdioma();

const firebaseConfig = {
  apiKey: "AIzaSyDKWdXYEG6PO9KEMQMklyPGngtXuZlP7Cg",
  authDomain: "saudecare-app.firebaseapp.com",
  projectId: "saudecare-app",
  storageBucket: "saudecare-app.firebasestorage.app",
  messagingSenderId: "455466438728",
  appId: "1:455466438728:web:61cfbf9fac85d59e18c87d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const tenantSlug = params.get('t');

function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

async function load(){
  if (!tenantSlug){
    document.getElementById('hero').innerHTML = '<h1>' + t('invalido') + '</h1>';
    return;
  }
  const profileSnap = await getDoc(doc(db, 'public_tenant_profiles', tenantSlug));
  if (!profileSnap.exists()){
    document.getElementById('hero').innerHTML = '<h1>' + t('naoEnc') + '</h1>';
    return;
  }
  const profile = profileSnap.data();
  // Se por algum motivo este perfil público ainda não tiver o campo
  // tenantId gravado (ex: documentos criados antes deste campo existir),
  // usa o próprio slug do URL como reserva — na grande maioria dos casos
  // é o mesmo valor, e evita que Serviços/Equipa/Formações/Testemunhos
  // desapareçam todos de uma vez só por faltar este campo.
  const tenantId = profile.tenantId || tenantSlug;

  aplicarCorMarca(profile.branding?.primaryColor);

  renderHero(profile, tenantSlug);
  renderAbout(profile);
  renderOfertas(profile, tenantSlug);

  // Destaque especial só na página da Hikari Fafe — link para o Mapa da
  // Alma e para a Cartomancia. Não aparece a mais ninguém (outros
  // subscritores não têm esta funcionalidade ativa), e cada um só aparece
  // se a Hikari o deixar visível nas suas definições.
  if (tenantId === 'hikari-terapias'){
    const mapaUrl = window.location.href.replace('pagina.html', 'mapa-da-alma.html').split('?')[0];
    const cartoUrl = window.location.href.replace('pagina.html', 'cartomancia.html').split('?')[0];
    const poemasUrl = window.location.href.replace('pagina.html', 'poemas-meiji.html').split('?')[0] + '?t=hikari-terapias';

    fetch('https://effortless-entremet-7de9ef.netlify.app/.netlify/functions/mapaAlma', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'getOverrides', tenantId: 'hikari-terapias' })
    }).then(r => r.json()).then(data => {
      if (!data.ok) return;

      const tiles = [];
      if (data.mapaAlmaVisivel !== false){
        tiles.push(`<a href="${escapeHtml(mapaUrl)}" class="spirit-tile" target="_blank" rel="noopener">
          <div class="spirit-icon">✦</div><div class="spirit-label">Mapa da Alma</div><div class="spirit-tag">grátis</div>
        </a>`);
      }
      if (data.cartomanciaVisivel !== false){
        tiles.push(`<a href="${escapeHtml(cartoUrl)}" class="spirit-tile" target="_blank" rel="noopener">
          <div class="spirit-icon">🃏</div><div class="spirit-label">Tarot</div><div class="spirit-tag">grátis</div>
        </a>`);
      }
      tiles.push(`<a href="${escapeHtml(poemasUrl)}" class="spirit-tile" target="_blank" rel="noopener">
        <div class="spirit-icon">🎴</div><div class="spirit-label">Poemas Meiji</div><div class="spirit-tag">grátis</div>
      </a>`);
      if (data.limpezaTexto){
        tiles.push(`<a href="#limpezaDetalhe" class="spirit-tile" onclick="document.getElementById('limpezaDetalhe').classList.toggle('hidden');return false;">
          <div class="spirit-icon">🛡️</div><div class="spirit-label">Limpeza Energética</div><div class="spirit-tag">${data.limpezaPrecoConsulta ?? 35}€</div>
        </a>`);
      }
      if (!tiles.length) return;

      document.getElementById('espiritualidadeSection').innerHTML = `
        <h2 class="section-title">✨ Serviços Espirituais</h2>
        <div class="spirit-grid">${tiles.join('')}</div>
        ${data.limpezaTexto ? `
        <div id="limpezaDetalhe" class="card hidden" style="margin-top:10px;background:#1a0f2e;border:1px solid rgba(212,175,55,.4);">
          <h3 style="color:#f0d878;font-size:16px;margin-bottom:8px;">🛡️ Deteção & Limpeza Energética</h3>
          <p style="color:#c9b8e8;font-size:13.5px;line-height:1.6;margin-bottom:10px;white-space:pre-wrap;">${escapeHtml(data.limpezaTexto)}</p>
          <p style="color:#c9b8e8;font-size:12.5px;">Avaliação completa com Pêndulo Hebreu. A limpeza em si varia de caso para caso. À distância ou presencial.</p>
          ${data.whatsapp ? `<a href="https://wa.me/${data.whatsapp}?text=${encodeURIComponent('Olá! Vi a página e gostava de saber mais sobre a Limpeza Energética.')}" target="_blank" style="display:inline-block;margin-top:10px;background:linear-gradient(90deg,#d4af37,#f0d878);color:#2a1a00;font-weight:700;padding:10px 20px;border-radius:12px;text-decoration:none;font-size:13.5px;">📱 Falar com a Hikari Fafe</a>` : ''}
        </div>` : ''}
      `;
      renderQuickNav();
    }).catch(()=>{});
  }

  renderContact(profile);
  renderAvailability(profile, tenantSlug);
  applyDynamicManifest(profile);

  // Livro de Reclamações Eletrónico — obrigatório por lei em Portugal
  // para quem presta serviços a consumidores; link visível na página
  // inicial, como a lei exige, sempre que o subscritor o tiver configurado.
  if (profile.legalTexts?.livroReclamacoesUrl){
    const linkEl = document.getElementById('livroReclamacoesLink');
    linkEl.style.display = 'block';
    linkEl.innerHTML =
      `<a href="${escapeHtml(profile.legalTexts.livroReclamacoesUrl)}" target="_blank" rel="noopener" style="color:var(--muted);font-size:12px;">📕 Livro de Reclamações</a>`;
  }

  const [categoriesSnap, servicesSnap, teamSnap, trainingsSnap, testimonialsSnap] = await Promise.all([
    getDocs(collection(db, 'tenants', tenantId, 'serviceCategories')),
    getDocs(collection(db, 'tenants', tenantId, 'services')),
    getDocs(collection(db, 'tenants', tenantId, 'teamMembers')),
    getDocs(collection(db, 'tenants', tenantId, 'trainings')),
    getDocs(collection(db, 'tenants', tenantId, 'testimonials'))
  ]);

  renderServices(categoriesSnap, servicesSnap, tenantSlug);
  renderTeam(teamSnap);
  renderTrainings(trainingsSnap, tenantSlug);
  renderTestimonials(testimonialsSnap);
  renderQuickNav();
}

function renderQuickNav(){
  const secoes = [
    { id:'ofertasSection', label:t('navLoja'), icon:'🛍️' },
    { id:'espiritualidadeSection', label:t('navEsp'), icon:'✨' },
    { id:'servicesSection', label:t('servicos'), icon:'🩺' },
    { id:'teamSection', label:t('equipa'), icon:'🙋' },
    { id:'trainingsSection', label:t('formacoes'), icon:'🎓' },
    { id:'testimonialsSection', label:t('testemunhos'), icon:'⭐' },
    { id:'availabilitySection', label:t('horarios'), icon:'🗓️' },
    { id:'contactSection', label:t('contactos'), icon:'📍' }
  ];
  const links = secoes
    .filter(s => document.getElementById(s.id)?.innerHTML.trim())
    .map(s => `<a href="#${s.id}">${s.icon} ${s.label}</a>`)
    .join('');
  const nav = document.getElementById('quickNav');
  if (links) nav.innerHTML = links; else nav.remove();
}

// ── "Adicionar ao ecrã principal" com identidade do subscritor ─────────
// Sem servidor próprio, o manifest.json normal é fixo para toda a app.
// Aqui construímos um manifest à medida, no próprio browser, assim que
// sabemos o nome e o logótipo deste subscritor, e trocamos a hiperligação
// do manifest para essa versão personalizada antes do utilizador poder
// "instalar" a página. No iPhone/Safari o ícone depende também da tag
// apple-touch-icon, que também é atualizada aqui.
function applyDynamicManifest(profile){
  document.title = profile.businessName || 'Vindora';
  const logoUrl = profile.branding?.logoUrl || '';

  if (logoUrl){
    const appleIcon = document.getElementById('appleTouchIcon');
    if (appleIcon) appleIcon.href = logoUrl;
    let fav = document.querySelector('link[rel="icon"]');
    if (!fav){ fav = document.createElement('link'); fav.rel = 'icon'; document.head.appendChild(fav); }
    fav.href = logoUrl;
  }

  const manifestObj = {
    name: profile.businessName || 'Vindora',
    short_name: (profile.businessName || 'Vindora').slice(0, 12),
    start_url: window.location.href,
    display: 'standalone',
    background_color: '#f6f8f7',
    theme_color: profile.branding?.primaryColor || '#2f6f5e',
    icons: logoUrl ? [
      { src: logoUrl, sizes: '192x192', type: 'image/png' },
      { src: logoUrl, sizes: '512x512', type: 'image/png' }
    ] : []
  };
  const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
  const manifestLink = document.getElementById('dynamicManifest');
  if (manifestLink) manifestLink.href = URL.createObjectURL(blob);
}

function ofertaLinkSeguro(u){

  return /^https?:\/\/[^\s]+$/i.test(u) || /^(app|pagina|marcar|inscricao|ficha|portal|saudecare-[a-z-]+)\.html(\?[^\s]*)?$/.test(u);
}

function renderServices(categoriesSnap, servicesSnap, slug){
  if (servicesSnap.empty) return;
  const services = [];
  servicesSnap.forEach(d => services.push(d.data()));
  const modLabel = { presencial: t('presencial'), online: t('online'), ambos: t('ambos') };

  let categories = [];
  categoriesSnap.forEach(d => categories.push({ id: d.id, ...d.data() }));

  // Compatibilidade: serviços antigos sem categoryId (ainda não migrados
  // no momento em que este perfil foi visto) — agrupa por nome de categoria.
  if (categories.length === 0){
    const byName = {};
    services.forEach(s => { const n = s.category || t('servicos'); if(!byName[n]) byName[n] = { name:n, icon: s.categoryIcon||'🩺', modalidade:'', id:n }; });
    categories = Object.values(byName);
    services.forEach(s => { s.categoryId = s.category || t('servicos'); });
  }

  let html = '';
  categories.sort((a,b) => (a.name||'').localeCompare(b.name||'')).forEach((cat, i) => {
    const items = services.filter(s => s.categoryId === cat.id);
    if (!items.length) return;
    const itemsHtml = items.map(s => `
      <div class="service-card" style="margin-top:8px;">
        <div>
          <strong>${escapeHtml(s.name)}</strong>
          ${s.type === 'pack' ? `<div class="muted">${t('pack', { n: s.packSessions||'' })}</div>` : ''}
          ${s.description ? `<div class="muted">${escapeHtml(s.description)}</div>` : ''}
        </div>
        <div class="price">${s.price}€</div>
      </div>`).join('');
    html += `<div class="card cat-card" id="catCard${i}" onclick="toggleCatCard(${i})">
      <div class="cat-head">
        <h3 style="margin:0;color:var(--primary-dark);">${cat.icon||'🩺'} ${escapeHtml(cat.name)}</h3>
        <span class="chevron">▾</span>
      </div>
      ${cat.modalidade ? `<div class="cat-mod">${modLabel[cat.modalidade]||''}</div>` : ''}
      ${cat.description ? `<div class="muted" style="margin-top:4px;">${escapeHtml(cat.description)}</div>` : ''}
      <div class="cat-items hidden">${itemsHtml}</div>
    </div>`;
  });
  document.getElementById('servicesSection').innerHTML = `
    <h2 class="section-title">${t('servicos')}</h2>${html}
  `;
}

window.toggleCatCard = function(i){
  const card = document.getElementById('catCard' + i);
  if (!card) return;
  card.classList.toggle('open');
  card.querySelector('.cat-items')?.classList.toggle('hidden');
};

const DAY_LABELS = { get mon(){return t('seg');}, get tue(){return t('ter');}, get wed(){return t('qua');}, get thu(){return t('qui');}, get fri(){return t('sex');}, get sat(){return t('sab');}, get sun(){return t('dom');} };
const DAY_KEYS_BY_JS_INDEX = ['sun','mon','tue','wed','thu','fri','sat'];

// Devolve o horário aplicável a uma data concreta, já considerando
// exceções (têm sempre prioridade) e alternância semana A/B quando o
// modo é quinzenal. Devolve null se esse dia estiver fechado.
function getScheduleForDate(avail, dateObj){
  const dateStr = chaveData(dateObj);
  const exceptions = avail.exceptions || {};
  if (exceptions[dateStr]){
    const ex = exceptions[dateStr];
    return ex.closed ? null : { enabled: true, start: ex.start, end: ex.end };
  }
  const dayKey = DAY_KEYS_BY_JS_INDEX[dateObj.getDay()];
  if (avail.mode === 'biweekly' && avail.biweekly?.referenceMonday){
    const diffWeeks = semanasDesde(avail.biweekly.referenceMonday, dateObj);
    const isWeekB = (((diffWeeks % 2) + 2) % 2) === 1;
    const src = isWeekB ? (avail.biweekly.weekB || {}) : avail;
    return src[dayKey] || { enabled: false };
  }
  return avail[dayKey] || { enabled: false };
}

function renderAvailability(profile, slug){
  const avail = profile.availability || {};
  const el = document.getElementById('availabilitySection');

  if (avail.noFixedHours || avail.mode === 'none'){
    el.innerHTML = `
      <h2 class="section-title">🗓️ ${t('horarios')}</h2>
      <div class="card" style="text-align:center;">
        <p class="muted">${t('semFixo')}</p>
        <a class="cta" style="margin-top:10px;display:inline-block;" href="marcar.html?t=${encodeURIComponent(slug)}">${t('marcarCal')}</a>
      </div>
    `;
    return;
  }

  let scheduleHtml;
  if (avail.mode === 'biweekly'){
    const weekB = avail.biweekly?.weekB || {};
    const rowsFor = (src) => Object.keys(DAY_LABELS).filter(k => src[k]?.enabled)
      .map(k => `<div>${DAY_LABELS[k]}: ${escapeHtml(src[k].start)} – ${escapeHtml(src[k].end)}</div>`).join('');
    scheduleHtml = `
      <p class="muted" style="margin-bottom:4px;"><strong>${t('semanaA')}</strong></p>${rowsFor(avail) || '<p class="muted">' + t('semHorSem') + '</p>'}
      <p class="muted" style="margin:10px 0 4px;"><strong>${t('semanaB')}</strong></p>${rowsFor(weekB) || '<p class="muted">' + t('semHorSem') + '</p>'}
      <p class="muted" style="margin-top:8px;">${t('alterna')}</p>`;
  } else {
    const activeDays = Object.keys(DAY_LABELS).filter(k => avail[k]?.enabled);
    if (!activeDays.length){ el.innerHTML = ''; return; }
    scheduleHtml = activeDays.map(k => `<div>${DAY_LABELS[k]}: ${escapeHtml(avail[k].start)} – ${escapeHtml(avail[k].end)}</div>`).join('');
  }
  const tzTenant = fusoDe(profile);
  const nota = tzTenant !== fusoDoDispositivo()
    ? `<p class="muted" style="margin-top:8px;">${escapeHtml(t('fuso', { f: tzTenant.replace('_',' ') }))}</p>` : '';
  el.innerHTML = `
    <h2 class="section-title">🗓️ ${t('horarios')}</h2>
    <div class="card">${scheduleHtml}${nota}</div>
  `;
}
