<style>
  :root{ --primary:#2f6f5e; --primary-dark:#1f4d40; --bg:#f6f8f7; --card:#fff; --text:#1a2b26; --muted:#6b7d76; --accent:#b3893f;
    --font-display:'Fraunces',Georgia,serif; --font-body:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-body);}
  body{background:var(--bg);color:var(--text);line-height:1.5;}
  .hero{position:relative;background:linear-gradient(150deg,var(--primary-dark),var(--primary) 65%);color:#fff;padding:34px 20px 28px;text-align:center;}
  .hero img.logo{width:64px;height:64px;border-radius:14px;object-fit:cover;margin-bottom:12px;background:#fff;box-shadow:0 5px 14px rgba(0,0,0,.16);}
  .hero h1{font-family:var(--font-display);font-weight:600;font-size:23px;letter-spacing:-.01em;margin-bottom:5px;}
  .hero p{opacity:.9;font-size:14px;}
  .wrap{max-width:520px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid rgba(31,77,64,.07);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(20,40,34,.04);}
  label{display:block;margin:12px 0 6px;font-size:13.5px;color:var(--muted);font-weight:600;}
  label:first-child{margin-top:0;}
  input, select, textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #dde5e1;
    background:#fff;color:var(--text);font-size:15px;font-family:inherit;}
  textarea{resize:vertical;}
  .btn{display:block;width:100%;text-align:center;background:var(--primary);color:#fff;font-weight:600;
    padding:14px;border:none;border-radius:100px;cursor:pointer;font-size:15px;margin-top:16px;box-shadow:0 6px 16px rgba(31,77,64,.18);}
  .btn:disabled{opacity:.6;box-shadow:none;}
  .muted{color:var(--muted);font-size:13.5px;line-height:1.5;}
  .service-option{border:1.5px solid #dde5e1;border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:border-color .12s,background .12s;}
  .service-option.active{border-color:var(--primary);background:#f0f7f4;}
  .service-option strong{font-size:14.5px;}
  .success{text-align:center;padding:30px 16px;}
  .success .check{font-size:48px;margin-bottom:10px;}
  .errorbox{background:#fdecea;color:#a33;border:1px solid #f5c6c0;border-radius:10px;padding:12px;margin-top:10px;font-size:13.5px;}
  .hidden{display:none !important;}
</style>

function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

const DAY_LABELS = { mon:'Segunda', tue:'Terça', wed:'Quarta', thu:'Quinta', fri:'Sexta', sat:'Sábado', sun:'Domingo' };
const DAY_KEYS_BY_JS_INDEX = ['sun','mon','tue','wed','thu','fri','sat'];

// Mesma lógica usada na página pública de perfil: exceções têm sempre
// prioridade, depois alterna semana A/B se o modo for quinzenal.
function getScheduleForDate(avail, dateObj){
  const dateStr = chaveData(dateObj);
  const exceptions = avail.exceptions || {};
  if (exceptions[dateStr]){
    const ex = exceptions[dateStr];
    return ex.closed ? null : { enabled: true, start: ex.start, end: ex.end };
  }
  const dayKey = DAY_KEYS_BY_JS_INDEX[dateObj.getDay()];
  if (avail.mode === 'biweekly' && avail.biweekly?.referenceMonday){
    const diffWeeks = semanasDesde(avail.biweekly.referenceMonday, dateObj);
    const isWeekB = (((diffWeeks % 2) + 2) % 2) === 1;
    const src = isWeekB ? (avail.biweekly.weekB || {}) : avail;
    return src[dayKey] || { enabled: false };
  }
  return avail[dayKey] || { enabled: false };
}

let profile, tenantId, services = [], categories = [], selectedService = null, FUSO = 'Europe/Lisbon';

function ligarIdioma(){
  const s = document.getElementById('vdLang');
  if (s) s.addEventListener('change', () => { definirIdioma(s.value); if (profile){ desenharHero(); selectedService = null; renderForm(); } else { location.reload(); } });
}
function desenharHero(){
  document.getElementById('hero').innerHTML = `
    ${seletorIdiomaHtml()}
    ${profile.logoUrl ? `<img class="logo" src="${escapeHtml(profile.logoUrl)}">` : ''}
    <h1>${escapeHtml(profile.businessName || t('titulo'))}</h1>
    <p>${t('intro')}</p>
  `;
  ligarIdioma();
}

async function load(){
  if (!tenantSlug){
    document.getElementById('hero').innerHTML = seletorIdiomaHtml() + '<h1>' + t('invalido') + '</h1>'; ligarIdioma();
    return;
  }
  const profileSnap = await getDoc(doc(db, 'public_tenant_profiles', tenantSlug));
  if (!profileSnap.exists()){
    document.getElementById('hero').innerHTML = seletorIdiomaHtml() + '<h1>' + t('naoEncontrada') + '</h1>'; ligarIdioma();
    return;
  }
  profile = profileSnap.data();
  tenantId = profile.tenantId || tenantSlug;
  aplicarCorMarca(profile.branding?.primaryColor);
  FUSO = fusoDe(profile);

  desenharHero();

  const [catSnap, svcSnap] = await Promise.all([
    getDocs(collection(db, 'tenants', tenantId, 'serviceCategories')),
    getDocs(collection(db, 'tenants', tenantId, 'services'))
  ]);
  catSnap.forEach(d => categories.push({ id: d.id, ...d.data() }));
  svcSnap.forEach(d => { if (d.data().active !== false) services.push({ id: d.id, ...d.data() }); });

  renderForm();
}

function renderForm(){
  const avail = profile.availability || {};
  const semHorarioFixo = !!avail.noFixedHours || avail.mode === 'none';

  main.innerHTML = `

      <label>${t('contacto')}</label>

      ${services.length ? `
      <label>${t('servico')}</label>
      <div id="serviceList">
        ${services.map(s => {
          const cat = categories.find(c => c.id === s.categoryId);
          return `<div class="service-option" data-id="${s.id}">
            <strong>${cat?.icon || '🩺'} ${escapeHtml(s.name)}</strong>
            <div class="muted">${s.durationMinutes ? s.durationMinutes + ' min · ' : ''}${s.price ? s.price + '€' : t('gratis')}</div>
          </div>`;
        }).join('')}
      </div>` : ''}

      ${semHorarioFixo ? `
      <label>${t('quando')}</label>
      <textarea id="fQuando" rows="2" placeholder="${t('quandoPh')}"></textarea>
      <p class="muted" style="margin-top:4px;">${t('semFixo')}</p>
      ` : `
      <label>${t('data')}</label>
      <input id="fData" type="date" min="${hojeNoFuso()}">
      <p class="muted" id="fDataInfo" style="margin-top:4px;"></p>
      <label>${t('hora')}</label>
      <input id="fHora" type="time">
      <p class="muted" id="fFusoInfo" style="margin-top:4px;"></p>
      `}

      <label>${t('mensagem')}</label>
      <textarea id="fMensagem" rows="2" placeholder="${t('mensagemPh')}"></textarea>

      <button class="btn" id="btnEnviar">${t('btn')}</button>
      <div id="formError"></div>
    </div>
  `;

  document.querySelectorAll('.service-option').forEach(el => el.addEventListener('click', () => {
    document.querySelectorAll('.service-option').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
    selectedService = services.find(s => s.id === el.dataset.id);
  }));

  const fDataInput = document.getElementById('fData');
  if (fDataInput) fDataInput.addEventListener('change', () => { updateDateInfo(avail); atualizarFuso(); });
  const fHoraInput = document.getElementById('fHora');
  if (fHoraInput) fHoraInput.addEventListener('input', atualizarFuso);
  atualizarFuso();

  document.getElementById('btnEnviar').addEventListener('click', onSubmit);
}

function updateDateInfo(avail){
  const infoEl = document.getElementById('fDataInfo');
  const dataVal = document.getElementById('fData').value;
  if (!infoEl || !dataVal) return;
  const dateObj = new Date(dataVal + 'T00:00:00');
  const sched = getScheduleForDate(avail, dateObj);
  if (!sched || !sched.enabled){
    infoEl.textContent = t('naoAtende');
    infoEl.style.color = '#a33';
  } else {
    infoEl.textContent = t('habitual', { a: sched.start, b: sched.end });
    infoEl.style.color = '';
  }
}

// Mostra em que fuso são as horas e, se o visitante estiver noutro fuso,
// a hora equivalente no dispositivo dele.
function hojeNoFuso(){
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: FUSO, year: 'numeric', month: '2-digit', day: '2-digit' })
    .formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return p.year + '-' + p.month + '-' + p.day;
}

function atualizarFuso(){
  const el = document.getElementById('fFusoInfo');
  if (!el) return;
  const meu = fusoDoDispositivo();
  const base = t('fusoBase', { f: FUSO.replace('_', ' ') });
  const data = document.getElementById('fData')?.value;
  const hora = document.getElementById('fHora')?.value;
  if (meu === FUSO || !data || !hora){
    el.textContent = meu === FUSO ? '' : base;
    return;
  }
  const quando = dataNoFuso(data, hora, FUSO);
  el.textContent = base + t('fusoSeu', { f: meu.replace('_', ' '), q: formatarNoFuso(quando, meu) });
}

async function onSubmit(){
  const clientName = document.getElementById('fNome').value.trim();
  const clientContacto = document.getElementById('fContacto').value.trim();
  const mensagem = document.getElementById('fMensagem').value.trim();
  const errorEl = document.getElementById('formError');
  errorEl.innerHTML = '';

  if (!clientName || !clientContacto){
    errorEl.innerHTML = '<div class="errorbox">' + t('errContacto') + '</div>';
    return;
  }
  const eEmail = clientContacto.includes('@');
  if (eEmail ? !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(clientContacto) : clientContacto.replace(/\D/g, '').length < 7){
    errorEl.innerHTML = '<div class="errorbox">' + t('errContactoInv') + '</div>';
    return;
  }
  // Campo-armadilha para robôs: pessoas não o veem nem o preenchem.
  if (document.getElementById('fSite')?.value){
    main.innerHTML = '<div class="card success"><div class="check">✅</div><h2>' + t('enviado') + '</h2></div>';
    return;
  }

  const avail = profile.availability || {};
  const semHorarioFixo = !!avail.noFixedHours || avail.mode === 'none';
  let requestedStart = null;
  let quandoTexto = '';

  if (semHorarioFixo){
    quandoTexto = document.getElementById('fQuando').value.trim();
    if (!quandoTexto){
      errorEl.innerHTML = '<div class="errorbox">' + t('errQuando') + '</div>';
      return;
    }
  } else {
    const data = document.getElementById('fData').value;
    const hora = document.getElementById('fHora').value;
    if (!data){
      errorEl.innerHTML = '<div class="errorbox">' + t('errData') + '</div>';
      return;
    }
    const quando = dataNoFuso(data, hora || '09:00', FUSO);
    if (quando.getTime() < Date.now()){
      errorEl.innerHTML = '<div class="errorbox">' + t('errPassado') + '</div>';
      return;
    }
    requestedStart = quando.toISOString();
  }

  const btn = document.getElementById('btnEnviar');
  btn.disabled = true; btn.textContent = t('aEnviar');

  try{
    const contactoIsEmail = clientContacto.includes('@');
    await addDoc(collection(db, 'public_booking_requests'), {
      tenantId, status: 'pending_review',
      clientName,
      clientPhone: contactoIsEmail ? '' : clientContacto,
      clientEmail: contactoIsEmail ? clientContacto : '',
      serviceName: selectedService?.name || '',
      servicePrice: selectedService?.price ?? null,
      serviceId: selectedService?.id || '',
      requestedStart,
      preferenciaLivre: quandoTexto || '',
      message: mensagem,
      createdAt: new Date().toISOString()
    });

    main.innerHTML = `
      <div class="card success">
        <div class="check">✅</div>
        <h2>${t('enviado')}</h2>
        <p class="muted" style="margin-top:8px;">${t('enviadoTxt')}</p>
        ${requestedStart ? `<p style="margin-top:10px;"><strong>${t('pediu')}</strong> ${escapeHtml(formatarNoFuso(new Date(requestedStart), FUSO))} (${escapeHtml(FUSO.replace('_',' '))})${fusoDoDispositivo() !== FUSO ? '<br><span class="muted">' + escapeHtml(t('noSeuFuso', { q: formatarNoFuso(new Date(requestedStart), fusoDoDispositivo()) })) + '</span>' : ''}</p>` : ''}
      </div>
    `;
  }catch(e){
    console.error(e);
    errorEl.innerHTML = '<div class="errorbox">' + t('errEnviar') + '</div>';
    btn.disabled = false; btn.textContent = t('btn');
  }
}

load();
</script>
</body>
</html>
