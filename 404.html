<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vindora</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f6f8f7;color:#1a2b26;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:20px;}
  a{color:#2f6f5e;font-weight:600;}
</style>
</head>
<body>
<div id="msg"><p>A abrir…</p></div>
<script>
// Links com o nome do subscritor: vindora.pt/nome, vindora.pt/nome/marcar,
// vindora.pt/nome/formacao/ID. O GitHub Pages mostra esta página para
// qualquer endereço que não seja um ficheiro, e daqui encaminhamos.
(function(){
  var partes = location.pathname.replace(/^\/+|\/+$/g, '').split('/');
  var slug = (partes[0] || '').toLowerCase();
  var ok = /^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug) && slug.length >= 3 && slug.length <= 40;
  if (!ok){
    document.getElementById('msg').innerHTML = '<h2>Página não encontrada</h2><p style="margin-top:8px;"><a href="/">Ir para a página inicial</a></p>';
    return;
  }
  var extra = location.search.replace(/^\?/, '').split('&').filter(function(x){ return x && x.indexOf('t=') !== 0; }).join('&');
  var alvo = '/pagina.html?t=' + encodeURIComponent(slug);
  var hash = location.hash;
  var sub = (partes[1] || '').toLowerCase();
  if (sub === 'marcar') alvo = '/marcar.html?t=' + encodeURIComponent(slug);
  else if (sub === 'formacao' && partes[2]) alvo = '/inscricao.html?t=' + encodeURIComponent(slug) + '&tr=' + encodeURIComponent(partes[2]);
  else if (sub === 'formacoes') hash = '#trainingsSection';
  else if (sub === 'loja') hash = '#ofertasSection';
  if (extra) alvo += '&' + extra;
  location.replace(alvo + hash);
})();
</script>
<noscript><p>Ative o JavaScript para continuar.</p></noscript>
</body>
</html>
