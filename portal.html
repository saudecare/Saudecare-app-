<style>
  :root{ --primary:#1a2b26; }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f8f7;color:#1a2b26;margin:0;padding:0 0 40px;}
  header{background:var(--primary);color:#fff;padding:20px;text-align:center;}
  header h1{margin:0 0 4px;font-size:1.3rem;}
  header p{margin:0;opacity:.85;font-size:.9rem;}
  main{max-width:520px;margin:0 auto;padding:16px;}
  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .card h2{margin:0 0 10px;font-size:1.05rem;color:var(--primary);}
  .muted{color:#6b7a75;font-size:.85rem;}
  .appt{background:#f6f8f7;border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .appt strong{display:block;}
  .btn{display:inline-block;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:.95rem;cursor:pointer;text-decoration:none;text-align:center;}
  .btn-block{display:block;width:100%;margin-top:8px;}
  .crisis{background:#fdecea;border:1px solid #f3c1bc;border-radius:10px;padding:12px 14px;font-size:.85rem;line-height:1.5;color:#7a2b23;}
  .crisis strong{display:block;margin-bottom:4px;}
  #msgs{max-height:280px;overflow-y:auto;background:#f6f8f7;border-radius:10px;padding:10px;margin-bottom:8px;}
  .msg{margin-bottom:8px;max-width:80%;padding:8px 12px;border-radius:12px;font-size:.9rem;line-height:1.4;}
  .msg.me{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:2px;}
  .msg.them{background:#e9f0ee;border-bottom-left-radius:2px;}
  .msgtime{font-size:.7rem;opacity:.6;margin-top:2px;}
  .inputrow{display:flex;gap:6px;}
  .inputrow input{flex:1;padding:9px 10px;border:1px solid #ccc;border-radius:8px;font-size:.9rem;}
  .loading, .errorbox{text-align:center;padding:40px 20px;color:#6b7a75;}
  .scale-row{display:flex;gap:8px;flex-wrap:wrap;}
  .scale-btn{width:42px;height:42px;border-radius:50%;border:2px solid #e0e0e0;background:#fff;font-size:1.1rem;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6b7a75;user-select:none;}
  .scale-btn.selected{border-color:var(--primary);background:var(--primary);color:#fff;}
  .scale-label{font-size:.8rem;color:#6b7a75;margin:2px 0 6px;}
  .checkin-entry{background:#f6f8f7;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.85rem;}
  .checkin-entry .cvals{display:flex;gap:10px;margin:4px 0;font-size:.85rem;}
  .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:var(--card,#fff);border:1px solid #e5e5e5;border-radius:14px;padding:18px 10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;text-align:center;font-size:.9rem;color:var(--text,#1a2b26);}
  .tile:active{background:#eef6f2;}
  .tile-icon{font-size:28px;}
  .tile-badge{position:absolute;top:8px;right:8px;background:var(--primary);color:#fff;font-size:.65rem;
    padding:2px 7px;border-radius:20px;}
  .btn-back{background:none;border:none;color:var(--primary);font-size:.95rem;padding:6px 0 14px;cursor:pointer;font-weight:600;}
  .hidden{display:none !important;}
  .msg-tick{font-size:.75rem;color:#8fa39a;margin-left:4px;}
  .msg-tick.read{color:var(--primary);}
</style>
</head>

let T = (k) => k;
let __lang = 'pt';
const __LOCALES = { pt:'pt-PT', en:'en-GB', es:'es-ES', fr:'fr-FR', de:'de-DE', it:'it-IT' };
let __i18n = null;
const __i18nPronto = import('./i18n.js').then(m => {
  __i18n = m; m.registar('portal', __DICT); __lang = m.iniciarIdioma();
  T = (k, v) => m.t('portal', k, v);
}).catch(() => {});

// ── Verificação automática de versão ────────────────────────────────────
// Nunca recarrega sozinha (podia interromper alguém a meio de escrever
// uma mensagem) — só mostra um aviso discreto, a pessoa escolhe quando.
(async function checkForPageUpdate(){
  try {
    const res = await fetch(window.location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    const html = await res.text();
    const match = html.match(/const PAGE_VERSION = '([^']+)'/);
    if (match && match[1] !== PAGE_VERSION){
      await __i18nPronto; document.getElementById('updTxt').textContent = T('novaVersao'); document.getElementById('updBtn').textContent = T('atualizar');
      document.getElementById('updateBanner').classList.remove('hidden');
    }
  } catch(e){
    // Falha de rede ao verificar não deve travar o arranque da página.
  }
})();

const FUNCTION_URL = 'https://effortless-entremet-7de9ef.netlify.app/.netlify/functions/patientPortal';
const params = new URLSearchParams(window.location.search);
const tenantId = params.get('t');
const patientId = params.get('p');
const token = params.get('k');

function escapeHtml(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function escapeAttrJs(str){
  return escapeHtml(str).replace(/'/g, "\\'");
}

window.downloadPaymentProof = function(serviceName, dateStr, price){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const business = portalData?.businessName || 'Vindora';
  const patientName = portalData?.patientName || '';
  let y = 60;

  doc.setFontSize(16);
  doc.text(T('pdfTitulo'), 40, y); y += 30;

  doc.setFontSize(11);
  doc.setTextColor(150, 60, 40);
  doc.text(T('pdfNaoFatura'), 40, y); y += 16;
  doc.text(T('pdfInterno'), 40, y); y += 30;

  doc.setTextColor(20, 30, 25);
  doc.setFontSize(12);
  doc.text(`${T('pdfConsultorio')}: ${business}`, 40, y); y += 20;
  doc.text(`${T('pdfPaciente')}: ${patientName}`, 40, y); y += 20;
  doc.text(`${T('pdfServico')}: ${serviceName || '-'}`, 40, y); y += 20;
  doc.text(`${T('pdfData')}: ${dateStr}`, 40, y); y += 20;
  doc.text(`${T('pdfValor')}: ${price}€`, 40, y); y += 20;
  doc.text(`${T('pdfEmitido')}: ${new Date().toLocaleString(__LOCALES[__lang])}`, 40, y); y += 40;

  doc.setFontSize(10);
  doc.setTextColor(120, 120, 120);
  doc.text(T('pdfFatura'), 40, y);

  doc.save(`comprovativo-pagamento-${dateStr.replace(/[/,: ]/g,'-')}.pdf`);
};

async function callPortal(action, extra){
  const res = await fetch(FUNCTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tenantId, patientId, token, action, ...extra })
  });
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.error || T('erroDesc'));
  return data;
}

function formatDateTime(iso){
  const d = new Date(iso);
  const loc = __LOCALES[__lang];
  return d.toLocaleDateString(loc, { weekday:'short', day:'2-digit', month:'2-digit' }) + (__lang === 'pt' ? ' às ' : ' · ') +
    d.toLocaleTimeString(loc, { hour:'2-digit', minute:'2-digit' });
}

function playPortalNotifSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    osc.start(); osc.stop(ctx.currentTime + 0.35);
  }catch(e){ /* som é só um extra, nunca deve travar nada */ }
}

let __portalLastKnownUnread = null;
function updateMessagesTileBadge(count){
  const badge = document.getElementById('msgTileBadge');
  if (badge) badge.outerHTML = count > 0 ? `<span id="msgTileBadge" class="tile-badge">${count}</span>` : `<span id="msgTileBadge" style="display:none;"></span>`;
}
async function checkForNewMessages(){
  try{
    const res = await callPortal('unreadCount');
    const count = res.unreadMessagesCount || 0;
    if (__portalLastKnownUnread !== null && count > __portalLastKnownUnread) playPortalNotifSound();
    __portalLastKnownUnread = count;
    portalData.unreadMessagesCount = count;
    updateMessagesTileBadge(count);
  }catch(e){ /* falha silenciosa — não deve incomodar quem está a usar o Portal */ }
}
let __portalGlobalPollTimer = null;
function startGlobalMessagePolling(){
  if (__portalGlobalPollTimer) return;
  __portalGlobalPollTimer = setInterval(checkForNewMessages, 25000);
}

let __lastPortalMsgSig = null;
function renderMessages(messages){
  const box = document.getElementById('msgs');
  if (!box) return;
  const sig = messages.map(m => m.id + (m.readByProfessional ? '1' : '0')).join('|');
  if (sig === __lastPortalMsgSig) return; // nada mudou, não redesenha (evita "piscar")
  __lastPortalMsgSig = sig;
  box.innerHTML = messages.length ? messages.map(m => `
    <div class="msg ${m.sender === 'patient' ? 'me' : 'them'}">
      ${escapeHtml(m.text)}
      <div class="msgtime">${formatDateTime(m.createdAt)}${m.sender === 'patient' ? `<span class="msg-tick ${m.readByProfessional ? 'read' : ''}">${m.readByProfessional ? T('lida') : T('enviada')}</span>` : ''}</div>
    </div>`).join('') : '<p class="muted" style="text-align:center;">' + T('semMsgs') + '</p>';
  box.scrollTop = box.scrollHeight;
}

function toggleReport(id){
  const el = document.getElementById('report_' + id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ── Diário de Bem-Estar ───────────────────────────────────────────────
const MOOD_ICONS = ['😔','😕','😐','🙂','😄'];
const SLEEP_ICONS = ['😩','😪','😐','🙂','😴'];
const ENERGY_ICONS = ['🪫','🔋','🔋','🔋','⚡'];
const checkinState = { mood: null, sleepQuality: null, energyLevel: null };

function buildScale(containerId, key, icons){
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = [1,2,3,4,5].map(n => `<div class="scale-btn" onclick="selectScale('${containerId}','${key}',${n})">${icons[n-1]}</div>`).join('');
}

function selectScale(containerId, key, val){
  checkinState[key] = checkinState[key] === val ? null : val;
  const el = document.getElementById(containerId);
  [...el.children].forEach((btn, i) => btn.classList.toggle('selected', (i+1) === checkinState[key]));
}

function renderCheckinHistory(checkins){
  const box = document.getElementById('checkinHistory');
  if (!box) return;
  if (!checkins || !checkins.length){
    box.innerHTML = '<p class="muted">' + T('semRegistos') + '</p>';
    return;
  }
  box.innerHTML = checkins.map(c => {
    const parts = [];
    if (c.mood) parts.push(`${MOOD_ICONS[c.mood-1]} ${T('humor')}`);
    if (c.sleepQuality) parts.push(`${SLEEP_ICONS[c.sleepQuality-1]} ${T('sono')}`);
    if (c.energyLevel) parts.push(`${ENERGY_ICONS[c.energyLevel-1]} ${T('energia')}`);
    return `<div class="checkin-entry">
      <strong>${formatDateTime(c.createdAt)}</strong>
      ${parts.length ? `<div class="cvals">${parts.join(' &nbsp; ')}</div>` : ''}
      ${c.notes ? `<div style="white-space:pre-wrap;margin-top:4px;">${escapeHtml(c.notes)}</div>` : ''}
    </div>`;
  }).join('');
}

async function submitCheckin(){
  const notes = document.getElementById('checkinNotes').value.trim();
  if (!checkinState.mood && !checkinState.sleepQuality && !checkinState.energyLevel && !notes){
    alert(T('escolhaUma'));
    return;
  }
  const btn = document.getElementById('checkinSubmitBtn');
  btn.disabled = true;
  btn.textContent = T('aGuardar');
  try{
    await callPortal('addCheckin', { mood: checkinState.mood, sleepQuality: checkinState.sleepQuality, energyLevel: checkinState.energyLevel, notes });
    document.getElementById('checkinNotes').value = '';
    checkinState.mood = null; checkinState.sleepQuality = null; checkinState.energyLevel = null;
    buildScale('moodScale', 'mood', MOOD_ICONS);
    buildScale('sleepScale', 'sleepQuality', SLEEP_ICONS);
    buildScale('energyScale', 'energyLevel', ENERGY_ICONS);
    const data = await callPortal('get');
    portalData = data;
    renderCheckinHistory(data.checkins);
    btn.textContent = T('registado');
    setTimeout(() => { btn.textContent = T('guardarHoje'); }, 1800);
  }catch(e){
    alert(T('erroGuardar'));
    btn.textContent = T('guardarHoje');
  }
  btn.disabled = false;
}

let __messagePollTimer = null;

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.disabled = true;
  try{
    await callPortal('sendMessage', { text });
    input.value = '';
    await refreshMessages();
  }catch(e){
    alert(T('erroMsg'));
  }
  input.disabled = false;
  input.focus();
}

async function refreshMessages(){
  try{
    const data = await callPortal('get');
    portalData = data;
    renderMessages(data.messages);
  }catch(e){ /* falha silenciosa — tenta outra vez no próximo ciclo */ }
}

function startMessagePolling(){
  stopMessagePolling();
  // Verifica mensagens novas a cada 5 segundos enquanto esta secção
  // estiver aberta — o mais próximo de "instantâneo" que conseguimos
  // sem um servidor de tempo real dedicado (que teria custos extra).
  __messagePollTimer = setInterval(refreshMessages, 5000);
}

function stopMessagePolling(){
  if (__messagePollTimer){ clearInterval(__messagePollTimer); __messagePollTimer = null; }
}

let portalData = null;
let currentSection = null;

function crisisBox(){
  return `<div class="card crisis">
    <strong>${T('crisisTitulo')}</strong>
    ${T('crisisTxt')}
  </div>`;
}

// ── "Adicionar ao ecrã principal" com identidade do consultório ─────────
// Mesmo mecanismo usado na página pública — troca o manifest genérico por
// um construído na hora com o nome/cor/logótipo deste consultório.
function applyPortalManifest(businessName, primaryColor, logoUrl){
  if (logoUrl){
    const appleIcon = document.getElementById('appleTouchIcon');
    if (appleIcon) appleIcon.href = logoUrl;
  }
  const manifestObj = {
    name: (businessName || 'Vindora') + ' — ' + T('portalTitle'),
    short_name: (businessName || 'Vindora').slice(0, 12),
    start_url: window.location.href,
    display: 'standalone',
    background_color: '#f6f8f7',
    theme_color: primaryColor || '#1a2b26',
    icons: logoUrl ? [
      { src: logoUrl, sizes: '192x192', type: 'image/png' },
      { src: logoUrl, sizes: '512x512', type: 'image/png' }
    ] : []
  };
  const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
  const manifestLink = document.getElementById('dynamicManifest');
  if (manifestLink) manifestLink.href = URL.createObjectURL(blob);
}

let __deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  __deferredInstallPrompt = e;
});

window.installPortalApp = async function(){
  if (__deferredInstallPrompt){
    __deferredInstallPrompt.prompt();
    await __deferredInstallPrompt.userChoice;
    __deferredInstallPrompt = null;
  } else {
    alert(T('instalarAjuda'));
  }
};

  const main = document.getElementById('mainContent');
  const data = portalData;
  const hasOnlineUpcoming = data.upcoming.some(a => a.local === 'online');
  const hasHealing = (data.healingProtocols||[]).length > 0;
  main.innerHTML = `
    ${crisisBox()}
    <button class="btn btn-block" style="margin-bottom:14px;" onclick="installPortalApp()">${T('instalar')}</button>
    <div class="tile-grid">
      <button class="tile" onclick="openPortalSection('appointments')">
        ${hasOnlineUpcoming ? '<span class="tile-badge">' + T('tOnline') + '</span>' : ''}
        <span class="tile-icon">📅</span><span>${T('tMarcacoes')}</span>
      </button>
      <button class="tile" onclick="openPortalSection('checkin')">
        <span class="tile-icon">🌱</span><span>${T('tDiario')}</span>
      </button>
      <button class="tile" onclick="openPortalSection('messages')">
        <span id="msgTileBadge" class="tile-badge" style="${(data.unreadMessagesCount||0) > 0 ? '' : 'display:none;'}">${data.unreadMessagesCount||0}</span>
        <span class="tile-icon">💬</span><span>${data.preferredChannel && data.preferredChannel !== 'portal' ? T('tContacto') : T('tMensagens')}</span>
      </button>
      <button class="tile" onclick="openPortalSection('reports')">
        <span class="tile-icon">📖</span><span>${T('tRelatorios')}${hasHealing ? T('eRotina') : ''}</span>
      </button>
      <button class="tile" onclick="openPortalSection('myData')">
        <span class="tile-icon">📋</span><span>${T('tDados')}</span>
      </button>
      <button class="tile" onclick="openPortalSection('materials')">
        ${(data.sharedMaterials||[]).length ? '<span class="tile-badge">' + data.sharedMaterials.length + '</span>' : ''}
        <span class="tile-icon">🎧</span><span>${T('tMateriais')}</span>
      </button>
    </div>
  `;
}

window.openPortalSection = function(name){
  currentSection = name;
  history.pushState({ section: name }, '', '#' + name);
  renderPortalSection(name);
};

window.backToPortalMenu = function(fromPopstate){
  currentSection = null;
  if (!fromPopstate) history.pushState({ section: null }, '', window.location.pathname + window.location.search);
  renderMenu();
};

// Faz o botão físico/gesto de retroceder do telemóvel voltar ao menu do
// Portal, em vez de sair da página logo na primeira vez que é usado.
window.addEventListener('popstate', (e) => {
  if (e.state && e.state.section){
    currentSection = e.state.section;
    renderPortalSection(currentSection);
  } else {
    backToPortalMenu(true);
  }
});

function renderPortalSection(name){
  stopMessagePolling();
  const main = document.getElementById('mainContent');
  const data = portalData;
  const backBtn = `<button class="btn-back" onclick="backToPortalMenu()">${T('voltar')}</button>`;
  let inner = '';

  if (name === 'appointments'){
    const paymentBadge = (a) => {
      if (!a.price) return '';
      const label = a.paymentStatus === 'paid' ? T('pago') : (a.paymentStatus === 'partial' ? T('parcial') : T('pendente'));
      return `<div class="muted" style="margin-top:2px;">${label} · ${a.price}€</div>`;
    };
    const upcomingHtml = data.upcoming.length
      ? data.upcoming.map(a => `
        <div class="appt">
          <strong>${formatDateTime(a.startsAt)}</strong>
          <span class="muted">${escapeHtml(a.serviceName||'')} ${a.local==='online' ? '· 💻 ' + T('tOnline') : ''}</span>
          ${paymentBadge(a)}
        </div>`).join('')
      : '<p class="muted">' + T('semMarc') + '</p>';

    const pastHtml = data.past.length
      ? data.past.map(a => `
        <div class="appt">
          <strong>${formatDateTime(a.startsAt)}</strong>
          <span class="muted">${escapeHtml(a.serviceName||'')}</span>
          ${paymentBadge(a)}
          ${a.price && a.paymentStatus === 'paid' ? `<button class="ghost" style="margin-top:6px;" onclick="downloadPaymentProof('${escapeAttrJs(a.serviceName||'')}','${escapeAttrJs(formatDateTime(a.startsAt))}',${a.price})">${T('descComp')}</button>` : ''}
        </div>`).join('')
      : '<p class="muted">' + T('semAnt') + '</p>';

    const hasOnlineUpcoming = data.upcoming.some(a => a.local === 'online');
    const oc = data.onlineConsult || { tool: 'whatsapp' };
    let onlineToolHtml = '';
    if (oc.tool === 'custom' && oc.customLink){
      onlineToolHtml = `<a class="btn btn-block" target="_blank" href="${escapeHtml(oc.customLink)}">${T('entrarVideo')}</a>`;
    } else if (oc.tool === 'whatsapp'){
      if (oc.whatsappNumber){
        onlineToolHtml = `<a class="btn btn-block" target="_blank" href="https://wa.me/${oc.whatsappNumber}">${T('abrirWA')}</a>
          <p class="muted" style="margin-top:6px;">${T('waNota')}</p>`;
      } else {
        onlineToolHtml = `<p class="muted">${T('videoNaoCfg')}</p>`;
      }
    } else {
      const jitsiRoom = 'saudecare-' + tenantId.slice(0,8) + '-' + patientId.slice(0,8);
      const displayName = encodeURIComponent(data.patientName || T('paciente'));
      onlineToolHtml = `<a class="btn btn-block" target="_blank" href="https://meet.jit.si/${jitsiRoom}#config.disableDeepLinking=true&config.deeplinking.disabled=true&config.prejoinPageEnabled=false&config.startWithAudioMuted=false&config.startWithVideoMuted=false&userInfo.displayName=%22${displayName}%22">${T('entrarVideo')}</a>`;
    }

    inner = `
      ${hasOnlineUpcoming ? `
      <div class="card">
        <h2>${T('consultaOnline')}</h2>
        <p class="muted">${T('temOnline')}</p>
        ${onlineToolHtml}
        <p class="muted" style="margin-top:8px;">${T('precisaNet')}</p>
      </div>` : ''}
      <div class="card">
        <h2>${T('proximas')}</h2>
        ${upcomingHtml}
      </div>
      <div class="card">
        <h2>${T('historico')}</h2>
        ${pastHtml}
      </div>
    `;

  } else if (name === 'checkin'){
    inner = `
      <div class="card">
        <h2>${T('tDiario').replace(/^/, '🌱 ')}</h2>
        <p class="muted" style="margin-bottom:10px;">${T('diarioTxt')}</p>
        <div class="scale-label">${T('humor')}</div>
        <div class="scale-row" id="moodScale"></div>
        <div class="scale-label" style="margin-top:10px;">${T('sono')}</div>
        <div class="scale-row" id="sleepScale"></div>
        <div class="scale-label" style="margin-top:10px;">${T('energia')}</div>
        <div class="scale-row" id="energyScale"></div>
        <textarea id="checkinNotes" placeholder="${T('notasPh')}" rows="3" style="width:100%;margin-top:12px;padding:9px 10px;border:1px solid #ccc;border-radius:8px;font-family:inherit;font-size:.9rem;resize:vertical;"></textarea>
        <button id="checkinSubmitBtn" class="btn btn-block" onclick="submitCheckin()">${T('guardarHoje')}</button>
        <div id="checkinHistory" style="margin-top:14px;"></div>
      </div>
    `;

  } else if (name === 'messages'){
    if (data.preferredChannel && data.preferredChannel !== 'portal'){
      const wa = data.onlineConsult?.tool === 'whatsapp' && data.onlineConsult?.whatsappNumber
        ? `<a class="btn btn-block" style="margin-top:8px;" target="_blank" href="https://wa.me/${data.onlineConsult.whatsappNumber}">${T('abrirWA')}</a>`
        : '';
      inner = `
        <div class="card">
          <h2>${T('contactoTitulo')}</h2>
          <p class="muted">${T('prefereWA')}</p>
          ${wa}
        </div>
      `;
    } else {
    inner = `
      <div class="card">
        <h2>${T('msgsTitulo')}</h2>
        <p class="muted" style="margin-bottom:8px;">${T('msgsTxt')}</p>
        <div id="msgs"></div>
        <div class="inputrow">
          <input id="msgInput" placeholder="${T('escreverMsg')}" onkeydown="if(event.key==='Enter')sendMessage()">
          <button class="btn" onclick="sendMessage()">${T('enviar')}</button>
        </div>
      </div>
    `;
    }

  } else if (name === 'reports'){
    const reportsHtml = data.reports.length
      ? data.reports.map(r => `
        <div class="appt" style="cursor:pointer;" onclick="toggleReport('${r.id}')">
          <div class="row" style="justify-content:space-between;align-items:center;">
            <div>
              <strong>${escapeHtml(r.protocolName||T('relatorio'))}</strong>
              <span class="muted">${r.generatedAt ? formatDateTime(r.generatedAt) : ''}</span>
            </div>
            <span class="muted">${T('tocarVer')}</span>
          </div>
          <div id="report_${r.id}" style="display:none;margin-top:8px;font-size:.9rem;background:#fff;border-radius:8px;padding:14px;">${r.reportHtml ? r.reportHtml : `<div style="white-space:pre-wrap;font-size:.85rem;">${escapeHtml(r.reportText||T('semConteudo'))}</div>`}</div>
        </div>`).join('')
      : '<p class="muted">' + T('semRelat') + '</p>';

    const healingHtml = (data.healingProtocols||[]).length
      ? data.healingProtocols.map(h => `
        <div class="appt">
          <strong>${h.generatedAt ? formatDateTime(h.generatedAt) : T('rotinaCura')}</strong>
          ${h.emotionalPattern ? `<div class="muted">${T('padraoEmo')}: ${escapeHtml(h.emotionalPattern)}</div>` : ''}
          ${h.notes ? `<div style="margin-top:6px;white-space:pre-wrap;">${escapeHtml(h.notes)}</div>` : ''}
          ${h.materialsLink ? `<a class="btn btn-block" style="margin-top:8px;" target="_blank" href="${escapeHtml(h.materialsLink)}">${T('abrirMat')}</a>` : ''}
        </div>`).join('')
      : '';

    inner = `
      ${healingHtml ? `
      <div class="card">
        <h2>${T('minhaRotina')}</h2>
        ${healingHtml}
      </div>` : ''}
      <div class="card">
        <h2>${T('relatAnt')}</h2>
        ${reportsHtml}
      </div>
    `;

  } else if (name === 'myData'){
    const md = data.myData || {};
    const customFieldsHtml = (md.customFields||[]).length
      ? md.customFields.map(f => `<div class="appt"><strong>${escapeHtml(f.label||'')}</strong><div class="muted">${escapeHtml(f.value||'—')}</div></div>`).join('')
      : '';
    inner = `
      <div class="card">
        <h2>${T('dadosTitulo')}</h2>
        <p class="muted" style="margin-bottom:10px;">${T('dadosTxt')}</p>
        ${md.photoUrl ? `<img src="${escapeHtml(md.photoUrl)}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;margin-bottom:10px;" onerror="this.style.display='none';">` : ''}
        <div class="appt"><strong>${T('nomeCompleto')}</strong><div class="muted">${escapeHtml(md.fullName||'—')}</div></div>
        <div class="appt"><strong>${T('telefone')}</strong><div class="muted">${escapeHtml(md.phone||'—')}</div></div>
        <div class="appt"><strong>${T('email')}</strong><div class="muted">${escapeHtml(md.email||'—')}</div></div>
        <div class="appt"><strong>${T('nif')}</strong><div class="muted">${escapeHtml(md.nif||'—')}</div></div>
        ${customFieldsHtml}
        ${md.clinicalNotes !== null && md.clinicalNotes !== undefined ? `
        <div class="appt"><strong>${T('notasClin')}</strong><div class="muted" style="white-space:pre-wrap;">${escapeHtml(md.clinicalNotes||'—')}</div></div>` : ''}
      </div>
    `;

  } else if (name === 'materials'){
    const materials = data.sharedMaterials || [];
    const materialsHtml = materials.length
      ? materials.map(m => `
        <div class="appt">
          <strong>${escapeHtml(m.label||T('material'))}</strong>
          <a class="btn btn-block" style="margin-top:8px;" target="_blank" rel="noopener" href="${escapeHtml(m.url)}">${T('abrirDesc')}</a>
        </div>`).join('')
      : '<p class="muted">' + T('semMat') + '</p>';
    inner = `
      <div class="card">
        <h2>${T('matTitulo')}</h2>
        <p class="muted" style="margin-bottom:10px;">${T('matTxt')}</p>
        ${materialsHtml}
      </div>
    `;
  }

  main.innerHTML = `${backBtn}${inner}`;

  if (name === 'checkin'){
    buildScale('moodScale', 'mood', MOOD_ICONS);
    buildScale('sleepScale', 'sleepQuality', SLEEP_ICONS);
    buildScale('energyScale', 'energyLevel', ENERGY_ICONS);
    renderCheckinHistory(data.checkins);
  }
  if (name === 'messages' && (!data.preferredChannel || data.preferredChannel === 'portal')){
    __lastPortalMsgSig = null;
    renderMessages(data.messages);
    startMessagePolling();
    __portalLastKnownUnread = 0;
    updateMessagesTileBadge(0);
    callPortal('markMessagesRead').catch(()=>{});
  }
}

async function load(){
  const main = document.getElementById('mainContent');
  if (!tenantId || !patientId || !token){
    await __i18nPronto; main.innerHTML = '<div class="errorbox">' + T('linkIncompleto') + '</div>';
    return;
  }
  await __i18nPronto;
  montarSeletor();
  try{
    const data = await callPortal('get');
    portalData = data;
    document.documentElement.style.setProperty('--primary', data.primaryColor || '#1a2b26');
    document.getElementById('hBusiness').textContent = data.businessName;
    document.getElementById('hPatient').textContent = T('ola', { n: data.patientName });
    document.title = data.businessName + ' — ' + T('portalTitle');
    applyPortalManifest(data.businessName, data.primaryColor, data.logoUrl);

    if (!data.portalConsentGivenAt && data.consentText){
      renderConsentGate();
    } else {
      renderMenu();
    }
    __portalLastKnownUnread = data.unreadMessagesCount || 0;
    startGlobalMessagePolling();
  }catch(e){
    console.error(e);
    main.innerHTML = '<div class="errorbox">' + T('naoAbre') + '</div>';
  }
}

function renderConsentGate(){
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="card">
      <h2>${T('antes')}</h2>
      <p class="muted" style="margin-bottom:10px;">${T('leiaTermo')}</p>
      <div style="max-height:280px;overflow-y:auto;background:#f6f8f7;border-radius:8px;padding:12px;font-size:13px;white-space:pre-wrap;margin-bottom:14px;">${escapeHtml(portalData.consentText)}</div>
      <label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;margin-bottom:14px;">
        <input type="checkbox" id="consentGateCheckbox" style="width:auto;margin-top:3px;">
        <span>${T('concordo')}</span>
      </label>
      <button id="consentGateBtn" class="btn btn-block" onclick="acceptConsentGate()">${T('confCont')}</button>
      <p id="consentGateError" class="muted" style="color:#b3413a;margin-top:8px;"></p>
    </div>
  `;
}

window.acceptConsentGate = async function(){
  const errEl = document.getElementById('consentGateError');
  errEl.textContent = '';
  if (!document.getElementById('consentGateCheckbox').checked){
    errEl.textContent = T('marcarConf');
    return;
  }
  const btn = document.getElementById('consentGateBtn');
  btn.disabled = true;
  btn.textContent = T('aConfirmar');
  try{
    await callPortal('giveConsent');
    renderMenu();
  }catch(e){
    errEl.textContent = T('erroConf');
    btn.disabled = false;
    btn.textContent = T('confCont');
  }
};

function montarSeletor(){
  const sel = document.getElementById('vdLang');
  if (!sel || !__i18n) return;
  sel.innerHTML = __i18n.IDIOMAS.map(([k,n]) => '<option value="'+k+'"'+(k===__lang?' selected':'')+'>'+n+'</option>').join('');
  sel.onchange = () => {
    __i18n.definirIdioma(sel.value); __lang = sel.value;
    T = (k, v) => __i18n.t('portal', k, v);
    if (!portalData) return;
    document.getElementById('hPatient').textContent = T('ola', { n: portalData.patientName });
    document.title = portalData.businessName + ' — ' + T('portalTitle');
    if (document.getElementById('consentGateBtn')) renderConsentGate();
    else if (currentSection) renderPortalSection(currentSection); else renderMenu();
  };
}

load();
