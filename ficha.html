<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Ficha de Avaliação</title>
<style>
  :root{ --primary:#2f6f5e; --primary-dark:#1f4d40; --bg:#f6f8f7; --card:#fff; --text:#1a2b26; --muted:#6b7d76; }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{background:var(--bg);color:var(--text);}
  .hero{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:28px 20px;text-align:center;}
  .hero h1{font-size:22px;margin-bottom:6px;}
  .hero p{opacity:.9;font-size:14px;}
  .wrap{max-width:520px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);}
  label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px;}
  input,textarea{width:100%;padding:10px;border:1px solid #d8e0dc;border-radius:8px;margin-bottom:14px;font-size:14px;}
  .scale{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .scale button{width:36px;height:36px;border-radius:8px;border:1px solid #d8e0dc;background:#fff;cursor:pointer;}
  .scale button.selected{background:var(--primary);color:#fff;border-color:var(--primary);}
  .choice{display:block;border:1px solid #d8e0dc;border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;}
  .choice.selected{border-color:var(--primary);background:#eef6f2;}
  button.primary{background:var(--primary);color:#fff;border:none;width:100%;padding:13px;border-radius:10px;font-size:15px;cursor:pointer;margin-top:6px;}
  .muted{color:var(--muted);font-size:12px;}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a2b26;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:999;}
  .confirm-box{text-align:center;padding:30px 16px;}
  .confirm-box .check{font-size:44px;margin-bottom:10px;}
</style>
</head>
<body>

<div class="hero">
  <h1 id="formTitle">…</h1>
  <p id="formDesc"></p>
</div>

<div class="wrap">
  <div id="langBox" style="text-align:right;margin-bottom:8px;"></div>
  <div id="content"></div>
</div>

<div id="toast"></div>

<script type="module">
import { aplicarCorMarca } from "./marca.js";
import { registar, t as _t, iniciarIdioma, definirIdioma, IDIOMAS, idioma } from "./i18n.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, collection, addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

registar('ficha', {"carregar": {"pt": "A carregar…", "en": "Loading…", "es": "Cargando…", "fr": "Chargement…", "de": "Wird geladen…", "it": "Caricamento…"}, "linkInv": {"pt": "Ligação inválida", "en": "Invalid link", "es": "Enlace no válido", "fr": "Lien invalide", "de": "Ungültiger Link", "it": "Link non valido"}, "linkInvTxt": {"pt": "Falta informação no link (?t=&f=).", "en": "The link is missing information (?t=&f=).", "es": "Falta información en el enlace (?t=&f=).", "fr": "Il manque des informations dans le lien (?t=&f=).", "de": "Im Link fehlen Angaben (?t=&f=).", "it": "Mancano informazioni nel link (?t=&f=)."}, "pagNaoEnc": {"pt": "Página não encontrada", "en": "Page not found", "es": "Página no encontrada", "fr": "Page introuvable", "de": "Seite nicht gefunden", "it": "Pagina non trovata"}, "fichaNaoEnc": {"pt": "Ficha não encontrada", "en": "Form not found", "es": "Ficha no encontrada", "fr": "Fiche introuvable", "de": "Formular nicht gefunden", "it": "Scheda non trovata"}, "nome": {"pt": "O seu nome", "en": "Your name", "es": "Su nombre", "fr": "Votre nom", "de": "Ihr Name", "it": "Il suo nome"}, "nomePh": {"pt": "Nome completo", "en": "Full name", "es": "Nombre completo", "fr": "Nom complet", "de": "Vollständiger Name", "it": "Nome completo"}, "contacto": {"pt": "Telefone ou email (para vos ser possível identificar a resposta)", "en": "Phone or email (so that your answer can be identified)", "es": "Teléfono o correo electrónico (para poder identificar su respuesta)", "fr": "Téléphone ou e-mail (pour pouvoir identifier votre réponse)", "de": "Telefon oder E-Mail (damit Ihre Antwort zugeordnet werden kann)", "it": "Telefono o e-mail (per poter identificare la sua risposta)"}, "contactoPh": {"pt": "Telefone ou email", "en": "Phone or email", "es": "Teléfono o correo electrónico", "fr": "Téléphone ou e-mail", "de": "Telefon oder E-Mail", "it": "Telefono o e-mail"}, "termo": {"pt": "Termo de consentimento", "en": "Consent form", "es": "Consentimiento", "fr": "Formulaire de consentement", "de": "Einwilligungserklärung", "it": "Modulo di consenso"}, "aceito": {"pt": "Li e aceito os termos acima.", "en": "I have read and accept the terms above.", "es": "He leído y acepto los términos anteriores.", "fr": "J’ai lu et j’accepte les conditions ci-dessus.", "de": "Ich habe die obigen Bedingungen gelesen und akzeptiere sie.", "it": "Ho letto e accetto i termini sopra indicati."}, "confirmo": {"pt": "Confirmo que as respostas que estou a dar são verdadeiras e autorizo o seu uso pelo profissional responsável para efeitos de avaliação e acompanhamento.", "en": "I confirm that the answers I am giving are true and I authorise their use by the responsible professional for assessment and follow-up purposes.", "es": "Confirmo que las respuestas que doy son verdaderas y autorizo su uso por el profesional responsable a efectos de evaluación y seguimiento.", "fr": "Je confirme que mes réponses sont véridiques et j’autorise leur utilisation par le professionnel responsable à des fins d’évaluation et de suivi.", "de": "Ich bestätige, dass meine Antworten wahrheitsgemäß sind, und erlaube der verantwortlichen Fachperson, sie zur Beurteilung und Begleitung zu verwenden.", "it": "Confermo che le risposte fornite sono veritiere e autorizzo il loro uso da parte del professionista responsabile ai fini di valutazione e follow-up."}, "enviar": {"pt": "Enviar respostas", "en": "Send answers", "es": "Enviar respuestas", "fr": "Envoyer les réponses", "de": "Antworten senden", "it": "Invia le risposte"}, "indiqueNome": {"pt": "Indique o seu nome.", "en": "Please enter your name.", "es": "Indique su nombre.", "fr": "Indiquez votre nom.", "de": "Bitte geben Sie Ihren Namen an.", "it": "Indichi il suo nome."}, "confirmeAut": {"pt": "Confirme a autorização antes de enviar.", "en": "Confirm the authorisation before sending.", "es": "Confirme la autorización antes de enviar.", "fr": "Confirmez l’autorisation avant d’envoyer.", "de": "Bestätigen Sie die Erlaubnis vor dem Senden.", "it": "Confermi l’autorizzazione prima di inviare."}, "confirmeTermo": {"pt": "Confirme que leu e aceita o termo de consentimento antes de enviar.", "en": "Confirm that you have read and accept the consent form before sending.", "es": "Confirme que ha leído y acepta el consentimiento antes de enviar.", "fr": "Confirmez que vous avez lu et accepté le formulaire de consentement avant d’envoyer.", "de": "Bestätigen Sie vor dem Senden, dass Sie die Einwilligungserklärung gelesen und akzeptiert haben.", "it": "Confermi di aver letto e accettato il modulo di consenso prima di inviare."}, "enviadas": {"pt": "Respostas enviadas!", "en": "Answers sent!", "es": "¡Respuestas enviadas!", "fr": "Réponses envoyées !", "de": "Antworten gesendet!", "it": "Risposte inviate!"}, "obrigado": {"pt": "Obrigado. O profissional responsável vai analisar as suas respostas.", "en": "Thank you. The responsible professional will review your answers.", "es": "Gracias. El profesional responsable revisará sus respuestas.", "fr": "Merci. Le professionnel responsable examinera vos réponses.", "de": "Danke. Die verantwortliche Fachperson wird Ihre Antworten prüfen.", "it": "Grazie. Il professionista responsabile esaminerà le sue risposte."}, "erroEnviar": {"pt": "Não foi possível enviar. Tente novamente.", "en": "Could not send. Please try again.", "es": "No se pudo enviar. Inténtelo de nuevo.", "fr": "Envoi impossible. Veuillez réessayer.", "de": "Senden nicht möglich. Bitte versuchen Sie es erneut.", "it": "Impossibile inviare. Riprovi."}});
const t = (k) => _t('ficha', k);
iniciarIdioma();

const firebaseConfig = {
  apiKey: "AIzaSyDKWdXYEG6PO9KEMQMklyPGngtXuZlP7Cg",
  authDomain: "saudecare-app.firebaseapp.com",
  projectId: "saudecare-app",
  storageBucket: "saudecare-app.firebasestorage.app",
  messagingSenderId: "455466438728",
  appId: "1:455466438728:web:61cfbf9fac85d59e18c87d"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const tenantSlug = params.get('t');
const formId = params.get('f');
const linkedPatientId = params.get('p'); // opcional — link personalizado enviado a um paciente já existente
let tenantId = null;
let formData = null;
const answersState = {};

function toast(msg, isError=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#b3413a' : '#1a2b26';
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 3200);
}
function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

async function loadForm(){
  if (!tenantSlug || !formId){
    document.getElementById('formTitle').textContent = t('linkInv');
    document.getElementById('formDesc').textContent = t('linkInvTxt');
    return;
  }
  const profileSnap = await getDoc(doc(db, 'public_tenant_profiles', tenantSlug));
  if (!profileSnap.exists()){
    document.getElementById('formTitle').textContent = t('pagNaoEnc');
    return;
  }
  tenantId = profileSnap.data().tenantId;
  aplicarCorMarca(profileSnap.data().branding?.primaryColor);

  const formSnap = await getDoc(doc(db, 'tenants', tenantId, 'forms', formId));
  if (!formSnap.exists()){
    document.getElementById('formTitle').textContent = t('fichaNaoEnc');
    return;
  }
  formData = formSnap.data();
  document.getElementById('formTitle').textContent = formData.title;
  document.getElementById('formDesc').textContent = formData.description || '';
  renderForm();
}

function renderForm(){
  const content = document.getElementById('content');
  let questionsHtml = formData.questions.map(q => {
    if (q.type === 'text'){
      return `<div class="card">
        <label>${escapeHtml(q.label)}</label>
        <textarea rows="3" oninput="window.__setAnswer('${q.id}', this.value)"></textarea>
      </div>`;
    }
    if (q.type === 'scale'){
      let btns = '';
      for (let i=0; i<=10; i++){
        btns += `<button type="button" id="scale-${q.id}-${i}" onclick="window.__setScale('${q.id}', ${i})">${i}</button>`;
      }
      return `<div class="card">
        <label>${escapeHtml(q.label)}</label>
        <div class="scale">${btns}</div>
      </div>`;
    }
    if (q.type === 'multiple_choice'){
      let opts = (q.options||[]).map((o, idx) => `
        <div class="choice" id="choice-${q.id}-${idx}" onclick="window.__setChoice('${q.id}', ${idx}, '${escapeHtml(o).replace(/'/g,"\\'")}')">${escapeHtml(o)}</div>
      `).join('');
      return `<div class="card"><label>${escapeHtml(q.label)}</label>${opts}</div>`;
    }
    return '';
  }).join('');

  content.innerHTML = `
    <div class="card">
      <label>${t('nome')}</label>
      <input id="respName" placeholder="${t('nomePh')}">
      <label>${t('contacto')}</label>
      <input id="respContact" placeholder="${t('contactoPh')}">
    </div>
    ${formData.includesConsent && formData.consentTextSnapshot ? `
    <div class="card">
      <label style="margin-bottom:6px;">${t('termo')}</label>
      <div style="max-height:180px;overflow-y:auto;background:#f6f8f7;border-radius:8px;padding:10px;font-size:13px;white-space:pre-wrap;margin-bottom:8px;">${escapeHtml(formData.consentTextSnapshot)}</div>
      <label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;">
        <input type="checkbox" id="respConsentTerm" style="width:auto;margin-top:3px;">
        <span>${t('aceito')}</span>
      </label>
    </div>` : ''}
    ${questionsHtml}
    <div class="card">
      <label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;">
        <input type="checkbox" id="respConsent" style="width:auto;margin-top:3px;">
        <span>${t('confirmo')}</span>
      </label>
    </div>
    <button class="primary" onclick="window.__submitForm()">${t('enviar')}</button>
  `;
}

window.__setAnswer = function(qId, value){ answersState[qId] = value; };

window.__setScale = function(qId, value){
  for (let i=0;i<=10;i++){
    const el = document.getElementById(`scale-${qId}-${i}`);
    if (el) el.classList.toggle('selected', i===value);
  }
  answersState[qId] = value;
};

window.__setChoice = function(qId, idx, label){
  formData.questions.find(q=>q.id===qId).options.forEach((_, i) => {
    const el = document.getElementById(`choice-${qId}-${i}`);
    if (el) el.classList.toggle('selected', i===idx);
  });
  answersState[qId] = label;
};

window.__submitForm = async function(){
  const name = document.getElementById('respName').value.trim();
  if (!name){ toast(t('indiqueNome'), true); return; }
  if (!document.getElementById('respConsent').checked){ toast(t('confirmeAut'), true); return; }
  if (formData.includesConsent && !document.getElementById('respConsentTerm')?.checked){
    toast(t('confirmeTermo'), true);
    return;
  }

  const answers = formData.questions.map(q => ({
    questionId: q.id,
    label: q.label,
    value: answersState[q.id] ?? ''
  }));

  try{
    await addDoc(collection(db, 'public_form_responses'), {
      tenantId,
      formId,
      formTitle: formData.title,
      patientId: linkedPatientId || null,
      respondentName: name,
      respondentContact: document.getElementById('respContact').value.trim(),
      answers,
      consentConfirmedAt: serverTimestamp(),
      consentTermAccepted: formData.includesConsent ? true : null,
      status: 'pending_review',
      submittedAt: serverTimestamp()
    });
    document.getElementById('content').innerHTML = `
      <div class="card confirm-box">
        <div class="check">✅</div>
        <h2>${t('enviadas')}</h2>
        <p class="muted" style="margin-top:8px;">${t('obrigado')}</p>
      </div>`;
  }catch(e){
    console.error(e);
    toast(t('erroEnviar'), true);
  }
};

function restaurar(){
  Object.keys(answersState).forEach(q => {
    const v = answersState[q];
    const ta = document.querySelector('textarea[oninput*="\'' + q + '\'"]'); if (ta && typeof v === 'string') ta.value = v;
    if (typeof v === 'number'){ const b = document.getElementById('scale-' + q + '-' + v); if (b) b.classList.add('selected'); }
    const fq = formData.questions.find(x => x.id === q);
    if (fq && fq.type === 'multiple_choice'){ (fq.options||[]).forEach((o,i) => { if (o === v){ const el = document.getElementById('choice-' + q + '-' + i); if (el) el.classList.add('selected'); } }); }
  });
}
document.getElementById('langBox').innerHTML = '<select id="vdLang" aria-label="Language" style="width:auto;padding:5px 8px;font-size:12px;">' + IDIOMAS.map(([k,n]) => '<option value="'+k+'"'+(k===idioma()?' selected':'')+'>'+n+'</option>').join('') + '</select>';
document.getElementById('vdLang').addEventListener('change', e => {
  definirIdioma(e.target.value);
  if (!formData || !document.getElementById('respName')) return;
  const nome = document.getElementById('respName').value, cont = document.getElementById('respContact').value;
  renderForm();
  document.getElementById('respName').value = nome; document.getElementById('respContact').value = cont;
  restaurar();
});
loadForm();
</script>
<div style="text-align:center;padding:16px;color:var(--muted);font-size:12px;">Powered by Vindora</div>
</body>
</html>
