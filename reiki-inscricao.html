<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Inscrição — Hikari Fafe Escola de Reiki</title>
<style>
  :root{
    --fundo:#faf6ef; --papel:#fffdf9; --linha:#e6d9c3;
    --texto:#3b2f1e; --suave:#8a7a63; --destaque:#b8893b;
    --verde:#5d7a4a; --aviso:#9a5b3d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:0 0 40px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--fundo); color:var(--texto); line-height:1.55;
  }
  .envolve{max-width:520px;margin:0 auto;padding:0 14px;}
  header{text-align:center;padding:24px 0 8px;}
  header h1{font-size:1.15rem;margin:0;letter-spacing:.04em;}
  header p{margin:5px 0 0;color:var(--suave);font-size:.86rem;}
  .cartao{
    background:var(--papel); border:1px solid var(--linha);
    border-radius:14px; padding:18px; margin-top:14px;
  }
  .selo{
    display:inline-block; padding:4px 12px;
    border:1px solid var(--destaque); border-radius:999px;
    color:var(--destaque); font-size:.82rem;
  }
  .cartao h2{font-size:1.05rem;margin:10px 0 2px;}
  .suave{color:var(--suave);font-size:.88rem;}
  label{display:block;margin:14px 0 4px;font-size:.88rem;font-weight:600;}
  input[type=text],input[type=tel],input[type=email]{
    width:100%;padding:12px;border:1px solid var(--linha);border-radius:9px;
    font-size:1rem;font-family:inherit;background:#fff;color:var(--texto);
  }
  input:focus{outline:2px solid var(--destaque);outline-offset:0;}
  .consent{display:flex;gap:10px;align-items:flex-start;margin-top:16px;font-size:.84rem;color:var(--suave);}
  .consent input{margin-top:3px;flex-shrink:0;width:18px;height:18px;}
  button.enviar{
    width:100%;margin-top:18px;padding:14px;border:0;border-radius:10px;
    background:var(--destaque);color:#fff;font-size:1rem;font-family:inherit;cursor:pointer;
  }
  button.enviar:disabled{background:var(--linha);color:var(--suave);cursor:default;}
  .erro{color:var(--aviso);font-size:.88rem;margin-top:12px;min-height:1.2em;}
  .ok{text-align:center;padding:10px 0;}
  .ok .grande{font-size:2.2rem;}
  .nota{text-align:center;color:var(--suave);font-size:.78rem;margin:22px 0 0;}
  .armadilha{position:absolute;left:-9999px;top:-9999px;height:0;overflow:hidden;}
</style>
</head>
<body>
<div class="envolve">
  <header>
    <h1>HIKARI FAFE</h1>
    <p>Escola de Reiki</p>
  </header>
  <div id="conteudo"><div class="cartao" style="text-align:center;" ><span class="suave">A abrir…</span></div></div>
  <p class="nota">Os teus dados servem só para te dar acesso à formação. <a href="reiki-privacidade.html" style="color:inherit;">Privacidade</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKWdXYEG6PO9KEMQMklyPGngtXuZlP7Cg",
  authDomain: "saudecare-app.firebaseapp.com",
  projectId: "saudecare-app",
  storageBucket: "saudecare-app.firebasestorage.app",
  messagingSenderId: "455466438728",
  appId: "1:455466438728:web:61cfbf9fac85d59e18c87d"
};
const db = getFirestore(initializeApp(firebaseConfig));
const alvo = document.getElementById('conteudo');

const ROTULOS = {
  '1':'Nível 1 — Shoden',
  '2':'Nível 2 — Okuden',
  '3A':'Nível 3A — Shinpiden',
  '3B':'Nível 3B — Shinpiden'
};

const params = new URLSearchParams(location.search);
const tenant = params.get('t') || '';
const turmaId = params.get('turma') || '';
const token = params.get('k') || '';

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function mostrarInativo(){
  alvo.innerHTML = `
    <div class="cartao" style="text-align:center;">
      <div style="font-size:1.8rem;">🌿</div>
      <h2>Este link já não está ativo</h2>
      <p class="suave">Pede à Hikari Fafe um link novo para a tua turma.</p>
    </div>`;
}

function guardado(){
  try { return localStorage.getItem('reikiInsc-' + turmaId) === '1'; } catch(_){ return false; }
}
function marcarGuardado(){
  try { localStorage.setItem('reikiInsc-' + turmaId, '1'); } catch(_){}
}

function mostrarObrigado(){
  alvo.innerHTML = `
    <div class="cartao ok">
      <div class="grande">✅</div>
      <h2>Pedido enviado</h2>
      <p class="suave">A Hikari Fafe vai aceitar a tua inscrição e envia-te por WhatsApp o teu link pessoal da Sala de Estudo.</p>
    </div>`;
}

async function abrir(){
  if (!tenant || !turmaId || !token){ mostrarInativo(); return; }
  let turma = null;
  try {
    const s = await getDoc(doc(db, 'tenants', tenant, 'reikiClasses', turmaId));
    if (s.exists()) turma = s.data();
  } catch(e){ console.warn('Inscrição: não consegui ler a turma', e); }
  if (!turma || turma.conviteToken !== token || turma.conviteAtivo === false || turma.ativa === false){
    mostrarInativo(); return;
  }
  if (guardado()){ mostrarObrigado(); return; }

  const rotuloNivel = ROTULOS[turma.nivel] || '';
  alvo.innerHTML = `
    <div class="cartao">
      ${rotuloNivel ? `<span class="selo">${esc(rotuloNivel)}</span>` : ''}
      <h2>${esc(turma.nome || 'Turma de Reiki')}</h2>
      <p class="suave">Escreve o teu nome e o teu telemóvel. É só isto.</p>
      <form id="form" autocomplete="on" novalidate>
        <label for="nome">Nome completo</label>
        <input id="nome" type="text" autocomplete="name" placeholder="Como vai sair no certificado" maxlength="120">
        <label for="tel">Telemóvel (WhatsApp)</label>
        <input id="tel" type="tel" autocomplete="tel" inputmode="tel" placeholder="912 345 678" maxlength="30">
        <label for="mail">E-mail <span class="suave" style="font-weight:400;">(opcional)</span></label>
        <input id="mail" type="email" autocomplete="email" maxlength="120">
        <div class="armadilha" aria-hidden="true"><input id="site" type="text" tabindex="-1" autocomplete="off"></div>
        <label class="consent"><input id="ok" type="checkbox">
          <span>Autorizo a Hikari Fafe Escola de Reiki a guardar o meu nome e contacto para a minha formação.</span></label>
        <div id="erro" class="erro"></div>
        <button id="enviar" class="enviar" type="submit">Enviar inscrição</button>
      </form>
    </div>`;

  const form = document.getElementById('form');
  const erro = document.getElementById('erro');
  const botao = document.getElementById('enviar');

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    erro.textContent = '';
    const nome = document.getElementById('nome').value.trim().replace(/\s+/g, ' ');
    const tel = document.getElementById('tel').value.trim();
    const mail = document.getElementById('mail').value.trim();
    const digitos = tel.replace(/\D/g, '');

    if (document.getElementById('site').value){ marcarGuardado(); mostrarObrigado(); return; }
    if (nome.length < 2){ erro.textContent = 'Escreve o teu nome completo.'; return; }
    if (digitos.length < 9 || digitos.length > 15){ erro.textContent = 'Confirma o telemóvel: parece incompleto.'; return; }
    if (mail && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)){ erro.textContent = 'O e-mail não parece certo. Podes deixá-lo em branco.'; return; }
    if (!document.getElementById('ok').checked){ erro.textContent = 'Preciso da tua autorização para guardar os dados.'; return; }

    botao.disabled = true;
    botao.textContent = 'A enviar…';
    try {
      await addDoc(collection(db, 'tenants', tenant, 'reikiInscricoes'), {
        nome, telefone: tel, email: mail,
        turmaId, turmaNome: String(turma.nome || '').slice(0, 120),
        nivel: String(turma.nivel || ''), token,
        estado: 'pendente', criadoEm: serverTimestamp()
      });
      marcarGuardado();
      mostrarObrigado();
    } catch(e){
      console.warn('Inscrição: falhou', e);
      botao.disabled = false;
      botao.textContent = 'Enviar inscrição';
      erro.textContent = 'Não consegui enviar. Confirma a ligação e tenta outra vez.';
    }
  });
}

abrir();
</script>
</body>
</html>
