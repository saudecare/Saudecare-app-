<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Portal do Paciente</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<link rel="manifest" id="dynamicManifest" href="manifest.json">
<link rel="apple-touch-icon" id="appleTouchIcon" href="">
<style>
  :root{ --primary:#1a2b26; }
  *{box-sizing:border-box;}
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f8f7;color:#1a2b26;margin:0;padding:0 0 40px;}
  header{background:var(--primary);color:#fff;padding:20px;text-align:center;}
  header h1{margin:0 0 4px;font-size:1.3rem;}
  header p{margin:0;opacity:.85;font-size:.9rem;}
  main{max-width:520px;margin:0 auto;padding:16px;}
  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.06);}
  .card h2{margin:0 0 10px;font-size:1.05rem;color:var(--primary);}
  .muted{color:#6b7a75;font-size:.85rem;}
  .appt{background:#f6f8f7;border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .appt strong{display:block;}
  .btn{display:inline-block;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:.95rem;cursor:pointer;text-decoration:none;text-align:center;}
  .btn-block{display:block;width:100%;margin-top:8px;}
  .crisis{background:#fdecea;border:1px solid #f3c1bc;border-radius:10px;padding:12px 14px;font-size:.85rem;line-height:1.5;color:#7a2b23;}
  .crisis strong{display:block;margin-bottom:4px;}
  #msgs{max-height:280px;overflow-y:auto;background:#f6f8f7;border-radius:10px;padding:10px;margin-bottom:8px;}
  .msg{margin-bottom:8px;max-width:80%;padding:8px 12px;border-radius:12px;font-size:.9rem;line-height:1.4;}
  .msg.me{background:var(--primary);color:#fff;margin-left:auto;border-bottom-right-radius:2px;}
  .msg.them{background:#e9f0ee;border-bottom-left-radius:2px;}
  .msgtime{font-size:.7rem;opacity:.6;margin-top:2px;}
  .inputrow{display:flex;gap:6px;}
  .inputrow input{flex:1;padding:9px 10px;border:1px solid #ccc;border-radius:8px;font-size:.9rem;}
  .loading, .errorbox{text-align:center;padding:40px 20px;color:#6b7a75;}
  .scale-row{display:flex;gap:8px;flex-wrap:wrap;}
  .scale-btn{width:42px;height:42px;border-radius:50%;border:2px solid #e0e0e0;background:#fff;font-size:1.1rem;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6b7a75;user-select:none;}
  .scale-btn.selected{border-color:var(--primary);background:var(--primary);color:#fff;}
  .scale-label{font-size:.8rem;color:#6b7a75;margin:2px 0 6px;}
  .checkin-entry{background:#f6f8f7;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:.85rem;}
  .checkin-entry .cvals{display:flex;gap:10px;margin:4px 0;font-size:.85rem;}
  .tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    background:var(--card,#fff);border:1px solid #e5e5e5;border-radius:14px;padding:18px 10px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer;text-align:center;font-size:.9rem;color:var(--text,#1a2b26);}
  .tile:active{background:#eef6f2;}
  .tile-icon{font-size:28px;}
  .tile-badge{position:absolute;top:8px;right:8px;background:var(--primary);color:#fff;font-size:.65rem;
    padding:2px 7px;border-radius:20px;}
  .btn-back{background:none;border:none;color:var(--primary);font-size:.95rem;padding:6px 0 14px;cursor:pointer;font-weight:600;}
  .hidden{display:none !important;}
  .msg-tick{font-size:.75rem;color:#8fa39a;margin-left:4px;}
  .msg-tick.read{color:var(--primary);}
</style>
</head>
<body>

<div id="updateBanner" class="hidden" style="position:sticky;top:0;z-index:500;background:#1a2b26;color:#fff;padding:10px 14px;text-align:center;font-size:.85rem;">
  Há uma versão mais recente desta página. <button onclick="window.location.reload()" style="background:#fff;color:#1a2b26;border:none;border-radius:6px;padding:4px 10px;margin-left:6px;cursor:pointer;font-weight:600;">Atualizar agora</button>
</div>

<header>
  <h1 id="hBusiness">Portal do Paciente</h1>
  <p id="hPatient"></p>
</header>

<main id="mainContent">
  <div class="loading">A carregar…</div>
</main>

<script>
const PAGE_VERSION = '2026-09-04-01';

// ── Verificação automática de versão ────────────────────────────────────
// Nunca recarrega sozinha (podia interromper alguém a meio de escrever
// uma mensagem) — só mostra um aviso discreto, a pessoa escolhe quando.
(async function checkForPageUpdate(){
  try {
    const res = await fetch(window.location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    const html = await res.text();
    const match = html.match(/const PAGE_VERSION = '([^']+)'/);
    if (match && match[1] !== PAGE_VERSION){
      document.getElementById('updateBanner').classList.remove('hidden');
    }
  } catch(e){
    // Falha de rede ao verificar não deve travar o arranque da página.
  }
})();

const FUNCTION_URL = 'https://effortless-entremet-7de9ef.netlify.app/.netlify/functions/patientPortal';
const params = new URLSearchParams(window.location.search);
const tenantId = params.get('t');
const patientId = params.get('p');
const token = params.get('k');

function escapeHtml(s){
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function escapeAttrJs(str){
  return escapeHtml(str).replace(/'/g, "\\'");
}

window.downloadPaymentProof = function(serviceName, dateStr, price){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'pt', format: 'a4' });
  const business = portalData?.businessName || 'Vindora';
  const patientName = portalData?.patientName || '';
  let y = 60;

  doc.setFontSize(16);
  doc.text('Comprovativo de Pagamento', 40, y); y += 30;

  doc.setFontSize(11);
  doc.setTextColor(150, 60, 40);
  doc.text('Este documento NÃO é fatura, fatura-recibo nem qualquer documento fiscal.', 40, y); y += 16;
  doc.text('Serve apenas como confirmação interna de pagamento.', 40, y); y += 30;

  doc.setTextColor(20, 30, 25);
  doc.setFontSize(12);
  doc.text(`Consultório: ${business}`, 40, y); y += 20;
  doc.text(`Paciente: ${patientName}`, 40, y); y += 20;
  doc.text(`Serviço: ${serviceName || '-'}`, 40, y); y += 20;
  doc.text(`Data da consulta: ${dateStr}`, 40, y); y += 20;
  doc.text(`Valor pago: ${price}€`, 40, y); y += 20;
  doc.text(`Emitido em: ${new Date().toLocaleString('pt-PT')}`, 40, y); y += 40;

  doc.setFontSize(10);
  doc.setTextColor(120, 120, 120);
  doc.text('Se precisar de fatura para efeitos fiscais, contacte o seu terapeuta diretamente.', 40, y);

  doc.save(`comprovativo-pagamento-${dateStr.replace(/[/,: ]/g,'-')}.pdf`);
};

async function callPortal(action, extra){
  const res = await fetch(FUNCTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tenantId, patientId, token, action, ...extra })
  });
  const data = await res.json();
  if (!res.ok || !data.ok) throw new Error(data.error || 'Erro desconhecido');
  return data;
}

function formatDateTime(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('pt-PT', { weekday:'short', day:'2-digit', month:'2-digit' }) + ' às ' +
    d.toLocaleTimeString('pt-PT', { hour:'2-digit', minute:'2-digit' });
}

let __lastPortalMsgSig = null;
function renderMessages(messages){
  const box = document.getElementById('msgs');
  if (!box) return;
  const sig = messages.map(m => m.id + (m.readByProfessional ? '1' : '0')).join('|');
  if (sig === __lastPortalMsgSig) return; // nada mudou, não redesenha (evita "piscar")
  __lastPortalMsgSig = sig;
  box.innerHTML = messages.length ? messages.map(m => `
    <div class="msg ${m.sender === 'patient' ? 'me' : 'them'}">
      ${escapeHtml(m.text)}
      <div class="msgtime">${formatDateTime(m.createdAt)}${m.sender === 'patient' ? `<span class="msg-tick ${m.readByProfessional ? 'read' : ''}">${m.readByProfessional ? '✓✓ Lida' : '✓ Enviada'}</span>` : ''}</div>
    </div>`).join('') : '<p class="muted" style="text-align:center;">Ainda sem mensagens.</p>';
  box.scrollTop = box.scrollHeight;
}

function toggleReport(id){
  const el = document.getElementById('report_' + id);
  if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ── Diário de Bem-Estar ───────────────────────────────────────────────
const SCALE_LABELS = ['Muito baixo', 'Baixo', 'Médio', 'Bom', 'Muito bom'];
const MOOD_ICONS = ['😔','😕','😐','🙂','😄'];
const SLEEP_ICONS = ['😩','😪','😐','🙂','😴'];
const ENERGY_ICONS = ['🪫','🔋','🔋','🔋','⚡'];
const checkinState = { mood: null, sleepQuality: null, energyLevel: null };

function buildScale(containerId, key, icons){
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = [1,2,3,4,5].map(n => `<div class="scale-btn" onclick="selectScale('${containerId}','${key}',${n})">${icons[n-1]}</div>`).join('');
}

function selectScale(containerId, key, val){
  checkinState[key] = checkinState[key] === val ? null : val;
  const el = document.getElementById(containerId);
  [...el.children].forEach((btn, i) => btn.classList.toggle('selected', (i+1) === checkinState[key]));
}

function renderCheckinHistory(checkins){
  const box = document.getElementById('checkinHistory');
  if (!box) return;
  if (!checkins || !checkins.length){
    box.innerHTML = '<p class="muted">Ainda sem registos — o primeiro fica aqui assim que guardar.</p>';
    return;
  }
  box.innerHTML = checkins.map(c => {
    const parts = [];
    if (c.mood) parts.push(`${MOOD_ICONS[c.mood-1]} Humor`);
    if (c.sleepQuality) parts.push(`${SLEEP_ICONS[c.sleepQuality-1]} Sono`);
    if (c.energyLevel) parts.push(`${ENERGY_ICONS[c.energyLevel-1]} Energia`);
    return `<div class="checkin-entry">
      <strong>${formatDateTime(c.createdAt)}</strong>
      ${parts.length ? `<div class="cvals">${parts.join(' &nbsp; ')}</div>` : ''}
      ${c.notes ? `<div style="white-space:pre-wrap;margin-top:4px;">${escapeHtml(c.notes)}</div>` : ''}
    </div>`;
  }).join('');
}

async function submitCheckin(){
  const notes = document.getElementById('checkinNotes').value.trim();
  if (!checkinState.mood && !checkinState.sleepQuality && !checkinState.energyLevel && !notes){
    alert('Escolha pelo menos uma escala ou escreva algo antes de guardar.');
    return;
  }
  const btn = document.getElementById('checkinSubmitBtn');
  btn.disabled = true;
  btn.textContent = 'A guardar…';
  try{
    await callPortal('addCheckin', { mood: checkinState.mood, sleepQuality: checkinState.sleepQuality, energyLevel: checkinState.energyLevel, notes });
    document.getElementById('checkinNotes').value = '';
    checkinState.mood = null; checkinState.sleepQuality = null; checkinState.energyLevel = null;
    buildScale('moodScale', 'mood', MOOD_ICONS);
    buildScale('sleepScale', 'sleepQuality', SLEEP_ICONS);
    buildScale('energyScale', 'energyLevel', ENERGY_ICONS);
    const data = await callPortal('get');
    portalData = data;
    renderCheckinHistory(data.checkins);
    btn.textContent = '✅ Registado!';
    setTimeout(() => { btn.textContent = 'Guardar registo de hoje'; }, 1800);
  }catch(e){
    alert('Não foi possível guardar o registo. Tente novamente.');
    btn.textContent = 'Guardar registo de hoje';
  }
  btn.disabled = false;
}

let __messagePollTimer = null;

async function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.disabled = true;
  try{
    await callPortal('sendMessage', { text });
    input.value = '';
    await refreshMessages();
  }catch(e){
    alert('Não foi possível enviar a mensagem. Tente novamente.');
  }
  input.disabled = false;
  input.focus();
}

async function refreshMessages(){
  try{
    const data = await callPortal('get');
    portalData = data;
    renderMessages(data.messages);
  }catch(e){ /* falha silenciosa — tenta outra vez no próximo ciclo */ }
}

function startMessagePolling(){
  stopMessagePolling();
  // Verifica mensagens novas a cada 5 segundos enquanto esta secção
  // estiver aberta — o mais próximo de "instantâneo" que conseguimos
  // sem um servidor de tempo real dedicado (que teria custos extra).
  __messagePollTimer = setInterval(refreshMessages, 5000);
}

function stopMessagePolling(){
  if (__messagePollTimer){ clearInterval(__messagePollTimer); __messagePollTimer = null; }
}

let portalData = null;
let currentSection = null;

function crisisBox(){
  return `<div class="card crisis">
    <strong>⚠️ Este espaço não é monitorizado 24 horas.</strong>
    Se estiver numa situação de crise ou emergência, não espere por uma resposta aqui — contacte a Linha SNS24 (808 24 24 24) ou o 112 imediatamente.
  </div>`;
}

// ── "Adicionar ao ecrã principal" com identidade do consultório ─────────
// Mesmo mecanismo usado na página pública — troca o manifest genérico por
// um construído na hora com o nome/cor/logótipo deste consultório.
function applyPortalManifest(businessName, primaryColor, logoUrl){
  if (logoUrl){
    const appleIcon = document.getElementById('appleTouchIcon');
    if (appleIcon) appleIcon.href = logoUrl;
  }
  const manifestObj = {
    name: (businessName || 'Vindora') + ' — Portal do Paciente',
    short_name: (businessName || 'Vindora').slice(0, 12),
    start_url: window.location.href,
    display: 'standalone',
    background_color: '#f6f8f7',
    theme_color: primaryColor || '#1a2b26',
    icons: logoUrl ? [
      { src: logoUrl, sizes: '192x192', type: 'image/png' },
      { src: logoUrl, sizes: '512x512', type: 'image/png' }
    ] : []
  };
  const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
  const manifestLink = document.getElementById('dynamicManifest');
  if (manifestLink) manifestLink.href = URL.createObjectURL(blob);
}

let __deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  __deferredInstallPrompt = e;
});

window.installPortalApp = async function(){
  if (__deferredInstallPrompt){
    __deferredInstallPrompt.prompt();
    await __deferredInstallPrompt.userChoice;
    __deferredInstallPrompt = null;
  } else {
    alert('Para guardar este Portal no seu telemóvel, como se fosse uma app:\n\n📱 iPhone/iPad (Safari): toque no botão Partilhar (o quadrado com a seta para cima) e escolha "Adicionar ao ecrã principal".\n\n🤖 Android/Chrome: toque no menu ⋮ do navegador e escolha "Instalar app" ou "Adicionar ao ecrã principal".');
  }
};

function renderMenu(){
  stopMessagePolling();
  const main = document.getElementById('mainContent');
  const data = portalData;
  const hasOnlineUpcoming = data.upcoming.some(a => a.local === 'online');
  const hasHealing = (data.healingProtocols||[]).length > 0;
  main.innerHTML = `
    ${crisisBox()}
    <button class="btn btn-block" style="margin-bottom:14px;" onclick="installPortalApp()">📲 Guardar no telemóvel (como uma app)</button>
    <div class="tile-grid">
      <button class="tile" onclick="openPortalSection('appointments')">
        ${hasOnlineUpcoming ? '<span class="tile-badge">Online</span>' : ''}
        <span class="tile-icon">📅</span><span>Marcações</span>
      </button>
      <button class="tile" onclick="openPortalSection('checkin')">
        <span class="tile-icon">🌱</span><span>Diário de Bem-Estar</span>
      </button>
      <button class="tile" onclick="openPortalSection('messages')">
        <span class="tile-icon">💬</span><span>Mensagens</span>
      </button>
      <button class="tile" onclick="openPortalSection('reports')">
        <span class="tile-icon">📖</span><span>Relatórios${hasHealing ? ' e Rotina' : ''}</span>
      </button>
    </div>
  `;
}

window.openPortalSection = function(name){
  currentSection = name;
  history.pushState({ section: name }, '', '#' + name);
  renderPortalSection(name);
};

window.backToPortalMenu = function(fromPopstate){
  currentSection = null;
  if (!fromPopstate) history.pushState({ section: null }, '', window.location.pathname + window.location.search);
  renderMenu();
};

// Faz o botão físico/gesto de retroceder do telemóvel voltar ao menu do
// Portal, em vez de sair da página logo na primeira vez que é usado.
window.addEventListener('popstate', (e) => {
  if (e.state && e.state.section){
    currentSection = e.state.section;
    renderPortalSection(currentSection);
  } else {
    backToPortalMenu(true);
  }
});

function renderPortalSection(name){
  stopMessagePolling();
  const main = document.getElementById('mainContent');
  const data = portalData;
  const backBtn = `<button class="btn-back" onclick="backToPortalMenu()">← Voltar</button>`;
  let inner = '';

  if (name === 'appointments'){
    const paymentBadge = (a) => {
      if (!a.price) return '';
      const label = a.paymentStatus === 'paid' ? '✅ Pago' : (a.paymentStatus === 'partial' ? '🟡 Parcial' : '🔴 Pendente');
      return `<div class="muted" style="margin-top:2px;">${label} · ${a.price}€</div>`;
    };
    const upcomingHtml = data.upcoming.length
      ? data.upcoming.map(a => `
        <div class="appt">
          <strong>${formatDateTime(a.startsAt)}</strong>
          <span class="muted">${escapeHtml(a.serviceName||'')} ${a.local==='online' ? '· 💻 Online' : ''}</span>
          ${paymentBadge(a)}
        </div>`).join('')
      : '<p class="muted">Sem marcações agendadas.</p>';

    const pastHtml = data.past.length
      ? data.past.map(a => `
        <div class="appt">
          <strong>${formatDateTime(a.startsAt)}</strong>
          <span class="muted">${escapeHtml(a.serviceName||'')}</span>
          ${paymentBadge(a)}
          ${a.price && a.paymentStatus === 'paid' ? `<button class="ghost" style="margin-top:6px;" onclick="downloadPaymentProof('${escapeAttrJs(a.serviceName||'')}','${escapeAttrJs(formatDateTime(a.startsAt))}',${a.price})">📥 Descarregar comprovativo</button>` : ''}
        </div>`).join('')
      : '<p class="muted">Ainda sem consultas anteriores.</p>';

    const hasOnlineUpcoming = data.upcoming.some(a => a.local === 'online');
    const oc = data.onlineConsult || { tool: 'jitsi' };
    let onlineToolHtml = '';
    if (oc.tool === 'custom' && oc.customLink){
      onlineToolHtml = `<a class="btn btn-block" target="_blank" href="${escapeHtml(oc.customLink)}">Entrar na videochamada</a>`;
    } else if (oc.tool === 'whatsapp' && oc.whatsappNumber){
      onlineToolHtml = `<a class="btn btn-block" target="_blank" href="https://wa.me/${oc.whatsappNumber}">Abrir WhatsApp</a>
        <p class="muted" style="margin-top:6px;">O seu terapeuta vai iniciar a chamada de vídeo lá dentro, à hora combinada.</p>`;
    } else {
      const jitsiRoom = 'saudecare-' + tenantId.slice(0,8) + '-' + patientId.slice(0,8);
      const displayName = encodeURIComponent(data.patientName || 'Paciente');
      onlineToolHtml = `<a class="btn btn-block" target="_blank" href="https://meet.jit.si/${jitsiRoom}#config.prejoinPageEnabled=false&config.startWithAudioMuted=false&config.startWithVideoMuted=false&userInfo.displayName=%22${displayName}%22">Entrar na videochamada</a>`;
    }

    inner = `
      ${hasOnlineUpcoming ? `
      <div class="card">
        <h2>💻 Consulta online</h2>
        <p class="muted">Tem uma consulta online agendada. Toque no botão à hora combinada.</p>
        ${onlineToolHtml}
        <p class="muted" style="margin-top:8px;">⚠️ Precisa de estar ligado à internet (wifi ou dados móveis) para a videochamada funcionar.</p>
      </div>` : ''}
      <div class="card">
        <h2>📅 Próximas marcações</h2>
        ${upcomingHtml}
      </div>
      <div class="card">
        <h2>🗓️ Histórico de consultas</h2>
        ${pastHtml}
      </div>
    `;

  } else if (name === 'checkin'){
    inner = `
      <div class="card">
        <h2>🌱 Diário de Bem-Estar</h2>
        <p class="muted" style="margin-bottom:10px;">Registe como se sente hoje — sono, energia, humor, ou o que quiser partilhar. Fica guardado para o seu terapeuta acompanhar consigo, sessão após sessão. Não precisa de preencher tudo, nem todos os dias.</p>
        <div class="scale-label">Humor</div>
        <div class="scale-row" id="moodScale"></div>
        <div class="scale-label" style="margin-top:10px;">Sono</div>
        <div class="scale-row" id="sleepScale"></div>
        <div class="scale-label" style="margin-top:10px;">Energia</div>
        <div class="scale-row" id="energyScale"></div>
        <textarea id="checkinNotes" placeholder="Algo que queira partilhar (sintomas, pensamentos, o que sentir)…" rows="3" style="width:100%;margin-top:12px;padding:9px 10px;border:1px solid #ccc;border-radius:8px;font-family:inherit;font-size:.9rem;resize:vertical;"></textarea>
        <button id="checkinSubmitBtn" class="btn btn-block" onclick="submitCheckin()">Guardar registo de hoje</button>
        <div id="checkinHistory" style="margin-top:14px;"></div>
      </div>
    `;

  } else if (name === 'messages'){
    inner = `
      <div class="card">
        <h2>💬 Mensagens</h2>
        <p class="muted" style="margin-bottom:8px;">Fale com o seu terapeuta entre sessões. As mensagens novas aparecem sozinhas, sem precisar de atualizar a página.</p>
        <div id="msgs"></div>
        <div class="inputrow">
          <input id="msgInput" placeholder="Escrever mensagem…" onkeydown="if(event.key==='Enter')sendMessage()">
          <button class="btn" onclick="sendMessage()">Enviar</button>
        </div>
      </div>
    `;

  } else if (name === 'reports'){
    const reportsHtml = data.reports.length
      ? data.reports.map(r => `
        <div class="appt" style="cursor:pointer;" onclick="toggleReport('${r.id}')">
          <div class="row" style="justify-content:space-between;align-items:center;">
            <div>
              <strong>${escapeHtml(r.protocolName||'Relatório')}</strong>
              <span class="muted">${r.generatedAt ? formatDateTime(r.generatedAt) : ''}</span>
            </div>
            <span class="muted">Toque para ver ▾</span>
          </div>
          <div id="report_${r.id}" style="display:none;margin-top:8px;white-space:pre-wrap;font-size:.85rem;background:#fff;border-radius:8px;padding:10px;">${escapeHtml(r.reportText||'Sem conteúdo disponível.')}</div>
        </div>`).join('')
      : '<p class="muted">Ainda sem relatórios partilhados.</p>';

    const healingHtml = (data.healingProtocols||[]).length
      ? data.healingProtocols.map(h => `
        <div class="appt">
          <strong>${h.generatedAt ? formatDateTime(h.generatedAt) : 'Rotina de cura'}</strong>
          ${h.emotionalPattern ? `<div class="muted">Padrão Emocional: ${escapeHtml(h.emotionalPattern)}</div>` : ''}
          ${h.notes ? `<div style="margin-top:6px;white-space:pre-wrap;">${escapeHtml(h.notes)}</div>` : ''}
          ${h.materialsLink ? `<a class="btn btn-block" style="margin-top:8px;" target="_blank" href="${escapeHtml(h.materialsLink)}">🎧 Abrir materiais de apoio</a>` : ''}
        </div>`).join('')
      : '';

    inner = `
      ${healingHtml ? `
      <div class="card">
        <h2>🌿 A minha rotina de cura</h2>
        ${healingHtml}
      </div>` : ''}
      <div class="card">
        <h2>📖 Relatórios de consultas anteriores</h2>
        ${reportsHtml}
      </div>
    `;
  }

  main.innerHTML = `${backBtn}${inner}`;

  if (name === 'checkin'){
    buildScale('moodScale', 'mood', MOOD_ICONS);
    buildScale('sleepScale', 'sleepQuality', SLEEP_ICONS);
    buildScale('energyScale', 'energyLevel', ENERGY_ICONS);
    renderCheckinHistory(data.checkins);
  }
  if (name === 'messages'){
    __lastPortalMsgSig = null;
    renderMessages(data.messages);
    startMessagePolling();
  }
}

async function load(){
  const main = document.getElementById('mainContent');
  if (!tenantId || !patientId || !token){
    main.innerHTML = '<div class="errorbox">Link incompleto. Peça ao seu terapeuta um novo link.</div>';
    return;
  }
  try{
    const data = await callPortal('get');
    portalData = data;
    document.documentElement.style.setProperty('--primary', data.primaryColor || '#1a2b26');
    document.getElementById('hBusiness').textContent = data.businessName;
    document.getElementById('hPatient').textContent = 'Olá, ' + data.patientName + '!';
    document.title = data.businessName + ' — Portal do Paciente';
    applyPortalManifest(data.businessName, data.primaryColor, data.logoUrl);

    if (!data.portalConsentGivenAt && data.consentText){
      renderConsentGate();
    } else {
      renderMenu();
    }
  }catch(e){
    console.error(e);
    main.innerHTML = '<div class="errorbox">Não foi possível abrir o seu portal. Verifique o link ou peça um novo ao seu terapeuta.</div>';
  }
}

function renderConsentGate(){
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="card">
      <h2>📄 Antes de continuar</h2>
      <p class="muted" style="margin-bottom:10px;">Por favor leia o termo de consentimento abaixo. Precisa de confirmar que leu e concorda antes de aceder ao seu Portal.</p>
      <div style="max-height:280px;overflow-y:auto;background:#f6f8f7;border-radius:8px;padding:12px;font-size:13px;white-space:pre-wrap;margin-bottom:14px;">${escapeHtml(portalData.consentText)}</div>
      <label style="display:flex;align-items:flex-start;gap:8px;font-weight:400;margin-bottom:14px;">
        <input type="checkbox" id="consentGateCheckbox" style="width:auto;margin-top:3px;">
        <span>Li e concordo com o termo de consentimento acima.</span>
      </label>
      <button id="consentGateBtn" class="btn btn-block" onclick="acceptConsentGate()">Confirmar e continuar</button>
      <p id="consentGateError" class="muted" style="color:#b3413a;margin-top:8px;"></p>
    </div>
  `;
}

window.acceptConsentGate = async function(){
  const errEl = document.getElementById('consentGateError');
  errEl.textContent = '';
  if (!document.getElementById('consentGateCheckbox').checked){
    errEl.textContent = 'Precisa de marcar a confirmação antes de continuar.';
    return;
  }
  const btn = document.getElementById('consentGateBtn');
  btn.disabled = true;
  btn.textContent = 'A confirmar…';
  try{
    await callPortal('giveConsent');
    renderMenu();
  }catch(e){
    errEl.textContent = 'Não foi possível confirmar. Tente novamente.';
    btn.disabled = false;
    btn.textContent = 'Confirmar e continuar';
  }
};

load();
</script>
