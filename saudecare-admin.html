<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Vindora — Administração</title>
<style>
  :root{
    --primary:#1f2d5c; --primary-dark:#141d3f; --bg:#f6f7fb; --card:#ffffff;
    --text:#1a1d2b; --muted:#6b7080; --danger:#b3413a; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{background:var(--bg);color:var(--text);}
  #app{display:flex;min-height:100vh;}
  nav{width:220px;background:var(--primary-dark);color:#fff;padding:20px 12px;flex-shrink:0;}
  nav h1{font-size:18px;margin-bottom:4px;padding:0 8px;}
  nav p{font-size:11px;opacity:.7;padding:0 8px;margin-bottom:20px;}
  nav button{display:block;width:100%;text-align:left;background:none;border:none;color:#e4e6f2;
    padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px;margin-bottom:4px;}
  nav button.active,nav button:hover{background:var(--primary);color:#fff;}
  main{flex:1;padding:24px;max-width:1000px;}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);}
  h2{margin-bottom:14px;font-size:20px;}
  input,select,textarea{width:100%;padding:12px;border:1px solid #dcdfe8;border-radius:8px;
    margin-bottom:10px;font-size:16px;}
  label{font-size:12px;color:var(--muted);display:block;margin-bottom:4px;}
  button.primary{background:var(--primary);color:#fff;border:none;padding:10px 18px;
    border-radius:8px;cursor:pointer;font-size:14px;}
  button.danger{background:var(--danger);color:#fff;border:none;padding:8px 14px;
    border-radius:8px;cursor:pointer;font-size:13px;}
  button.ghost{background:none;border:1px solid #dcdfe8;padding:8px 14px;border-radius:8px;cursor:pointer;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .tenant-item{border-bottom:1px solid #eef0f5;padding:12px 0;}
  .tenant-item:last-child{border-bottom:none;}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#e4e6f2;color:var(--primary-dark);}
  .badge.active{background:#dcf0e4;color:#1f6d3f;}
  .badge.trial{background:#fff3cd;color:#8a5a00;}
  .badge.suspended,.badge.cancelled{background:#f6e2e0;color:var(--danger);}
  .muted{color:var(--muted);font-size:13px;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;}
  .stat-card{background:var(--card);border-radius:12px;padding:14px;text-align:center;}
  .stat-card .num{font-size:26px;font-weight:700;color:var(--primary);}
  #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100%;padding:20px 16px;box-sizing:border-box;}
  .login-card{max-width:360px;width:100%;background:var(--card);border-radius:16px;padding:22px;box-shadow:0 4px 16px rgba(0,0,0,.1);}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1a1d2b;
    color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:999;}
  .hidden{display:none !important;}
  .stepBlock{margin-bottom:18px;}
  .stepBlock strong{display:block;margin-bottom:4px;}
  @media(max-width:640px){
    #app{flex-direction:column;}
    nav{width:100%;display:flex;flex-wrap:wrap;padding:8px;gap:4px;justify-content:center;}
    nav h1,nav p{display:none;}
    nav button{flex:1 1 auto;min-width:90px;margin:0;padding:8px 6px;font-size:12px;text-align:center;}
    main{padding:14px;}
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
  <h2>Administração — Entrar</h2>
  <p class="muted" style="margin-bottom:14px;">Acesso restrito à equipa da plataforma Vindora.</p>
  <label>Email</label>
  <input id="loginEmail" type="email" autocomplete="username">
  <label>Palavra-passe</label>
  <input id="loginPass" type="password" autocomplete="current-password">
  <button class="primary" style="width:100%" onclick="doLogin()">Entrar</button>
  <p id="loginError" class="muted" style="color:var(--danger);margin-top:8px;"></p>
  </div>
</div>

<div id="app" class="hidden">
  <nav>
    <h1>Vindora</h1>
    <p>Administração da plataforma</p>
    <button data-view="overview" class="active">📊 Visão geral</button>
    <button data-view="tenants">🏢 Subscritores</button>
    <button data-view="newTenant">➕ Novo subscritor</button>
    <button data-view="announcements">📢 Avisos</button>
    <button data-view="logout" style="margin-top:20px;color:#f2b8b8;">Sair</button>
  </nav>
  <main id="mainView"></main>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut,
  createUserWithEmailAndPassword, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, updateDoc, deleteDoc,
  query, orderBy, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDKWdXYEG6PO9KEMQMklyPGngtXuZlP7Cg",
  authDomain: "saudecare-app.firebaseapp.com",
  projectId: "saudecare-app",
  storageBucket: "saudecare-app.firebasestorage.app",
  messagingSenderId: "455466438728",
  appId: "1:455466438728:web:61cfbf9fac85d59e18c87d"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// App Firebase secundária, só para criar contas de subscritores sem
// desligar a sessão de admin em curso (createUserWithEmailAndPassword
// muda automaticamente a sessão ativa para o utilizador recém-criado
// se usarmos a mesma instância de auth — por isso usamos uma separada).
const secondaryApp = initializeApp(firebaseConfig, 'subscriberCreation');
const secondaryAuth = getAuth(secondaryApp);

// Função privilegiada (Netlify) que atribui as claims e ativa o
// subscritor num único pedido — substitui o comando manual do Cloud Shell.
const CLAIMS_FUNCTION_URL = 'https://effortless-entremet-7de9ef.netlify.app/.netlify/functions/activateTenant';

function generateRandomPassword(){
  const bytes = new Uint8Array(24);
  crypto.getRandomValues(bytes);
  return Array.from(bytes, b => b.toString(36)).join('').slice(0, 24);
}

let currentUser = null;
let allTenants = [];

function toast(msg, isError=false){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isError ? '#b3413a' : '#1a1d2b';
  t.style.display = 'block';
  setTimeout(()=> t.style.display='none', 3200);
}
function escapeHtml(str){
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){
  return escapeHtml(str).replace(/`/g, '&#96;');
}

window.doLogin = async function(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = '';
  try{
    await signInWithEmailAndPassword(auth, email, pass);
  }catch(e){
    errEl.textContent = 'Credenciais inválidas.';
    console.error(e);
  }
};

onAuthStateChanged(auth, async (user) => {
  if (!user){
    currentUser = null;
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    return;
  }

  // Confirma que esta conta está autorizada como administradora da
  // plataforma — sem isto, qualquer conta Firebase válida (ex: de um
  // subscritor) poderia tentar abrir este painel.
  const adminSnap = await getDoc(doc(db, 'platform_admins', user.uid));
  if (!adminSnap.exists()){
    toast('Esta conta não tem acesso de administração.', true);
    await signOut(auth);
    return;
  }

  currentUser = user;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  renderView('overview');
});

document.querySelectorAll('nav button[data-view]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if (btn.dataset.view === 'logout'){ signOut(auth); return; }
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    renderView(btn.dataset.view);
  });
});

function renderView(view){
  const main = document.getElementById('mainView');
  main.innerHTML = '<p class="muted">A carregar…</p>';
  if (view === 'overview') renderOverview(main);
  else if (view === 'tenants') renderTenants(main);
  else if (view === 'newTenant') renderNewTenant(main);
  else if (view === 'announcements') renderAnnouncements(main);
}

async function loadAllTenants(){
  // Sem orderBy: o Firestore descarta silenciosamente documentos a que
  // falte o campo usado na ordenação, o que fazia subscritores
  // desaparecerem da lista. Ordenamos em JavaScript, que é tolerante.
  const snap = await getDocs(collection(db, 'tenants'));
  allTenants = [];
  snap.forEach(d => allTenants.push({ id: d.id, ...d.data() }));
  allTenants.sort((a,b) => (a.businessName||a.id).localeCompare(b.businessName||b.id));
  return allTenants;
}

// ── VISÃO GERAL ──────────────────────────────────────────────────────
async function renderOverview(main){
  await loadAllTenants();
  const counts = { trial: 0, active: 0, suspended: 0, cancelled: 0 };
  allTenants.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });

  const pending = allTenants.filter(t => t.status === 'pending_activation');

  main.innerHTML = `
    <h2>Visão geral</h2>
    ${pending.length ? `
      <div class="card" style="border:1.5px solid #e0a020;background:#fff8ea;margin-bottom:14px;">
        <strong style="color:#8a5a00;">⚠️ ${pending.length} conta${pending.length>1?'s':''} à espera de ativação</strong>
        <p class="muted" style="margin:6px 0 10px;">Alguém já se registou sozinho mas ainda não consegue entrar.</p>
        <button class="primary" onclick="document.querySelector('nav button[data-view=tenants]').click()">Ver e ativar →</button>
      </div>` : ''}
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${allTenants.length}</div><div class="muted">Total subscritores</div></div>
      <div class="stat-card"><div class="num">${counts.trial}</div><div class="muted">Em teste</div></div>
      <div class="stat-card"><div class="num">${counts.active}</div><div class="muted">Ativos</div></div>
      <div class="stat-card"><div class="num">${counts.suspended + counts.cancelled}</div><div class="muted">Suspensos/Cancelados</div></div>
    </div>
    <div class="card" style="margin-top:16px;">
      <h2>Mais recentes</h2>
      ${allTenants.slice(0, 5).map(t => `
        <div class="tenant-item row">
          <div><strong>${escapeHtml(t.businessName||t.id)}</strong><div class="muted">${escapeHtml(t.slug||'')}</div></div>
          <span class="badge ${t.status}">${escapeHtml(t.status||'')}</span>
        </div>
      `).join('') || '<p class="muted">Ainda sem subscritores.</p>'}
    </div>
  `;
}

// ── LISTA DE SUBSCRITORES ────────────────────────────────────────────
async function renderTenants(main){
  await loadAllTenants();
  const todayStr = new Date().toISOString().slice(0,10);
  const in7DaysStr = new Date(Date.now() + 7*24*60*60*1000).toISOString().slice(0,10);

  function paymentBadge(t){
    if (!t.nextPaymentDue || t.plan === 'lifetime') return '';
    if (t.nextPaymentDue < todayStr) return '<span class="badge" style="background:#f4d7d3;color:#8a2e20;">💸 pagamento em atraso</span>';
    if (t.nextPaymentDue <= in7DaysStr) return '<span class="badge" style="background:#fff3cd;color:#7a5b00;">⏳ pagamento em breve</span>';
    return '';
  }

  const countTrial = allTenants.filter(t => t.status === 'trial').length;
  const countActive = allTenants.filter(t => t.status === 'active').length;
  const countOverdue = allTenants.filter(t => t.nextPaymentDue && t.nextPaymentDue < todayStr && t.plan !== 'lifetime').length;
  const countSoon = allTenants.filter(t => t.nextPaymentDue && t.nextPaymentDue >= todayStr && t.nextPaymentDue <= in7DaysStr && t.plan !== 'lifetime').length;

  const summaryHtml = `<div class="card" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-bottom:12px;">
    <div><div style="font-size:20px;font-weight:700;">${allTenants.length}</div><div class="muted" style="font-size:12px;">Total</div></div>
    <div><div style="font-size:20px;font-weight:700;">${countTrial}</div><div class="muted" style="font-size:12px;">Em teste</div></div>
    <div><div style="font-size:20px;font-weight:700;color:${countSoon?'#7a5b00':'inherit'};">${countSoon}</div><div class="muted" style="font-size:12px;">Pag. em breve</div></div>
    <div><div style="font-size:20px;font-weight:700;color:${countOverdue?'#8a2e20':'inherit'};">${countOverdue}</div><div class="muted" style="font-size:12px;">Pag. em atraso</div></div>
  </div>`;

  const sorted = [...allTenants].sort((a,b) => {
    const pa = a.status === 'pending_activation' ? 0 : 1;
    const pb = b.status === 'pending_activation' ? 0 : 1;
    if (pa !== pb) return pa - pb;
    const overdueA = a.nextPaymentDue && a.nextPaymentDue < todayStr && a.plan !== 'lifetime' ? 0 : 1;
    const overdueB = b.nextPaymentDue && b.nextPaymentDue < todayStr && b.plan !== 'lifetime' ? 0 : 1;
    return overdueA - overdueB;
  });
  let rows = sorted.map(t => {
    const isPending = t.status === 'pending_activation';
    return `
    <div class="tenant-item" ${isPending ? 'style="background:#fff8ea;border-radius:8px;padding:10px;"' : ''}>
      <div class="row">
        <div><strong>${escapeHtml(t.businessName||t.id)}</strong>
          <div class="muted">${escapeHtml(t.slug||'')} · plano ${escapeHtml(t.plan||'—')}</div>
        </div>
        <span>
          <span class="badge ${isPending ? '' : escapeHtml(t.status||'')}" style="${isPending ? 'background:#fff3cd;color:#8a5a00;' : ''}">${isPending ? 'por ativar' : escapeHtml(t.status||'')}</span>
          ${paymentBadge(t)}
        </span>
      </div>
      <div class="row" style="margin-top:8px;">
        ${isPending
          ? `<button class="primary" data-action="setup" data-id="${escapeAttr(t.id)}">Ativar acesso →</button>`
          : `<button class="ghost" data-action="manage" data-id="${escapeAttr(t.id)}">Gerir</button>
             <button class="ghost" data-action="setup" data-id="${escapeAttr(t.id)}">Passos de ativação de login</button>`
        }
      </div>
    </div>
  `;
  }).join('');
  if (!rows) rows = '<p class="muted">Ainda sem subscritores.</p>';

  main.innerHTML = `
    <h2>Subscritores <span class="muted" style="font-size:13px;">(${sorted.length})</span></h2>
    ${summaryHtml}
    <div class="card">${rows}</div>
    <div id="tenantDetailContainer"></div>
  `;

  // Ligações por evento em vez de onclick inline — evita que nomes com
  // apóstrofos ou campos em falta partam o HTML e façam a linha desaparecer.
  main.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const t = allTenants.find(x => x.id === btn.dataset.id);
      if (!t) return;
      if (btn.dataset.action === 'manage') openTenantDetail(t.id);
      else renderTenantSetupSteps(t.id, t.businessName || t.id, t.ownerUid || '');
    });
  });
}

window.openTenantDetail = function(tenantId){
  const t = allTenants.find(x => x.id === tenantId);
  if (!t) return;
  const paymentLog = t.paymentLog || [];
  const paymentRows = paymentLog.length
    ? [...paymentLog].reverse().slice(0, 10).map(p => `
        <div class="row" style="font-size:13px;padding:4px 0;border-bottom:1px solid #f0f0f0;">
          <span>${escapeHtml(p.date||'')} · ${escapeHtml(p.method||'')} ${p.note ? '· '+escapeHtml(p.note) : ''}</span>
          <strong>${(p.amount||0).toFixed(2)}€</strong>
        </div>`).join('')
    : '<p class="muted" style="font-size:13px;">Ainda sem pagamentos registados.</p>';

  document.getElementById('tenantDetailContainer').innerHTML = `
    <div class="card">
      <h2>Editar subscritor</h2>
      <p class="muted">ID: ${escapeHtml(t.id)} · Dono (uid): ${escapeHtml(t.ownerUid||'—')}</p>
      <label>Nome do negócio</label>
      <input id="tdBusinessName" value="${escapeAttr(t.businessName||'')}">
      <label>Slug (link público)</label>
      <input id="tdSlug" value="${escapeAttr(t.slug||'')}">
      <label>Email do dono</label>
      <input id="tdOwnerEmail" value="${escapeAttr(t.ownerEmail||'')}">
      <label>Estado</label>
      <select id="tdStatus">
        <option value="pending_activation" ${t.status==='pending_activation'?'selected':''}>Por ativar</option>
        <option value="trial" ${t.status==='trial'?'selected':''}>Em teste</option>
        <option value="active" ${t.status==='active'?'selected':''}>Ativo</option>
        <option value="suspended" ${t.status==='suspended'?'selected':''}>Suspenso</option>
        <option value="cancelled" ${t.status==='cancelled'?'selected':''}>Cancelado</option>
      </select>
      <label>Plano</label>
      <select id="tdPlan">
        <option value="start" ${t.plan==='start'?'selected':''}>Start</option>
        <option value="grow" ${t.plan==='grow'?'selected':''}>Grow</option>
        <option value="pro" ${t.plan==='pro'?'selected':''}>Pro</option>
        <option value="enterprise" ${t.plan==='enterprise'?'selected':''}>Enterprise</option>
        <option value="lifetime" ${t.plan==='lifetime'?'selected':''}>Vitalício (sem restrições)</option>
      </select>

      <h3 style="margin:14px 0 6px;">Extras manuais (bónus sobre o plano)</h3>
      <p class="muted" style="margin-bottom:8px;">Use isto para dar mais espaço/pacientes/equipa a uma conta específica (ex: testador convidado), sem mudar o plano todo. Deixe a 0 se não houver extras.</p>
      <label>+ Espaço na Biblioteca de Conhecimento (MB)</label>
      <input id="tdExtraKbMb" type="number" min="0" value="${t.limitOverrides?.kbBytesExtra ? Math.round(t.limitOverrides.kbBytesExtra/1024/1024) : 0}">
      <label>+ Pacientes com Portal ativo</label>
      <input id="tdExtraPortal" type="number" min="0" value="${t.limitOverrides?.portalPatientsExtra || 0}">
      <label>+ Profissionais na equipa</label>
      <input id="tdExtraStaff" type="number" min="0" value="${t.limitOverrides?.staffExtra || 0}">

      <div class="row">
        <button class="primary" onclick="saveTenantChanges('${tenantId}')">Guardar alterações</button>
        <button class="danger" onclick="confirmDeleteTenant('${tenantId}','${escapeAttr(t.businessName||t.id)}')">Apagar subscritor</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-bottom:6px;">💶 Pagamentos e recebimentos</h3>
      <p class="muted" style="margin-bottom:8px;">Registo manual — assinale aqui sempre que receber uma transferência/MBWay deste subscritor. A app avisa sozinha na lista quando o próximo pagamento estiver perto ou em atraso.</p>
      <label>Data do próximo pagamento</label>
      <input id="tdNextPayment" type="date" value="${t.nextPaymentDue||''}">
      <button class="ghost" style="margin-top:6px;" onclick="saveNextPaymentDate('${tenantId}')">Guardar data</button>

      <h4 style="margin:14px 0 6px;">Registar pagamento recebido</h4>
      <div class="row">
        <input id="tdPayAmount" type="number" min="0" step="0.01" placeholder="Valor (€)" style="flex:1;">
        <select id="tdPayMethod" style="flex:1;">
          <option value="MBWay">MBWay</option>
          <option value="Transferência">Transferência</option>
          <option value="Dinheiro">Dinheiro</option>
          <option value="Outro">Outro</option>
        </select>
      </div>
      <input id="tdPayNote" placeholder="Nota (opcional, ex: renovação anual)">
      <button class="primary" style="margin-top:6px;" onclick="registerTenantPayment('${tenantId}')">+ Registar pagamento</button>

      <h4 style="margin:14px 0 6px;">Histórico</h4>
      ${paymentRows}
    </div>`;
};

window.saveNextPaymentDate = async function(tenantId){
  const nextPaymentDue = document.getElementById('tdNextPayment').value || null;
  await updateDoc(doc(db, 'tenants', tenantId), { nextPaymentDue });
  toast('Data do próximo pagamento guardada.');
  renderView('tenants');
};

window.registerTenantPayment = async function(tenantId){
  const amount = parseFloat(document.getElementById('tdPayAmount').value || '0') || 0;
  const method = document.getElementById('tdPayMethod').value;
  const note = document.getElementById('tdPayNote').value.trim();
  if (amount <= 0){ toast('Indique o valor recebido.', true); return; }
  const t = allTenants.find(x => x.id === tenantId);
  const paymentLog = [...(t?.paymentLog || []), {
    date: new Date().toISOString().slice(0,10), amount, method, note
  }];
  await updateDoc(doc(db, 'tenants', tenantId), { paymentLog });
  toast('Pagamento registado.');
  renderView('tenants');
};

window.saveTenantChanges = async function(tenantId){
  const businessName = document.getElementById('tdBusinessName').value.trim();
  const slug = document.getElementById('tdSlug').value.trim();
  const ownerEmail = document.getElementById('tdOwnerEmail').value.trim();
  const status = document.getElementById('tdStatus').value;
  const plan = document.getElementById('tdPlan').value;
  const limitOverrides = {
    kbBytesExtra: (parseInt(document.getElementById('tdExtraKbMb').value, 10) || 0) * 1024 * 1024,
    portalPatientsExtra: parseInt(document.getElementById('tdExtraPortal').value, 10) || 0,
    staffExtra: parseInt(document.getElementById('tdExtraStaff').value, 10) || 0
  };
  await updateDoc(doc(db, 'tenants', tenantId), { businessName, slug, ownerEmail, status, plan, limitOverrides });
  toast('Subscritor atualizado.');
  renderView('tenants');
};

window.confirmDeleteTenant = function(tenantId, businessName){
  document.getElementById('tenantDetailContainer').insertAdjacentHTML('beforeend', `
    <div class="card" style="border:1.5px solid var(--danger);">
      <strong style="color:var(--danger);">Apagar "${escapeHtml(businessName)}"?</strong>
      <p class="muted" style="margin:6px 0 10px;">Isto apaga só o registo do subscritor — não apaga a conta de login associada nem os dados internos dele (pacientes, agenda, etc.), que ficam órfãos. Usa isto sobretudo para limpar registos de teste.</p>
      <div class="row">
        <button class="danger" onclick="deleteTenant('${tenantId}')">Sim, apagar</button>
        <button class="ghost" onclick="openTenantDetail('${tenantId}')">Cancelar</button>
      </div>
    </div>`);
};

window.deleteTenant = async function(tenantId){
  await deleteDoc(doc(db, 'tenants', tenantId));
  toast('Subscritor apagado.');
  renderView('tenants');
};

// ── NOVO SUBSCRITOR ──────────────────────────────────────────────────
// ── AVISOS À PLATAFORMA ──────────────────────────────────────────────
// Mensagem visível a todos os subscritores (dono e equipa), usada para
// avisos importantes — ex: alteração de sub-processadores no Acordo de
// Processamento de Dados, manutenções, etc. Guardada num único
// documento (settings/platformAnnouncement), lido por qualquer conta
// autenticada, mas só escrito por administradores da plataforma.
async function renderAnnouncements(main){
  const snap = await getDoc(doc(db, 'settings', 'platformAnnouncement'));
  const current = snap.exists() ? snap.data() : null;

  main.innerHTML = `
    <h2>📢 Avisos à Plataforma</h2>
    <div class="card">
      <p class="muted" style="margin-bottom:10px;">A mensagem abaixo aparece a todos os subscritores (dono e equipa) na página inicial da app, com um botão para confirmarem que leram. Use para avisos importantes — ex: mudança de fornecedor no Acordo de Processamento de Dados, manutenção agendada, etc.</p>
      ${current?.active ? `<div class="badge active" style="margin-bottom:10px;">🟢 Aviso ativo agora</div>` : `<div class="badge" style="margin-bottom:10px;">⚪ Sem aviso ativo</div>`}
      <label>Mensagem</label>
      <textarea id="announcementText" rows="5" placeholder="Ex: A partir de 15/10/2026, a Vindora vai mudar de fornecedor de armazenamento de X para Y. Se se opuser a esta alteração, contacte-nos em vindoraportugal@gmail.com até essa data.">${current ? escapeHtml(current.text||'') : ''}</textarea>
      <div class="row">
        <button class="primary" onclick="publishAnnouncement()">Publicar aviso</button>
        ${current?.active ? `<button class="danger" onclick="deactivateAnnouncement()">Retirar aviso atual</button>` : ''}
      </div>
      ${current?.publishedAt ? `<p class="muted" style="margin-top:10px;">Publicado em: ${current.publishedAt.toDate ? current.publishedAt.toDate().toLocaleString('pt-PT') : ''}</p>` : ''}
    </div>
  `;
}

window.publishAnnouncement = async function(){
  const text = document.getElementById('announcementText').value.trim();
  if (!text){ toast('Escreva a mensagem do aviso.', true); return; }
  await setDoc(doc(db, 'settings', 'platformAnnouncement'), {
    text,
    active: true,
    id: String(Date.now()), // muda sempre que publica de novo, para reaparecer mesmo a quem já tinha lido um aviso anterior
    publishedAt: serverTimestamp()
  });
  toast('Aviso publicado — já visível para todos os subscritores.');
  renderView('announcements');
};

window.deactivateAnnouncement = async function(){
  if (!confirm('Retirar o aviso atual? Deixa de aparecer a quem ainda não o leu.')) return;
  await updateDoc(doc(db, 'settings', 'platformAnnouncement'), { active: false });
  toast('Aviso retirado.');
  renderView('announcements');
};

function renderNewTenant(main){
  main.innerHTML = `
    <h2>Criar novo subscritor</h2>
    <div class="card">
      <p class="muted" style="margin-bottom:10px;">
        A conta de login é criada automaticamente com uma password aleatória
        que nem tu vês — o subscritor recebe logo um email para definir a
        própria password. Tu nunca sabes nem defines a password dele.
      </p>
      <label>Nome do negócio</label><input id="ntBusinessName">
      <label>Slug (identificador do link público, sem espaços/acentos)</label><input id="ntSlug" placeholder="ex: joana-silva-fisio">
      <label>Email do subscritor</label><input id="ntEmail" type="email" placeholder="email real do subscritor">
      <label>Plano inicial</label>
      <select id="ntPlan">
        <option value="start">Start</option>
        <option value="grow">Grow</option>
        <option value="pro">Pro</option>
        <option value="lifetime">Vitalício (sem restrições)</option>
      </select>
      <button class="primary" id="ntCreateBtn" onclick="createTenant()">Criar subscritor e enviar email</button>
    </div>
  `;
}

window.createTenant = async function(){
  const businessName = document.getElementById('ntBusinessName').value.trim();
  const slug = document.getElementById('ntSlug').value.trim();
  const email = document.getElementById('ntEmail').value.trim();
  if (!businessName || !slug){ toast('Nome e slug são obrigatórios.', true); return; }
  if (!email){ toast('O email do subscritor é obrigatório.', true); return; }

  const btn = document.getElementById('ntCreateBtn');
  btn.disabled = true; btn.textContent = 'A criar…';

  try{
    // Cria a conta na app secundária (não afeta a sessão de admin atual)
    // com uma password aleatória que ninguém escreve nem vê.
    const randomPass = generateRandomPassword();
    const cred = await createUserWithEmailAndPassword(secondaryAuth, email, randomPass);
    const newUid = cred.user.uid;
    await signOut(secondaryAuth);

    // Envia o email de "definir password" para o subscritor escolher a sua própria.
    await sendPasswordResetEmail(auth, email);

    const docRef = await addDoc(collection(db, 'tenants'), {
      businessName,
      slug,
      status: 'pending_activation',
      plan: document.getElementById('ntPlan').value,
      ownerUid: newUid,
      ownerEmail: email,
      createdAt: serverTimestamp(),
      branding: {},
      legalTexts: {}
    });

    toast('Subscritor criado. Email enviado para ele definir a password.');
    renderTenantSetupSteps(docRef.id, businessName, newUid);
  }catch(e){
    console.error(e);
    if (e.code === 'auth/email-already-in-use') toast('Já existe uma conta com este email.', true);
    else toast('Não foi possível criar o subscritor. Tenta novamente.', true);
    btn.disabled = false; btn.textContent = 'Criar subscritor e enviar email';
  }
};

// ── PASSOS DE ATIVAÇÃO DE LOGIN (sem Cloud Functions, sem Blaze) ─────
window.renderTenantSetupSteps = function(tenantId, businessName, knownUid){
  window._setupTenantId = tenantId;
  const hasUid = !!knownUid;
  const main = document.getElementById('mainView');
  main.innerHTML = `
    <h2>Ativar login — ${escapeHtml(businessName)}</h2>

    <div class="card">
      <strong>Ativação em 1 clique</strong>
      ${hasUid
        ? `<p class="muted" style="margin:6px 0 14px;">O UID já é conhecido — basta confirmar.</p>
           <button class="primary" type="button" id="oneClickBtn" onclick="oneClickActivate('${tenantId}','${escapeAttr(knownUid)}')">✓ Ativar acesso agora</button>
           <p id="oneClickStatus" class="muted" style="margin-top:8px;"></p>`
        : `<p class="muted" style="margin:6px 0 14px;">Falta o UID do utilizador — usa os passos manuais abaixo desta vez.</p>`
      }
    </div>

    <details style="margin-bottom:14px;">
      <summary class="muted" style="cursor:pointer;">Método manual (Cloud Shell) — só se o botão acima falhar</summary>
      <div class="card" style="margin-top:10px;">
        <div class="stepBlock" ${hasUid ? 'style="opacity:.55;"' : ''}>
          <strong>Passo 1 — Criar (ou confirmar) a conta de login</strong>
          ${hasUid
            ? `<p class="muted">✓ Não é preciso — a conta já foi criada e o UID já é conhecido.</p>`
            : `<p class="muted">Se ainda não existir, cria o utilizador com o email/password que o subscritor vai usar para entrar em saudecare-core.html.</p>
               <a href="https://console.firebase.google.com/project/saudecare-app/authentication/users" target="_blank" rel="noopener">
                 <button class="ghost" type="button">Abrir Authentication →</button>
               </a>
               <p class="muted" style="margin-top:6px;">Depois de criares, toca no utilizador na lista — o <strong>UID</strong> aparece no topo da página dele. Copia-o.</p>`
          }
        </div>

        <div class="stepBlock">
          <strong>Passo 2 — Copiar o comando e correr no Cloud Shell</strong>
          <label style="margin-top:6px;">UID do utilizador ${hasUid ? '(já preenchido)' : '(colado do passo 1)'}</label>
          <input id="setupUid" value="${escapeAttr(knownUid||'')}" placeholder="ex: lGivQcVpk5htm7ao71t2VYUHU6q1" oninput="updateSetupCommand()">
          <label>Comando pronto — copia tudo e cola no Cloud Shell</label>
          <textarea id="setupCommand" rows="8" readonly style="font-family:monospace;font-size:12px;" onclick="this.select()"></textarea>
          <div class="row" style="margin-top:8px;">
            <button class="ghost" type="button" onclick="copySetupCommand()">Copiar comando</button>
            <a href="https://shell.cloud.google.com/?project=saudecare-app" target="_blank" rel="noopener">
              <button class="primary" type="button">Abrir Cloud Shell →</button>
            </a>
          </div>
          <p class="muted" style="margin-top:8px;">
            Cola o comando (um único bloco) e prime Enter. Quando aparecer
            <strong>"Claims atribuídas com sucesso"</strong>, o Passo 2 está feito.
          </p>
        </div>

        <div class="stepBlock" style="margin-bottom:0;">
          <strong>Passo 3 — Marcar a conta como ativa</strong>
          <p class="muted">Sem este passo, mesmo com o comando corrido, o subscritor continua bloqueado — as regras de segurança só permitem acesso a contas "Em teste" ou "Ativo".</p>
          <button class="primary" type="button" onclick="markTenantActivated('${tenantId}')">✓ Marcar como "Em teste"</button>
        </div>
      </div>
    </details>
  `;
  updateSetupCommand();
};

window.oneClickActivate = async function(tenantId, uid){
  const btn = document.getElementById('oneClickBtn');
  const status = document.getElementById('oneClickStatus');
  btn.disabled = true; btn.textContent = 'A ativar…';
  status.textContent = '';
  try{
    const idToken = await currentUser.getIdToken();
    const res = await fetch(CLAIMS_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + idToken },
      body: JSON.stringify({ uid, tenantId })
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Falha desconhecida');
    toast('Subscritor ativado com sucesso.');
    renderView('tenants');
  }catch(e){
    console.error(e);
    status.style.color = 'var(--danger)';
    status.textContent = 'Não foi possível ativar automaticamente. Usa o método manual abaixo.';
    btn.disabled = false; btn.textContent = '✓ Ativar acesso agora';
  }
};

window.markTenantActivated = async function(tenantId){
  await updateDoc(doc(db, 'tenants', tenantId), { status: 'trial' });
  toast('Conta ativada — o subscritor já pode entrar.');
  renderView('tenants');
};

window.updateSetupCommand = function(){
  const uidField = document.getElementById('setupUid');
  const uid = (uidField && uidField.value.trim()) || 'COLA_AQUI_O_UID';
  const tenantId = window._setupTenantId;
  const script =
`mkdir -p ~/saudecare-claims && cd ~/saudecare-claims && cat > setclaim.js << 'EOF'
const admin = require('firebase-admin');
admin.initializeApp({ projectId: 'saudecare-app' });
admin.auth().setCustomUserClaims('${uid}', { tenantId: '${tenantId}', role: 'owner' })
  .then(() => { console.log('Claims atribuídas com sucesso.'); process.exit(); })
  .catch(err => { console.error(err); process.exit(1); });
EOF
npm init -y >/dev/null 2>&1 && npm install firebase-admin >/dev/null 2>&1 && node setclaim.js`;
  const out = document.getElementById('setupCommand');
  if (out) out.value = script;
};

window.copySetupCommand = function(){
  const el = document.getElementById('setupCommand');
  if (!el) return;
  el.select();
  navigator.clipboard.writeText(el.value)
    .then(()=> toast('Comando copiado — cola-o no Cloud Shell.'))
    .catch(()=> toast('Não copiou automaticamente — toca no texto, seleciona tudo e copia manualmente.', true));
};
</script>
